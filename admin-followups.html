<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Follow-ups — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  /* View toggle */
  .view-toggle{display:flex;gap:4px;align-items:center;}
  .view-toggle .btn{min-width:68px;}
  .view-toggle .btn.active{background:var(--chart);color:var(--ink);border-color:var(--chart);}

  /* Calendar shell */
  .cal-shell{display:none;}
  .cal-shell.active{display:block;}
  .list-shell{display:block;}
  .list-shell.hidden{display:none;}

  /* Calendar nav */
  .cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .cal-nav-title{font-size:16px;font-weight:600;flex:1;}
  .cal-nav .btn{padding:4px 10px;font-size:13px;}

  /* Day-of-week header row */
  .cal-day-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px;}
  .cal-day-label{text-align:center;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:4px 0;}

  /* Today cell */
  .cal-cell.today{background:#fafafa;border:1px solid var(--chart-dark);}

  /* Outside-month cells */
  .cal-cell.other-month .cal-cell-head{color:#ccc;}

  /* Type color overrides on .cal-item */
  .cal-item.type-call{background:#dbeafe;color:#1e40af;}
  .cal-item.type-email{background:var(--chart);color:var(--ink);}
  .cal-item.type-meeting{background:#dcfce7;color:#166534;}
  .cal-item.type-task{background:var(--bg-alt,#f5f5f7);color:var(--ink);border:1px solid var(--line);}
  .cal-item.type-sms{background:#f3e8ff;color:#6b21a8;}
  .cal-item.overdue{background:#fee2e2 !important;color:#991b1b !important;}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Follow-ups</span></div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Task
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Follow-up Queue</h1>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="filter-count" id="fu-count"></span>
          <!-- View toggle -->
          <div class="view-toggle">
            <button class="btn btn-ghost btn-sm active" id="btn-list" onclick="setView('list')">List</button>
            <button class="btn btn-ghost btn-sm" id="btn-cal" onclick="setView('calendar')">Calendar</button>
          </div>
          <label style="font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" id="show-done" onchange="onViewUpdate()"/> Show completed
          </label>
        </div>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search tasks..." oninput="onViewUpdate()"/>
        </div>
        <select class="filter-select" id="filter-type" onchange="onViewUpdate()">
          <option value="">All types</option>
          <option value="call">Call</option>
          <option value="email">Email</option>
          <option value="sms">SMS</option>
          <option value="meeting">Meeting</option>
          <option value="task">Task</option>
        </select>
        <select class="filter-select" id="filter-priority" onchange="onViewUpdate()">
          <option value="">All priorities</option>
          <option value="high">High</option>
          <option value="normal">Normal</option>
          <option value="low">Low</option>
        </select>
      </div>

      <!-- LIST VIEW -->
      <div class="list-shell" id="list-shell">
        <div class="card">
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th style="width:32px"></th>
                <th>Task</th><th>Contact</th><th>Type</th><th>Priority</th><th>Due</th><th></th>
              </tr></thead>
              <tbody id="fu-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- CALENDAR VIEW -->
      <div class="cal-shell" id="cal-shell">
        <div class="card" style="padding:20px">
          <div class="cal-nav">
            <button class="btn btn-ghost btn-sm" onclick="calPrev()">&#8592;</button>
            <div class="cal-nav-title" id="cal-title"></div>
            <button class="btn btn-ghost btn-sm" onclick="calNext()">&#8594;</button>
          </div>
          <div class="cal-day-labels">
            <div class="cal-day-label">Sun</div>
            <div class="cal-day-label">Mon</div>
            <div class="cal-day-label">Tue</div>
            <div class="cal-day-label">Wed</div>
            <div class="cal-day-label">Thu</div>
            <div class="cal-day-label">Fri</div>
            <div class="cal-day-label">Sat</div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title" id="modal-title-text">Add Task</h2>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1">
        <label class="form-label">Title</label>
        <input class="form-input" id="f-title" placeholder="Task title" required/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-input" id="f-type">
          <option value="task">Task</option>
          <option value="call">Call</option>
          <option value="email">Email</option>
          <option value="sms">SMS</option>
          <option value="meeting">Meeting</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Priority</label>
        <select class="form-input" id="f-priority">
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Due Date &amp; Time</label>
      <input class="form-input" id="f-due" type="datetime-local"/>
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea class="form-input" id="f-notes" rows="3" placeholder="Optional notes..."></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('followups');

let allTasks = [];
let editId = null;
let currentView = 'list'; // 'list' | 'calendar'
let calYear, calMonth; // 0-based month

// Init calendar to current month
(function() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
})();

// ─── Data ───────────────────────────────────────────────────────────────────

async function loadTasks() {
  allTasks = await TMIAdmin.api('/api/followups') || [];
  onViewUpdate();
}

function isOverdue(task) {
  return !task.completed && new Date(task.due_at) < new Date();
}

function filteredTasks() {
  const q = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('filter-type').value;
  const pri = document.getElementById('filter-priority').value;
  const showDone = document.getElementById('show-done').checked;
  return allTasks.filter(t => {
    if (!showDone && t.completed) return false;
    if (type && t.type !== type) return false;
    if (pri && t.priority !== pri) return false;
    if (q && !t.title.toLowerCase().includes(q)) return false;
    return true;
  });
}

// ─── View toggling ───────────────────────────────────────────────────────────

function setView(v) {
  currentView = v;
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
  document.getElementById('btn-cal').classList.toggle('active', v === 'calendar');
  document.getElementById('list-shell').classList.toggle('hidden', v !== 'list');
  document.getElementById('cal-shell').classList.toggle('active', v === 'calendar');
  onViewUpdate();
}

function onViewUpdate() {
  if (currentView === 'list') renderTable();
  else renderCalendar();
}

// ─── List view ───────────────────────────────────────────────────────────────

function renderTable() {
  const rows = filteredTasks();
  document.getElementById('fu-count').textContent = `${rows.length} task${rows.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('fu-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">&#9989;</div><h3>Queue is clear</h3><p>No pending follow-ups.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(t => {
    const overdue = isOverdue(t);
    const contact = t.contacts || {};
    const contactName = contact.first_name ? `${contact.first_name} ${contact.last_name || ''}`.trim() : '-';
    const dueColor = overdue ? 'color:var(--red);font-weight:600' : '';
    return `
      <tr style="${t.completed ? 'opacity:0.5' : ''}">
        <td>
          <div class="checklist-check ${t.completed ? 'done' : ''}" onclick="toggleDone('${t.id}', ${!t.completed})"></div>
        </td>
        <td class="td-name">${t.title}${overdue ? ' <span class="badge badge-overdue" style="font-size:10px">overdue</span>' : ''}</td>
        <td class="td-muted">${contactName}</td>
        <td>${TMIAdmin.badge(t.type)}</td>
        <td>${TMIAdmin.badge(t.priority)}</td>
        <td style="font-size:12px;${dueColor}">${TMIAdmin.fmt(t.due_at)}</td>
        <td class="td-action">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${t.id}')">Edit</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--red);margin-left:4px" onclick="deleteTask('${t.id}')">Del</button>
        </td>
      </tr>
    `;
  }).join('');
}

// ─── Calendar view ───────────────────────────────────────────────────────────

function calPrev() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function calNext() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  const tasks = filteredTasks();
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  // Update count to show month total
  const monthTasks = tasks.filter(t => {
    if (!t.due_at) return false;
    const d = new Date(t.due_at);
    return d.getFullYear() === calYear && d.getMonth() === calMonth;
  });
  document.getElementById('fu-count').textContent = `${monthTasks.length} task${monthTasks.length !== 1 ? 's' : ''} this month`;

  // Month title
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-title').textContent = `${monthNames[calMonth]} ${calYear}`;

  // Build a map: dateStr -> tasks[]
  const taskMap = {};
  tasks.forEach(t => {
    if (!t.due_at) return;
    const d = new Date(t.due_at);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!taskMap[key]) taskMap[key] = [];
    taskMap[key].push(t);
  });

  // First day of month, last day
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const daysInMonth = lastDay.getDate();

  // Prev month tail
  const prevMonthLast = new Date(calYear, calMonth, 0).getDate();

  const cells = [];

  // Leading cells from prev month
  for (let i = startDow - 1; i >= 0; i--) {
    cells.push({ day: prevMonthLast - i, currentMonth: false, dateStr: null });
  }
  // Current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day: d, currentMonth: true, dateStr });
  }
  // Trailing cells to fill last row
  const trailing = 7 - (cells.length % 7);
  if (trailing < 7) {
    for (let d = 1; d <= trailing; d++) {
      cells.push({ day: d, currentMonth: false, dateStr: null });
    }
  }

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = cells.map(cell => {
    const isToday = cell.dateStr === todayStr;
    const cellTasks = cell.dateStr ? (taskMap[cell.dateStr] || []) : [];
    const extraClass = `${isToday ? 'today' : ''} ${!cell.currentMonth ? 'other-month' : ''}`.trim();

    const items = cellTasks.map(t => {
      const overdue = isOverdue(t);
      let typeClass = `type-${t.type || 'task'}`;
      if (overdue) typeClass = 'overdue';
      const label = t.title.length > 22 ? t.title.slice(0, 21) + '…' : t.title;
      return `<div class="cal-item ${typeClass}" onclick="openEdit('${t.id}')" title="${escHtml(t.title)}">${escHtml(label)}</div>`;
    }).join('');

    return `<div class="cal-cell ${extraClass}">
      <div class="cal-cell-head">${cell.day}</div>
      ${items}
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── CRUD ────────────────────────────────────────────────────────────────────

async function toggleDone(id, completed) {
  const res = await TMIAdmin.api('/api/followups', 'PUT', { id, completed });
  if (res) {
    const t = allTasks.find(t => t.id === id);
    if (t) { t.completed = completed; t.completed_at = completed ? new Date().toISOString() : null; }
    onViewUpdate();
    TMIAdmin.toast(completed ? 'Marked complete' : 'Reopened');
  }
}

function openAddModal() {
  editId = null;
  document.getElementById('modal-title-text').textContent = 'Add Task';
  document.getElementById('f-title').value = '';
  document.getElementById('f-type').value = 'task';
  document.getElementById('f-priority').value = 'normal';
  document.getElementById('f-notes').value = '';
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(9, 0, 0, 0);
  document.getElementById('f-due').value = d.toISOString().slice(0, 16);
  document.getElementById('add-modal').classList.add('open');
}

function openEdit(id) {
  const t = allTasks.find(t => t.id === id);
  if (!t) return;
  editId = id;
  document.getElementById('modal-title-text').textContent = 'Edit Task';
  document.getElementById('f-title').value = t.title;
  document.getElementById('f-type').value = t.type;
  document.getElementById('f-priority').value = t.priority;
  document.getElementById('f-notes').value = t.notes || '';
  document.getElementById('f-due').value = t.due_at ? t.due_at.slice(0, 16) : '';
  document.getElementById('add-modal').classList.add('open');
}

function closeModal() { document.getElementById('add-modal').classList.remove('open'); }

async function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  const due_at = document.getElementById('f-due').value;
  if (!title || !due_at) { TMIAdmin.toast('Title and due date required', 'error'); return; }
  const payload = {
    title,
    type: document.getElementById('f-type').value,
    priority: document.getElementById('f-priority').value,
    notes: document.getElementById('f-notes').value,
    due_at: new Date(due_at).toISOString(),
  };
  if (editId) payload.id = editId;
  const method = editId ? 'PUT' : 'POST';
  const res = await TMIAdmin.api('/api/followups', method, payload);
  if (res) {
    TMIAdmin.toast(editId ? 'Task updated' : 'Task added');
    closeModal();
    await loadTasks();
  }
}

async function deleteTask(id) {
  const ok = await TMIAdmin.confirm('Delete this task?', false);
  if (!ok) return;
  const res = await TMIAdmin.api('/api/followups', 'DELETE', { id });
  if (res) { TMIAdmin.toast('Deleted'); await loadTasks(); }
}

loadTasks();
</script>
</body>
</html>
