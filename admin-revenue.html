<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Revenue — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Revenue</span></div>
    </div>
    <div class="content">
      <div class="sec-head"><h1>Revenue Dashboard</h1></div>

      <!-- Top stats -->
      <div class="stats-row" id="rev-stats"></div>

      <div class="grid-2" style="margin-top:20px">

        <!-- MRR by client -->
        <div class="card">
          <div class="card-head"><span class="card-title">Monthly Recurring Revenue</span><span class="card-sub" id="mrr-total"></span></div>
          <div id="mrr-list" style="padding:4px 0"></div>
        </div>

        <!-- Pipeline value -->
        <div class="card">
          <div class="card-head"><span class="card-title">Pipeline Value by Stage</span></div>
          <div id="pipeline-list" style="padding:20px"></div>
        </div>
      </div>

      <!-- Invoice history -->
      <div class="card" style="margin-top:20px">
        <div class="card-head"><span class="card-title">Invoice History</span><a href="/admin-invoices" class="btn btn-ghost btn-sm">View all</a></div>
        <div id="inv-history"></div>
      </div>

      <!-- Proposals pipeline -->
      <div class="card" style="margin-top:20px">
        <div class="card-head"><span class="card-title">Open Proposals</span><a href="/admin-proposals" class="btn btn-ghost btn-sm">View all</a></div>
        <div id="prop-open"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('revenue');

async function loadRevenue() {
  const [clients, leads, invoices, proposals] = await Promise.all([
    TMIAdmin.api('/api/clients'),
    TMIAdmin.api('/api/leads'),
    TMIAdmin.api('/api/invoices'),
    TMIAdmin.api('/api/proposals'),
  ]);

  // Stats
  const activeClients = (clients || []).filter(c => c.status === 'active');
  const mrr = activeClients.reduce((s, c) => s + parseFloat(c.mrr || 0), 0);
  const invoicePaid = (invoices || []).filter(i => i.status === 'paid').reduce((s, i) => s + parseFloat(i.amount || 0), 0);
  const invoiceOutstanding = (invoices || []).filter(i => ['pending','viewed','overdue'].includes(i.status)).reduce((s, i) => s + parseFloat(i.amount || 0), 0);
  const pipelineValue = (leads || []).filter(l => !['won','lost'].includes(l.status)).reduce((s, l) => s + parseFloat(l.value || 0), 0);

  document.getElementById('rev-stats').innerHTML = `
    <div class="stat-box"><div class="stat-label">MRR</div><div class="stat-val">$${mrr.toLocaleString()}</div><div class="stat-delta">${activeClients.length} active clients</div></div>
    <div class="stat-box"><div class="stat-label">ARR</div><div class="stat-val">$${(mrr * 12).toLocaleString()}</div><div class="stat-delta">Annualized</div></div>
    <div class="stat-box"><div class="stat-label">Collected</div><div class="stat-val" style="color:var(--green)">$${invoicePaid.toLocaleString()}</div><div class="stat-delta">All paid invoices</div></div>
    <div class="stat-box"><div class="stat-label">Outstanding</div><div class="stat-val">$${invoiceOutstanding.toLocaleString()}</div><div class="stat-delta">Pipeline: $${pipelineValue.toLocaleString()}</div></div>
  `;

  // MRR breakdown
  const sorted = activeClients.sort((a, b) => parseFloat(b.mrr || 0) - parseFloat(a.mrr || 0));
  document.getElementById('mrr-total').textContent = `$${mrr.toLocaleString()}/mo`;
  document.getElementById('mrr-list').innerHTML = sorted.length ? sorted.map(c => {
    const pct = mrr > 0 ? Math.round(parseFloat(c.mrr || 0) / mrr * 100) : 0;
    const name = c.contacts ? `${c.contacts.first_name || ''} ${c.contacts.last_name || ''}`.trim() || c.contacts.company || 'Unknown' : 'Unknown';
    return `
      <div style="padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">${name}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:3px">${c.plan || ''}</div>
          <div style="height:4px;background:var(--line);border-radius:2px;margin-top:8px"><div style="height:4px;background:var(--chart);border-radius:2px;width:${pct}%"></div></div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:14px;font-weight:700">$${parseFloat(c.mrr || 0).toLocaleString()}</div>
          <div style="font-size:11px;color:var(--muted)">${pct}%</div>
        </div>
      </div>
    `;
  }).join('') : '<div style="padding:20px;text-align:center;font-size:13px;color:var(--muted)">No active clients yet.</div>';

  // Pipeline by stage
  const stages = ['new','contacted','qualified','proposal'];
  document.getElementById('pipeline-list').innerHTML = stages.map(stage => {
    const stageLeads = (leads || []).filter(l => l.status === stage);
    const val = stageLeads.reduce((s, l) => s + parseFloat(l.value || 0), 0);
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div>
          <div style="font-size:13px;font-weight:500">${stage.charAt(0).toUpperCase() + stage.slice(1)}</div>
          <div style="font-size:11px;color:var(--muted)">${stageLeads.length} lead${stageLeads.length !== 1 ? 's' : ''}</div>
        </div>
        <div style="font-size:14px;font-weight:700">$${val.toLocaleString()}</div>
      </div>
    `;
  }).join('');

  // Invoice history (last 10)
  const recentInv = (invoices || []).slice(0, 10);
  document.getElementById('inv-history').innerHTML = recentInv.length ? recentInv.map(i => {
    const name = i.clients?.contacts || i.contacts;
    const displayName = name ? `${name.first_name || ''} ${name.last_name || ''}`.trim() || name.company || '-' : '-';
    return `
      <div style="padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">${i.number || 'Invoice'} - ${displayName}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${TMIAdmin.fmt(i.created_at)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          ${TMIAdmin.badge(i.status)}
          <div style="font-size:14px;font-weight:700">$${parseFloat(i.amount).toLocaleString()}</div>
        </div>
      </div>
    `;
  }).join('') : '<div style="padding:20px;text-align:center;font-size:13px;color:var(--muted)">No invoices yet.</div>';

  // Open proposals
  const openProps = (proposals || []).filter(p => ['draft','sent','viewed'].includes(p.status));
  document.getElementById('prop-open').innerHTML = openProps.length ? openProps.map(p => {
    const name = p.contacts ? `${p.contacts.first_name || ''} ${p.contacts.last_name || ''}`.trim() || p.contacts.company || '-' : '-';
    return `
      <div style="padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">${p.title}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${name} &middot; ${TMIAdmin.fmt(p.created_at)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          ${TMIAdmin.badge(p.status)}
          <div style="font-size:14px;font-weight:700">${p.total ? '$' + parseFloat(p.total).toLocaleString() : '-'}</div>
        </div>
      </div>
    `;
  }).join('') : '<div style="padding:20px;text-align:center;font-size:13px;color:var(--muted)">No open proposals.</div>';
}

loadRevenue();
</script>
</body>
</html>
