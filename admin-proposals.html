<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Proposals — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Proposals</span></div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Proposal
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Proposals</h1>
        <span class="filter-count" id="prop-count"></span>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search proposals..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderTable()">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="sent">Sent</option>
          <option value="viewed">Viewed</option>
          <option value="accepted">Accepted</option>
          <option value="declined">Declined</option>
        </select>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Title</th><th>Client</th><th>Total</th><th>Status</th><th>Date</th><th></th>
            </tr></thead>
            <tbody id="prop-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Slide panel -->
<div class="panel-overlay" id="prop-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('prop-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-prop-title">Proposal</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" onclick="copyShareLink()">Copy Link</button>
        <button class="btn btn-ghost btn-sm" onclick="panelEdit()">Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="panelMarkAccepted()">Accept</button>
        <button class="btn btn-ghost btn-sm" onclick="panelMarkDeclined()">Decline</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProposal()">Delete</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid" id="panel-prop-details"></div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Line Items</div>
      <div id="panel-line-items" style="margin-top:12px"></div>
      <div id="panel-prop-total-row" style="margin-top:12px;display:none">
        <div class="proposal-total">
          <span class="proposal-total-label">Total</span>
          <span class="proposal-total-val" id="panel-prop-total-val"></span>
        </div>
      </div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Notes</div>
      <p id="panel-prop-notes" style="font-size:14px;color:var(--ink-2);line-height:1.65;margin-top:8px;white-space:pre-wrap;"></p>
    </div>
  </div>
</div>

<!-- Proposal Builder Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal" style="max-width:680px;width:100%">
    <div class="modal-hd">
      <h2 class="modal-title" id="modal-title-text">New Proposal</h2>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>

    <div class="form-group">
      <label class="form-label">Title <span style="color:var(--red)">*</span></label>
      <input class="form-input" id="f-title" placeholder="Proposal title" required/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Client</label>
        <input class="form-input" id="f-client" placeholder="Client name"/>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="f-status">
          <option value="draft">Draft</option>
          <option value="sent">Sent</option>
          <option value="viewed">Viewed</option>
          <option value="accepted">Accepted</option>
          <option value="declined">Declined</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <label class="form-label" style="margin:0">Line Items</label>
        <button type="button" class="btn btn-ghost btn-sm" onclick="addLineItem()">+ Add Line Item</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 72px 96px 40px;gap:6px;margin-bottom:6px;padding:0 2px">
        <span style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em">Description</span>
        <span style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em">Qty</span>
        <span style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em">Unit Price</span>
        <span></span>
      </div>
      <div id="line-items-list"></div>
      <div id="li-total-row" style="display:none;margin-top:12px">
        <div class="proposal-total">
          <span class="proposal-total-label">Total</span>
          <span class="proposal-total-val" id="li-total-val">$0.00</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Notes / Terms</label>
      <textarea class="form-input" id="f-notes" rows="3" placeholder="Notes, payment terms, expiry details..."></textarea>
    </div>

    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProposal()">Save Proposal</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('proposals');

let allProposals = [];
let currentProposal = null;
let editId = null;
let lineItems = [];

async function loadProposals() {
  allProposals = await TMIAdmin.api('/api/proposals') || [];
  renderTable();
}

function contactName(p) {
  if (p.client_name) return p.client_name;
  const c = p.contacts;
  if (!c) return '-';
  return `${c.first_name || ''} ${c.last_name || ''}`.trim() || c.company || '-';
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const rows = allProposals.filter(p => {
    if (st && p.status !== st) return false;
    if (q && !`${p.title} ${contactName(p)}`.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('prop-count').textContent = `${rows.length} proposal${rows.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('prop-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📄</div><h3>No proposals</h3><p>Create your first proposal above.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(p => `
    <tr onclick="openPanel('${p.id}')">
      <td class="td-name">${p.title}</td>
      <td>${contactName(p)}</td>
      <td style="font-weight:600">${p.total != null ? TMIAdmin.currency(p.total) : '<span class="td-muted">-</span>'}</td>
      <td>${TMIAdmin.badge(p.status)}</td>
      <td class="td-muted">${TMIAdmin.fmt(p.created_at)}</td>
      <td class="td-action"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openPanel('${p.id}')">View</button></td>
    </tr>
  `).join('');
}

function openPanel(id) {
  currentProposal = allProposals.find(p => p.id === id);
  if (!currentProposal) return;
  const p = currentProposal;
  document.getElementById('panel-prop-title').textContent = p.title;
  document.getElementById('panel-prop-notes').textContent = p.notes || '-';

  document.getElementById('panel-prop-details').innerHTML = `
    <div class="detail-item"><div class="detail-label">Client</div><div class="detail-val">${contactName(p)}</div></div>
    <div class="detail-item"><div class="detail-label">Status</div><div class="detail-val">${TMIAdmin.badge(p.status)}</div></div>
    <div class="detail-item"><div class="detail-label">Total</div><div class="detail-val" style="font-size:20px;font-weight:700">${p.total != null ? TMIAdmin.currency(p.total) : '-'}</div></div>
    <div class="detail-item"><div class="detail-label">Created</div><div class="detail-val">${TMIAdmin.fmt(p.created_at)}</div></div>
  `;

  // Line items
  const items = p.line_items || p.sections || [];
  const panelLI = document.getElementById('panel-line-items');
  if (items.length) {
    panelLI.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 52px 88px 88px;gap:4px 8px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)">
        <span>Description</span><span>Qty</span><span>Unit Price</span><span style="text-align:right">Line Total</span>
      </div>
      ${items.map(li => {
        const qty = parseFloat(li.qty || li.quantity || 1);
        const price = parseFloat(li.price || li.unit_price || li.amount || 0);
        const lineTotal = qty * price;
        return `<div style="display:grid;grid-template-columns:1fr 52px 88px 88px;gap:4px 8px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)">
          <span style="color:var(--ink)">${li.desc || li.description || '-'}</span>
          <span style="color:var(--ink-2)">${qty}</span>
          <span style="color:var(--ink-2)">${TMIAdmin.currency(price)}</span>
          <span style="font-weight:600;color:var(--ink);text-align:right">${TMIAdmin.currency(lineTotal)}</span>
        </div>`;
      }).join('')}
    `;
  } else {
    panelLI.innerHTML = '<span style="font-size:13px;color:var(--ink-3)">No line items.</span>';
  }

  const totalRow = document.getElementById('panel-prop-total-row');
  if (p.total != null) {
    totalRow.style.display = 'block';
    document.getElementById('panel-prop-total-val').textContent = TMIAdmin.currency(p.total);
  } else {
    totalRow.style.display = 'none';
  }

  TMIAdmin.openPanel('prop-panel');
}

async function panelMarkAccepted() {
  if (!currentProposal) return;
  const res = await TMIAdmin.api('/api/proposals', 'PUT', { id: currentProposal.id, status: 'accepted' });
  if (res) { TMIAdmin.toast('Marked as accepted'); TMIAdmin.closePanel('prop-panel'); await loadProposals(); }
}

async function panelMarkDeclined() {
  if (!currentProposal) return;
  const res = await TMIAdmin.api('/api/proposals', 'PUT', { id: currentProposal.id, status: 'declined' });
  if (res) { TMIAdmin.toast('Marked as declined'); TMIAdmin.closePanel('prop-panel'); await loadProposals(); }
}

function panelEdit() {
  if (!currentProposal) return;
  TMIAdmin.closePanel('prop-panel');
  openAddModal(currentProposal);
}

async function deleteProposal() {
  if (!currentProposal) return;
  const ok = await TMIAdmin.confirm('Delete this proposal?', true);
  if (!ok) return;
  const res = await TMIAdmin.api('/api/proposals', 'DELETE', { id: currentProposal.id });
  if (res) { TMIAdmin.toast('Deleted'); TMIAdmin.closePanel('prop-panel'); await loadProposals(); }
}

function copyShareLink() {
  if (!currentProposal) return;
  const url = `${window.location.origin}/proposal-view.html?id=${currentProposal.id}`;
  navigator.clipboard.writeText(url).then(() => TMIAdmin.toast('Link copied to clipboard'));
}

// --- Line Items ---
function addLineItem() {
  lineItems.push({ desc: '', qty: 1, price: 0 });
  renderLineItems();
}

function removeLineItem(i) {
  lineItems.splice(i, 1);
  renderLineItems();
}

function renderLineItems() {
  const list = document.getElementById('line-items-list');
  if (!lineItems.length) {
    list.innerHTML = '<div style="font-size:13px;color:var(--ink-3);padding:4px 0">No line items yet. Click "+ Add Line Item" to begin.</div>';
    document.getElementById('li-total-row').style.display = 'none';
    return;
  }
  list.innerHTML = lineItems.map((item, i) => `
    <div style="display:grid;grid-template-columns:1fr 72px 96px 40px;gap:6px;margin-bottom:6px;align-items:center">
      <input class="form-input" style="font-size:13px" value="${escAttr(item.desc)}" placeholder="Description" oninput="lineItems[${i}].desc=this.value"/>
      <input class="form-input" style="font-size:13px;text-align:center" type="number" min="1" value="${item.qty}" placeholder="1" oninput="lineItems[${i}].qty=parseFloat(this.value)||1;recalcTotal()"/>
      <input class="form-input" style="font-size:13px;text-align:right" type="number" min="0" step="0.01" value="${item.price || ''}" placeholder="0.00" oninput="lineItems[${i}].price=parseFloat(this.value)||0;recalcTotal()"/>
      <button type="button" class="btn btn-ghost btn-sm" style="color:var(--red);padding:0 8px;font-size:16px;line-height:1" onclick="removeLineItem(${i})">&times;</button>
    </div>
  `).join('');
  recalcTotal();
}

function escAttr(s) {
  return (s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function recalcTotal() {
  const total = lineItems.reduce((s, li) => s + (parseFloat(li.qty) || 1) * (parseFloat(li.price) || 0), 0);
  const row = document.getElementById('li-total-row');
  row.style.display = lineItems.length ? 'block' : 'none';
  document.getElementById('li-total-val').textContent = TMIAdmin.currency(total);
}

// --- Modal ---
function openAddModal(proposal) {
  editId = proposal ? proposal.id : null;
  lineItems = [];
  if (proposal) {
    document.getElementById('modal-title-text').textContent = 'Edit Proposal';
    document.getElementById('f-title').value = proposal.title || '';
    document.getElementById('f-client').value = proposal.client_name || contactName(proposal) || '';
    document.getElementById('f-status').value = proposal.status || 'draft';
    document.getElementById('f-notes').value = proposal.notes || '';
    const items = proposal.line_items || proposal.sections || [];
    lineItems = items.map(li => ({
      desc: li.desc || li.description || '',
      qty: parseFloat(li.qty || li.quantity || 1),
      price: parseFloat(li.price || li.unit_price || li.amount || 0),
    }));
  } else {
    document.getElementById('modal-title-text').textContent = 'New Proposal';
    ['f-title','f-client','f-notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-status').value = 'draft';
  }
  renderLineItems();
  document.getElementById('add-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('add-modal').classList.remove('open');
  editId = null;
  lineItems = [];
}

async function saveProposal() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { TMIAdmin.toast('Title is required', 'error'); return; }

  const total = lineItems.reduce((s, li) => s + (parseFloat(li.qty) || 1) * (parseFloat(li.price) || 0), 0);
  const payload = {
    title,
    client_name: document.getElementById('f-client').value.trim() || null,
    status: document.getElementById('f-status').value,
    line_items: lineItems.map(li => ({
      desc: li.desc,
      qty: parseFloat(li.qty) || 1,
      price: parseFloat(li.price) || 0,
    })),
    total: lineItems.length ? total : null,
    notes: document.getElementById('f-notes').value.trim() || null,
  };
  if (editId) payload.id = editId;
  const method = editId ? 'PUT' : 'POST';
  const res = await TMIAdmin.api('/api/proposals', method, payload);
  if (res) {
    TMIAdmin.toast(editId ? 'Proposal updated' : 'Proposal saved');
    closeModal();
    await loadProposals();
  }
}

loadProposals();
</script>
</body>
</html>
