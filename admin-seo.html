<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SEO — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .seo-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:900px){.seo-grid{grid-template-columns:1fr;}}
  .card-hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .card-hd h2{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);margin:0;}
  .card-hd .count{font-size:12px;color:var(--muted);}
  .needs-key{padding:40px;text-align:center;}
  .needs-key h3{font-family:var(--serif);font-size:20px;color:var(--ink);margin:0 0 10px;}
  .needs-key p{font-size:14px;color:var(--ink-2);line-height:1.6;margin:0 auto;max-width:46ch;}
  .needs-key code{background:var(--bg-alt);padding:2px 7px;border-radius:4px;font-size:13px;color:var(--ink);}
  .topic-list{list-style:none;margin:0;padding:0;}
  .topic-list li{padding:14px 20px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);display:flex;align-items:flex-start;gap:12px;}
  .topic-list li:last-child{border-bottom:none;}
  .topic-list .topic-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .topic-rank{flex:none;width:22px;height:22px;border-radius:50%;background:var(--chart);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .err-box{padding:14px 20px;font-size:12px;color:var(--red);background:var(--bg-alt);border-radius:var(--r-sm);margin:0 0 4px;font-family:monospace;white-space:pre-wrap;word-break:break-word;}
  .truncate-url{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">SEO</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="loadSeo()">Refresh</button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>SEO Command Center</h1>
        <div class="sec-head-right">
          <span class="filter-count" id="seo-target">tmi-technology.com</span>
        </div>
      </div>

      <div id="seo-root">
        <div class="card"><div style="padding:40px;text-align:center;color:var(--muted);font-size:14px;">Loading snapshot…</div></div>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('seo');

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function num(n) {
  if (n === null || n === undefined || n === '') return '—';
  return Number(n).toLocaleString('en-US');
}

// Pick the best Founders of the Future topic candidates from the keyword set: prefer
// question-shaped queries (how/why/what/cost...), then fall back to high-volume
// informational terms. Brand and navigational terms are skipped.
function suggestTopics(keywords) {
  const QUESTION = /\b(how|why|what|when|where|who|which|cost|vs|best|guide|tips|software|alternative|examples?|template)\b/i;
  const SKIP = /\b(tmi|login|sign\s?in|pricing page)\b/i;
  const scored = (keywords || [])
    .filter(k => k.keyword && !SKIP.test(k.keyword))
    .map(k => {
      const isQuestion = QUESTION.test(k.keyword);
      const vol = Number(k.volume) || 0;
      // Question terms get a heavy boost; otherwise rank by raw volume.
      const score = vol + (isQuestion ? 5000 : 0);
      return { ...k, isQuestion, score };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, 8);
  return scored;
}

function renderNeedsKey(keyName) {
  document.getElementById('seo-root').innerHTML = `
    <div class="card">
      <div class="needs-key">
        <h3>SEO Command Center is not connected</h3>
        <p>Add <code>${esc(keyName || 'AHREFS_API_KEY')}</code> in Vercel to enable the SEO Command Center. Once the key is set, this page will pull a live snapshot from Ahrefs for tmi-technology.com.</p>
      </div>
    </div>`;
}

function errBox(label, err) {
  if (!err) return '';
  const status = err.status != null ? `HTTP ${err.status}` : 'error';
  let body = err.body;
  if (typeof body === 'object') body = JSON.stringify(body);
  return `<div class="err-box">${esc(label)}: ${esc(status)} - ${esc(body || 'no detail')}</div>`;
}

function render(data) {
  const e = data.errors || {};
  const dr = data.domain_rating;
  const keywords = data.keywords || [];
  const pages = data.pages || [];
  const topics = suggestTopics(keywords);

  const kwRows = keywords.length
    ? keywords.map(k => `<tr>
        <td class="td-name">${esc(k.keyword)}</td>
        <td class="td-muted">${num(k.volume)}</td>
        <td>${k.position != null ? '#' + esc(k.position) : '—'}</td>
        <td class="td-muted"><a href="${esc(k.url || '#')}" target="_blank" rel="noopener" class="truncate-url" style="color:var(--blue)" title="${esc(k.url || '')}">${esc(k.url || '—')}</a></td>
      </tr>`).join('')
    : `<tr><td colspan="4" class="empty-state"><div class="empty-icon">🔎</div><h3>No keywords</h3><p>Ahrefs returned no organic keywords for this target.</p></td></tr>`;

  const pgRows = pages.length
    ? pages.map(p => `<tr>
        <td class="td-name"><a href="${esc(p.url || '#')}" target="_blank" rel="noopener" class="truncate-url" style="color:var(--blue)" title="${esc(p.url || '')}">${esc(p.url || '—')}</a></td>
        <td class="td-muted">${num(p.traffic)}</td>
        <td class="td-muted">${esc(p.top_keyword || '—')}</td>
        <td class="td-muted">${p.value != null ? TMIAdmin.currency(Math.round(p.value)) : '—'}</td>
      </tr>`).join('')
    : `<tr><td colspan="4" class="empty-state"><div class="empty-icon">📄</div><h3>No pages</h3><p>Ahrefs returned no traffic pages for this target.</p></td></tr>`;

  const topicItems = topics.length
    ? topics.map((t, i) => `<li>
        <span class="topic-rank">${i + 1}</span>
        <div>
          <div>${esc(t.keyword)}</div>
          <div class="topic-meta">${num(t.volume)} searches/mo${t.isQuestion ? ' · question intent' : ''}${t.position != null ? ' · currently #' + esc(t.position) : ''}</div>
        </div>
      </li>`).join('')
    : `<li><div style="color:var(--muted)">No topic candidates yet - connect Ahrefs and refresh.</div></li>`;

  document.getElementById('seo-root').innerHTML = `
    <div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-box">
        <div class="stat-label">Domain Rating</div>
        <div class="stat-val">${dr != null ? esc(dr) : '—'}</div>
        <div class="stat-delta">${data.ahrefs_rank != null ? 'Ahrefs Rank #' + num(data.ahrefs_rank) : 'out of 100'}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Tracked Keywords</div>
        <div class="stat-val">${keywords.length}</div>
        <div class="stat-delta">top organic terms</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Top Pages</div>
        <div class="stat-val">${pages.length}</div>
        <div class="stat-delta">by organic traffic</div>
      </div>
    </div>

    ${errBox('Domain Rating', e.domain_rating)}
    ${errBox('Keywords', e.keywords)}
    ${errBox('Pages', e.pages)}

    <div class="seo-grid">
      <div class="card">
        <div class="card-hd"><h2>Top organic keywords</h2><span class="count">${keywords.length}</span></div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Keyword</th><th>Volume</th><th>Position</th><th>URL</th></tr></thead>
            <tbody>${kwRows}</tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-hd"><h2>Top pages by traffic</h2><span class="count">${pages.length}</span></div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>URL</th><th>Traffic</th><th>Top keyword</th><th>Value</th></tr></thead>
            <tbody>${pgRows}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-hd"><h2>Suggested next Founders of the Future topics</h2><span class="count">${topics.length}</span></div>
      <ul class="topic-list">${topicItems}</ul>
    </div>`;
}

async function loadSeo() {
  document.getElementById('seo-root').innerHTML = `<div class="card"><div style="padding:40px;text-align:center;color:var(--muted);font-size:14px;">Loading snapshot…</div></div>`;
  const data = await TMIAdmin.api('/api/seo');
  if (!data) return;
  if (data.needs_key) { renderNeedsKey(data.key); return; }
  render(data);
}

loadSeo();
</script>
</body>
</html>
