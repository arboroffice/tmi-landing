<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FOTF Editorial — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
/* ── Tab bar ──────────────────────────────────────────────────────────── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tab-btn{font-size:13px;font-weight:500;padding:10px 18px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink-2);font-family:inherit;transition:color 0.15s,border-color 0.15s;margin-bottom:-1px;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
.tab-btn:hover:not(.active){color:var(--ink);}
.tab-pane{display:none;}
.tab-pane.active{display:flex;flex-direction:column;flex:1;overflow:hidden;}

/* ── Newsletter (nl_) styles ──────────────────────────────────────────── */
.nl-wrap{display:flex;flex:1;overflow:hidden;}
.nl-queue{width:260px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
.nl-queue-hd{padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
.nl-queue-search{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;color:var(--ink);background:var(--bg);outline:none;font-family:inherit;}
.nl-queue-search:focus{border-color:var(--ink);}
.nl-filter-row{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;}
.nl-filter{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:none;color:var(--ink-2);font-family:inherit;transition:background 0.1s,color 0.1s;}
.nl-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.nl-list{flex:1;overflow-y:auto;}
.nl-card{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.1s;}
.nl-card:hover{background:var(--bg);}
.nl-card.active{background:var(--chart);}
.nl-card-series{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.nl-card-title{font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nl-card-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center;}
.nl-new-btn{display:block;padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;width:100%;text-align:left;font-family:inherit;transition:background 0.1s;}
.nl-new-btn:hover{background:var(--bg);}
.nl-editor{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.nl-editor-bar{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;flex-wrap:wrap;}
.two-sides{display:flex;gap:6px;align-items:center;}
.two-sides-chip{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500;}
.two-sides-chip.ok{background:#dcfce7;color:#166534;}
.two-sides-chip.warn{background:#fef3c7;color:#92400e;}
.nl-editor-actions{margin-left:auto;display:flex;gap:8px;}
.nl-form{flex:1;overflow-y:auto;padding:28px 32px;}
.nl-meta-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;}
.nl-field{margin-bottom:20px;}
.nl-field label{display:block;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.nl-field .nl-hint{font-size:11px;color:var(--muted);font-style:italic;margin-top:5px;font-weight:400;text-transform:none;letter-spacing:0;display:block;}
.nl-field input,.nl-field textarea,.nl-field select{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;color:var(--ink);background:var(--surface);outline:none;font-family:inherit;resize:vertical;transition:border-color 0.15s;}
.nl-field input:focus,.nl-field textarea:focus,.nl-field select:focus{border-color:var(--ink);}
.nl-field textarea.tall{min-height:120px;}
.nl-field textarea.short{min-height:72px;}
.nl-field input.headline{font-size:20px;font-family:var(--serif);font-weight:600;}
.nl-section-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);min-height:42px;cursor:text;}
.tag-pill{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--chart);color:var(--ink);display:flex;align-items:center;gap:4px;}
.tag-pill button{background:none;border:none;cursor:pointer;color:var(--ink-2);font-size:14px;line-height:1;padding:0;}
.tag-input{border:none;outline:none;font-size:13px;font-family:inherit;color:var(--ink);background:transparent;min-width:80px;}
.nl-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--muted);gap:12px;padding:60px 32px;text-align:center;}
.nl-empty h3{font-size:18px;font-weight:400;color:var(--ink-2);}
.series-rotation{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px;}
.sr-cell{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;}
.sr-cell .sr-name{color:var(--ink);font-weight:500;margin-bottom:4px;}
.sr-cell .sr-count{color:var(--muted);font-size:11px;}
.sr-cell.has-issue{border-color:var(--chart);background:#fafff0;}
.series-banner{background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:24px;}
.series-banner-name{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;color:var(--ink);margin-bottom:4px;}
.series-banner-desc{font-size:13px;color:var(--ink-2);line-height:1.5;}
.prev-series-strip{margin-bottom:24px;}
.prev-series-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.prev-series-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);}
.prev-issue-row{display:flex;gap:10px;}
.prev-issue-card{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;transition:border-color 0.15s,background 0.12s;}
.prev-issue-card:hover{border-color:var(--ink-2);background:var(--bg-alt);}
.prev-issue-num{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.prev-issue-headline{font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;}
.prev-issue-expand{display:none;margin-top:10px;font-size:12px;color:var(--ink-2);line-height:1.55;border-top:1px solid var(--line);padding-top:10px;white-space:pre-wrap;}
.prev-issue-card.open .prev-issue-expand{display:block;}

/* ── Issues (iss_) styles ─────────────────────────────────────────────── */
.issue-num{font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;}
.cover-thumb{width:56px;height:40px;border-radius:4px;background-size:cover;background-position:center;background-color:var(--bg-alt);flex-shrink:0;}
.cover-thumb.empty{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--line-strong);}

/* ── Tab-pane layout helpers ─────────────────────────────────────────── */
#tab-newsletter{overflow:hidden;}
#tab-issues{overflow-y:auto;}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="page">Editorial</span>
      </div>
      <div class="topbar-actions" id="topbar-actions">
        <!-- Actions injected per tab -->
      </div>
    </div>

    <div class="content" style="padding:0;overflow:hidden;display:flex;flex-direction:column;">
      <div style="padding:0 24px;flex-shrink:0;">
        <div class="tab-bar" style="margin-bottom:0">
          <button class="tab-btn active" onclick="switchTab('newsletter',this)">Newsletter</button>
          <button class="tab-btn" onclick="switchTab('issues',this)">Issues</button>
        </div>
      </div>

      <!-- ── Newsletter Tab ──────────────────────────────────────────────── -->
      <div class="tab-pane active" id="tab-newsletter">
        <div class="nl-wrap">

          <!-- Queue -->
          <div class="nl-queue">
            <button class="nl-new-btn" onclick="nl_newIssue()">+ New Issue</button>
            <div class="nl-queue-hd">
              <input class="nl-queue-search" placeholder="Search issues..." oninput="nl_filterIssues(this.value)" id="nl-q-search"/>
            </div>
            <div class="nl-filter-row" id="nl-filter-row">
              <button class="nl-filter active" data-f="all" onclick="nl_setFilter('all',this)">All</button>
              <button class="nl-filter" data-f="draft" onclick="nl_setFilter('draft',this)">Draft</button>
              <button class="nl-filter" data-f="scheduled" onclick="nl_setFilter('scheduled',this)">Scheduled</button>
              <button class="nl-filter" data-f="sent" onclick="nl_setFilter('sent',this)">Sent</button>
            </div>
            <div class="nl-list" id="nl-list">
              <div style="padding:20px 16px;font-size:13px;color:var(--muted)">Loading...</div>
            </div>
          </div>

          <!-- Editor -->
          <div class="nl-editor" id="nl-editor">
            <div class="nl-empty" id="nl-empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13" stroke-linecap="round"/><line x1="16" y1="17" x2="8" y2="17" stroke-linecap="round"/></svg>
              <h3>Select an issue or create a new one</h3>
              <button class="btn btn-primary btn-sm" onclick="nl_newIssue()">+ New Issue</button>
            </div>
            <div id="nl-form-wrap" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
              <div class="nl-editor-bar">
                <div class="two-sides" id="nl-two-sides" style="display:none">
                  <span class="two-sides-chip warn" id="nl-chip-online">Online ?</span>
                  <span class="two-sides-chip warn" id="nl-chip-physical">Physical ?</span>
                </div>
                <div class="nl-editor-actions">
                  <button class="btn btn-ghost btn-sm" onclick="nl_deleteIssue()" id="nl-btn-delete" style="color:var(--red)">Delete</button>
                  <button class="btn btn-ghost btn-sm" onclick="nl_saveIssue()">Save Draft</button>
                  <button class="btn btn-ghost btn-sm" onclick="nl_openSchedule()">Schedule</button>
                  <button class="btn btn-primary btn-sm" onclick="nl_pushToBeehiiv()">Push to Beehiiv</button>
                </div>
              </div>
              <div class="nl-form" id="nl-form">
                <div class="nl-meta-row">
                  <div style="flex:0 0 auto">
                    <label style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Series</label>
                    <select class="form-input" id="nl-f-series" style="font-size:13px;padding:7px 10px;" onchange="nl_onSeriesChange()">
                      <option value="">Pick series...</option>
                      <option value="field-guide">Sunday Field Guide</option>
                      <option value="tool-drop">Wednesday Tool Drop</option>
                      <option value="field-notes">Field Notes</option>
                      <option value="receipts">Receipts</option>
                      <option value="build">Build</option>
                      <option value="wrong-way">Wrong Way</option>
                      <option value="day-one">Day One</option>
                      <option value="open-tabs">Open Tabs</option>
                    </select>
                  </div>
                  <div style="flex:0 0 80px">
                    <label style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Issue #</label>
                    <input type="number" id="nl-f-issue-num" class="form-input" style="font-size:13px;padding:7px 10px;" placeholder="Auto"/>
                  </div>
                  <div id="nl-f-status-badge" style="align-self:flex-end;padding-bottom:2px"></div>
                </div>

                <div id="nl-rotation-wrap" style="margin-bottom:20px"></div>

                <div id="nl-series-context" style="display:none">
                  <div class="series-banner" id="nl-series-banner"></div>
                  <div class="prev-series-strip" id="nl-prev-series-strip" style="display:none">
                    <div class="prev-series-hd">
                      <span class="prev-series-label">Previous in this series</span>
                      <span id="nl-prev-series-count" style="font-size:11px;color:var(--muted)"></span>
                    </div>
                    <div class="prev-issue-row" id="nl-prev-issue-row"></div>
                  </div>
                </div>

                <div class="nl-section-label">Headline &amp; Dek</div>
                <div class="nl-field">
                  <label>Headline</label>
                  <input type="text" id="nl-f-headline" class="headline" placeholder="The job that cost more than the invoice said" oninput="nl_markDirty()"/>
                </div>
                <div class="nl-field">
                  <label>Dek <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px">italic subhead</span></label>
                  <input type="text" id="nl-f-dek" placeholder="One sentence. Sets up the idea." oninput="nl_markDirty()"/>
                </div>

                <div id="nl-series-fields-wrap"></div>

                <div class="nl-section-label">Tags</div>
                <div class="nl-field">
                  <label>Topics</label>
                  <div class="tags-wrap" id="nl-tags-wrap" onclick="document.getElementById('nl-tag-input').focus()">
                    <input class="tag-input" id="nl-tag-input" placeholder="Add tag..." onkeydown="nl_handleTagKey(event)"/>
                  </div>
                </div>

                <div style="height:40px"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- ── Issues Tab ──────────────────────────────────────────────────── -->
      <div class="tab-pane" id="tab-issues" style="padding:0 24px 24px;">

        <div class="sec-head">
          <h1>FOTF Issues</h1>
        </div>

        <div class="filter-bar">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="iss-search" placeholder="Search issues..." oninput="iss_renderTable()"/>
          </div>
          <select class="filter-select" id="iss-filter-status" onchange="iss_renderTable()">
            <option value="">All statuses</option>
            <option value="draft">Draft</option>
            <option value="writing">Writing</option>
            <option value="ready">Ready</option>
            <option value="published">Published</option>
            <option value="archived">Archived</option>
          </select>
        </div>

        <div class="card">
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th style="width:48px">#</th>
                <th>Title</th>
                <th>Theme</th>
                <th>Status</th>
                <th>Publish Date</th>
                <th>Subscribers</th>
                <th></th>
              </tr></thead>
              <tbody id="iss-issues-tbody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Schedule modal (newsletter) -->
<div class="modal-overlay" id="nl-schedule-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd">
      <h3 class="modal-title">Schedule Issue</h3>
      <button class="modal-close" onclick="TMIAdmin.closeModal('nl-schedule-modal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">
      <div class="form-group">
        <label class="form-label">Send Date &amp; Time</label>
        <input type="datetime-local" class="form-input" id="nl-sched-dt"/>
      </div>
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select class="form-input" id="nl-sched-audience">
          <option value="all">All subscribers</option>
          <option value="free">Free only</option>
          <option value="premium">Premium (paid) only</option>
        </select>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost btn-sm" onclick="TMIAdmin.closeModal('nl-schedule-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="nl_confirmSchedule()">Schedule</button>
    </div>
  </div>
</div>

<!-- New/Edit Issue modal (issues tab) -->
<div class="modal-overlay" id="iss-issue-modal">
  <div class="modal">
    <div class="modal-hd">
      <h3 class="modal-title" id="iss-issue-modal-title">New Issue</h3>
      <button class="modal-close" onclick="iss_closeIssueModal()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="iss-issue-id"/>
      <div class="form-row">
        <label class="form-label">Issue Number</label>
        <input type="number" class="form-input" id="iss-issue-number" placeholder="e.g. 12"/>
      </div>
      <div class="form-row">
        <label class="form-label">Title</label>
        <input type="text" class="form-input" id="iss-issue-title" placeholder="Issue title..."/>
      </div>
      <div class="form-row">
        <label class="form-label">Theme / Hook</label>
        <input type="text" class="form-input" id="iss-issue-theme" placeholder="One-line theme or hook..."/>
      </div>
      <div class="form-row">
        <label class="form-label">Status</label>
        <select class="form-input" id="iss-issue-status">
          <option value="draft">Draft</option>
          <option value="writing">Writing</option>
          <option value="ready">Ready</option>
          <option value="published">Published</option>
          <option value="archived">Archived</option>
        </select>
      </div>
      <div class="form-row grid-2">
        <div>
          <label class="form-label">Publish Date</label>
          <input type="date" class="form-input" id="iss-issue-publish-date"/>
        </div>
        <div>
          <label class="form-label">Subscriber Count</label>
          <input type="number" class="form-input" id="iss-issue-subscribers" placeholder="0"/>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">Cover Image URL</label>
        <input type="url" class="form-input" id="iss-issue-cover" placeholder="https://..."/>
      </div>
      <div class="form-row">
        <label class="form-label">Notes</label>
        <textarea class="form-input" id="iss-issue-notes" rows="3" placeholder="Internal notes, content outline..."></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost btn-sm" onclick="iss_closeIssueModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="iss_saveIssue()">Save Issue</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();

// ── Tab switching ────────────────────────────────────────────────────────────
const TAB_ACTIONS = {
  newsletter: `<button class="btn btn-primary btn-sm" onclick="nl_newIssue()">+ New Issue</button>`,
  issues:     `<button class="btn btn-primary btn-sm" onclick="TMIAdmin.openModal('iss-issue-modal')">+ New Issue</button>`,
};

let activeTab = 'newsletter';
let issTabLoaded = false;

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('topbar-actions').innerHTML = TAB_ACTIONS[name] || '';
  activeTab = name;
  if (name === 'issues' && !issTabLoaded) { issTabLoaded = true; iss_loadIssues(); }
  history.replaceState(null, '', '#' + name);
}

// Hash-aware init
(function(){
  const _h = location.hash.slice(1);
  const _valid = ['newsletter','issues'];
  const _tab = _valid.includes(_h) ? _h : 'newsletter';
  const _btns = document.querySelectorAll('.tab-btn');
  const _btnMap = { newsletter: _btns[0], issues: _btns[1] };
  if (_tab !== 'newsletter') switchTab(_tab, _btnMap[_tab] || _btns[0]);
  else document.getElementById('topbar-actions').innerHTML = TAB_ACTIONS.newsletter;
  const _FEMAP = {'newsletter':'fotf-newsletter','issues':'fotf-issues'};
  TMIAdmin.initSidebar(_FEMAP[_tab] || 'fotf-newsletter');
})();

// ════════════════════════════════════════════════════════════════════════════
// NEWSLETTER TAB  (prefix: nl_)
// ════════════════════════════════════════════════════════════════════════════
const NL_SERIES_CONFIG = {
  'field-guide':{label:'Sunday Field Guide',desc:'A curated Sunday read. One story, three picks, a question that sits with you all week.',twoSides:false,fields:[
    {id:'opening_note',label:'Opening Note',hint:'How you\'re coming into this week. Personal, grounded, no performance.',tall:true},
    {id:'main_story',label:'Main Story',hint:'The one thing worth thinking about this week. Real situation, specific operator.',tall:true},
    {id:'three_picks',label:'Three Picks',hint:'A tool, a read, an idea. One sentence each. No fluff.',tall:false},
    {id:'question',label:'Question to Sit With',hint:'One question. Leave it open. Don\'t answer it.',input:true},
    {id:'thread',label:'Series Thread',hint:'How this connects forward or back in the series. One sentence.',input:true},
  ]},
  'tool-drop':{label:'Wednesday Tool Drop',desc:'One tool. Why it matters right now. How both sides of the house use it.',twoSides:true,fields:[
    {id:'the_tool',label:'The Tool',hint:'Name it. What category is it. Link if relevant.',input:true},
    {id:'why_now',label:'Why Now',hint:'Why this tool this week. What changed or what made you notice it.',tall:false},
    {id:'online_use',label:'Online Business Use',hint:'Specific scenario. Creator, SaaS, e-com, agency. What problem, what outcome.',tall:false},
    {id:'physical_use',label:'Physical Business Use',hint:'Specific scenario. Trades, fleet, manufacturing. What problem, what outcome.',tall:false},

    {id:'theme',label:'The Thread This Week',hint:'The thing connecting all three picks. Say it up front.',input:true},
    {id:'tab_1',label:'Tab 1',hint:'Link or reference + 2-3 sentences on why. What to take from it. What it changed.',tall:false},
    {id:'tab_2',label:'Tab 2',hint:'Link or reference + 2-3 sentences on why. What to take from it.',tall:false},
    {id:'tab_3',label:'Tab 3',hint:'Link or reference + 2-3 sentences on why. What surprised you about it.',tall:false},

const NL_SERIES_LABEL = Object.fromEntries(Object.entries(NL_SERIES_CONFIG).map(([k,v]) => [k, v.label]));
const NL_ALL_SERIES = Object.keys(NL_SERIES_CONFIG);

let nl_issues = [];
let nl_currentIssue = null;
let nl_dirty = false;
let nl_filterStatus = 'all';
let nl_tags = [];

function nl_markDirty() { nl_dirty = true; }

function nl_handleTagKey(e) {
  if ((e.key === 'Enter' || e.key === ',') && e.target.value.trim()) {
    e.preventDefault(); nl_addTag(e.target.value.trim()); e.target.value = '';
  }
}
function nl_addTag(t) {
  if (nl_tags.includes(t)) return; nl_tags.push(t); nl_renderTags(); nl_markDirty();
}
function nl_removeTag(t) {
  nl_tags = nl_tags.filter(x => x !== t); nl_renderTags(); nl_markDirty();
}
function nl_renderTags() {
  const wrap = document.getElementById('nl-tags-wrap');
  const input = document.getElementById('nl-tag-input');
  wrap.querySelectorAll('.tag-pill').forEach(p => p.remove());
  nl_tags.forEach(t => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${t}<button onclick="nl_removeTag('${t}')" type="button">×</button>`;
    wrap.insertBefore(pill, input);
  });
}

function nl_checkTwoSides() {
  const series = document.getElementById('nl-f-series').value;
  const cfg = NL_SERIES_CONFIG[series];
  const twoSidesEl = document.getElementById('nl-two-sides');
  if (!cfg || !cfg.twoSides) { twoSidesEl.style.display = 'none'; return; }
  twoSidesEl.style.display = 'flex';
  const online   = (document.getElementById('nl-sf-online_use')?.value || '').trim();
  const physical = (document.getElementById('nl-sf-physical_use')?.value || '').trim();
  const co = document.getElementById('nl-chip-online');
  const cp = document.getElementById('nl-chip-physical');
  co.className = `two-sides-chip ${online ? 'ok' : 'warn'}`;
  co.textContent = online ? 'Online ✓' : 'Online —';
  cp.className = `two-sides-chip ${physical ? 'ok' : 'warn'}`;
  cp.textContent = physical ? 'Physical ✓' : 'Physical —';
}

function nl_renderSeriesForm(series, bodyData) {
  const cfg = NL_SERIES_CONFIG[series];
  const wrap = document.getElementById('nl-series-fields-wrap');
  const ctx  = document.getElementById('nl-series-context');
  const banner = document.getElementById('nl-series-banner');
  if (!cfg) { wrap.innerHTML = ''; ctx.style.display = 'none'; document.getElementById('nl-two-sides').style.display = 'none'; return; }
  banner.innerHTML = `<div class="series-banner-name">${cfg.label}</div><div class="series-banner-desc">${cfg.desc}</div>`;
  ctx.style.display = '';
  nl_renderPreviousInSeries(series);
  wrap.innerHTML = `<div class="nl-section-label">Body</div>` +
    cfg.fields.map(f => {
      const val = (bodyData && bodyData[f.id]) ? bodyData[f.id].replace(/"/g,'&quot;') : '';
      const onchange = f.id === 'online_use' || f.id === 'physical_use'
        ? 'oninput="nl_checkTwoSides();nl_markDirty()"' : 'oninput="nl_markDirty()"';
      if (f.input) return `<div class="nl-field"><label>${f.label}<span class="nl-hint">${f.hint}</span></label><input type="text" id="nl-sf-${f.id}" value="${val}" placeholder="${f.hint}" ${onchange}/></div>`;
      return `<div class="nl-field"><label>${f.label}<span class="nl-hint">${f.hint}</span></label><textarea id="nl-sf-${f.id}" class="${f.tall?'tall':'short'}" placeholder="${f.hint}" ${onchange}>${bodyData?.[f.id]||''}</textarea></div>`;
    }).join('');
  nl_checkTwoSides();
}

function nl_renderPreviousInSeries(series) {
  const strip = document.getElementById('nl-prev-series-strip');
  const row   = document.getElementById('nl-prev-issue-row');
  const count = document.getElementById('nl-prev-series-count');
  const prev  = nl_issues.filter(i => i.series === series && i.id !== nl_currentIssue?.id).slice(0,3);
  if (!prev.length) { strip.style.display = 'none'; return; }
  strip.style.display = '';
  count.textContent = `${prev.length} previous`;
  row.innerHTML = prev.map(i => {
    let preview = '';
    try { const b = JSON.parse(i.notes||'{}'); const bd = b.body||{}; const fv = Object.values(bd).find(v => v && v.trim()); if (fv) preview = fv.slice(0,200); } catch(e) {}
    const num = i.issue_number ? `#${i.issue_number}` : TMIAdmin.fmt(i.created_at);
    return `<div class="prev-issue-card" onclick="nl_togglePrevIssue(this)">
      <div class="prev-issue-num">${num} · ${TMIAdmin.badge(i.status)}</div>
      <div class="prev-issue-headline">${i.headline||'(no headline)'}</div>
      ${preview?`<div class="prev-issue-expand">${preview}${preview.length>=200?'...':''}</div>`:''}
    </div>`;
  }).join('');
}

function nl_togglePrevIssue(card) { card.classList.toggle('open'); }

function nl_renderRotation(allIssues) {
  const thisMonth = new Date(); thisMonth.setDate(1); thisMonth.setHours(0,0,0,0);
  const counts = {};
  NL_ALL_SERIES.forEach(s => counts[s] = 0);
  allIssues.forEach(i => { if (i.series && new Date(i.created_at) >= thisMonth) counts[i.series] = (counts[i.series]||0)+1; });
  document.getElementById('nl-rotation-wrap').innerHTML =
    `<div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">This Month</div>
    <div class="series-rotation">${NL_ALL_SERIES.map(s =>
      `<div class="sr-cell ${counts[s]?'has-issue':''}">
        <div class="sr-name">${NL_SERIES_CONFIG[s]?.label||s}</div>
        <div class="sr-count">${counts[s]} issue${counts[s]!==1?'s':''}</div>
      </div>`).join('')}</div>`;
}

function nl_onSeriesChange() {
  const series = document.getElementById('nl-f-series').value;
  nl_renderSeriesForm(series, null);
  if (series) {
    const maxNum = Math.max(0, ...nl_issues.filter(i => i.series === series && i.issue_number).map(i => i.issue_number));
    const numEl = document.getElementById('nl-f-issue-num');
    if (!numEl.value) numEl.value = maxNum + 1;
  }
  nl_markDirty();
}

function nl_renderList(list) {
  const el = document.getElementById('nl-list');
  if (!list.length) { el.innerHTML = `<div style="padding:20px 16px;font-size:13px;color:var(--muted)">No issues found.</div>`; return; }
  el.innerHTML = list.map(i => {
    const series = NL_SERIES_CONFIG[i.series]?.label || i.series || 'Unknown';
    const num = i.issue_number ? ` #${i.issue_number}` : '';
    const isActive = nl_currentIssue?.id === i.id;
    return `<div class="nl-card${isActive?' active':''}" onclick="nl_loadIssue('${i.id}')">
      <div class="nl-card-series">${series}${num}</div>
      <div class="nl-card-title">${i.headline||'(no headline)'}</div>
      <div class="nl-card-meta">${TMIAdmin.badge(i.status)}<span>${TMIAdmin.fmt(i.created_at)}</span></div>
    </div>`;
  }).join('');
}

function nl_filterIssues(q) {
  const search = q.toLowerCase();
  let filtered = nl_issues.filter(i => nl_filterStatus === 'all' || i.status === nl_filterStatus);
  if (search) filtered = filtered.filter(i => (i.headline||'').toLowerCase().includes(search) || (i.series||'').includes(search));
  nl_renderList(filtered);
}

function nl_setFilter(status, btn) {
  nl_filterStatus = status;
  document.querySelectorAll('#nl-filter-row .nl-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  nl_filterIssues(document.getElementById('nl-q-search').value);
}

function nl_loadIssue(id) {
  if (nl_dirty && nl_currentIssue) { if (!confirm('You have unsaved changes. Discard them?')) return; }
  const issue = nl_issues.find(i => i.id === id);
  if (!issue) return;
  nl_currentIssue = issue; nl_dirty = false; nl_tags = issue.tags || [];
  document.getElementById('nl-empty').style.display = 'none';
  document.getElementById('nl-form-wrap').style.display = 'flex';
  document.getElementById('nl-f-series').value    = issue.series || '';
  document.getElementById('nl-f-issue-num').value = issue.issue_number || '';
  document.getElementById('nl-f-headline').value  = issue.headline || '';
  document.getElementById('nl-f-dek').value       = issue.dek || '';
  let bodyData = {};
  try { const n = JSON.parse(issue.notes||'{}'); bodyData = n.body||{}; } catch(e) {}
  if (!Object.keys(bodyData).length) {
    bodyData = { cold_open:issue.cold_open, setup:issue.setup, the_turn:issue.the_turn,
      the_proof:issue.the_proof, online_use:issue.online_example, physical_use:issue.physical_example,
      next_step:issue.next_step, pull_quote:issue.pull_quote };
  }
  nl_renderSeriesForm(issue.series, bodyData);
  nl_renderTags();
  document.getElementById('nl-f-status-badge').innerHTML = TMIAdmin.badge(issue.status);
  document.getElementById('nl-btn-delete').style.display = issue.status === 'sent' ? 'none' : '';
  nl_renderList(nl_issues.filter(i => nl_filterStatus === 'all' || i.status === nl_filterStatus));
}

function nl_collectSeriesBody() {
  const series = document.getElementById('nl-f-series').value;
  const cfg = NL_SERIES_CONFIG[series];
  if (!cfg) return {};
  const body = {};
  cfg.fields.forEach(f => { const el = document.getElementById('nl-sf-'+f.id); if (el) body[f.id] = el.value.trim(); });
  return body;
}

function nl_collectFields() {
  const body = nl_collectSeriesBody();
  return {
    id: nl_currentIssue?.id,
    series: document.getElementById('nl-f-series').value,
    issue_number: parseInt(document.getElementById('nl-f-issue-num').value) || null,
    headline: document.getElementById('nl-f-headline').value.trim(),
    dek: document.getElementById('nl-f-dek').value.trim(),
    notes: JSON.stringify({ body }),
    tags: nl_tags,
  };
}

async function nl_saveIssue() {
  const fields = nl_collectFields();
  let updated;
  if (nl_currentIssue?.id) { updated = await TMIAdmin.api('/api/fotf-issues','PUT',fields); }
  else { updated = await TMIAdmin.api('/api/fotf-issues','POST',fields); }
  if (!updated) return;
  nl_dirty = false; nl_currentIssue = updated;
  TMIAdmin.toast('Saved'); await nl_reload();
}

async function nl_newIssue() {
  if (nl_dirty && nl_currentIssue) { if (!confirm('You have unsaved changes. Discard them?')) return; }
  nl_currentIssue = null; nl_dirty = false; nl_tags = [];
  document.getElementById('nl-empty').style.display = 'none';
  document.getElementById('nl-form-wrap').style.display = 'flex';
  document.getElementById('nl-f-series').value    = '';
  document.getElementById('nl-f-issue-num').value = '';
  document.getElementById('nl-f-headline').value  = '';
  document.getElementById('nl-f-dek').value       = '';
  document.getElementById('nl-series-fields-wrap').innerHTML = '';
  document.getElementById('nl-series-context').style.display = 'none';
  document.getElementById('nl-two-sides').style.display = 'none';
  nl_renderTags();
  document.getElementById('nl-f-status-badge').innerHTML = TMIAdmin.badge('draft');
  document.getElementById('nl-btn-delete').style.display = 'none';
  document.getElementById('nl-f-headline').focus();
  nl_renderList(nl_issues.filter(i => nl_filterStatus === 'all' || i.status === nl_filterStatus));
}

async function nl_deleteIssue() {
  if (!nl_currentIssue?.id) return;
  const ok = await TMIAdmin.confirm(`Delete "${nl_currentIssue.headline||'this issue'}"? This cannot be undone.`);
  if (!ok) return;
  await TMIAdmin.api(`/api/fotf-issues?id=${nl_currentIssue.id}`,'DELETE');
  nl_currentIssue = null; nl_dirty = false;
  document.getElementById('nl-empty').style.display = 'flex';
  document.getElementById('nl-form-wrap').style.display = 'none';
  await nl_reload();
}

function nl_openSchedule() {
  if (!nl_currentIssue?.id) { TMIAdmin.toast('Save the issue first','error'); return; }
  const dt = document.getElementById('nl-sched-dt');
  dt.value = nl_currentIssue.scheduled_at ? nl_currentIssue.scheduled_at.slice(0,16) : '';
  TMIAdmin.openModal('nl-schedule-modal');
}

async function nl_confirmSchedule() {
  const dt = document.getElementById('nl-sched-dt').value;
  if (!dt) { TMIAdmin.toast('Pick a date and time','error'); return; }
  await nl_saveIssue();
  const updated = await TMIAdmin.api('/api/fotf-issues','PUT',{ id:nl_currentIssue.id, status:'scheduled', scheduled_at:new Date(dt).toISOString() });
  if (!updated) return;
  nl_currentIssue = updated;
  TMIAdmin.closeModal('nl-schedule-modal'); TMIAdmin.toast('Scheduled');
  await nl_reload();
}

async function nl_pushToBeehiiv() {
  if (!nl_currentIssue?.id) { await nl_saveIssue(); }
  if (!nl_currentIssue?.id) return;
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Pushing...';
  const result = await TMIAdmin.api('/api/fotf-issues','POST',{ action:'push-beehiiv', id:nl_currentIssue.id });
  btn.disabled = false; btn.textContent = 'Push to Beehiiv';
  if (result?.ok) TMIAdmin.toast('Pushed to Beehiiv as draft');
}

async function nl_reload() {
  nl_issues = await TMIAdmin.api('/api/fotf-issues') || [];
  nl_issues.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  nl_renderList(nl_issues.filter(i => nl_filterStatus === 'all' || i.status === nl_filterStatus));
  nl_renderRotation(nl_issues);
}

// ════════════════════════════════════════════════════════════════════════════
// ISSUES TAB  (prefix: iss_)
// ════════════════════════════════════════════════════════════════════════════
let iss_allIssues = [];
let iss_editingId = null;

async function iss_loadIssues() {
  const data = await TMIAdmin.api('/api/fotf-issues');
  if (data) { iss_allIssues = Array.isArray(data) ? data : []; iss_renderTable(); }
}

function iss_getFiltered() {
  const q = document.getElementById('iss-search').value.toLowerCase();
  const status = document.getElementById('iss-filter-status').value;
  return iss_allIssues.filter(i => {
    if (status && i.status !== status) return false;
    if (q) { const hay = [i.title, i.theme, String(i.issue_number||'')].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
}

function iss_renderTable() {
  const filtered = iss_getFiltered();
  const tbody = document.getElementById('iss-issues-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📰</div><h3>No issues yet</h3><p>Create your first FOTF issue.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(i => {
    const coverHtml = i.cover_url
      ? `<div class="cover-thumb" style="background-image:url('${i.cover_url}')"></div>`
      : `<div class="cover-thumb empty">📄</div>`;
    return `<tr>
      <td><span class="issue-num">${i.issue_number != null ? '#'+i.issue_number : '—'}</span></td>
      <td><div style="display:flex;align-items:center;gap:12px">${coverHtml}<div><div class="td-name">${i.title||'Untitled'}</div><div class="td-muted">${i.theme||''}</div></div></div></td>
      <td class="td-muted">${i.theme||'—'}</td>
      <td>${TMIAdmin.badge(i.status||'draft')}</td>
      <td class="td-muted">${i.publish_date ? new Date(i.publish_date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'}</td>
      <td class="td-muted">${i.subscriber_count != null ? Number(i.subscriber_count).toLocaleString() : '—'}</td>
      <td class="td-action">
        <button class="btn btn-ghost btn-sm" onclick="iss_editIssue(${JSON.stringify(i).replace(/"/g,'&quot;')})">Edit</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="iss_deleteIssue('${i.id}')">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

function iss_editIssue(issue) {
  iss_editingId = issue.id;
  document.getElementById('iss-issue-modal-title').textContent = 'Edit Issue';
  document.getElementById('iss-issue-id').value           = issue.id;
  document.getElementById('iss-issue-number').value       = issue.issue_number ?? '';
  document.getElementById('iss-issue-title').value        = issue.title || '';
  document.getElementById('iss-issue-theme').value        = issue.theme || '';
  document.getElementById('iss-issue-status').value       = issue.status || 'draft';
  document.getElementById('iss-issue-publish-date').value = issue.publish_date ? issue.publish_date.split('T')[0] : '';
  document.getElementById('iss-issue-subscribers').value  = issue.subscriber_count ?? '';
  document.getElementById('iss-issue-cover').value        = issue.cover_url || '';
  document.getElementById('iss-issue-notes').value        = issue.notes || '';
  TMIAdmin.openModal('iss-issue-modal');
}

function iss_closeIssueModal() {
  iss_editingId = null;
  document.getElementById('iss-issue-modal-title').textContent = 'New Issue';
  ['iss-issue-id','iss-issue-number','iss-issue-title','iss-issue-theme',
   'iss-issue-publish-date','iss-issue-subscribers','iss-issue-cover','iss-issue-notes']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('iss-issue-status').value = 'draft';
  TMIAdmin.closeModal('iss-issue-modal');
}

async function iss_saveIssue() {
  const title = document.getElementById('iss-issue-title').value.trim();
  if (!title) { TMIAdmin.toast('Title required','error'); return; }
  const payload = {
    issue_number:     parseInt(document.getElementById('iss-issue-number').value) || null,
    title,
    theme:            document.getElementById('iss-issue-theme').value.trim() || null,
    status:           document.getElementById('iss-issue-status').value,
    publish_date:     document.getElementById('iss-issue-publish-date').value || null,
    subscriber_count: parseInt(document.getElementById('iss-issue-subscribers').value) || null,
    cover_url:        document.getElementById('iss-issue-cover').value.trim() || null,
    notes:            document.getElementById('iss-issue-notes').value.trim() || null,
  };
  let res;
  if (iss_editingId) {
    res = await TMIAdmin.api('/api/fotf-issues','PATCH',{id:iss_editingId,...payload});
    if (res) { TMIAdmin.toast('Issue updated'); const idx = iss_allIssues.findIndex(i => i.id === iss_editingId); if (idx >= 0) iss_allIssues[idx] = res; }
  } else {
    res = await TMIAdmin.api('/api/fotf-issues','POST',payload);
    if (res) { TMIAdmin.toast('Issue created'); iss_allIssues.unshift(res); }
  }
  if (res) { iss_closeIssueModal(); iss_renderTable(); }
}

async function iss_deleteIssue(id) {
  if (!await TMIAdmin.confirm('Delete this issue? This cannot be undone.')) return;
  const res = await TMIAdmin.api(`/api/fotf-issues?id=${id}`,'DELETE');
  if (res) { TMIAdmin.toast('Issue deleted'); iss_allIssues = iss_allIssues.filter(i => i.id !== id); iss_renderTable(); }
}

// ── Init ─────────────────────────────────────────────────────────────────────
