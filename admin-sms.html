<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMS — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .tab-bar{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:2px;margin-bottom:20px;}
  .tab-bar button{background:none;border:none;padding:5px 14px;border-radius:4px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:background 0.12s,color 0.12s;line-height:1;}
  .tab-bar button.active{background:var(--chart);color:var(--ink);}
  .tab-bar button:not(.active):hover{background:var(--surface);color:var(--ink);}

  /* Conversations list */
  .conv-list{display:flex;flex-direction:column;gap:4px;}
  .conv-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:background 0.12s,border-color 0.12s;}
  .conv-card:hover{background:var(--bg-alt);border-color:var(--line-strong);}
  .conv-avatar{width:38px;height:38px;border-radius:50%;background:var(--chart);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink);flex:none;}
  .conv-info{flex:1;min-width:0;}
  .conv-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px;}
  .conv-preview{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-time{font-size:11px;color:var(--muted);flex:none;}

  /* Thread panel */
  .thread-messages{display:flex;flex-direction:column;gap:10px;padding:16px 0;min-height:200px;}
  .bubble-wrap{display:flex;justify-content:flex-end;}
  .bubble{background:var(--bg-alt);border:1px solid var(--line);border-radius:14px 14px 2px 14px;padding:9px 14px;max-width:80%;font-size:13px;color:var(--ink);line-height:1.5;}
  .bubble-meta{font-size:10px;color:var(--muted);text-align:right;margin-top:3px;}
  .thread-reply{display:flex;gap:8px;padding:16px 0 0;border-top:1px solid var(--line);margin-top:auto;}
  .thread-reply textarea{flex:1;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-family:inherit;resize:none;background:var(--bg);color:var(--ink);}
  .thread-reply textarea:focus{outline:none;border-color:var(--ink);}
  .thread-contact-hd{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}

  /* Templates */
  .tpl-list{display:flex;flex-direction:column;gap:8px;}
  .tpl-card{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:flex-start;gap:12px;}
  .tpl-body-wrap{flex:1;min-width:0;}
  .tpl-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .tpl-preview{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tpl-actions{display:flex;gap:6px;flex:none;}
</style>

</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">SMS</span></div>
      <div class="topbar-actions" id="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openCompose()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Send SMS
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>SMS Outreach</h1>
        <span class="filter-count" id="sms-count"></span>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <button id="tab-messages" class="active" onclick="setTab('messages')">Messages</button>
        <button id="tab-conversations" onclick="setTab('conversations')">Conversations</button>
        <button id="tab-templates" onclick="setTab('templates')">Templates</button>
      </div>

      <!-- Messages tab -->
      <div id="view-messages">
        <div class="filter-bar">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="search" placeholder="Search messages..." oninput="renderTable()"/>
          </div>
          <select class="filter-select" id="filter-status" onchange="renderTable()">
            <option value="">All</option>
            <option value="sent">Sent</option>
            <option value="delivered">Delivered</option>
            <option value="failed">Failed</option>
          </select>
        </div>

        <div class="card">
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th>To</th><th>Contact</th><th>Message</th><th>Status</th><th>Sent</th>
              </tr></thead>
              <tbody id="sms-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Conversations tab -->
      <div id="view-conversations" style="display:none;">
        <div class="card" style="padding:16px;">
          <div class="conv-list" id="conv-list"></div>
        </div>
      </div>

      <!-- Templates tab -->
      <div id="view-templates" style="display:none;">
        <div class="card" style="padding:16px;">
          <div class="tpl-list" id="tpl-list"></div>
          <div id="tpl-empty" style="display:none;padding:32px 0;text-align:center;">
            <div style="font-size:28px;margin-bottom:8px;">📝</div>
            <div style="font-size:13px;color:var(--muted);">No templates yet. Click "+ New Template" to create one.</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Compose modal -->
<div class="modal-overlay" id="compose-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title">Send SMS</h2>
      <button class="modal-x" onclick="closeCompose()">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input class="form-input" id="c-phone" placeholder="+1 (555) 000-0000" type="tel"/>
      <div class="form-hint">Include country code or US will be assumed.</div>
    </div>
    <div class="form-group">
      <label class="form-label">Message</label>
      <textarea class="form-input" id="c-body" rows="5" placeholder="Type your message..." oninput="updateCharCount()"></textarea>
      <div class="sms-char-count" id="char-count">0 / 160</div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeCompose()">Cancel</button>
      <button class="btn btn-primary" id="send-btn" onclick="sendSMS()">Send Message</button>
    </div>
  </div>
</div>

<!-- New Template modal -->
<div class="modal-overlay" id="tpl-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title">New Template</h2>
      <button class="modal-x" onclick="closeTplModal()">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Template Name</label>
      <input class="form-input" id="tpl-name-input" placeholder="e.g. Follow-up, Introduction..."/>
    </div>
    <div class="form-group">
      <label class="form-label">Message Body</label>
      <textarea class="form-input" id="tpl-body-input" rows="5" placeholder="Type your template message..."></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeTplModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTemplate()">Save Template</button>
    </div>
  </div>
</div>

<!-- Thread panel (conversation detail) -->
<div class="panel-overlay" id="thread-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('thread-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="thread-title">—</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" onclick="TMIAdmin.closePanel('thread-panel')">Close</button>
      </div>
    </div>
    <div class="panel-body" id="thread-panel-body" style="display:flex;flex-direction:column;height:100%;">
      <div class="thread-contact-hd" id="thread-contact-hd"></div>
      <div class="thread-messages" id="thread-messages"></div>
      <div class="thread-reply">
        <textarea id="thread-reply-input" rows="2" placeholder="Reply..." oninput="updateThreadCharCount()"></textarea>
        <button class="btn btn-primary btn-sm" onclick="sendThreadReply()" id="thread-send-btn">Send</button>
      </div>
      <div style="font-size:10px;color:var(--muted);text-align:right;margin-top:4px;" id="thread-char-count">0 / 160</div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('sms');

let allSMS = [];
let currentTab = 'messages';
let currentThreadPhone = null;

// ---- Tab management ----
function setTab(tab) {
  currentTab = tab;
  ['messages','conversations','templates'].forEach(t => {
    document.getElementById('view-' + t).style.display = t === tab ? '' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });

  // Show/hide the "+ New Template" button
  const actions = document.getElementById('topbar-actions');
  const existing = document.getElementById('btn-new-tpl');
  if (tab === 'templates') {
    if (!existing) {
      const btn = document.createElement('button');
      btn.id = 'btn-new-tpl';
      btn.className = 'btn btn-ghost btn-sm';
      btn.textContent = '+ New Template';
      btn.onclick = openTplModal;
      actions.insertBefore(btn, actions.firstChild);
    }
  } else {
    if (existing) existing.remove();
  }

  if (tab === 'conversations') renderConversations();
  if (tab === 'templates') renderTemplates();
}

// ---- SMS data ----
async function loadSMS() {
  allSMS = await TMIAdmin.api('/api/sms') || [];
  renderTable();
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const rows = allSMS.filter(s => {
    if (st && s.status !== st) return false;
    if (q && !`${s.phone} ${s.body} ${contactName(s)}`.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('sms-count').textContent = `${rows.length} message${rows.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('sms-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">💬</div><h3>No messages</h3><p>Sent messages will appear here.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(s => `
    <tr>
      <td class="td-name">${s.phone}</td>
      <td>${contactName(s)}</td>
      <td style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--ink-2)">${s.body}</td>
      <td>${TMIAdmin.badge(s.status)}</td>
      <td class="td-muted">${TMIAdmin.fmt(s.created_at)}</td>
    </tr>
  `).join('');
}

function contactName(s) {
  const c = s.contacts;
  if (!c) return '';
  return `${c.first_name || ''} ${c.last_name || ''}`.trim();
}

// ---- Compose ----
function openCompose(prefillPhone) {
  document.getElementById('compose-modal').classList.add('open');
  if (prefillPhone) {
    document.getElementById('c-phone').value = prefillPhone;
    document.getElementById('c-body').focus();
  }
}
function closeCompose() {
  document.getElementById('compose-modal').classList.remove('open');
}

function updateCharCount() {
  const len = document.getElementById('c-body').value.length;
  document.getElementById('char-count').textContent = `${len} / 160`;
  document.getElementById('char-count').style.color = len > 160 ? 'var(--red)' : 'var(--muted)';
}

async function sendSMS() {
  const phone = document.getElementById('c-phone').value.trim();
  const body = document.getElementById('c-body').value.trim();
  if (!phone || !body) { TMIAdmin.toast('Phone and message required', 'error'); return; }
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  const res = await TMIAdmin.api('/api/sms', 'POST', { phone, body });
  btn.disabled = false; btn.textContent = 'Send Message';
  if (res) {
    if (res.ok) {
      TMIAdmin.toast('Message sent');
      closeCompose();
      document.getElementById('c-phone').value = '';
      document.getElementById('c-body').value = '';
      updateCharCount();
      await loadSMS();
    } else {
      TMIAdmin.toast('Send failed - check Twilio config', 'error');
    }
  }
}

// ---- Conversations ----
function renderConversations() {
  const byPhone = {};
  allSMS.forEach(s => {
    if (!byPhone[s.phone]) byPhone[s.phone] = [];
    byPhone[s.phone].push(s);
  });

  // Sort phones by most recent message
  const phones = Object.keys(byPhone).sort((a, b) => {
    const aLatest = Math.max(...byPhone[a].map(s => new Date(s.created_at)));
    const bLatest = Math.max(...byPhone[b].map(s => new Date(s.created_at)));
    return bLatest - aLatest;
  });

  const list = document.getElementById('conv-list');
  if (!phones.length) {
    list.innerHTML = `<div style="padding:32px 0;text-align:center;"><div style="font-size:28px;margin-bottom:8px;">💬</div><div style="font-size:13px;color:var(--muted);">No conversations yet.</div></div>`;
    return;
  }

  list.innerHTML = phones.map(phone => {
    const msgs = byPhone[phone].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const last = msgs[msgs.length - 1];
    const contact = last.contacts;
    const name = contact ? `${contact.first_name || ''} ${contact.last_name || ''}`.trim() || phone : phone;
    const initials = name === phone ? '#' : name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const preview = last.body.length > 60 ? last.body.slice(0, 60) + '...' : last.body;
    const time = TMIAdmin.fmt(last.created_at);
    const data = JSON.stringify({ phone, name }).replace(/"/g, '&quot;');
    return `<div class="conv-card" onclick="openThread(${data})">
      <div class="conv-avatar">${initials}</div>
      <div class="conv-info">
        <div class="conv-name">${name}</div>
        <div class="conv-preview">${preview}</div>
      </div>
      <div class="conv-time">${time}</div>
    </div>`;
  }).join('');
}

function openThread(data) {
  const { phone, name } = data;
  currentThreadPhone = phone;

  const msgs = allSMS
    .filter(s => s.phone === phone)
    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

  document.getElementById('thread-title').textContent = name;
  document.getElementById('thread-contact-hd').textContent = phone === name ? '' : phone;

  document.getElementById('thread-messages').innerHTML = msgs.map(s => `
    <div class="bubble-wrap">
      <div>
        <div class="bubble">${s.body}</div>
        <div class="bubble-meta">${TMIAdmin.badge(s.status)} ${TMIAdmin.fmt(s.created_at)}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('thread-reply-input').value = '';
  updateThreadCharCount();
  TMIAdmin.openPanel('thread-panel');

  // Scroll messages to bottom
  setTimeout(() => {
    const el = document.getElementById('thread-messages');
    el.scrollTop = el.scrollHeight;
  }, 50);
}

function updateThreadCharCount() {
  const len = document.getElementById('thread-reply-input').value.length;
  document.getElementById('thread-char-count').textContent = `${len} / 160`;
}

async function sendThreadReply() {
  if (!currentThreadPhone) return;
  const body = document.getElementById('thread-reply-input').value.trim();
  if (!body) return;
  const btn = document.getElementById('thread-send-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  const res = await TMIAdmin.api('/api/sms', 'POST', { phone: currentThreadPhone, body });
  btn.disabled = false; btn.textContent = 'Send';
  if (res && res.ok) {
    TMIAdmin.toast('Message sent');
    await loadSMS();
    // Re-open thread with updated data
    const contact = (allSMS.find(s => s.phone === currentThreadPhone) || {}).contacts;
    const name = contact ? `${contact.first_name || ''} ${contact.last_name || ''}`.trim() || currentThreadPhone : currentThreadPhone;
    openThread({ phone: currentThreadPhone, name });
  } else {
    TMIAdmin.toast('Send failed', 'error');
  }
}

// ---- Templates ----
const TPL_KEY = 'sms_templates';

function getTemplates() {
  try { return JSON.parse(localStorage.getItem(TPL_KEY)) || []; }
  catch { return []; }
}

function saveTemplates(tpls) {
  localStorage.setItem(TPL_KEY, JSON.stringify(tpls));
}

function renderTemplates() {
  const tpls = getTemplates();
  const list = document.getElementById('tpl-list');
  const empty = document.getElementById('tpl-empty');
  if (!tpls.length) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = tpls.map(t => `
    <div class="tpl-card">
      <div class="tpl-body-wrap">
        <div class="tpl-name">${t.name}</div>
        <div class="tpl-preview">${t.body.length > 80 ? t.body.slice(0,80) + '...' : t.body}</div>
      </div>
      <div class="tpl-actions">
        <button class="btn btn-ghost btn-sm" onclick="useTemplate('${t.id}')">Use</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTemplate('${t.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function openTplModal() {
  document.getElementById('tpl-name-input').value = '';
  document.getElementById('tpl-body-input').value = '';
  document.getElementById('tpl-modal').classList.add('open');
}

function closeTplModal() {
  document.getElementById('tpl-modal').classList.remove('open');
}

function saveTemplate() {
  const name = document.getElementById('tpl-name-input').value.trim();
  const body = document.getElementById('tpl-body-input').value.trim();
  if (!name || !body) { TMIAdmin.toast('Name and body required', 'error'); return; }
  const tpls = getTemplates();
  tpls.push({ id: Date.now().toString(), name, body });
  saveTemplates(tpls);
  TMIAdmin.toast('Template saved');
  closeTplModal();
  renderTemplates();
}

function useTemplate(id) {
  const tpls = getTemplates();
  const t = tpls.find(t => t.id === id);
  if (!t) return;
  setTab('messages');
  openCompose();
  document.getElementById('c-body').value = t.body;
  updateCharCount();
}

function deleteTemplate(id) {
  const tpls = getTemplates().filter(t => t.id !== id);
  saveTemplates(tpls);
  TMIAdmin.toast('Template deleted');
  renderTemplates();
}

loadSMS();
</script>
</body>
</html>
