<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Add City Lead — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .form-card{max-width:680px;}
  .form-section{margin-bottom:32px;}
  .form-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><a href="/admin-city-dashboard">City Leads</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page" id="page-crumb">Add City Lead</span></div>
    </div>

    <div class="content">
      <div class="sec-head">
        <h1 id="page-title">Add City Lead</h1>
      </div>

      <div class="card form-card">
        <div class="form-section">
          <div class="form-section-title">Contact Info</div>
          <div class="form-row">
            <label class="form-label">Full Name <span style="color:var(--red)">*</span></label>
            <input type="text" class="form-input" id="cl-name" placeholder="Jane Smith" required/>
          </div>
          <div class="form-row grid-2">
            <div>
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="cl-email" placeholder="jane@example.com"/>
            </div>
            <div>
              <label class="form-label">Phone</label>
              <input type="tel" class="form-input" id="cl-phone" placeholder="(555) 000-0000"/>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Territory</div>
          <div class="form-row grid-2">
            <div>
              <label class="form-label">City <span style="color:var(--red)">*</span></label>
              <input type="text" class="form-input" id="cl-city" placeholder="Houston"/>
            </div>
            <div>
              <label class="form-label">State</label>
              <input type="text" class="form-input" id="cl-state" placeholder="TX" maxlength="2"/>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Territory Description</label>
            <input type="text" class="form-input" id="cl-territory" placeholder="Greater Houston metro area, including Katy and Sugar Land"/>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Status & Notes</div>
          <div class="form-row">
            <label class="form-label">Status</label>
            <select class="form-input" id="cl-status">
              <option value="active">Active</option>
              <option value="pending">Pending</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="form-row">
            <label class="form-label">Notes</label>
            <textarea class="form-input" id="cl-notes" rows="4" placeholder="Background, how you found them, agreement terms..."></textarea>
          </div>
        </div>

        <div style="display:flex;gap:12px;align-items:center">
          <button class="btn btn-primary" id="save-btn" onclick="saveLead()">Save City Lead</button>
          <a href="/admin-city-roster" class="btn btn-ghost">Cancel</a>
          <button class="btn btn-ghost" id="delete-btn" onclick="deleteLead()" style="display:none;margin-left:auto;color:var(--red)">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('city-roster');

let editId = null;

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) return;

  editId = id;
  document.getElementById('page-crumb').textContent = 'Edit City Lead';
  document.getElementById('page-title').textContent = 'Edit City Lead';
  document.getElementById('delete-btn').style.display = 'inline-flex';

  const data = await TMIAdmin.api(`/api/city-leads?id=${id}`);
  if (!data) return;

  document.getElementById('cl-name').value      = data.name || '';
  document.getElementById('cl-email').value     = data.email || '';
  document.getElementById('cl-phone').value     = data.phone || '';
  document.getElementById('cl-city').value      = data.city || '';
  document.getElementById('cl-state').value     = data.state || '';
  document.getElementById('cl-territory').value = data.territory || '';
  document.getElementById('cl-status').value    = data.status || 'active';
  document.getElementById('cl-notes').value     = data.notes || '';
}

async function saveLead() {
  const name = document.getElementById('cl-name').value.trim();
  const city = document.getElementById('cl-city').value.trim();
  if (!name) { TMIAdmin.toast('Name is required', 'error'); return; }
  if (!city) { TMIAdmin.toast('City is required', 'error'); return; }

  const payload = {
    name,
    email:     document.getElementById('cl-email').value.trim() || null,
    phone:     document.getElementById('cl-phone').value.trim() || null,
    city,
    state:     document.getElementById('cl-state').value.trim().toUpperCase() || null,
    territory: document.getElementById('cl-territory').value.trim() || null,
    status:    document.getElementById('cl-status').value,
    notes:     document.getElementById('cl-notes').value.trim() || null,
  };

  let res;
  if (editId) {
    res = await TMIAdmin.api('/api/city-leads', 'PATCH', { id: editId, ...payload });
    if (res) { TMIAdmin.toast('City lead updated'); }
  } else {
    res = await TMIAdmin.api('/api/city-leads', 'POST', payload);
    if (res) { TMIAdmin.toast('City lead added'); }
  }

  if (res) setTimeout(() => window.location.href = '/admin-city-roster', 800);
}

async function deleteLead() {
  if (!editId) return;
  if (!await TMIAdmin.confirm('Delete this city lead? All associated business records will be orphaned.')) return;
  const res = await TMIAdmin.api(`/api/city-leads?id=${editId}`, 'DELETE');
  if (res) { TMIAdmin.toast('Deleted'); setTimeout(() => window.location.href = '/admin-city-roster', 800); }
}

init();
</script>
</body>
</html>
