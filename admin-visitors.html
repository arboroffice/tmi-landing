<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Site Visitors — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .vis-co{font-weight:600;color:var(--ink);}
  .vis-sub{font-size:12px;color:var(--muted);}
  .vis-li{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;}
  .vis-page{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--ink-2);}
  .badge-sync{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chart);color:var(--ink);}
  .badge-new{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg-alt);color:var(--ink-2);}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Site Visitors</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">Export CSV</button>
        <button class="btn btn-primary btn-sm" id="btn-sync" onclick="syncMeta()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7" stroke-linecap="round"/><polyline points="21 4 21 9 16 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Sync to Meta Audience
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Site Visitors</h1>
        <div class="sec-head-right">
          <span class="filter-count" id="vis-count"></span>
        </div>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, company, title, industry..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-sync" onchange="renderTable()">
          <option value="">All</option>
          <option value="unsynced">Not synced to Meta</option>
          <option value="synced">Synced to Meta</option>
        </select>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Person</th><th>Company</th><th>Industry</th><th>Location</th>
              <th>Last page</th><th>Visits</th><th>Last seen</th><th>Meta</th><th></th>
            </tr></thead>
            <tbody id="vis-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.initSidebar('visitors');

let VISITORS = [];

async function load() {
  const data = await TMIAdmin.api('/api/visitors');
  VISITORS = Array.isArray(data) ? data : [];
  renderTable();
}

function getFiltered() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  const sync = document.getElementById('filter-sync').value;
  return VISITORS.filter(v => {
    if (sync === 'synced' && !v.synced_meta) return false;
    if (sync === 'unsynced' && v.synced_meta) return false;
    if (!q) return true;
    const hay = [v.first_name, v.last_name, v.company, v.title, v.industry, v.email, v.region, v.city]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderTable() {
  const rows = getFiltered();
  document.getElementById('vis-count').textContent = `${rows.length} visitor${rows.length === 1 ? '' : 's'}`;
  const tbody = document.getElementById('vis-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="padding:40px;text-align:center;color:var(--muted)">No identified visitors yet. Once RB2B starts resolving traffic, they show up here.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(v => {
    const name = [v.first_name, v.last_name].filter(Boolean).join(' ') || '—';
    const nameCell = v.linkedin_url
      ? `<a class="vis-li" href="${esc(v.linkedin_url)}" target="_blank" rel="noopener">${esc(name)}</a>`
      : esc(name);
    const loc = [v.city, v.region, v.country].filter(Boolean).join(', ') || '—';
    const seen = v.last_seen ? new Date(v.last_seen).toLocaleDateString() : '';
    const meta = v.synced_meta ? `<span class="badge-sync">Synced</span>` : `<span class="badge-new">New</span>`;
    return `<tr>
      <td><div class="vis-co">${nameCell}</div><div class="vis-sub">${esc(v.title || '')}${v.email ? ' · ' + esc(v.email) : ''}</div></td>
      <td>${esc(v.company || '—')}${v.company_domain ? `<div class="vis-sub">${esc(v.company_domain)}</div>` : ''}</td>
      <td>${esc(v.industry || '—')}</td>
      <td>${esc(loc)}</td>
      <td><div class="vis-page" title="${esc(v.last_page || '')}">${esc(v.last_page || '—')}</div></td>
      <td>${v.visit_count || 1}</td>
      <td>${esc(seen)}</td>
      <td>${meta}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="del('${v.id}')" title="Delete">&times;</button></td>
    </tr>`;
  }).join('');
}

async function del(id) {
  if (!confirm('Remove this visitor?')) return;
  const res = await TMIAdmin.api(`/api/visitors?id=${id}`, 'DELETE');
  if (res) { TMIAdmin.toast('Removed'); load(); }
}

async function syncMeta() {
  const btn = document.getElementById('btn-sync');
  btn.disabled = true;
  const res = await TMIAdmin.api('/api/visitors-sync-meta', 'POST', {});
  btn.disabled = false;
  if (res && res.ok) {
    TMIAdmin.toast(`Synced ${res.synced} visitor${res.synced === 1 ? '' : 's'} to Meta`);
    load();
  }
}

function exportCSV() {
  const rows = getFiltered();
  const headers = ['Name','Title','Company','Domain','Email','Industry','Location','Last Page','Visits','Last Seen','LinkedIn'];
  const lines = rows.map(v => {
    const name = [v.first_name, v.last_name].filter(Boolean).join(' ');
    const loc = [v.city, v.region, v.country].filter(Boolean).join(', ');
    return [
      name, v.title || '', v.company || '', v.company_domain || '', v.email || '',
      v.industry || '', loc, v.last_page || '', v.visit_count || 1,
      v.last_seen ? new Date(v.last_seen).toLocaleString() : '', v.linkedin_url || ''
    ].map(x => `"${String(x).replace(/"/g, '""')}"`).join(',');
  });
  const csv = [headers.join(','), ...lines].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `site-visitors-${new Date().toISOString().split('T')[0]}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

load();
</script>
</body>
</html>
