<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Partial circle: ~310° arc, gap at top -->
  <circle cx="100" cy="100" r="90"
    stroke="currentColor" stroke-width="5" fill="none"
    stroke-dasharray="489 566" stroke-dashoffset="-38"
    stroke-linecap="round"/>

  <g fill="currentColor">
    <!-- ── M (back layer, starts below T crossbar) ── -->
    <!-- Left outer vertical stem -->
    <rect x="30" y="65" width="15" height="93"/>
    <!-- Left base serif -->
    <rect x="20" y="150" width="35" height="11"/>
    <!-- Left inner diagonal: top-right of left stem → V-center -->
    <polygon points="45,65 59,65 108,109 94,109"/>
    <!-- Right inner diagonal: V-center → top-left of right stem -->
    <polygon points="141,65 155,65 106,109 92,109"/>
    <!-- Right outer vertical stem -->
    <rect x="141" y="65" width="15" height="93"/>
    <!-- Right base serif -->
    <rect x="131" y="150" width="35" height="11"/>

    <!-- ── I (back layer, right side) ── -->
    <!-- Top serif -->
    <rect x="147" y="65" width="28" height="10"/>
    <!-- Stem -->
    <rect x="153" y="75" width="13" height="83"/>
    <!-- Base serif -->
    <rect x="147" y="150" width="28" height="11"/>

    <!-- ── T (front layer, dominant) ── -->
    <!-- Crossbar: covers tops of M and I, creates stacking effect -->
    <rect x="22" y="43" width="156" height="21"/>
    <!-- Left serif tab -->
    <rect x="16" y="38" width="32" height="31"/>
    <!-- Right serif tab -->
    <rect x="152" y="38" width="32" height="31"/>
    <!-- Vertical stem -->
    <rect x="87" y="43" width="26" height="125"/>
    <!-- Base serif -->
    <rect x="74" y="157" width="52" height="12"/>
  </g>
</svg>
