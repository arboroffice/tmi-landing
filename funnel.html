<style>
  :root{
    --bg-dark:#0a0b14;--ink:#1a1a1a;--chart:#E4FF97;--chart-dark:#D0FF6A;
    --serif:"Barlow",system-ui,sans-serif;
    --sans:"Neue Haas Grotesk Display","Neue Haas Grotesk",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg-dark);color:#fff;-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  h1{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-0.02em;}

  .wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px 56px;width:100%;max-width:880px;margin:0 auto;}

  .brand{display:flex;align-items:center;gap:9px;font-family:var(--sans);font-size:15px;font-weight:700;color:#fff;margin-bottom:44px;}
  .brand img{height:24px;width:auto;filter:brightness(0) invert(1);}

  .kicker{font-family:var(--sans);font-size:11px;letter-spacing:0.24em;text-transform:uppercase;font-weight:600;color:var(--chart);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
  .kicker::before,.kicker::after{content:"";display:block;width:24px;height:1px;background:var(--chart);opacity:0.5;}

  h1{font-size:clamp(28px,4.6vw,52px);line-height:1.04;max-width:18ch;margin:0 auto 36px;}
  h1 em{font-style:italic;color:rgba(255,255,255,0.45);}

  .vsl{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);box-shadow:0 30px 90px rgba(0,0,0,0.55);}
  .vsl::after{content:"";position:absolute;inset:-1px;border-radius:16px;box-shadow:0 0 0 1px rgba(228,255,151,0.14);pointer-events:none;}
  .vsl video,.vsl iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;}

  .cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--chart);color:#0a0b14;font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:0.01em;padding:19px 46px;border-radius:999px;margin-top:40px;transition:background 0.15s,transform 0.15s;box-shadow:0 14px 40px rgba(228,255,151,0.16);}
  .cta:hover{background:var(--chart-dark);transform:translateY(-1px);}
  .note{font-family:var(--sans);font-size:13px;color:rgba(255,255,255,0.4);margin-top:18px;letter-spacing:0.02em;}

  @media(max-width:600px){
    .wrap{padding:28px 18px 44px;}
    .brand{margin-bottom:32px;}
    .cta{width:100%;padding:18px 28px;margin-top:32px;}
    h1{margin-bottom:28px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand"><img src="logo.svg" alt="TMI"/> TMI</div>

  <div class="kicker">The Intelligence Audit</div>
  <h1>Most businesses don't have a people problem. <em>They have a systems problem.</em></h1>

  <div class="vsl">
    <!-- Drop your VSL here. Self-hosted: keep the <video> below and upload vsl.mp4.

    <video controls playsinline preload="metadata" poster="hero-bg.png">
      <source src="vsl.mp4" type="video/mp4"/>
    </video>
  </div>

  <a href="/complete-audit" class="cta" onclick="if(typeof fbq==='function')fbq('track','Lead');">Take the Complete Audit &rarr;</a>
  <p class="note">A complete operational audit, then 30 minutes with the founder and a strategist.</p>
</div>
