<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Start a Business — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .msg-cell{font-size:13px;color:var(--ink-2);max-width:320px;}
  .status-select{font-size:12px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg-alt);color:var(--ink-2);border:1px solid var(--line-strong);white-space:nowrap;}
  .pill.none{background:#fff6e5;color:#8a5a00;border-color:#f0d9a8;}
  .pill.learning{background:#eaf3ff;color:#255a9e;border-color:#bcd8f5;}
  .pill.have{background:#eefbe6;color:#3d7a1f;border-color:#c6ecb0;}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Start a Business</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">Export CSV</button>
      </div>
    </div>

    <div class="content">
      <div class="sec-head">
        <h1>Start a Business</h1>
        <span class="filter-count" id="count"></span>
      </div>

      <div class="stats-row" id="stats-row">
        <div class="stat-box"><div class="stat-label">Total applications</div><div class="stat-val" id="stat-total">—</div></div>
        <div class="stat-box"><div class="stat-label">New</div><div class="stat-val" id="stat-new">—</div></div>
        <div class="stat-box"><div class="stat-label">This week</div><div class="stat-val" id="stat-week">—</div></div>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, email, trade..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderTable()">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="interviewing">Interviewing</option>
          <option value="accepted">Accepted</option>
          <option value="archived">Archived</option>
        </select>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Trade</th>
              <th>Location</th>
              <th>About</th>
              <th>Date</th>
              <th>Status</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="empty" style="display:none">No applications yet. They'll appear here the moment someone applies on /startabusiness.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('startabusiness');

var ROWS = [];
var TRADE_STATUS = { have:'Has a trade', learning:'Learning', none:'No trade yet' };

function fmtDate(d){ return TMIAdmin.fmt(d); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function load(){
  ROWS = await TMIAdmin.api('/api/startabusiness') || [];
  stats();
  renderTable();
}

function stats(){
  var now = Date.now();
  var week = ROWS.filter(function(r){ return r.created_at && (now - new Date(r.created_at).getTime()) < 7*864e5; }).length;
  var neu = ROWS.filter(function(r){ return (r.status||'new')==='new'; }).length;
  document.getElementById('stat-total').textContent = ROWS.length;
  document.getElementById('stat-new').textContent = neu;
  document.getElementById('stat-week').textContent = week;
}

function tradeCell(r){
  var st = r.trade_status || '';
  var label = TRADE_STATUS[st] || '';
  var trade = r.trade ? esc(r.trade) : '';
  var pill = label ? '<span class="pill '+esc(st)+'">'+esc(label)+'</span>' : '';
  if(trade && pill) return trade + '<br>' + pill;
  return trade || pill || '—';
}

function renderTable(){
  var q = (document.getElementById('search').value||'').toLowerCase().trim();
  var st = document.getElementById('filter-status').value;
  var rows = ROWS.filter(function(r){
    if(st && (r.status||'new')!==st) return false;
    if(q){ var hay=((r.name||'')+' '+(r.email||'')+' '+(r.trade||'')+' '+(r.location||'')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  document.getElementById('count').textContent = rows.length + (rows.length===1?' application':' applications');
  var tb = document.getElementById('tbody');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  var STATUSES = ['new','contacted','interviewing','accepted','archived'];
  tb.innerHTML = rows.map(function(r){
    var cur = r.status || 'new';
    var opts = STATUSES.map(function(s){ return '<option value="'+s+'"'+(s===cur?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'; }).join('');
    return '<tr>'
      + '<td><strong>'+esc(r.name||'—')+'</strong></td>'
      + '<td class="td-muted"><a href="mailto:'+esc(r.email)+'">'+esc(r.email||'—')+'</a></td>'
      + '<td class="td-muted">'+(r.phone?'<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>':'—')+'</td>'
      + '<td>'+tradeCell(r)+'</td>'
      + '<td class="td-muted">'+esc(r.location||'—')+'</td>'
      + '<td class="msg-cell">'+esc(r.message||'—')+'</td>'
      + '<td class="td-muted">'+fmtDate(r.created_at)+'</td>'
      + '<td><select class="status-select" onchange="setStatus(\''+r.id+'\',this.value)">'+opts+'</select></td>'
      + '</tr>';
  }).join('');
}

async function setStatus(id, status){
  var r = ROWS.find(function(x){ return x.id===id; });
  if(r) r.status = status;
  stats();
  try{ await TMIAdmin.api('/api/startabusiness','PATCH',{ id:id, status:status }); TMIAdmin.toast('Updated'); }
  catch(e){ TMIAdmin.toast('Update failed','error'); }
}

function exportCSV(){
  var head = ['Name','Email','Phone','Trade status','Trade','Location','About','Date','Status'];
  var lines = [head.join(',')].concat(ROWS.map(function(r){
    return [r.name, r.email, r.phone, (TRADE_STATUS[r.trade_status]||r.trade_status), r.trade, r.location, r.message, r.created_at, r.status||'new'].map(function(v){
      return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    }).join(',');
  }));
  var blob = new Blob([lines.join('\n')], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'startabusiness-applications.csv'; a.click();
}

load();
</script>
</body>
</html>
