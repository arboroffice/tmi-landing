<style>

        <div className="container">
          <div className="manifesto-grid">
            <div className="label">A note<br/>from the founders</div>

          </div>

            <div className="num">02 · CONNECT, DON'T REPLACE</div>

          <div>
            <div className="num">03 · EVIDENCE, NOT ADJECTIVES</div>
            <h3>We measure or we don't claim it.</h3>
            <p>Every agent ships with a measurement plan. Every quarter we publish customer-verified outcomes. Adjectives are cheap; the receipts are not.</p>
          </div>
        </div>
      </section>

            <div className="timeline-row">
              <div className="year">2022</div>

              </div>
            </div>
            <div className="timeline-row">
              <div className="year">2023</div>
              <div className="body">

            <div className="timeline-row">
              <div className="year">2024</div>

              </div>
            </div>
            <div className="timeline-row">
              <div className="year">2026</div>
              <div className="body">
                <h4>Series B. Industrial-grade compliance. Refining at scale.</h4>
                <p>$48M Series B. SOC 2 Type II and IEC 62443-3-3. Three majors live across refining and midstream. The next chapter is invention - agents that re-imagine workflows that were never possible before.</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section className="stats-band" data-screen-label="Company · Stats">

            <div className="leader">
              <div className="avatar">NA</div>
              <div>

              <div className="avatar">JT</div>

              </div>
            </div>
          </div>
        </div>

      <section data-screen-label="Company · Investors">

          <p>Tell us where the operation is, and we'll tell you which agents pay back fastest. Or just come say hi at one of the conferences below.</p>
