<style>
  :root {
    --ink: #f3ece1;
    --ink-2: #a8a097;
    --ink-3: #6b665e;
    --bg: #0c0b0a;
    --bg-2: #15130f;
    --bg-3: #1f1c17;
    --line: rgba(243, 236, 225, 0.10);
    --line-strong: rgba(243, 236, 225, 0.22);
    --accent: #e89e3c;
    --accent-warm: #d2691e;
    --serif: 'Fraunces', 'Newsreader', Georgia, serif;
    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    --container: 1480px;
    --gap: clamp(20px, 3vw, 48px);
    --section: clamp(96px, 11vw, 180px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  .container { max-width: var(--container); margin: 0 auto; padding: 0 clamp(20px, 3.5vw, 56px); }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow::before { content: ""; display: inline-block; width: 28px; height: 1px; background: var(--accent); }

  /* ─────────── nav ─────────── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 22px clamp(20px, 3.5vw, 56px);

    transition: background 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease;
    border-bottom: 1px solid transparent;

    display: flex; align-items: baseline; gap: 8px;

  .nav .mark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .nav .links { display: flex; gap: 28px; }
  .nav .links a { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); transition: color 0.15s; }
  .nav .links a:hover { color: var(--ink); }
  .nav .cta {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 12px 22px; border: 1px solid var(--ink); color: var(--ink); border-radius: 999px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .nav .cta:hover { background: var(--ink); color: var(--bg); }
  @media (max-width: 820px) { .nav .links { display: none; } }

  /* ─────────── hero ─────────── */

    overflow: hidden;
  }

      radial-gradient(ellipse 80% 60% at 30% 75%, rgba(232, 158, 60, 0.32) 0%, transparent 55%),

      linear-gradient(180deg, #1a1612 0%, #0c0b0a 60%, #050403 100%);
  }
  .hero-img::before {

      linear-gradient(180deg, transparent 78%, rgba(232,158,60,0.12) 80%, transparent 82%),
      linear-gradient(180deg, transparent 79.5%, rgba(0,0,0,0.6) 80%, transparent 80.5%);

    background-position: center;
  }

    position: absolute; inset: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' preserveAspectRatio='xMidYMax slice'><g fill='%23000' opacity='0.85'><rect y='720' width='1600' height='180'/><g transform='translate(180 720)'><rect x='-4' y='-160' width='8' height='160'/><polygon points='-60,-180 60,-180 30,-160 -30,-160'/><rect x='-30' y='-130' width='60' height='10'/></g><g transform='translate(420 720)'><rect x='-3' y='-220' width='6' height='220'/><polygon points='-50,-240 50,-240 25,-220 -25,-220'/><polygon points='-15,-260 15,-260 8,-240 -8,-240'/></g><g transform='translate(700 720)'><rect x='-5' y='-280' width='10' height='280'/><polygon points='-80,-300 80,-300 40,-280 -40,-280'/><rect x='-50' y='-260' width='100' height='14'/><circle cx='0' cy='-260' r='14'/></g><g transform='translate(1020 720)'><rect x='-3' y='-180' width='6' height='180'/><polygon points='-45,-200 45,-200 22,-180 -22,-180'/></g><g transform='translate(1300 720)'><rect x='-4' y='-240' width='8' height='240'/><polygon points='-65,-260 65,-260 32,-240 -32,-240'/><rect x='-40' y='-220' width='80' height='10'/></g></g></svg>");
    background-size: cover; background-position: center bottom;
  }
  .hero-img::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(12,11,10,0.55) 0%, rgba(12,11,10,0.15) 30%, rgba(12,11,10,0.25) 65%, rgba(12,11,10,0.95) 100%),
      radial-gradient(ellipse at 30% 70%, rgba(232,158,60,0.18) 0%, transparent 60%);
  }
  .hero-grain {
    position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.88  0 0 0 0.06 0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode: overlay;
    opacity: 0.35;
  }
  .hero-inner {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 120px clamp(20px, 3.5vw, 56px) clamp(48px, 6vw, 96px);
    max-width: var(--container); width: 100%; margin: 0 auto;
  }
  .hero-meta {
    display: flex; align-items: center; gap: 18px; margin-bottom: 32px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);
  }
  .hero-meta .pill { padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink); }
  .hero-meta .dotline { display: inline-block; flex: 1; max-width: 220px; height: 1px; background: linear-gradient(90deg, var(--ink-2), transparent); }
  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(56px, 9.5vw, 184px);
    line-height: 0.92;
    letter-spacing: -0.035em;
    font-weight: 400;
    max-width: 14ch;
    text-wrap: balance;
    color: var(--ink);
  }
  .hero h1 em {
    font-style: italic; font-weight: 300;
    color: var(--accent);
    font-variation-settings: "SOFT" 100;
  }
  .hero-bottom {
    margin-top: clamp(40px, 5vw, 72px);
    display: grid; grid-template-columns: 1.4fr 1fr; gap: clamp(32px, 5vw, 96px); align-items: end;
  }
  .hero-bottom .lede {
    font-family: var(--serif);
    font-size: clamp(18px, 1.7vw, 24px);
    line-height: 1.45;
    color: var(--ink);
    max-width: 42ch;
    text-wrap: pretty;
    font-weight: 300;
  }
  .hero-bottom .lede strong { color: var(--accent); font-style: italic; font-weight: 400; }
  .hero-bottom .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 22px; }
  .btn-primary {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 18px 32px; background: var(--ink); color: var(--bg); border-radius: 999px;
    display: inline-flex; align-items: center; gap: 14px;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .btn-primary:hover { background: var(--accent); transform: translateX(4px); }
  .btn-primary .arrow { width: 16px; height: 1px; background: currentColor; position: relative; }
  .btn-primary .arrow::after { content: ""; position: absolute; right: 0; top: -3px; width: 8px; height: 8px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg); transform-origin: 100% 50%; }
  .scroll-cue { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
  .scroll-cue .vline { width: 1px; height: 32px; background: var(--ink-2); display: inline-block; animation: scrollCue 2.4s ease-in-out infinite; transform-origin: top; }

  @media (max-width: 820px) {

  }

  /* ─────────── caption strip beneath hero ─────────── */
  .caption-strip {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
    background: var(--bg);
  }
  .caption-strip .container {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2);
  }
  .caption-strip span:first-child { color: var(--ink); }
  .caption-strip .ticker { display: flex; gap: 32px; overflow: hidden; }
  .caption-strip .ticker span::before { content: "·"; margin-right: 32px; color: var(--ink-3); }
  .caption-strip .ticker span:first-child::before { display: none; }

  /* ─────────── thesis / pull-quote ─────────── */
  .thesis {
    padding: var(--section) 0;
    border-bottom: 1px solid var(--line);
  }
  .thesis-grid { display: grid; grid-template-columns: 1fr 2fr; gap: clamp(40px, 6vw, 120px); align-items: start; }
  .thesis-label { position: sticky; top: 120px; }
  .thesis-body p {
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(28px, 3.4vw, 52px); line-height: 1.22; letter-spacing: -0.02em;
    margin-bottom: 32px; color: var(--ink);
    max-width: 24ch; text-wrap: pretty;
  }
  .thesis-body p:last-child { margin-bottom: 0; }
  .thesis-body p em { color: var(--accent); font-style: italic; font-weight: 400; }
  .thesis-body p .strike { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--ink-3); font-weight: 300; }

  @media (max-width: 820px) {
    .thesis-grid { grid-template-columns: 1fr; }
    .thesis-label { position: static; }
  }

  /* ─────────── reality / image+stat duo ─────────── */
  .reality { background: var(--bg-2); padding: var(--section) 0; border-bottom: 1px solid var(--line); }
  .reality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
  .reality-grid > .col {
    padding: clamp(48px, 6vw, 96px) clamp(28px, 4vw, 64px);
  }
  .reality-grid > .col:first-child { border-right: 1px solid var(--line); }
  .reality h2 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(40px, 5.4vw, 88px); line-height: 0.98; letter-spacing: -0.025em;
    margin: 24px 0 32px; max-width: 14ch; text-wrap: balance;
  }
  .reality h2 em { color: var(--accent); font-style: italic; font-weight: 300; }
  .reality p { font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 50ch; margin-bottom: 18px; }
  .reality-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 56px; border-top: 1px solid var(--line); }
  .reality-stats > div { padding: 32px 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding-right: 24px; padding-left: 0; }
  .reality-stats > div:nth-child(2n) { padding-left: 24px; padding-right: 0; border-right: 0; }
  .reality-stats > div:nth-child(n+3) { border-bottom: 0; }
  .reality-stats .num { font-family: var(--serif); font-size: clamp(48px, 5.5vw, 84px); line-height: 1; font-weight: 400; letter-spacing: -0.025em; }
  .reality-stats .num em { color: var(--accent); font-style: italic; font-weight: 300; }
  .reality-stats .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-top: 14px; max-width: 28ch; }
  .reality-img-col { background-size: cover; background-position: center; min-height: 540px; position: relative; }
  .reality-art {
    background:
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(232,158,60,0.18) 0%, transparent 60%),
      linear-gradient(180deg, #1a1612 0%, #0c0b0a 100%);
  }
  .reality-art::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(243,236,225,0.06) 0 1px, transparent 1px 80px),
      repeating-linear-gradient(0deg, rgba(243,236,225,0.04) 0 1px, transparent 1px 60px),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><g stroke='%23e89e3c' stroke-width='1' fill='none' opacity='0.55'><path d='M40 500 Q 200 300 400 320 T 760 200'/><path d='M40 540 Q 220 380 400 380 T 760 280'/><path d='M40 460 L 200 460 L 200 280 L 360 280 L 360 380 L 540 380 L 540 220 L 760 220'/><circle cx='200' cy='280' r='4' fill='%23e89e3c'/><circle cx='360' cy='380' r='4' fill='%23e89e3c'/><circle cx='540' cy='220' r='4' fill='%23e89e3c'/></g><g fill='%23f3ece1' opacity='0.4' font-family='monospace' font-size='10'><text x='208' y='270'>WELL-A14</text><text x='368' y='370'>JCT-07</text><text x='548' y='210'>STN-22</text></g></svg>");
    background-size: cover, cover, cover;
  }
  .reality-img-col::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(12,11,10,0.4)); }
  .reality-img-col .caption {
    position: absolute; bottom: 28px; left: 32px; right: 32px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
    display: flex; justify-content: space-between; gap: 16px; z-index: 1;
  }
  @media (max-width: 820px) {
    .reality-grid { grid-template-columns: 1fr; }
    .reality-grid > .col:first-child { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  /* ─────────── phases (image-led, three big rows) ─────────── */
  .phases { padding: var(--section) 0 0; }
  .phases-head { padding-bottom: clamp(56px, 7vw, 96px); }
  .phases-head h2 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(48px, 7vw, 124px); line-height: 0.95; letter-spacing: -0.03em;
    max-width: 16ch; margin-top: 24px; text-wrap: balance;
  }
  .phases-head h2 em { color: var(--accent); font-style: italic; font-weight: 300; }
  .phase-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border-top: 1px solid var(--line-strong);
    min-height: 640px;
  }
  .phase-row:nth-child(odd) > .copy { order: 1; }
  .phase-row:nth-child(odd) > .image { order: 2; }
  .phase-row:nth-child(even) > .copy { order: 2; border-left: 1px solid var(--line); }
  .phase-row:nth-child(even) > .image { order: 1; }
  .phase-row .copy { padding: clamp(56px, 7vw, 120px) clamp(28px, 4vw, 80px); display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .phase-row .copy .num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--ink-3); }
  .phase-row .copy h3 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(40px, 5vw, 80px); line-height: 0.98; letter-spacing: -0.025em;
    max-width: 12ch; text-wrap: balance;
  }
  .phase-row .copy h3 em { color: var(--accent); font-style: italic; font-weight: 300; }
  .phase-row .copy p { color: var(--ink-2); font-size: 17px; line-height: 1.55; max-width: 48ch; }
  .phase-row .copy ul { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .phase-row .copy li { display: grid; grid-template-columns: 16px 1fr; gap: 14px; font-size: 15px; line-height: 1.5; color: var(--ink); }
  .phase-row .copy li::before { content: "→"; color: var(--accent); font-family: var(--mono); }
  .phase-row .image { background-size: cover; background-position: center; position: relative; min-height: 480px; }
  .phase-row .image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 60%, rgba(12,11,10,0.6)); }
  .phase-row .image .tag {
    position: absolute; top: 28px; left: 28px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); padding: 8px 14px; background: rgba(12,11,10,0.6); backdrop-filter: blur(8px);
    border: 1px solid var(--line-strong); border-radius: 999px;
  }
  .phase-row .image .credit {
    position: absolute; bottom: 22px; right: 28px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-2); text-transform: uppercase;
  }
  @media (max-width: 820px) {
    .phase-row { grid-template-columns: 1fr; min-height: auto; }
    .phase-row > .copy, .phase-row > .image { order: unset !important; border-left: 0 !important; }
    .phase-row .image { min-height: 360px; }
  }

  /* ─────────── industries (4 cards, photo-led) ─────────── */
  .industries { padding: var(--section) 0; border-top: 1px solid var(--line-strong); }
  .industries-head { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: end; padding-bottom: clamp(56px, 7vw, 96px); }
  .industries-head h2 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(44px, 6vw, 104px); line-height: 0.96; letter-spacing: -0.03em;
    max-width: 14ch; text-wrap: balance;
  }
  .industries-head h2 em { color: var(--accent); font-style: italic; font-weight: 300; }
  .industries-head .meta { color: var(--ink-2); font-size: 17px; line-height: 1.55; max-width: 44ch; }
  .industries-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(20px, 2.5vw, 32px); }
  .industry-card {
    position: relative; overflow: hidden;
    aspect-ratio: 4 / 3;
    background: var(--bg-2);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .industry-card .img { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 0.7s ease, filter 0.5s ease; filter: brightness(0.65) contrast(1.05); }
  .industry-card:hover .img { transform: scale(1.04); filter: brightness(0.8) contrast(1.05); }
  .industry-card::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(12,11,10,0.0) 30%, rgba(12,11,10,0.92)); }
  .industry-card .body {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    padding: clamp(28px, 3.5vw, 48px);
    display: flex; flex-direction: column; gap: 14px;
  }

function useReveal() {
  const ref = useRef();
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}
