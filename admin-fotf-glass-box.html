<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Glass Box — FOTF Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
.gb-list { display: flex; flex-direction: column; gap: 12px; }
.gb-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 24px; }
.gb-card-body { font-size: 14px; color: var(--ink); line-height: 1.7; white-space: pre-wrap; margin-bottom: 14px; }
.gb-card-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); }
.gb-card-date { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="page">Glass Box</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openAdd()">+ Add Post</button>
      </div>
    </div>

    <div class="content">
      <div class="sec-head">
        <h1>Glass Box <span id="gb-count" style="font-size:14px;font-weight:400;color:var(--muted)"></span></h1>
        <p style="font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.5">Public posts from the TMI team. Members see these in their FOTF portal.</p>
      </div>

      <div class="gb-list" id="gb-list">
        <div style="padding:32px;text-align:center;color:var(--muted);font-size:13px">Loading...</div>
      </div>

    </div>
  </div>
</div>

<!-- Add Post Modal -->
<div class="modal-overlay" id="gb-modal">
  <div class="modal" style="max-width:520px">
    <div class="modal-hd">
      <h3 class="modal-title">Add Glass Box Post</h3>
      <button class="modal-x" onclick="TMIAdmin.closeModal('gb-modal')">&times;</button>
    </div>
    <div style="padding:20px 24px">
      <div class="form-group">
        <label class="form-label">Post <span style="color:var(--red)">*</span></label>
        <textarea class="form-input" id="gb-text" style="min-height:140px" placeholder="Share what's happening behind the scenes — progress, decisions, honest updates..."></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost btn-sm" onclick="TMIAdmin.closeModal('gb-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="savePost()">Post</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('fotf-glass-box');

let posts = [];

function renderList() {
  document.getElementById('gb-count').textContent = posts.length ? `(${posts.length})` : '';

  if (!posts.length) {
    document.getElementById('gb-list').innerHTML =
      `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="12" x2="16" y2="12" stroke-linecap="round"/><line x1="8" y1="8" x2="16" y2="8" stroke-linecap="round"/><line x1="8" y1="16" x2="12" y2="16" stroke-linecap="round"/></svg>
        <p>No posts yet. Add the first Glass Box update.</p>
      </div>`;
    return;
  }

  document.getElementById('gb-list').innerHTML = posts.map(p => `
    <div class="gb-card">
      <div class="gb-card-body">${escHtml(p.post_text || '')}</div>
      <div class="gb-card-foot">
        <span class="gb-card-date">${TMIAdmin.fmt(p.created_at)}</span>
        <button class="btn btn-ghost btn-sm" style="color:var(--red);font-size:12px" onclick="deletePost('${p.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openAdd() {
  document.getElementById('gb-text').value = '';
  TMIAdmin.openModal('gb-modal');
}

async function savePost() {
  const post_text = document.getElementById('gb-text').value.trim();
  if (!post_text) return TMIAdmin.toast('Post text is required', 'error');
  const data = await TMIAdmin.api('/api/fotf-glass-box', 'POST', { post_text });
  if (!data) return;
  TMIAdmin.closeModal('gb-modal');
  TMIAdmin.toast('Post published');
  await reload();
}

async function deletePost(id) {
  const ok = await TMIAdmin.confirm('Delete this post? Members will no longer see it.');
  if (!ok) return;
  await TMIAdmin.api(`/api/fotf-glass-box?id=${id}`, 'DELETE');
  TMIAdmin.toast('Post deleted');
  await reload();
}

async function reload() {
  posts = await TMIAdmin.api('/api/fotf-glass-box') || [];
  posts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  renderList();
}

reload();
</script>
</body>
</html>
