name: Founders of the Future Letters (2x Weekly)

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays at 9am UTC (5am ET)
    - cron: '0 9 * * 4'   # Thursdays at 9am UTC (5am ET)
  workflow_dispatch:        # manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/package.json

      - name: Install dependencies
        run: npm install
        working-directory: agents

      - name: Run research agent
        run: node agents/research.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run writer agent
        run: node agents/writer.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push article
        run: |
          git config user.name "TMI Bot"
          git config user.email "bot@tmi-technology.com"
          TITLE=$(cat .last-title 2>/dev/null || echo "Weekly Founders of the Future Letters")
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Founders of the Future Letters: $TITLE"
            git push
            # Tell Bing/Copilot and other IndexNow engines about the new article immediately.
            SLUG=$(git diff --name-only HEAD~1 HEAD | grep -oE '^article-[a-z0-9-]+\.html$' | head -1 | sed 's/\.html$//')
            if [ -n "$SLUG" ]; then
              curl -s "https://api.indexnow.org/indexnow?url=https://www.tmitechai.com/${SLUG}&key=1ff7376d2a8649b0a6516385e204d6f0" || true
              curl -s "https://api.indexnow.org/indexnow?url=https://www.tmitechai.com/news&key=1ff7376d2a8649b0a6516385e204d6f0" || true
            fi
          fi

      - name: Send email to subscribers
        run: node agents/email-sender.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
