name: GTM Daily Outbound

on:
  schedule:
    # 8am ET daily (1pm UTC)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      leads:
        description: 'Batch size (leave blank for default 100)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (build audits, do not send)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd agents && npm install

      - name: Run GTM outbound agent (find, audit, and contact ~100 businesses)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          RESEND_OUTREACH_API_KEY: ${{ secrets.RESEND_OUTREACH_API_KEY }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL }}
          OUTREACH_REPLY_TO: ${{ secrets.OUTREACH_REPLY_TO }}
          OUTREACH_INBOXES: ${{ secrets.OUTREACH_INBOXES }}
          OUTREACH_CC: ${{ secrets.OUTREACH_CC }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          INSTANTLY_CAMPAIGN_ID: ${{ secrets.INSTANTLY_CAMPAIGN_ID }}
          GTM_DIGEST_EMAIL: ${{ secrets.GTM_DIGEST_EMAIL }}
          GTM_LEADS_PER_DAY: ${{ inputs.leads }}
          GTM_DRY_RUN: ${{ inputs.dry_run }}
        run: cd agents && node gtm/orchestrator.js

      - name: Commit generated audit microsites
        run: |
          git config user.name "TMI Bot"
          git config user.email "bot@tmi-technology.com"
          git add audit/
          if git diff --staged --quiet; then
            echo "No new audit pages this run"
          else
            git commit -m "Outbound: personalized audit microsites ($(date -u +%Y-%m-%d))"
            git push
          fi
