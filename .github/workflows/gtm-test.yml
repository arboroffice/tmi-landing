name: GTM Test Send

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Recipient email'
        required: true
        default: 'mia@tmitechai.com'
      company:
        description: 'Test company name'
        required: false
        default: 'Apex Steel Fabrication'
      domain:
        description: 'Company domain (optional; enables live research)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install agent deps
        run: cd agents && npm install
      - name: Send test email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          RESEND_OUTREACH_API_KEY: ${{ secrets.RESEND_OUTREACH_API_KEY }}
          OUTREACH_FROM_EMAIL: ${{ secrets.OUTREACH_FROM_EMAIL }}
          OUTREACH_REPLY_TO: ${{ secrets.OUTREACH_REPLY_TO }}
          OUTREACH_INBOXES: ${{ secrets.OUTREACH_INBOXES }}
          TEST_EMAIL: ${{ inputs.email }}
          TEST_COMPANY: ${{ inputs.company }}
          TEST_DOMAIN: ${{ inputs.domain }}
        run: cd agents && node gtm/test-send.js
