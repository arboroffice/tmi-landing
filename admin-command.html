<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Command — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .cmd-grid{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-top:8px;}
  @media(max-width:1000px){.cmd-grid{grid-template-columns:1fr;}}
  .cmd-asof{font-size:12px;color:var(--muted);}
  .cmd-state{font-size:15px;line-height:1.6;color:var(--ink);padding:2px 20px 14px;}
  .prio{padding:14px 20px;border-bottom:1px solid var(--line);}
  .prio:last-child{border-bottom:none;}
  .prio-t{font-weight:600;color:var(--ink);font-size:14px;}
  .prio-w{color:var(--muted);font-size:13px;line-height:1.5;margin-top:3px;}
  .prio-m{display:inline-block;margin-top:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;}
  .risk{display:flex;gap:10px;align-items:baseline;padding:10px 20px;border-bottom:1px solid var(--line);font-size:13px;}
  .risk:last-child{border-bottom:none;}
  .sev{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:5px;flex:none;}
  .sev.high{background:#fde8e8;color:#b42318;} .sev.medium{background:#fef3d7;color:#9a6700;} .sev.low{background:#e8f0e8;color:#2a6b2a;}
  .act{padding:14px 20px;border-bottom:1px solid var(--line);}
  .act:last-child{border-bottom:none;}
  .act-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .act-t{font-weight:600;color:var(--ink);font-size:14px;}
  .act-d{color:var(--muted);font-size:13px;line-height:1.5;margin-top:3px;}
  .act-meta{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap;}
  .pill{font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--ink);background:#fff;}
  .pill.owner{background:var(--bg-alt,#f5f5f7);}
  .pill.now{background:#fde8e8;color:#b42318;border-color:transparent;}
  .pill.today{background:#fef3d7;color:#9a6700;border-color:transparent;}
  .pill.agent{background:#eef7cf;color:#4f6b0e;border-color:transparent;}
  .act-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .cmd-empty{padding:18px 20px;font-size:13px;color:var(--muted);}
  .runbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px;}
  .agentrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 20px;border-bottom:1px solid var(--line);font-size:13px;}
  .agentrow:last-child{border-bottom:none;}
  .agentrow .ext{font-size:10px;color:#9a6700;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Command</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="loadAll()">Refresh</button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Command</h1>
        <div class="sec-head-right"><span class="cmd-asof" id="cmd-asof"></span></div>
      </div>

      <div class="runbar">
        <button class="btn btn-primary btn-sm" id="run-ceo" onclick="runCeo()">Run CEO Agent</button>
        <button class="btn btn-primary btn-sm" id="run-cos" onclick="runCos()">Run Chief of Staff</button>
      </div>

      <div id="cmd-stats" class="stats-row"></div>

      <div class="cmd-grid">
        <div id="cmd-left"></div>
        <div id="cmd-right"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('command');

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EXTERNAL = { 'collections':'/admin-invoices', 'reactivate':'/admin-outbound', 'campaign-send':'/admin-campaign' };

function card(title, sub, inner){
  return `<div class="card"><div class="card-head"><span class="card-title">${esc(title)}</span>${sub?`<span class="card-sub">${esc(sub)}</span>`:''}</div><div class="card-body">${inner}</div></div>`;
}
function statBox(label, val, note){
  return `<div class="stat-box"><div class="stat-label">${esc(label)}</div><div class="stat-val">${esc(val)}</div>${note?`<div class="stat-delta">${esc(note)}</div>`:''}</div>`;
}

// ── CEO panel ──────────────────────────────────────────────────────────────
function renderCeo(report){
  const stats = document.getElementById('cmd-stats');
  const left = document.getElementById('cmd-left');
  if(!report){
    stats.innerHTML=''; stats.style.display='none';
    left.innerHTML = card('CEO strategy', null, `<div class="cmd-empty">No readout yet. Click Run CEO Agent to generate this week’s strategy.</div>`);
    return;
  }
  document.getElementById('cmd-asof').textContent = report.generated_at ? 'as of ' + new Date(report.generated_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
  stats.innerHTML = (report.scoreboard||[]).map(s=>statBox(s.label, s.value, s.note)).join('');
  stats.style.display = (report.scoreboard||[]).length ? '' : 'none';

  let html = '';
  if(report.state) html += `<div class="cmd-state">${esc(report.state)}</div>`;
  const prios = (report.priorities||[]).map(p=>`<div class="prio"><div class="prio-t">${esc(p.title)}</div>${p.why?`<div class="prio-w">${esc(p.why)}</div>`:''}${p.metric?`<span class="prio-m">${esc(p.metric)}</span>`:''}</div>`).join('') || `<div class="cmd-empty">No priorities.</div>`;
  const risks = (report.risks||[]).map(r=>`<div class="risk"><span class="sev ${esc((r.severity||'low'))}">${esc(r.severity||'low')}</span><span>${esc(r.risk)}</span></div>`).join('');
  const decs = (report.decisions||[]).map(d=>`<div class="risk"><span>${esc(d.question)}${d.context?` <span style="color:var(--muted)">— ${esc(d.context)}</span>`:''}</span></div>`).join('');

  left.innerHTML =
    card('This week', report.date||'', html + prios) +
    (risks ? card('Risks', null, risks) : '') +
    (decs ? card('Decisions to make', null, decs) : '');
}

// ── Chief of Staff panel ───────────────────────────────────────────────────
function renderCos(data){
  const right = document.getElementById('cmd-right');
  const plan = data && data.plan;
  const actions = (data && data.actions) || [];
  const catalog = (data && data.catalog) || [];

  let html = '';
  html += card('Chief of Staff', plan && plan.date || '',
    plan && plan.focus ? `<div class="cmd-state"><b>Focus:</b> ${esc(plan.focus)}</div>` : `<div class="cmd-empty">No plan yet. Click Run Chief of Staff.</div>`);

  if(actions.length){
    const rows = actions.map(a=>{
      const pr = a.priority==='now'?'now':(a.priority==='today'?'today':'');
      let run = '';
      if(a.agent){
        if(a.external && EXTERNAL[a.agent]) run = `<a class="btn btn-ghost btn-sm" href="${EXTERNAL[a.agent]}">Open →</a>`;
        else run = `<button class="btn btn-primary btn-sm" onclick="runAgent('${esc(a.agent)}',this)">Run agent</button>`;
      }
      return `<div class="act"><div class="act-top"><div><div class="act-t">${esc(a.title)}</div>${a.detail?`<div class="act-d">${esc(a.detail)}</div>`:''}</div></div>
        <div class="act-meta">
          <span class="pill owner">${esc(a.owner||'Mia')}</span>
          ${a.agent?`<span class="pill agent">${esc(a.agent)}${a.external?' · external':''}</span>`:''}
          ${pr?`<span class="pill ${pr}">${pr}</span>`:''}
          <span class="act-btns">${run}
            <button class="btn btn-ghost btn-sm" onclick="closeAction('${esc(a.id)}','done',this)">Done</button>
            <button class="btn btn-ghost btn-sm" onclick="closeAction('${esc(a.id)}','dismissed',this)">Dismiss</button>
          </span>
        </div></div>`;
    }).join('');
    html += card('Action queue', actions.length+' open', rows);
  }

  if(catalog.length){
    const rows = catalog.map(c=>{
      const btn = c.external
        ? `<a class="btn btn-ghost btn-sm" href="${EXTERNAL[c.key]||'#'}">Open →</a>`
        : `<button class="btn btn-ghost btn-sm" onclick="runAgent('${esc(c.key)}',this)">Run</button>`;
      return `<div class="agentrow"><span>${esc(c.label)} ${c.external?'<span class="ext">external</span>':''}</span>${btn}</div>`;
    }).join('');
    html += card('Digital agents', 'dispatch on demand', rows);
  }

  right.innerHTML = html;
}

// ── actions ────────────────────────────────────────────────────────────────
async function runCeo(){
  const b=document.getElementById('run-ceo'); b.disabled=true; b.textContent='Running…';
  await TMIAdmin.api('/api/ceo-agent','POST',{trigger:true});
  TMIAdmin.toast && TMIAdmin.toast('CEO agent running. Refresh in ~30s.');
  setTimeout(()=>{ b.disabled=false; b.textContent='Run CEO Agent'; loadCeo(); }, 30000);
}
async function runCos(){
  const b=document.getElementById('run-cos'); b.disabled=true; b.textContent='Running…';
  await TMIAdmin.api('/api/chief-of-staff','POST',{trigger:true});
  TMIAdmin.toast && TMIAdmin.toast('Chief of Staff planning. Refresh in ~30s.');
  setTimeout(()=>{ b.disabled=false; b.textContent='Run Chief of Staff'; loadCos(); }, 30000);
}
async function runAgent(key, el){
  if(el){ el.disabled=true; el.textContent='Starting…'; }
  const r = await TMIAdmin.api('/api/chief-of-staff','POST',{runAgent:key});
  if(r && r.needsManual && r.link){ window.location.href = r.link; return; }
  TMIAdmin.toast && TMIAdmin.toast((key)+' started.');
  if(el){ el.textContent='Started'; }
}
async function closeAction(id, status, el){
  await TMIAdmin.api('/api/chief-of-staff','POST',{completeAction:id, status});
  const row = el && el.closest('.act'); if(row) row.style.opacity=.4;
  loadCos();
}

async function loadCeo(){ const d = await TMIAdmin.api('/api/ceo-agent'); renderCeo(d && d.report); }
async function loadCos(){ const d = await TMIAdmin.api('/api/chief-of-staff'); renderCos(d); }
async function loadAll(){ await Promise.all([loadCeo(), loadCos()]); }
loadAll();
</script>
</body>
</html>
