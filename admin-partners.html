<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Partners — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Partners</span></div>
      <div class="topbar-actions"></div>
    </div>
    <div class="content">

      <div class="stats-row" id="partners-stats" style="grid-template-columns:repeat(3,1fr)"></div>

      <div class="sec-head" style="margin-top:8px">
        <h1>Partners</h1>
        <span class="filter-count" id="partners-count"></span>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, company, email..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderTable()">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="qualified">Qualified</option>
          <option value="won">Won (Active)</option>
          <option value="lost">Lost</option>
        </select>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Name</th><th>Company</th><th>Partner Type</th><th>Industries</th><th>Status</th><th>Date Applied</th><th>Actions</th>
            </tr></thead>
            <tbody id="partners-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="partner-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('partner-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-name">—</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" onclick="TMIAdmin.closePanel('partner-panel')">Close</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid" id="panel-detail-grid"></div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Partner Notes</div>
      <div id="panel-notes-parsed" style="margin-top:10px;display:flex;flex-direction:column;gap:10px;"></div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Update Status</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <select class="form-input" id="panel-status-select" style="flex:1">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="qualified">Qualified</option>
          <option value="won">Won (Active)</option>
          <option value="lost">Lost</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="saveStatus()">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('partners');

let allPartners = [];
let currentPartner = null;

async function loadPartners() {
  const data = await TMIAdmin.api('/api/leads');
  if (!data) return;
  allPartners = data.filter(l => l.source === 'partner-form');
  renderStats();
  renderTable();
}

function renderStats() {
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const newThisMonth = allPartners.filter(l => l.created_at && new Date(l.created_at) >= startOfMonth).length;
  const active = allPartners.filter(l => l.status === 'won' || l.status === 'qualified').length;
  document.getElementById('partners-stats').innerHTML = `
    <div class="stat-box"><div class="stat-label">Total Partners</div><div class="stat-val">${allPartners.length}</div></div>
    <div class="stat-box"><div class="stat-label">New This Month</div><div class="stat-val">${newThisMonth}</div></div>
    <div class="stat-box"><div class="stat-label">Active Partners</div><div class="stat-val" style="color:var(--green,#22c55e)">${active}</div></div>
  `;
}

// Parse partner notes field into structured data
function parsePartnerNotes(notes) {
  if (!notes) return {};
  const result = {};
  const lines = notes.split('\n');
  lines.forEach(line => {
    const idx = line.indexOf(':');
    if (idx === -1) return;
    const key = line.slice(0, idx).trim();
    const val = line.slice(idx + 1).trim();
    if (key && val) result[key] = val;
  });
  return result;
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  return allPartners.filter(l => {
    const c = l.contacts || {};
    const text = [c.first_name, c.last_name, c.email, c.company, l.name, l.email].filter(Boolean).join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (st && l.status !== st) return false;
    return true;
  });
}

function renderTable() {
  const filtered = getFiltered();
  document.getElementById('partners-count').textContent = `${filtered.length} partner${filtered.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('partners-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">🤝</div><h3>No partners yet</h3><p>Partner form submissions will appear here.</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(l => {
    const c = l.contacts || {};
    const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || l.name || '—';
    const company = c.company || '—';
    const parsed = parsePartnerNotes(l.notes);
    const partnerType = parsed['Partner type'] || parsed['Partner Type'] || '—';
    const industries = parsed['Industries'] || '—';
    const data = JSON.stringify(l).replace(/"/g, '&quot;');
    return `<tr onclick="openPanel(${data})" style="cursor:pointer">
      <td class="td-name">${name}</td>
      <td>${company}</td>
      <td class="td-muted">${partnerType}</td>
      <td class="td-muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${industries}">${industries}</td>
      <td>${TMIAdmin.badge(l.status)}</td>
      <td class="td-muted">${TMIAdmin.fmt(l.created_at)}</td>
      <td class="td-action">
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openPanel(${data})">View</button>
      </td>
    </tr>`;
  }).join('');
}

function openPanel(lead) {
  currentPartner = lead;
  const c = lead.contacts || {};
  const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || lead.name || '—';
  document.getElementById('panel-name').textContent = name;

  document.getElementById('panel-detail-grid').innerHTML = `
    <div class="detail-item"><div class="detail-label">Status</div><div class="detail-val">${TMIAdmin.badge(lead.status)}</div></div>
    <div class="detail-item"><div class="detail-label">Company</div><div class="detail-val">${c.company || '—'}</div></div>
    <div class="detail-item"><div class="detail-label">Email</div><div class="detail-val">${c.email ? `<a href="mailto:${c.email}" style="color:var(--blue)">${c.email}</a>` : '—'}</div></div>
    <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-val">${c.phone || lead.phone || '—'}</div></div>
    <div class="detail-item"><div class="detail-label">Applied</div><div class="detail-val">${TMIAdmin.fmt(lead.created_at)}</div></div>
  `;

  const parsed = parsePartnerNotes(lead.notes);
  const notesEl = document.getElementById('panel-notes-parsed');
  if (Object.keys(parsed).length) {
    notesEl.innerHTML = Object.entries(parsed).map(([key, val]) => `
      <div style="display:flex;flex-direction:column;gap:3px">
        <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">${key}</div>
        <div style="font-size:14px;color:var(--ink-2);line-height:1.5">${val}</div>
      </div>
    `).join('<div style="height:1px;background:var(--line);margin:2px 0"></div>');
  } else if (lead.notes) {
    notesEl.innerHTML = `<div style="font-size:14px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap">${lead.notes}</div>`;
  } else {
    notesEl.innerHTML = `<div style="font-size:13px;color:var(--muted)">No notes.</div>`;
  }

  document.getElementById('panel-status-select').value = lead.status || 'new';
  TMIAdmin.openPanel('partner-panel');
}

async function saveStatus() {
  if (!currentPartner) return;
  const status = document.getElementById('panel-status-select').value;
  const c = currentPartner.contacts || {};
  const res = await TMIAdmin.api('/api/leads', 'PUT', {
    lead: { id: currentPartner.id, status },
    contact: { first_name: c.first_name || 'Partner' }
  });
  if (res) {
    TMIAdmin.toast('Status updated');
    currentPartner.status = status;
    await loadPartners();
    TMIAdmin.closePanel('partner-panel');
  }
}

loadPartners();
</script>
</body>
</html>
