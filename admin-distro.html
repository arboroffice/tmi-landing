<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Distro — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .msg-cell{font-size:13px;color:var(--ink-2);max-width:280px;}
  .status-select{font-size:12px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .app-cell a{color:var(--ink);font-weight:600;}
  .app-cell .lnk{display:block;font-size:12px;color:var(--muted);word-break:break-all;}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Distro</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">Export CSV</button>
      </div>
    </div>

    <div class="content">
      <div class="sec-head">
        <h1>Distro</h1>
        <span class="filter-count" id="count"></span>
      </div>

      <div class="stats-row" id="stats-row">
        <div class="stat-box"><div class="stat-label">Total submissions</div><div class="stat-val" id="stat-total">—</div></div>
        <div class="stat-box"><div class="stat-label">New</div><div class="stat-val" id="stat-new">—</div></div>
        <div class="stat-box"><div class="stat-label">This week</div><div class="stat-val" id="stat-week">—</div></div>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, email, app..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderTable()">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="judging">Judging</option>
          <option value="passed">Passed</option>
          <option value="rejected">Rejected</option>
          <option value="client">Client</option>
          <option value="archived">Archived</option>
        </select>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Name</th>
              <th>Email</th>
              <th>App</th>
              <th>Platform</th>
              <th>Stage</th>
              <th>Revenue</th>
              <th>Model</th>
              <th>Notes</th>
              <th>Date</th>
              <th>Status</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="empty" style="display:none">No submissions yet. They'll appear here the moment someone submits an app on /distro.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('distro');

var ROWS = [];

function fmtDate(d){ return TMIAdmin.fmt(d); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function load(){
  ROWS = await TMIAdmin.api('/api/distro') || [];
  stats();
  renderTable();
}

function stats(){
  var now = Date.now();
  var week = ROWS.filter(function(r){ return r.created_at && (now - new Date(r.created_at).getTime()) < 7*864e5; }).length;
  var neu = ROWS.filter(function(r){ return (r.status||'new')==='new'; }).length;
  document.getElementById('stat-total').textContent = ROWS.length;
  document.getElementById('stat-new').textContent = neu;
  document.getElementById('stat-week').textContent = week;
}

function appCell(r){
  var name = r.app_name ? esc(r.app_name) : '—';
  if(r.app_link){
    var href = /^https?:\/\//.test(r.app_link) ? r.app_link : 'https://'+r.app_link;
    return '<div class="app-cell"><a href="'+esc(href)+'" target="_blank" rel="noopener">'+name+'</a><span class="lnk">'+esc(r.app_link)+'</span></div>';
  }
  return '<div class="app-cell">'+name+'</div>';
}

function renderTable(){
  var q = (document.getElementById('search').value||'').toLowerCase().trim();
  var st = document.getElementById('filter-status').value;
  var rows = ROWS.filter(function(r){
    if(st && (r.status||'new')!==st) return false;
    if(q){ var hay=((r.name||'')+' '+(r.email||'')+' '+(r.app_name||'')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  document.getElementById('count').textContent = rows.length + (rows.length===1?' submission':' submissions');
  var tb = document.getElementById('tbody');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  var STATUSES = ['new','judging','passed','rejected','client','archived'];
  tb.innerHTML = rows.map(function(r){
    var cur = r.status || 'new';
    var opts = STATUSES.map(function(s){ return '<option value="'+s+'"'+(s===cur?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'; }).join('');
    return '<tr>'
      + '<td><strong>'+esc(r.name||'—')+'</strong></td>'
      + '<td class="td-muted"><a href="mailto:'+esc(r.email)+'">'+esc(r.email||'—')+'</a></td>'
      + '<td>'+appCell(r)+'</td>'
      + '<td class="td-muted">'+esc(r.platform||'—')+'</td>'
      + '<td class="td-muted">'+esc(r.stage||'—')+'</td>'
      + '<td class="td-muted">'+esc(r.revenue||'—')+'</td>'
      + '<td class="td-muted">'+esc(r.model||'—')+'</td>'
      + '<td class="msg-cell">'+esc(r.message||'—')+'</td>'
      + '<td class="td-muted">'+fmtDate(r.created_at)+'</td>'
      + '<td><select class="status-select" onchange="setStatus(\''+r.id+'\',this.value)">'+opts+'</select></td>'
      + '</tr>';
  }).join('');
}

async function setStatus(id, status){
  var r = ROWS.find(function(x){ return x.id===id; });
  if(r) r.status = status;
  stats();
  try{ await TMIAdmin.api('/api/distro','PATCH',{ id:id, status:status }); TMIAdmin.toast('Updated'); }
  catch(e){ TMIAdmin.toast('Update failed','error'); }
}

function exportCSV(){
  var head = ['Name','Email','App','Link','Platform','Stage','Revenue','Model','Notes','Date','Status'];
  var lines = [head.join(',')].concat(ROWS.map(function(r){
    return [r.name, r.email, r.app_name, r.app_link, r.platform, r.stage, r.revenue, r.model, r.message, r.created_at, r.status||'new'].map(function(v){
      return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    }).join(',');
  }));
  var blob = new Blob([lines.join('\n')], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'distro-submissions.csv'; a.click();
}

load();
</script>
</body>
</html>
