<title>How to Build an Intelligent Company | Live Room | TMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#07080f;--panel:#0f1120;--panel-2:#151830;--line:rgba(255,255,255,0.10);
    --ink:#ffffff;--ink-2:#a6a9c0;--muted:#6f7292;
    --chart:#E4FF97;--chart-dark:#cdee72;--live:#ff4d4d;
    --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  .rm-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(7,8,15,0.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;}
  .rm-brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-0.01em;}
  .rm-brand img{height:20px;}
  .rm-title{font-size:13px;color:var(--ink-2);font-weight:600;}
  .live-pill{display:none;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#fff;background:var(--live);padding:5px 12px;border-radius:6px;}
  .live-pill.on{display:inline-flex;}
  .live-pill i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  .stage{display:grid;grid-template-columns:1fr 360px;gap:0;min-height:calc(100vh - 51px);}
  .video-col{padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0;}
  .screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  .screen iframe,.screen video{position:absolute;inset:0;width:100%;height:100%;border:0;}

  /* pre-live countdown overlay */
  .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#141830,#07080f);}
  .cover .k{font-size:12px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--chart);margin-bottom:16px;}
  .cover h2{font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-0.02em;margin:0 0 10px;max-width:20ch;}
  .cover p{color:var(--ink-2);font-size:15px;margin:0 0 26px;max-width:44ch;}
  .cd{display:flex;gap:14px;}
  .cd .u{background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:76px;}
  .cd .u b{display:block;font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .cd .u span{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
  .cover.placeholder{background:repeating-linear-gradient(45deg,#0c0e1c,#0c0e1c 14px,#0e1022 14px,#0e1022 28px);}

  .under{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .under h1{font-size:clamp(20px,2.2vw,28px);font-weight:800;letter-spacing:-0.02em;margin:0 0 6px;max-width:24ch;}
  .under .sub{color:var(--ink-2);font-size:14px;max-width:52ch;}
  .elapsed{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}

  /* timed CTA */
  .cta-card{display:none;background:linear-gradient(120deg,#171b34,#0f1120);border:1px solid rgba(228,255,151,0.4);border-radius:14px;padding:20px 22px;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;animation:rise .4s ease;}
  .cta-card.on{display:flex;}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .cta-card .t{font-size:16px;font-weight:700;max-width:44ch;}
  .cta-card .t span{color:var(--chart);}
  .cta-btn{background:var(--chart);color:#07080f;font-weight:800;font-size:15px;padding:13px 24px;border-radius:10px;white-space:nowrap;transition:background .15s,transform .15s;}
  .cta-btn:hover{background:var(--chart-dark);transform:translateY(-1px);}

  /* chat */
  .chat{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;}
  .chat-h{padding:14px 18px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;}
  .chat-h .cnt{color:var(--muted);font-weight:600;letter-spacing:0.04em;text-transform:none;font-size:12px;}
  .chat-log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 240px);}
  .msg{font-size:14px;line-height:1.45;animation:rise .3s ease;}
  .msg .who{font-weight:700;color:var(--chart);margin-right:7px;}
  .msg.host .who{color:#fff;}
  .msg.host{background:rgba(228,255,151,0.06);border-left:2px solid var(--chart);padding:8px 12px;border-radius:0 8px 8px 0;color:var(--ink);}
  .msg .txt{color:var(--ink-2);}
  .msg.host .txt{color:#e9ebf5;}
  .chat-in{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:8px;}
  .chat-in input{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:#fff;font-family:var(--sans);font-size:14px;}
  .chat-in input:focus{outline:none;border-color:var(--chart);}
  .chat-in button{background:var(--chart);color:#07080f;border:0;font-weight:800;font-size:14px;padding:0 16px;border-radius:9px;cursor:pointer;}

  /* ended state */
  .ended{max-width:640px;margin:6vh auto;text-align:center;padding:0 22px;}
  .ended .k{font-size:12px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--chart);margin-bottom:14px;}
  .ended h1{font-size:clamp(28px,4vw,46px);font-weight:800;letter-spacing:-0.02em;margin:0 0 16px;}
  .ended p{color:var(--ink-2);font-size:17px;margin:0 0 30px;}
  .ended .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .ended .primary{background:var(--chart);color:#07080f;font-weight:800;padding:15px 30px;border-radius:11px;font-size:16px;}
  .ended .ghost{border:1px solid var(--line);color:#fff;padding:15px 28px;border-radius:11px;font-size:16px;font-weight:600;}
  .ended .next{margin-top:26px;font-size:14px;color:var(--muted);}
  .ended .next b{color:#fff;}

  @media(max-width:900px){
    .stage{grid-template-columns:1fr;min-height:0;}
    .chat{border-left:0;border-top:1px solid var(--line);}
    .chat-log{max-height:340px;}
  }
  @media(max-width:560px){.video-col{padding:14px;}.rm-title{display:none;}}
</style>
</head>
<body>

<header class="rm-head">
  <a href="/" class="rm-brand"><img src="logo.svg" alt="TMI"/> TMI</a>
  <span class="rm-title">How to Build an Intelligent Company</span>
  <span class="live-pill" id="livePill"><i></i> Live</span>
</header>

<main id="app"><!-- rendered by JS --></main>

<script>
/* =====================================================================
   SELF-HOSTED WEBINAR ROOM
   Configure these three, then it runs itself.
   - WEBINAR_YT_ID : the unlisted YouTube video id of the recording, OR
   - WEBINAR_MP4   : a direct mp4 url (Cloudflare Stream / R2 / Bunny / Mux)
   - DURATION_SEC / CTA_AT_SEC must match the recording (see the plan).
   Leave both video sources blank and the room shows a broadcast placeholder
   so nothing looks broken before the recording is uploaded.
   ===================================================================== */
var WEBINAR_YT_ID = '';           // e.g. 'dQw4w9WgXcQ'  (unlisted is fine)
var WEBINAR_MP4   = '';           // e.g. 'https://cdn.tmitechai.com/class.mp4'
var DURATION_SEC  = 40 * 60;      // length of the recording
var CTA_AT_SEC    = 24 * 60;      // when the "book your audit" offer appears
var AUDIT_URL     = '/audit';

// --- timezone helpers (mirror of api/_webinar.js) ---
var TZ='America/Chicago', SESSION_WEEKDAY=2, SESSION_HOUR=15, SESSION_MIN=0;
function zonedToUtc(y,mo,d,h,mi){
  var asUTC=Date.UTC(y,mo-1,d,h,mi,0);
  var dtf=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var p={};dtf.formatToParts(new Date(asUTC)).forEach(function(x){p[x.type]=x.value;});
  var hr=+p.hour;if(hr===24)hr=0;
  var asTZ=Date.UTC(+p.year,p.month-1,+p.day,hr,+p.minute,+p.second);
  return new Date(asUTC-(asTZ-asUTC));
}
function chicagoParts(date){
  var dtf=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour12:false,weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  var p={};dtf.formatToParts(date).forEach(function(x){p[x.type]=x.value;});
  var wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday];
  var hr=+p.hour;if(hr===24)hr=0;
  return {y:+p.year,mo:+p.month,d:+p.day,wd:wd,h:hr,mi:+p.minute};
}
function nextSession(from){
  var now=from||new Date();var c=chicagoParts(now);
  var add=(SESSION_WEEKDAY-c.wd+7)%7;
  if(add===0&&(c.h>SESSION_HOUR||(c.h===SESSION_HOUR&&c.mi>=SESSION_MIN)))add=7;
  var base=Date.UTC(c.y,c.mo-1,c.d)+add*86400000;var b=new Date(base);
  return zonedToUtc(b.getUTCFullYear(),b.getUTCMonth()+1,b.getUTCDate(),SESSION_HOUR,SESSION_MIN);
}
function fmtSession(date){
  return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(date);
}
function fmtLocal(date){
  return new Intl.DateTimeFormat(undefined,{weekday:'long',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(date);
}

// --- simulated live chat: evergreen, timed to the recording ---
var CHAT=[
  {at:8,  host:1, who:'TMI Team', txt:'Welcome in. Drop your industry and company size in the chat while people file in.'},
  {at:26, who:'Marcus', txt:'HVAC, 22 techs. Here for the bottleneck part.'},
  {at:42, who:'Danielle', txt:'Commercial electrical, ~$8M. Everything runs through me and I am exhausted.'},
  {at:70, who:'Ray', txt:'Same. If I take a day off the whole thing stalls.'},
  {at:150,host:1, who:'TMI Team', txt:'That is exactly the problem we are going to take apart today. Three systems.'},
  {at:240,who:'Priya', txt:'We have like 9 apps and none of them talk to each other lol'},
  {at:360,who:'Sam', txt:'The single source of truth point just hit hard.'},
  {at:520,who:'Wes', txt:'How long does this take to actually build?'},
  {at:900,who:'Tanya', txt:'Wait, the command layer example is basically our whole ops meeting on one screen.'},
  {at:1200,host:1,who:'TMI Team', txt:'If you want us to map your operation after this, the free audit link is coming up.'},
  {at:1440,who:'Marcus', txt:'Booking the audit now.'},
  {at:1600,who:'Danielle', txt:'This is the first thing that has made me feel like I can step back.'},
  {at:1900,who:'Ray', txt:'Replaying this for my ops manager.'},
  {at:2200,host:1,who:'TMI Team', txt:'Last few minutes — get your questions in.'}
];

// --- state ---
function qs(k){return new URLSearchParams(location.search).get(k);}
var app=document.getElementById('app');
var mode=qs('mode');                 // 'ondemand' for replay
var token=qs('t')||'';
var sim=qs('sim');                   // debug: pre|live|ended
var forcedOffset=qs('o');            // debug: force offset seconds
var sIso=qs('s');
var sessionDate=sIso?new Date(sIso):nextSession();
var name=(qs('n')||localStorage.getItem('tmi_webinar_name')||'').trim();

function startMs(){
  if(mode==='ondemand') return Date.now();      // just-in-time replay
  return sessionDate.getTime();
}
function offset(){
  if(forcedOffset!==null&&forcedOffset!==undefined&&forcedOffset!=='') return +forcedOffset;
  if(mode==='ondemand') return (Date.now()-onDemandStart)/1000;
  return (Date.now()-sessionDate.getTime())/1000;
}
var onDemandStart=Date.now();

function currentState(){
  if(sim) return sim;
  if(mode==='ondemand') return offset()>=DURATION_SEC?'ended':'live';
  var o=offset();
  if(o<0) return 'pre';
  if(o<DURATION_SEC) return 'live';
  return 'ended';
}

function two(n){return (n<10?'0':'')+n;}
function hms(s){s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h>0?h+':':'')+two(m)+':'+two(x);}

// videoEmbed builds the player markup for the current offset.
function videoEmbed(o){
  if(WEBINAR_MP4){
    var live=(currentState()==='live'&&mode!=='ondemand');
    return '<video id="vid" '+(live?'':'controls ')+'playsinline autoplay '+(sim?'muted':'')+'><source src="'+WEBINAR_MP4+'#t='+Math.max(0,Math.floor(o))+'" type="video/mp4"></video>';
  }
  if(WEBINAR_YT_ID){
    var params='autoplay=1&rel=0&modestbranding=1&playsinline=1&start='+Math.max(0,Math.floor(o))+(currentState()==='live'&&mode!=='ondemand'?'&controls=0&disablekb=1':'&controls=1');
    return '<iframe id="vid" src="https://www.youtube-nocookie.com/embed/'+WEBINAR_YT_ID+'?'+params+'" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
  }
  // no video configured -> broadcast placeholder
  return '<div class="cover placeholder"><div class="k">Broadcast feed</div><h2 style="max-width:26ch">This is where the class plays.</h2><p>Add the recording id to <code style="color:#E4FF97">WEBINAR_YT_ID</code> in watch.html and the live feed appears here.</p></div>';
}

var attendPinged=false;
function pingAttend(){
  if(attendPinged||!token||mode==='ondemand') return;
  attendPinged=true;
  try{fetch('/api/webinar-attend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})});}catch(e){}
  try{if(typeof fbq==='function')fbq('track','ViewContent',{content_name:'Webinar Attended'});}catch(e){}
}

// ---------- renderers ----------
function renderPre(){
  document.getElementById('livePill').classList.remove('on');
  var greeting=name?('Good to see you, '+name.split(/\s+/)[0]+'.'):'You’re in the room.';
  app.innerHTML=
    '<div class="stage" style="grid-template-columns:1fr;">'
    +'<div class="video-col">'
    +'<div class="screen"><div class="cover">'
      +'<div class="k">Starting soon</div>'
      +'<h2>'+greeting+' We go live automatically.</h2>'
      +'<p>Keep this tab open. The class begins right at the top of the session and you’ll drop straight in.</p>'
      +'<div class="cd" id="cd"></div>'
    +'</div></div>'
    +'<div class="under"><div><h1>How to Build an Intelligent Company</h1>'
      +'<div class="sub">'+fmtSession(sessionDate)+'  ·  your time: '+fmtLocal(sessionDate)+'</div></div></div>'
    +'</div></div>';
  tickCountdown();
}
function tickCountdown(){
  var el=document.getElementById('cd');if(!el)return;
  var left=Math.max(0,(sessionDate.getTime()-Date.now())/1000);
  var d=Math.floor(left/86400),h=Math.floor((left%86400)/3600),m=Math.floor((left%3600)/60),s=Math.floor(left%60);
  el.innerHTML=
     '<div class="u"><b>'+two(d)+'</b><span>Days</span></div>'
    +'<div class="u"><b>'+two(h)+'</b><span>Hours</span></div>'
    +'<div class="u"><b>'+two(m)+'</b><span>Min</span></div>'
    +'<div class="u"><b>'+two(s)+'</b><span>Sec</span></div>';
}

function renderLive(){
  document.getElementById('livePill').classList.add('on');
  pingAttend();
  var o=offset();
  app.innerHTML=
    '<div class="stage">'
    +'<div class="video-col">'
      +'<div class="screen">'+videoEmbed(o)+'</div>'
      +'<div class="cta-card" id="ctaCard"><div class="t">Want us to map <span>your</span> operation and show you exactly where it’s leaking? Start with the free Business Intelligence Audit.</div><a class="cta-btn" href="'+AUDIT_URL+'" onclick="lead()">Book my free audit →</a></div>'
      +'<div class="under"><div><h1>How to Build an Intelligent Company</h1><div class="sub">The three systems that let a company run without the owner in the middle of everything.</div></div><div class="elapsed" id="elapsed"></div></div>'
    +'</div>'
    +'<aside class="chat">'
      +'<div class="chat-h"><span>Live chat</span><span class="cnt" id="chatCnt"></span></div>'
      +'<div class="chat-log" id="chatLog"></div>'
      +'<form class="chat-in" id="chatForm"><input id="chatMsg" placeholder="Ask a question..." maxlength="240" autocomplete="off"/><button type="submit">Send</button></form>'
    +'</aside>'
    +'</div>';
  chatShownIdx=-1;
  pumpChat(o);
  document.getElementById('chatForm').addEventListener('submit',sendQuestion);
}
var chatShownIdx=-1;
function pumpChat(o){
  var log=document.getElementById('chatLog');if(!log)return;
  for(var i=0;i<CHAT.length;i++){
    if(CHAT[i].at<=o && i>chatShownIdx){
      var m=CHAT[i];
      var div=document.createElement('div');
      div.className='msg'+(m.host?' host':'');
      div.innerHTML='<span class="who">'+m.who+'</span><span class="txt">'+m.txt+'</span>';
      log.appendChild(div);chatShownIdx=i;
    }
  }
  log.scrollTop=log.scrollHeight;
  var shown=Math.min(CHAT.length,chatShownIdx+1);
  var cnt=document.getElementById('chatCnt');if(cnt)cnt.textContent=(180+shown*7)+' watching';
}
function sendQuestion(e){
  e.preventDefault();
  var inp=document.getElementById('chatMsg');var v=inp.value.trim();if(!v)return;
  var log=document.getElementById('chatLog');
  var mine=document.createElement('div');mine.className='msg';
  mine.innerHTML='<span class="who" style="color:#fff">'+(name?name.split(/\s+/)[0]:'You')+'</span><span class="txt">'+v.replace(/</g,'&lt;')+'</span>';
  log.appendChild(mine);log.scrollTop=log.scrollHeight;inp.value='';
  try{fetch('/api/webinar-question',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,name:name,question:v})});}catch(e2){}
  setTimeout(function(){
    var r=document.createElement('div');r.className='msg host';
    r.innerHTML='<span class="who">TMI Team</span><span class="txt">Great question — sent to the team. We’ll cover it live or follow up by email.</span>';
    log.appendChild(r);log.scrollTop=log.scrollHeight;
  },1200);
}

function renderEnded(){
  document.getElementById('livePill').classList.remove('on');
  var next=nextSession(new Date(Date.now()+60000));
  app.innerHTML=
    '<div class="ended">'
    +'<div class="k">That’s a wrap</div>'
    +'<h1>You’ve seen the framework. Now map your operation.</h1>'
    +'<p>The fastest way to find out exactly where your business is leaking time and money is the free Business Intelligence Audit. We map how you run today and hand you a 30-day plan.</p>'
    +'<div class="row"><a class="primary" href="'+AUDIT_URL+'" onclick="lead()">Book my free audit →</a><a class="ghost" href="/webinar">Register for the next session</a></div>'
    +'<div class="next">Next live session: <b>'+fmtSession(next)+'</b>  ·  <a href="/webinar" style="color:#E4FF97">register a colleague</a></div>'
    +'</div>';
}

function lead(){try{if(typeof fbq==='function')fbq('track','Lead',{content_name:'Webinar Room CTA'});}catch(e){}}
window.lead=lead;

// ---------- main loop ----------
var lastState='';
function render(){
  var st=currentState();
  if(st!==lastState){
    lastState=st;
    if(st==='pre')renderPre();
    else if(st==='live')renderLive();
    else renderEnded();
  }
}
function loop(){
  var st=currentState();
  if(st==='pre'){ tickCountdown(); }
  else if(st==='live'){
    var o=offset();
    var el=document.getElementById('elapsed');if(el)el.textContent='Elapsed '+hms(o)+' / '+hms(DURATION_SEC);
    pumpChat(o);
    var cta=document.getElementById('ctaCard');if(cta&&o>=CTA_AT_SEC)cta.classList.add('on');
  }
  render();
}
render();
setInterval(loop,1000);
</script>
</body>
</html>
