<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bookings — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Bookings</span></div>
      <div class="topbar-actions"></div>
    </div>
    <div class="content">

      <div class="stats-row" id="bookings-stats" style="grid-template-columns:repeat(3,1fr)"></div>

      <div class="sec-head" style="margin-top:8px">
        <h1>Bookings</h1>
        <span class="filter-count" id="bookings-count"></span>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name or email..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-source" onchange="renderTable()">
          <option value="">All sources</option>
        </select>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Source</th><th>Booked Date</th><th>Days Since Booked</th><th>Actions</th>
            </tr></thead>
            <tbody id="bookings-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('bookings');

let allLeads = [];
let allBookings = [];

// Populate source filter
TMIAdmin.sources.forEach(s => {
  document.getElementById('filter-source').innerHTML += `<option>${s}</option>`;
});

async function loadBookings() {
  const data = await TMIAdmin.api('/api/leads');
  if (!data) return;
  allLeads = data;
  allBookings = data.filter(l => l.status === 'booked');
  renderStats();
  renderTable();
}

function renderStats() {
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay());
  startOfWeek.setHours(0, 0, 0, 0);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  const thisWeek = allBookings.filter(l => l.booked_at && new Date(l.booked_at) >= startOfWeek).length;
  const thisMonth = allBookings.filter(l => l.booked_at && new Date(l.booked_at) >= startOfMonth).length;

  document.getElementById('bookings-stats').innerHTML = `
    <div class="stat-box"><div class="stat-label">Total Booked Calls</div><div class="stat-val">${allBookings.length}</div></div>
    <div class="stat-box"><div class="stat-label">Booked This Week</div><div class="stat-val">${thisWeek}</div></div>
    <div class="stat-box"><div class="stat-label">Booked This Month</div><div class="stat-val">${thisMonth}</div></div>
  `;
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  const ms = Date.now() - new Date(dateStr).getTime();
  return Math.floor(ms / (1000 * 60 * 60 * 24));
}

function daysBadgeHtml(days) {
  if (days === null) return '<span class="td-muted">—</span>';
  let color, label;
  if (days < 3) {
    color = 'var(--green, #22c55e)';
    label = days === 0 ? 'Today' : days === 1 ? '1 day' : `${days} days`;
  } else if (days <= 7) {
    color = 'var(--yellow, #f59e0b)';
    label = `${days} days`;
  } else {
    color = 'var(--red, #ef4444)';
    label = `${days} days`;
  }
  return `<span style="font-weight:600;color:${color}">${label}</span>`;
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const src = document.getElementById('filter-source').value;
  return allBookings.filter(l => {
    const c = l.contacts || {};
    const text = [c.first_name, c.last_name, c.email, l.email].filter(Boolean).join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (src && l.source !== src) return false;
    return true;
  });
}

function renderTable() {
  const filtered = getFiltered();
  document.getElementById('bookings-count').textContent = `${filtered.length} booking${filtered.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('bookings-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📅</div><h3>No booked calls</h3><p>Leads that book a strategy call will appear here.</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(l => {
    const c = l.contacts || {};
    const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || l.name || '—';
    const email = c.email || l.email || '—';
    const phone = c.phone || l.phone || '—';
    const company = c.company || '—';
    const days = daysSince(l.booked_at);
    return `<tr>
      <td class="td-name">${name}</td>
      <td>${company}</td>
      <td style="color:var(--ink-2)">${email}</td>
      <td class="td-muted">${phone}</td>
      <td class="td-muted">${l.source || '—'}</td>
      <td class="td-muted">${l.booked_at ? TMIAdmin.fmt(l.booked_at) : '—'}</td>
      <td>${daysBadgeHtml(days)}</td>
      <td class="td-action" style="white-space:nowrap">
        <a href="/admin-leads" class="btn btn-ghost btn-sm">View Lead</a>
        <button class="btn btn-ghost btn-sm" style="margin-left:4px" onclick="markComplete('${l.id}')">Mark Complete</button>
      </td>
    </tr>`;
  }).join('');
}

async function markComplete(id) {
  const lead = allBookings.find(l => l.id === id);
  if (!lead) return;
  const c = lead.contacts || {};
  const ok = await TMIAdmin.confirm('Mark this call as complete? This will move the lead to "qualified".');
  if (!ok) return;
  const res = await TMIAdmin.api('/api/leads', 'PUT', {
    lead: { id, status: 'qualified' },
    contact: { first_name: c.first_name || 'Lead' }
  });
  if (res) {
    TMIAdmin.toast('Call marked complete — lead moved to qualified');
    await loadBookings();
  }
}

loadBookings();
</script>
</body>
</html>
