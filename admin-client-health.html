<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Client Health — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:900px){.health-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.health-grid{grid-template-columns:1fr;}}

  .health-card{background:var(--surface,#fff);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;transition:box-shadow 0.15s;}
  .health-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.07);}

  .health-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .health-card-name{font-size:16px;font-weight:600;color:var(--ink);line-height:1.2;}
  .health-card-company{font-size:13px;color:var(--ink-2);margin-top:2px;}

  .health-badge{font-size:11px;font-weight:600;letter-spacing:0.05em;padding:3px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
  .health-badge.healthy{background:#dcfce7;color:#166534;}
  .health-badge.watch{background:#fef9c3;color:#854d0e;}
  .health-badge.at-risk{background:#fee2e2;color:#991b1b;}

  .health-card-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
  .health-card-row .label{color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-size:10px;}
  .health-card-row .val{color:var(--ink-2);font-weight:500;}
  .health-card-row .val.overdue{color:var(--red,#ef4444);font-weight:700;}

  .health-plan-tag{display:inline-block;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);background:var(--bg-alt,#f5f5f7);border-radius:4px;padding:2px 8px;}
  .health-card-link{margin-top:4px;font-size:12px;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:color 0.15s;}
  .health-card-link:hover{color:var(--ink);}
</style>

</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Client Health</span></div>
      <div class="topbar-actions"></div>
    </div>
    <div class="content">

      <div class="stats-row" id="health-stats" style="grid-template-columns:repeat(4,1fr)"></div>

      <div class="sec-head" style="margin-top:8px">
        <h1>Client Health</h1>
        <span class="filter-count" id="health-count"></span>
      </div>

      <div class="filter-bar">
        <select class="filter-select" id="filter-health" onchange="renderCards()">
          <option value="">All clients</option>
          <option value="healthy">Healthy</option>
          <option value="watch">Watch</option>
          <option value="at-risk">At Risk</option>
        </select>
      </div>

      <div class="health-grid" id="health-grid"></div>

    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('client-health');

let enrichedClients = [];

async function loadData() {
  const [clients, invoices] = await Promise.all([
    TMIAdmin.api('/api/clients'),
    TMIAdmin.api('/api/invoices')
  ]);
  if (!clients) return;

  const inv = invoices || [];
  const now = new Date();

  // Only active clients
  const active = clients.filter(c => c.status === 'active');

  enrichedClients = active.map(client => {
    const clientInvoices = inv.filter(i => i.client_id === client.id);

    // Find most recent invoice date
    let lastInvoiceDate = null;
    clientInvoices.forEach(i => {
      const d = new Date(i.created_at);
      if (!lastInvoiceDate || d > lastInvoiceDate) lastInvoiceDate = d;
    });

    const hasOverdue = clientInvoices.some(i => i.status === 'overdue');
    const overdueAmount = clientInvoices
      .filter(i => i.status === 'overdue')
      .reduce((s, i) => s + parseFloat(i.amount || 0), 0);

    // Health score
    let score = 100;
    const reasons = [];

    if (lastInvoiceDate) {
      const daysSinceInvoice = Math.floor((now - lastInvoiceDate) / (1000 * 60 * 60 * 24));
      if (daysSinceInvoice >= 60) {
        score -= 30;
        reasons.push(`No invoice in ${daysSinceInvoice} days`);
      }
    } else {
      score -= 30;
      reasons.push('No invoices on record');
    }

    if (hasOverdue) {
      score -= 30;
      reasons.push(`Overdue invoice: ${TMIAdmin.currency(overdueAmount)}`);
    }

    if (client.status !== 'active') {
      score -= 20;
      reasons.push(`Status: ${client.status}`);
    }

    score = Math.max(0, score);

    let healthLabel, healthClass;
    if (score >= 80) {
      healthLabel = 'Healthy'; healthClass = 'healthy';
    } else if (score >= 50) {
      healthLabel = 'Watch'; healthClass = 'watch';
    } else {
      healthLabel = 'At Risk'; healthClass = 'at-risk';
    }

    // Months active
    let monthsActive = null;
    if (client.start_date) {
      const ms = now - new Date(client.start_date);
      monthsActive = Math.floor(ms / (1000 * 60 * 60 * 24 * 30));
    }

    return {
      ...client,
      score,
      healthLabel,
      healthClass,
      lastInvoiceDate,
      lastInvoice: clientInvoices.length ? clientInvoices.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] : null,
      hasOverdue,
      overdueAmount,
      monthsActive,
      reasons
    };
  });

  // Sort worst first
  enrichedClients.sort((a, b) => a.score - b.score);

  renderStats();
  renderCards();
}

function renderStats() {
  const healthy = enrichedClients.filter(c => c.healthClass === 'healthy').length;
  const watch = enrichedClients.filter(c => c.healthClass === 'watch').length;
  const atRisk = enrichedClients.filter(c => c.healthClass === 'at-risk').length;
  document.getElementById('health-stats').innerHTML = `
    <div class="stat-box"><div class="stat-label">Active Clients</div><div class="stat-val">${enrichedClients.length}</div></div>
    <div class="stat-box"><div class="stat-label">Healthy</div><div class="stat-val" style="color:var(--green,#22c55e)">${healthy}</div></div>
    <div class="stat-box"><div class="stat-label">Watch</div><div class="stat-val" style="color:var(--yellow,#f59e0b)">${watch}</div></div>
    <div class="stat-box"><div class="stat-label">At Risk</div><div class="stat-val" style="color:var(--red,#ef4444)">${atRisk}</div></div>
  `;
}

function renderCards() {
  const filterHealth = document.getElementById('filter-health').value;
  const filtered = filterHealth
    ? enrichedClients.filter(c => c.healthClass === filterHealth)
    : enrichedClients;

  document.getElementById('health-count').textContent = `${filtered.length} client${filtered.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('health-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">❤️</div><h3>No clients match this filter</h3><p>Try a different health status.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(client => {
    const c = client.contacts || {};
    const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || '—';
    const company = c.company || '—';

    const lastInvStr = client.lastInvoice
      ? `${TMIAdmin.fmt(client.lastInvoice.created_at)} &middot; ${TMIAdmin.badge(client.lastInvoice.status)}`
      : 'No invoices';

    const startStr = client.start_date
      ? `${TMIAdmin.fmt(client.start_date)}${client.monthsActive !== null ? ` &middot; ${client.monthsActive} mo` : ''}`
      : '—';

    const overdueRow = client.hasOverdue
      ? `<div class="health-card-row"><span class="label">Overdue</span><span class="val overdue">${TMIAdmin.currency(client.overdueAmount)}</span></div>`
      : '';

    return `<div class="health-card">
      <div class="health-card-top">
        <div>
          <div class="health-card-name">${name}</div>
          <div class="health-card-company">${company}</div>
        </div>
        <span class="health-badge ${client.healthClass}">${client.healthLabel}</span>
      </div>
      ${client.plan ? `<div><span class="health-plan-tag">${client.plan}</span></div>` : ''}
      <div class="health-card-row"><span class="label">Started</span><span class="val">${startStr}</span></div>
      <div class="health-card-row"><span class="label">Last Invoice</span><span class="val">${lastInvStr}</span></div>
      ${overdueRow}
      <div style="border-top:1px solid var(--line);padding-top:10px;margin-top:2px">
        <a href="/admin-clients" class="health-card-link">View Client <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></a>
      </div>
    </div>`;
  }).join('');
}

loadData();
</script>
</body>
</html>
