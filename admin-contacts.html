<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contacts — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Contacts</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV(allContacts)">Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Contact
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Contacts</h1>
        <span class="filter-count" id="contact-count"></span>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, email, company..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-audience" onchange="renderTable()">
          <option value="">All audiences</option>
          <option value="physical">Physical</option><option value="online">Online</option><option value="fotf">FOTF</option>
        </select>
        <select class="filter-select" id="filter-niche" onchange="renderTable()">
          <option value="">All niches</option>
        </select>
      </div>

      <div id="bulk-toolbar" style="display:none;position:sticky;top:0;background:var(--chart);padding:8px 16px;border-radius:var(--r-sm);display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;font-weight:500;color:var(--ink)">
        <span id="bulk-count">0 selected</span>
        <button class="btn btn-ghost btn-sm" onclick="bulkExportCSV()">Export CSV</button>
        <button class="btn btn-ghost btn-sm" onclick="bulkEmail()">Email Selected</button>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="clearSelection()">Clear</button>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th style="width:36px"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this)"/></th>
              <th>Name</th><th>Email</th><th>Phone</th><th>Company</th>
              <th>Audience</th><th>Niche</th><th>Added</th>
            </tr></thead>
            <tbody id="contacts-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="contact-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title" id="modal-title">Add Contact</h2>
      <button class="modal-x" onclick="TMIAdmin.closeModal('contact-modal')">&times;</button>
    </div>
    <input type="hidden" id="edit-id"/>
    <div class="form-row">
      <div class="form-group"><label class="form-label">First Name *</label><input class="form-input" id="f-first" placeholder="First"/></div>
      <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" id="f-last" placeholder="Last"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" type="email" placeholder="email@company.com"/></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="f-phone" placeholder="+1 555 000 0000"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Company</label><input class="form-input" id="f-company" placeholder="Company name"/></div>
      <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="f-title" placeholder="Job title"/></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select class="form-input" id="f-audience" onchange="onAudienceChange()">
          <option value="">Select audience</option>
          <option value="physical">Physical</option><option value="online">Online</option><option value="fotf">FOTF</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Niche</label>
        <select class="form-input" id="f-niche"><option value="">Select niche</option></select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="f-notes" rows="3"></textarea></div>
    <div class="form-group"><label class="form-label">Tags</label><input class="form-input" id="f-tags" placeholder="comma-separated tags"/></div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="TMIAdmin.closeModal('contact-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveContact()">Save Contact</button>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="contact-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('contact-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-name">—</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" onclick="editFromPanel()">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteFromPanel()">Delete</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Email</div><div class="detail-val" id="pd-email">—</div></div>
        <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-val" id="pd-phone">—</div></div>
        <div class="detail-item"><div class="detail-label">Company</div><div class="detail-val" id="pd-company">—</div></div>
        <div class="detail-item"><div class="detail-label">Title</div><div class="detail-val" id="pd-title">—</div></div>
        <div class="detail-item"><div class="detail-label">Audience</div><div class="detail-val" id="pd-audience">—</div></div>
        <div class="detail-item"><div class="detail-label">Niche</div><div class="detail-val" id="pd-niche">—</div></div>
        <div class="detail-item"><div class="detail-label">Added</div><div class="detail-val" id="pd-created">—</div></div>
      </div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Notes</div>
      <div id="pd-notes" style="font-size:14px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;">—</div>
      <div id="pd-tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
      <div class="panel-sep"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a id="pd-email-link" href="#" class="btn btn-ghost btn-sm">Send Email</a>
        <button class="btn btn-primary btn-sm" onclick="addAsLead()">Add as Lead</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('contacts');

let allContacts = [];
let currentContact = null;
let selectedIds = new Set();

// Build niche filter
const allNiches = [...TMIAdmin.niches.physical, ...TMIAdmin.niches.online, ...TMIAdmin.niches.fotf];
const nicheFilter = document.getElementById('filter-niche');
allNiches.forEach(n => { nicheFilter.innerHTML += `<option>${n}</option>`; });

function onAudienceChange() {
  const aud = document.getElementById('f-audience').value;
  const niches = aud ? TMIAdmin.niches[aud] : allNiches;
  const sel = document.getElementById('f-niche');
  sel.innerHTML = `<option value="">Select niche</option>` + niches.map(n => `<option>${n}</option>`).join('');
}

async function loadContacts() {
  const data = await TMIAdmin.api('/api/contacts');
  if (data) { allContacts = data; renderTable(); }
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const aud = document.getElementById('filter-audience').value;
  const niche = document.getElementById('filter-niche').value;

  const filtered = allContacts.filter(c => {
    const text = [c.first_name, c.last_name, c.email, c.company].filter(Boolean).join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (aud && c.audience !== aud) return false;
    if (niche && c.niche !== niche) return false;
    return true;
  });

  document.getElementById('contact-count').textContent = `${filtered.length} contact${filtered.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('contacts-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><div class="empty-icon">👤</div><h3>No contacts found</h3><p>Add contacts manually or they'll appear as leads are created.</p></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(c => {
    const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || '—';
    const checked = selectedIds.has(String(c.id)) ? 'checked' : '';
    return `<tr onclick="openPanel(${JSON.stringify(c).replace(/"/g,'&quot;')})">
      <td onclick="event.stopPropagation()"><input type="checkbox" class="row-check" value="${c.id}" ${checked} onchange="onRowCheck()"/></td>
      <td class="td-name">${name}</td>
      <td style="color:var(--ink-2)">${c.email || '—'}</td>
      <td class="td-muted">${c.phone || '—'}</td>
      <td>${c.company || '—'}</td>
      <td>${c.audience ? TMIAdmin.badge(c.audience) : '—'}</td>
      <td class="td-muted">${c.niche || '—'}</td>
      <td class="td-muted">${TMIAdmin.fmt(c.created_at)}</td>
    </tr>`;
  }).join('');
}

function openPanel(contact) {
  currentContact = contact;
  const name = [contact.first_name, contact.last_name].filter(Boolean).join(' ') || '—';
  document.getElementById('panel-name').textContent = name;
  document.getElementById('pd-email').innerHTML = contact.email ? `<a href="mailto:${contact.email}" style="color:var(--blue)">${contact.email}</a>` : '—';
  document.getElementById('pd-phone').textContent = contact.phone || '—';
  document.getElementById('pd-company').textContent = contact.company || '—';
  document.getElementById('pd-title').textContent = contact.title || '—';
  document.getElementById('pd-audience').innerHTML = contact.audience ? TMIAdmin.badge(contact.audience) : '—';
  document.getElementById('pd-niche').textContent = contact.niche || '—';
  document.getElementById('pd-created').textContent = TMIAdmin.fmt(contact.created_at);
  document.getElementById('pd-notes').textContent = contact.notes || '—';
  const tagsEl = document.getElementById('pd-tags');
  if (contact.tags) {
    tagsEl.innerHTML = contact.tags.split(',').filter(t => t.trim()).map(t =>
      `<span style="font-size:11px;padding:2px 8px;background:var(--bg-alt);border-radius:999px;color:var(--ink-2)">${t.trim()}</span>`
    ).join('');
  } else {
    tagsEl.innerHTML = '';
  }
  const emailLink = document.getElementById('pd-email-link');
  emailLink.href = contact.email ? `mailto:${contact.email}` : '#';
  TMIAdmin.openPanel('contact-panel');
}

function openAddModal() {
  document.getElementById('edit-id').value = '';
  document.getElementById('modal-title').textContent = 'Add Contact';
  document.getElementById('save-btn').textContent = 'Save Contact';
  ['first','last','email','phone','company','title','notes','tags'].forEach(f => {
    document.getElementById('f-' + f).value = '';
  });
  document.getElementById('f-audience').value = '';
  onAudienceChange();
  TMIAdmin.openModal('contact-modal');
}

function editFromPanel() {
  if (!currentContact) return;
  const c = currentContact;
  TMIAdmin.closePanel('contact-panel');
  document.getElementById('edit-id').value = c.id;
  document.getElementById('modal-title').textContent = 'Edit Contact';
  document.getElementById('save-btn').textContent = 'Update Contact';
  document.getElementById('f-first').value = c.first_name || '';
  document.getElementById('f-last').value = c.last_name || '';
  document.getElementById('f-email').value = c.email || '';
  document.getElementById('f-phone').value = c.phone || '';
  document.getElementById('f-company').value = c.company || '';
  document.getElementById('f-title').value = c.title || '';
  document.getElementById('f-audience').value = c.audience || '';
  onAudienceChange();
  setTimeout(() => { document.getElementById('f-niche').value = c.niche || ''; }, 50);
  document.getElementById('f-notes').value = c.notes || '';
  document.getElementById('f-tags').value = c.tags || '';
  TMIAdmin.openModal('contact-modal');
}

async function saveContact() {
  const id = document.getElementById('edit-id').value;
  const firstName = document.getElementById('f-first').value.trim();
  if (!firstName) { TMIAdmin.toast('First name is required', 'error'); return; }

  const payload = {
    first_name: firstName,
    last_name: document.getElementById('f-last').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    company: document.getElementById('f-company').value.trim(),
    title: document.getElementById('f-title').value.trim(),
    audience: document.getElementById('f-audience').value,
    niche: document.getElementById('f-niche').value,
    notes: document.getElementById('f-notes').value.trim(),
    tags: document.getElementById('f-tags').value.trim()
  };
  if (id) payload.id = id;

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  const res = await TMIAdmin.api('/api/contacts', id ? 'PUT' : 'POST', payload);
  btn.disabled = false; btn.textContent = id ? 'Update Contact' : 'Save Contact';

  if (res) {
    TMIAdmin.toast(id ? 'Contact updated' : 'Contact added');
    TMIAdmin.closeModal('contact-modal');
    await loadContacts();
  }
}

async function deleteFromPanel() {
  if (!currentContact) return;
  const ok = await TMIAdmin.confirm('Delete this contact? Any linked leads or clients will also be removed.');
  if (!ok) return;
  const res = await TMIAdmin.api(`/api/contacts?id=${currentContact.id}`, 'DELETE');
  if (res) {
    TMIAdmin.toast('Contact deleted');
    TMIAdmin.closePanel('contact-panel');
    await loadContacts();
  }
}

function addAsLead() {
  // Store contact and navigate to leads with pre-fill
  if (currentContact) {
    sessionStorage.setItem('prefill_contact', JSON.stringify(currentContact));
    window.location.href = '/admin-leads';
  }
}

function toggleSelectAll(cb) {
  const checks = document.querySelectorAll('.row-check');
  checks.forEach(c => { c.checked = cb.checked; });
  selectedIds.clear();
  if (cb.checked) checks.forEach(c => selectedIds.add(String(c.value)));
  updateBulkToolbar();
}

function onRowCheck() {
  selectedIds.clear();
  document.querySelectorAll('.row-check:checked').forEach(c => selectedIds.add(String(c.value)));
  const allChecks = document.querySelectorAll('.row-check');
  document.getElementById('select-all').checked = allChecks.length > 0 && selectedIds.size === allChecks.length;
  updateBulkToolbar();
}

function updateBulkToolbar() {
  const bar = document.getElementById('bulk-toolbar');
  const count = selectedIds.size;
  bar.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('bulk-count').textContent = `${count} selected`;
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.row-check').forEach(c => { c.checked = false; });
  document.getElementById('select-all').checked = false;
  updateBulkToolbar();
}

function exportCSV(contacts) {
  const headers = ['Name','Email','Phone','Company','Audience','Niche','Added'];
  const rows = contacts.map(c => [
    [c.first_name, c.last_name].filter(Boolean).join(' '),
    c.email || '',
    c.phone || '',
    c.company || '',
    c.audience || '',
    c.niche || '',
    TMIAdmin.fmt(c.created_at)
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'contacts.csv'; a.click();
  URL.revokeObjectURL(url);
}

function bulkExportCSV() {
  exportCSV(allContacts.filter(c => selectedIds.has(String(c.id))));
}

function bulkEmail() {
  const emails = allContacts.filter(c => selectedIds.has(String(c.id)) && c.email).map(c => c.email);
  if (!emails.length) { TMIAdmin.toast('No email addresses in selection', 'error'); return; }
  window.location.href = `mailto:?bcc=${encodeURIComponent(emails.join(','))}`;
}

loadContacts();
</script>
</body>
</html>
