<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stage Letters — FOTF Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
body.sl-page .content { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.sl-wrap { display: flex; flex: 1; overflow: hidden; }

/* Stage list sidebar */
.sl-sidebar { width: 220px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; overflow-y: auto; }
.sl-sidebar-hd { padding: 16px; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.sl-stage-btn { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border: none; background: none; text-align: left; cursor: pointer; font-family: inherit; border-bottom: 1px solid var(--line); transition: background 0.1s; width: 100%; }
.sl-stage-btn:hover { background: var(--bg); }
.sl-stage-btn.active { background: var(--chart); }
.sl-stage-btn .sl-tier { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.sl-stage-btn.active .sl-tier { color: #3a5400; }
.sl-stage-btn .sl-name { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.2; }
.sl-stage-btn .sl-updated { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* Editor */
.sl-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.sl-editor-bar { display: flex; align-items: center; gap: 12px; padding: 10px 28px; border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0; }
.sl-editor-bar .sl-stage-name { font-size: 16px; font-weight: 600; color: var(--ink); flex: 1; }
.sl-form { flex: 1; overflow-y: auto; padding: 28px 32px; }
.sl-field { margin-bottom: 20px; }
.sl-field label { display: block; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.sl-field input, .sl-field textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 12px; font-size: 14px; color: var(--ink); background: var(--surface); outline: none; font-family: inherit; resize: vertical; transition: border-color 0.15s; }
.sl-field input:focus, .sl-field textarea:focus { border-color: var(--ink); }
.sl-field textarea.body-area { min-height: 380px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.6; }
.sl-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
.sl-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--muted); gap: 10px; padding: 60px 32px; text-align: center; }
</style>
</head>
<body class="sl-page">
<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="page">Stage Letters</span>
      </div>
    </div>

    <div class="content">
      <div class="sl-wrap">

        <!-- Stage sidebar -->
        <div class="sl-sidebar">
          <div class="sl-sidebar-hd">7 Tiers</div>
          <div id="stage-list"></div>
        </div>

        <!-- Editor -->
        <div class="sl-editor">
          <div class="sl-editor-bar">
            <div class="sl-stage-name" id="sl-stage-name">Select a stage</div>
            <button class="btn btn-primary btn-sm" onclick="saveLetter()" id="sl-save-btn" style="display:none">Save Changes</button>
          </div>

          <div class="sl-empty" id="sl-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p>Select a stage to edit its letter</p>
          </div>

          <div class="sl-form" id="sl-form" style="display:none">
            <div class="sl-field">
              <label>Subject Line</label>
              <input type="text" id="sl-subject" placeholder="Email subject line..."/>
            </div>
            <div class="sl-field">
              <label>Body <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px">HTML or plain text</span></label>
              <textarea class="body-area" id="sl-body" placeholder="Dear {{name}},&#10;&#10;..."></textarea>
            </div>
            <div class="sl-meta" id="sl-updated"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('fotf-stage-letters');

const STAGES = [
  { key: 'tier1', label: 'Just Starting Out' },
  { key: 'tier2', label: 'Growing Fast' },
  { key: 'tier3', label: 'Ready To Scale' },
  { key: 'tier4', label: 'Scaling Hard' },
  { key: 'tier5', label: 'Multi Crew / Multi Location' },
  { key: 'tier6', label: 'Hitting $10 Million' },
  { key: 'tier7', label: 'Above $10 Million' },
];

let letters = [];
let currentLetter = null;

function renderSidebar() {
  document.getElementById('stage-list').innerHTML = STAGES.map((s, i) => {
    const letter = letters.find(l => l.stage === s.key);
    const isActive = currentLetter && currentLetter.stage === s.key;
    return `<button class="sl-stage-btn${isActive ? ' active' : ''}" onclick="loadStage('${s.key}')">
      <span class="sl-tier">Tier ${i + 1}</span>
      <span class="sl-name">${s.label}</span>
      ${letter ? `<span class="sl-updated">Updated ${TMIAdmin.fmt(letter.updated_at)}</span>` : '<span class="sl-updated">No letter yet</span>'}
    </button>`;
  }).join('');
}

function loadStage(key) {
  const letter = letters.find(l => l.stage === key) || { stage: key, subject: '', body: '', updated_at: null };
  currentLetter = letter;

  const stageDef = STAGES.find(s => s.key === key);
  const tierNum = STAGES.findIndex(s => s.key === key) + 1;

  document.getElementById('sl-stage-name').textContent = `Tier ${tierNum}: ${stageDef?.label || key}`;
  document.getElementById('sl-subject').value = letter.subject || '';
  document.getElementById('sl-body').value = letter.body || '';
  document.getElementById('sl-updated').textContent = letter.updated_at
    ? `Last updated ${TMIAdmin.fmt(letter.updated_at)}`
    : 'Not yet saved';
  document.getElementById('sl-empty').style.display = 'none';
  document.getElementById('sl-form').style.display = '';
  document.getElementById('sl-save-btn').style.display = '';

  renderSidebar();
}

async function saveLetter() {
  if (!currentLetter) return;
  const subject = document.getElementById('sl-subject').value.trim();
  const body = document.getElementById('sl-body').value.trim();
  const payload = {
    stage: currentLetter.stage,
    subject,
    body,
  };
  if (currentLetter.id) payload.id = currentLetter.id;
  const data = await TMIAdmin.api('/api/fotf-stage-letters', 'PUT', payload);
  if (!data) return;
  TMIAdmin.toast('Saved');
  await reload();
  loadStage(currentLetter.stage);
}

async function reload() {
  letters = await TMIAdmin.api('/api/fotf-stage-letters') || [];
  renderSidebar();
}

async function init() {
  await reload();
  // Auto-select tier1 on load
  loadStage('tier1');
}

init();
</script>
</body>
</html>
