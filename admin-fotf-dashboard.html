<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FOTF — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="page">Home</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="openCapture()">+ Quick Note</button>
        <a href="/admin-fotf-community" class="btn btn-primary btn-sm">+ Add Member</a>
      </div>
    </div>

    <div class="content">

      <!-- Stats -->
      <div class="stats-row" id="stats">
        <div class="stat-box">
          <div class="stat-label">Active Members</div>
          <div class="stat-val" id="stat-members">—</div>
          <div class="stat-delta" id="stat-members-d"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">New This Week</div>
          <div class="stat-val" id="stat-new">—</div>
          <div class="stat-delta" id="stat-new-d"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Last Open Rate</div>
          <div class="stat-val" id="stat-open">—</div>
          <div class="stat-delta" id="stat-open-d"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Active Sprints</div>
          <div class="stat-val" id="stat-sprints">—</div>
          <div class="stat-delta" id="stat-sprints-d"></div>
        </div>
      </div>

      <div class="grid-2">

        <!-- This Week -->
        <div style="display:flex;flex-direction:column;gap:20px;">

          <div class="card">
            <div class="card-head">
              <span class="card-title">This Week</span>
              <a href="/admin-fotf-newsletter" class="btn btn-ghost btn-sm">Newsletter</a>
            </div>
            <div id="week-wrap">
              <div style="padding:16px 20px;font-size:13px;color:var(--muted)">Loading...</div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="card-title">Recent Members</span>
              <a href="/admin-fotf-community" class="btn btn-ghost btn-sm">View all</a>
            </div>
            <div class="tbl-wrap">
              <table>
                <thead><tr>
                  <th>#</th><th>Name</th><th>Stage</th><th>City</th><th>Joined</th>
                </tr></thead>
                <tbody id="members-tbody">
                  <tr><td colspan="5" style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

        <!-- Right column -->
        <div style="display:flex;flex-direction:column;gap:20px;">

          <div class="card">
            <div class="card-head"><span class="card-title">Action Items</span></div>
            <div id="action-wrap">
              <div style="padding:16px 20px;font-size:13px;color:var(--muted)">Loading...</div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="card-title">Newsletter Queue</span>
              <a href="/admin-fotf-newsletter" class="btn btn-ghost btn-sm">Open editor</a>
            </div>
            <div id="queue-wrap">
              <div style="padding:16px 20px;font-size:13px;color:var(--muted)">Loading...</div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><span class="card-title">Stage Breakdown</span></div>
            <div id="stage-wrap" style="padding:16px 20px;">
              <div style="font-size:13px;color:var(--muted)">Loading...</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- Quick Capture Modal -->
<div class="modal-overlay" id="capture-modal">
  <div class="modal" style="max-width:520px">
    <div class="modal-hd">
      <h3 class="modal-title">Quick Note</h3>
      <button class="modal-close" onclick="TMIAdmin.closeModal('capture-modal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">
      <div class="form-group">
        <label class="form-label">Note / Idea / Glass Box</label>
        <textarea class="form-input" id="cap-text" rows="4" placeholder="Drop a thought, revenue number, hire update, or win..."></textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1">
          <label class="form-label">Tag</label>
          <select class="form-input" id="cap-tag">
            <option value="win">Win</option>
            <option value="revenue">Revenue</option>
            <option value="decision">Decision</option>
            <option value="hire">Hire</option>
            <option value="mistake">Mistake</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label">Publish</label>
          <select class="form-input" id="cap-schedule">
            <option value="">Save as draft</option>
            <option value="now">Post now</option>
            <option value="eow">End of week</option>
            <option value="monthly">Monthly recap</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost btn-sm" onclick="TMIAdmin.closeModal('capture-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveCapture()">Save Note</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('fotf-dashboard');

const STAGE_LABELS = {
  'day-one':'Day One','online-creator':'Creator','online-ecom':'E-com',
  'online-agency':'Agency','online-saas':'SaaS','trades':'Trades',
  'retail':'Retail','restaurant':'Food Service','not-yet':'Not Yet'
};
const STAGE_COLORS = {
  'day-one':'#dbeafe','online-creator':'#ede9fe','online-ecom':'#ede9fe',
  'online-agency':'#ede9fe','online-saas':'#ede9fe','trades':'#dcfce7',
  'retail':'#dcfce7','restaurant':'#dcfce7','not-yet':'#f3f4f6'
};

function openCapture() { TMIAdmin.openModal('capture-modal'); }

async function saveCapture() {
  const text = document.getElementById('cap-text').value.trim();
  if (!text) return TMIAdmin.toast('Write something first','error');
  const tag = document.getElementById('cap-tag').value;
  await TMIAdmin.api('/api/fotf-glass-box','POST',{ post_text: text, tag });
  TMIAdmin.closeModal('capture-modal');
  document.getElementById('cap-text').value = '';
  TMIAdmin.toast('Note saved');
}

async function loadDashboard() {
  const [members, issues] = await Promise.all([
    TMIAdmin.api('/api/fotf-members'),
    TMIAdmin.api('/api/fotf-issues'),
  ]);

  // Stats
  const now = new Date();
  const weekAgo = new Date(now - 7 * 864e5);

  if (members) {
    const active = members.filter(m => m.status === 'active');
    document.getElementById('stat-members').textContent = active.length;
    const newThisWeek = members.filter(m => new Date(m.created_at) >= weekAgo);
    document.getElementById('stat-new').textContent = newThisWeek.length;
    document.getElementById('stat-new-d').textContent = newThisWeek.length === 1 ? '1 new member' : `${newThisWeek.length} new members`;
    const sprints = active.filter(m => m.sprint_active).length;
    document.getElementById('stat-sprints').textContent = sprints;
    document.getElementById('stat-sprints-d').textContent = sprints === 1 ? '1 in progress' : `${sprints} in progress`;
  }

  if (issues) {
    const sent = issues.filter(i => i.status === 'sent' && i.open_rate);
    if (sent.length) {
      const last = sent[0];
      document.getElementById('stat-open').textContent = `${last.open_rate}%`;
      document.getElementById('stat-open-d').textContent = last.headline?.slice(0, 30) + (last.headline?.length > 30 ? '...' : '') || '';
    } else {
      document.getElementById('stat-open').textContent = '—';
      document.getElementById('stat-open-d').textContent = 'No sent issues yet';
    }
  }

  // This Week
  const today = now.getDay();
  const sunday = new Date(now); sunday.setDate(now.getDate() - today);
  const nextSunday = new Date(sunday); nextSunday.setDate(sunday.getDate() + 7);
  const nextWed   = new Date(sunday); nextWed.setDate(sunday.getDate() + (today <= 3 ? 3 - today : 10 - today));

  const upcomingIssues = issues ? issues.filter(i => i.status !== 'sent').slice(0, 6) : [];
  const weekItems = [
    { label: 'Sunday Field Guide', issue: upcomingIssues.find(i => i.series === 'field-guide') },
    { label: 'Wednesday Tool Drop', issue: upcomingIssues.find(i => i.series === 'tool-drop') },
  ];

  document.getElementById('week-wrap').innerHTML = weekItems.map(wi => {
    const status = wi.issue ? wi.issue.status : 'not started';
    const title = wi.issue?.headline || 'No draft yet';
    const badgeColor = status === 'scheduled' ? '#dcfce7' : status === 'draft' ? '#fef9c3' : '#f3f4f6';
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)">
      <div style="width:8px;height:8px;border-radius:50%;background:${badgeColor};flex-shrink:0;border:1px solid rgba(0,0,0,0.1)"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:var(--ink)">${wi.label}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</div>
      </div>
      <span style="font-size:11px;padding:2px 8px;border-radius:4px;background:${badgeColor};color:var(--ink-2);white-space:nowrap">${status}</span>
    </div>`;
  }).join('') + `<div style="padding:12px 20px">
    <a href="/admin-fotf-newsletter" style="font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px">Open newsletter editor →</a>
  </div>`;

  // Action items
  const actionItems = [];
  if (members) {
    const noReceipt = members.filter(m => m.status === 'active' && !m.receipt_sent).slice(0, 5);
    noReceipt.forEach(m => actionItems.push({
      icon: '📬', text: `Send Founder Receipt to <strong>${m.name || m.email}</strong>`,
      sub: `#${m.founder_number} · joined ${TMIAdmin.fmt(m.created_at)}`, href: '/admin-fotf-identity', urgent: false
    }));
    const walletMilestones = members.filter(m => {
      const saved = parseFloat(m.dollars_saved) || 0;
      return saved >= 1000 && m.status === 'active';
    }).slice(0, 3);
    walletMilestones.forEach(m => actionItems.push({
      icon: '💰', text: `Wallet milestone: <strong>${m.name || m.email}</strong>`,
      sub: `$${Number(m.dollars_saved).toLocaleString()} saved`, href: '/admin-fotf-identity', urgent: false
    }));
  }

  document.getElementById('action-wrap').innerHTML = actionItems.length
    ? actionItems.map(item => `
      <a href="${item.href}" style="display:flex;align-items:flex-start;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.1s" onmouseover="this.style.background='#fafafa'" onmouseout="this.style.background=''">
        <span style="font-size:16px;flex-shrink:0;line-height:1.4">${item.icon}</span>
        <div>
          <div style="font-size:13px;color:var(--ink)">${item.text}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${item.sub}</div>
        </div>
      </a>`).join('')
    : `<div style="padding:20px;font-size:13px;color:var(--muted)">All clear — nothing needs your attention.</div>`;

  // Newsletter queue
  const draftsScheduled = issues ? issues.filter(i => i.status !== 'sent').slice(0, 5) : [];
  document.getElementById('queue-wrap').innerHTML = draftsScheduled.length
    ? draftsScheduled.map(i => {
      const series = i.series?.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase()) || 'Unknown';
      return `<div style="padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;cursor:pointer" onclick="location.href='/admin-fotf-newsletter'">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.headline || '(no headline)'}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${series}${i.issue_number ? ` #${i.issue_number}` : ''}</div>
        </div>
        ${TMIAdmin.badge(i.status)}
      </div>`;
    }).join('')
    : `<div style="padding:20px;font-size:13px;color:var(--muted)">No drafts. <a href="/admin-fotf-newsletter" style="color:var(--ink);text-decoration:underline">Write first issue →</a></div>`;

  // Stage breakdown
  if (members) {
    const active = members.filter(m => m.status === 'active');
    const counts = {};
    active.forEach(m => { counts[m.stage] = (counts[m.stage] || 0) + 1; });
    const total = active.length || 1;
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    document.getElementById('stage-wrap').innerHTML = sorted.length
      ? sorted.map(([stage, count]) => `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div style="width:96px;font-size:12px;color:var(--ink-2)">${STAGE_LABELS[stage] || stage}</div>
          <div style="flex:1;height:6px;background:var(--bg);border-radius:999px;overflow:hidden">
            <div style="height:100%;width:${Math.round(count/total*100)}%;background:${STAGE_COLORS[stage]||'#f3f4f6'};border-radius:999px;min-width:${count?4:0}px;border:1px solid rgba(0,0,0,0.08)"></div>
          </div>
          <div style="width:24px;font-size:12px;color:var(--muted);text-align:right">${count}</div>
        </div>`).join('')
      : `<div style="font-size:13px;color:var(--muted)">No members yet.</div>`;
  }

  // Recent members table
  if (members) {
    const recent = [...members].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 8);
    document.getElementById('members-tbody').innerHTML = recent.length
      ? recent.map(m => `<tr onclick="location.href='/admin-fotf-community'" style="cursor:pointer">
          <td class="td-muted">#${m.founder_number || '—'}</td>
          <td class="td-name">${m.name || m.email}</td>
          <td>${TMIAdmin.badge(m.stage)}</td>
          <td class="td-muted">${m.city || '—'}</td>
          <td class="td-muted">${TMIAdmin.fmt(m.created_at)}</td>
        </tr>`).join('')
      : `<tr><td colspan="5" style="padding:32px;text-align:center;color:var(--muted);font-size:13px">No members yet. <a href="/admin-fotf-community" style="color:var(--ink);text-decoration:underline">Add your first one.</a></td></tr>`;
  }
}

loadDashboard();
</script>
</body>
</html>
