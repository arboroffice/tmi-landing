<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rituals — FOTF Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
.freq-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;}
.freq-tab{font-size:12px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:none;color:var(--ink-2);font-family:inherit;transition:background 0.1s,color 0.1s;}
.freq-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.ritual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.ritual-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;}
.ritual-card:hover{border-color:var(--ink-2);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.rc-freq{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.rc-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px;line-height:1.3;}
.rc-date{font-size:12px;color:var(--ink-2);margin-bottom:10px;}
.rc-notes{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="page">Rituals</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openNew()">+ Schedule Ritual</button>
      </div>
    </div>

    <div class="content">
      <div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat-box"><div class="stat-label">Weekly</div><div class="stat-val" id="s-w">—</div><div class="stat-delta">Build in Public</div></div>
        <div class="stat-box"><div class="stat-label">Monthly</div><div class="stat-val" id="s-m">—</div><div class="stat-delta">Hot Seat · The Drop</div></div>
        <div class="stat-box"><div class="stat-label">Quarterly</div><div class="stat-val" id="s-q">—</div><div class="stat-delta">Pitch Room</div></div>
        <div class="stat-box"><div class="stat-label">Annual</div><div class="stat-val" id="s-a">—</div><div class="stat-delta">100 Day Sprint</div></div>
      </div>

      <div class="freq-tabs">
        <button class="freq-tab active" onclick="setFreq('all',this)">All</button>
        <button class="freq-tab" onclick="setFreq('weekly',this)">Weekly</button>
        <button class="freq-tab" onclick="setFreq('monthly',this)">Monthly</button>
        <button class="freq-tab" onclick="setFreq('quarterly',this)">Quarterly</button>
        <button class="freq-tab" onclick="setFreq('annual',this)">Annual</button>
      </div>

      <div class="ritual-grid" id="ritual-grid">
        <div style="padding:20px;color:var(--muted);font-size:13px">Loading...</div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="ritual-modal">
  <div class="modal" style="max-width:480px;padding:28px">
    <div class="modal-hd">
      <h3 class="modal-title" id="modal-title">Schedule Ritual</h3>
      <button class="modal-x" onclick="TMIAdmin.closeModal('ritual-modal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <select class="form-input" id="r-type" onchange="onTypeChange()">
        <option value="">Pick type...</option>
        <option value="build-in-public">Build in Public (weekly)</option>
        <option value="hot-seat">Hot Seat (monthly)</option>
        <option value="the-drop">The Drop (monthly)</option>
        <option value="pitch-room">Pitch Room (quarterly)</option>
        <option value="100-day-sprint">100 Day Sprint (annual)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Frequency</label>
      <select class="form-input" id="r-freq">
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="quarterly">Quarterly</option>
        <option value="annual">Annual</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Title / Theme <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">optional</span></label>
      <input type="text" class="form-input" id="r-title" placeholder="e.g. Q2 Pitch Room - April"/>
    </div>
    <div class="form-group">
      <label class="form-label">Scheduled Date</label>
      <input type="datetime-local" class="form-input" id="r-date"/>
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea class="form-input" id="r-notes" style="min-height:80px" placeholder="Guest, topic, prep notes..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select class="form-input" id="r-status">
        <option value="scheduled">Scheduled</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="modal-ft">
      <button class="btn btn-danger btn-sm" id="r-delete-btn" style="display:none;margin-right:auto" onclick="deleteRitual()">Delete</button>
      <button class="btn btn-ghost btn-sm" onclick="TMIAdmin.closeModal('ritual-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveRitual()">Save</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('fotf-rituals');

const TYPE_FREQ = {
  'build-in-public':'weekly','hot-seat':'monthly','the-drop':'monthly',
  'pitch-room':'quarterly','100-day-sprint':'annual'
};
const TYPE_LABELS = {
  'build-in-public':'Build in Public','hot-seat':'Hot Seat','the-drop':'The Drop',
  'pitch-room':'Pitch Room','100-day-sprint':'100 Day Sprint'
};

let rituals = [];
let currentId = null;
let filterFreq = 'all';

function onTypeChange() {
  const f = TYPE_FREQ[document.getElementById('r-type').value];
  if (f) document.getElementById('r-freq').value = f;
}

function setFreq(f, btn) {
  filterFreq = f;
  document.querySelectorAll('.freq-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const filtered = filterFreq === 'all' ? rituals : rituals.filter(r => r.frequency === filterFreq);
  const el = document.getElementById('ritual-grid');
  if (!filtered.length) {
    el.innerHTML = `<div style="padding:32px;color:var(--muted);font-size:13px">No rituals yet. Schedule the first one.</div>`;
    return;
  }
  el.innerHTML = filtered.map(r => {
    const label = r.title || TYPE_LABELS[r.type] || r.type || 'Ritual';
    const when = r.scheduled_at
      ? new Date(r.scheduled_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
      : 'No date set';
    const statusCol = r.status === 'completed' ? '#16a34a' : r.status === 'cancelled' ? 'var(--red)' : 'var(--ink-2)';
    return `<div class="ritual-card" onclick="openEdit('${r.id}')">
      <div class="rc-freq">${r.frequency||''} · <span style="color:${statusCol}">${r.status||'scheduled'}</span></div>
      <div class="rc-title">${label}</div>
      <div class="rc-date">${when}</div>
      ${r.notes ? `<div class="rc-notes">${r.notes}</div>` : ''}
    </div>`;
  }).join('');
}

function openNew() {
  currentId = null;
  document.getElementById('modal-title').textContent = 'Schedule Ritual';
  document.getElementById('r-type').value = '';
  document.getElementById('r-freq').value = 'weekly';
  document.getElementById('r-title').value = '';
  document.getElementById('r-date').value = '';
  document.getElementById('r-notes').value = '';
  document.getElementById('r-status').value = 'scheduled';
  document.getElementById('r-delete-btn').style.display = 'none';
  TMIAdmin.openModal('ritual-modal');
}

function openEdit(id) {
  const r = rituals.find(x => x.id === id);
  if (!r) return;
  currentId = id;
  document.getElementById('modal-title').textContent = 'Edit Ritual';
  document.getElementById('r-type').value = r.type || '';
  document.getElementById('r-freq').value = r.frequency || 'weekly';
  document.getElementById('r-title').value = r.title || '';
  document.getElementById('r-date').value = r.scheduled_at ? r.scheduled_at.slice(0,16) : '';
  document.getElementById('r-notes').value = r.notes || '';
  document.getElementById('r-status').value = r.status || 'scheduled';
  document.getElementById('r-delete-btn').style.display = '';
  TMIAdmin.openModal('ritual-modal');
}

async function saveRitual() {
  const body = {
    type:         document.getElementById('r-type').value,
    frequency:    document.getElementById('r-freq').value,
    title:        document.getElementById('r-title').value.trim(),
    scheduled_at: document.getElementById('r-date').value
                    ? new Date(document.getElementById('r-date').value).toISOString()
                    : null,
    notes:        document.getElementById('r-notes').value.trim(),
    status:       document.getElementById('r-status').value,
  };
  const data = currentId
    ? await TMIAdmin.api('/api/fotf-rituals','PUT',{id:currentId,...body})
    : await TMIAdmin.api('/api/fotf-rituals','POST',body);
  if (!data) return;
  TMIAdmin.closeModal('ritual-modal');
  TMIAdmin.toast(currentId ? 'Updated' : 'Ritual scheduled');
  await reload();
}

async function deleteRitual() {
  if (!currentId) return;
  const ok = await TMIAdmin.confirm('Delete this ritual?');
  if (!ok) return;
  await TMIAdmin.api(`/api/fotf-rituals?id=${currentId}`,'DELETE');
  TMIAdmin.closeModal('ritual-modal');
  TMIAdmin.toast('Deleted');
  await reload();
}

async function reload() {
  rituals = await TMIAdmin.api('/api/fotf-rituals') || [];
  rituals.sort((a,b) => new Date(b.scheduled_at||0) - new Date(a.scheduled_at||0));
  document.getElementById('s-w').textContent = rituals.filter(r => r.frequency==='weekly').length;
  document.getElementById('s-m').textContent = rituals.filter(r => r.frequency==='monthly').length;
  document.getElementById('s-q').textContent = rituals.filter(r => r.frequency==='quarterly').length;
  document.getElementById('s-a').textContent = rituals.filter(r => r.frequency==='annual').length;
  renderGrid();
}

reload();
</script>
</body>
</html>
