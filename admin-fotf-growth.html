<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Growth — FOTF Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
.growth-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
.stage-bar-wrap{display:flex;flex-direction:column;gap:10px;padding:0 20px 20px;}
.stage-bar-row{display:flex;align-items:center;gap:12px;}
.stage-bar-label{font-size:12px;color:var(--ink-2);width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stage-bar-track{flex:1;height:8px;background:var(--bg);border-radius:999px;overflow:hidden;}
.stage-bar-fill{height:100%;background:var(--chart);border-radius:999px;transition:width 0.6s cubic-bezier(.2,.8,.2,1);}
.stage-bar-count{font-size:12px;color:var(--muted);width:28px;text-align:right;flex-shrink:0;}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.week-bar{width:100%;background:var(--chart);border-radius:3px 3px 0 0;min-height:2px;transition:height 0.5s cubic-bezier(.2,.8,.2,1);}
.week-label{font-size:9px;color:var(--muted);white-space:nowrap;}
.week-val{font-size:10px;font-weight:600;color:var(--ink-2);}
.sprint-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);}
.sprint-pill .dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex-shrink:0;}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="page">Growth</span>
      </div>
    </div>

    <div class="content">
      <div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat-box">
          <div class="stat-label">Total Active</div>
          <div class="stat-val" id="s-total">—</div>
          <div class="stat-delta" id="s-total-d"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">New This Month</div>
          <div class="stat-val" id="s-new">—</div>
          <div class="stat-delta" id="s-new-d"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Active Sprints</div>
          <div class="stat-val" id="s-sprints">—</div>
          <div class="stat-delta">100 Day Sprint</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Paused / Churned</div>
          <div class="stat-val" id="s-inactive">—</div>
          <div class="stat-delta" id="s-churn-d"></div>
        </div>
      </div>

      <div class="growth-grid">
        <div style="display:flex;flex-direction:column;gap:20px;">

          <!-- Member growth chart -->
          <div class="card">
            <div class="card-head">
              <span class="card-title">New Members - Last 8 Weeks</span>
            </div>
            <div class="rev-chart-wrap" id="growth-chart" style="height:200px;padding:16px 20px 0;">
              <div style="color:var(--muted);font-size:13px">Loading...</div>
            </div>
          </div>

          <!-- Recent members -->
          <div class="card">
            <div class="card-head">
              <span class="card-title">Newest Members</span>
              <a href="/admin-fotf-community" class="btn btn-ghost btn-sm">View all</a>
            </div>
            <div class="tbl-wrap">
              <table>
                <thead><tr><th>#</th><th>Name</th><th>Stage</th><th>Joined</th></tr></thead>
                <tbody id="recent-tbody">
                  <tr><td colspan="4" style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

        <div style="display:flex;flex-direction:column;gap:20px;">

          <!-- Stage breakdown -->
          <div class="card">
            <div class="card-head">
              <span class="card-title">By Stage</span>
            </div>
            <div class="stage-bar-wrap" id="stage-bars" style="padding-top:16px">
              <div style="color:var(--muted);font-size:13px">Loading...</div>
            </div>
          </div>

          <!-- Status breakdown -->
          <div class="card">
            <div class="card-head">
              <span class="card-title">Status Breakdown</span>
            </div>
            <div style="padding:16px 20px;display:flex;flex-direction:column;gap:12px" id="status-breakdown">
              <div style="color:var(--muted);font-size:13px">Loading...</div>
            </div>
          </div>

          <!-- Active sprints -->
          <div class="card">
            <div class="card-head">
              <span class="card-title">Active Sprints</span>
              <a href="/admin-fotf-community" class="btn btn-ghost btn-sm">Manage</a>
            </div>
            <div style="padding:16px 20px;display:flex;flex-direction:column;gap:8px" id="sprint-list">
              <div style="color:var(--muted);font-size:13px">Loading...</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('fotf-growth');

const STAGE_LABELS = {
  'day-one':'Day One','online-creator':'Creator','online-ecom':'E-com',
  'online-agency':'Agency','online-saas':'SaaS','trades':'Trades',
  'retail':'Retail','restaurant':'Food','not-yet':'Not Yet'
};

async function reload() {
  const members = await TMIAdmin.api('/api/fotf-members') || [];
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const active = members.filter(m => m.status === 'active');
  const newThisMonth = members.filter(m => new Date(m.created_at) >= monthStart);
  const sprinting = members.filter(m => m.sprint_active);
  const inactive = members.filter(m => m.status === 'paused' || m.status === 'churned');

  document.getElementById('s-total').textContent   = active.length;
  document.getElementById('s-new').textContent     = newThisMonth.length;
  document.getElementById('s-sprints').textContent = sprinting.length;
  document.getElementById('s-inactive').textContent= inactive.length;

  const prevMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevNew = members.filter(m => {
    const d = new Date(m.created_at);
    return d >= prevMonthStart && d < monthStart;
  }).length;
  if (prevNew > 0) {
    const delta = newThisMonth.length - prevNew;
    const el = document.getElementById('s-new-d');
    el.textContent = `${delta >= 0 ? '+' : ''}${delta} vs last month`;
    el.className = `stat-delta ${delta >= 0 ? 'pos' : 'neg'}`;
  }

  renderGrowthChart(members, now);
  renderStageBars(active);
  renderStatusBreakdown(members);
  renderSprints(sprinting);
  renderRecentMembers(members);
}

function renderGrowthChart(members, now) {
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const weekEnd = new Date(now);
    weekEnd.setDate(now.getDate() - i * 7);
    const weekStart = new Date(weekEnd);
    weekStart.setDate(weekEnd.getDate() - 7);
    const label = weekEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const count = members.filter(m => {
      const d = new Date(m.created_at);
      return d >= weekStart && d < weekEnd;
    }).length;
    weeks.push({label, count});
  }
  const max = Math.max(...weeks.map(w => w.count), 1);
  document.getElementById('growth-chart').innerHTML = weeks.map(w => {
    const pct = Math.round((w.count / max) * 160);
    return `<div class="week-col">
      <div class="week-val">${w.count || ''}</div>
      <div class="week-bar" style="height:${pct}px"></div>
      <div class="week-label">${w.label}</div>
    </div>`;
  }).join('');
}

function renderStageBars(active) {
  const counts = {};
  Object.keys(STAGE_LABELS).forEach(s => counts[s] = 0);
  active.forEach(m => { if (m.stage) counts[m.stage] = (counts[m.stage] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  const max = Math.max(...sorted.map(s => s[1]), 1);
  document.getElementById('stage-bars').innerHTML = sorted.map(([stage, count]) => `
    <div class="stage-bar-row">
      <div class="stage-bar-label">${STAGE_LABELS[stage] || stage}</div>
      <div class="stage-bar-track"><div class="stage-bar-fill" style="width:${Math.round((count/max)*100)}%"></div></div>
      <div class="stage-bar-count">${count}</div>
    </div>`).join('');
}

function renderStatusBreakdown(members) {
  const statuses = ['active','paused','churned'];
  const labels = {active:'Active',paused:'Paused',churned:'Churned'};
  const colors = {active:'#16a34a',paused:'#d97706',churned:'var(--muted)'};
  const total = members.length || 1;
  document.getElementById('status-breakdown').innerHTML = statuses.map(s => {
    const n = members.filter(m => m.status === s).length;
    const pct = Math.round((n / total) * 100);
    return `<div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;">
      <span style="color:${colors[s]};font-weight:500">${labels[s]}</span>
      <span style="color:var(--muted)">${n} <span style="font-size:11px">(${pct}%)</span></span>
    </div>`;
  }).join('');
}

function renderSprints(sprinting) {
  const el = document.getElementById('sprint-list');
  if (!sprinting.length) {
    el.innerHTML = `<div style="font-size:13px;color:var(--muted)">No active sprints.</div>`;
    return;
  }
  el.innerHTML = sprinting.slice(0,8).map(m =>
    `<div class="sprint-pill"><div class="dot"></div><span>${m.name || m.email}</span></div>`
  ).join('');
  if (sprinting.length > 8) {
    el.innerHTML += `<div style="font-size:12px;color:var(--muted);padding-top:4px">+ ${sprinting.length - 8} more</div>`;
  }
}

function renderRecentMembers(members) {
  const sorted = [...members].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0,8);
  document.getElementById('recent-tbody').innerHTML = sorted.length
    ? sorted.map(m => `<tr>
        <td class="td-muted">#${m.founder_number || '—'}</td>
        <td class="td-name">${m.name || m.email}</td>
        <td>${TMIAdmin.badge(m.stage)}</td>
        <td class="td-muted">${TMIAdmin.fmt(m.join_date || m.created_at)}</td>
      </tr>`).join('')
    : `<tr><td colspan="4" style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No members yet.</td></tr>`;
}

reload();
</script>
</body>
</html>
