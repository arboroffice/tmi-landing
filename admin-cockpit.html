<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sales Cockpit — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .ck-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:768px){.ck-stats{grid-template-columns:repeat(2,1fr);}}
  .ck-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .ck-stat .n{font-size:24px;font-weight:800;color:var(--ink);line-height:1;}
  .ck-stat .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px;}
  .ck-stat.hot .n{color:#0a7d2e;}
  .ck-sec{margin-bottom:26px;}
  .ck-sec h3{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .ck-sec h3 .ct{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg-alt,#f5f5f7);padding:2px 8px;border-radius:999px;}
  .ck-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;margin-bottom:8px;}
  @media(max-width:600px){.ck-row{grid-template-columns:40px 1fr;}.ck-row .ck-act{grid-column:1/-1;justify-content:flex-start;}}
  .ck-score{text-align:center;}
  .ck-score .v{font-size:20px;font-weight:800;color:var(--ink);line-height:1;}
  .ck-score .v.hot{color:#0a7d2e;}
  .ck-score .b{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .ck-co{font-size:15px;font-weight:600;color:var(--ink);}
  .ck-sub{font-size:12.5px;color:var(--ink-2,#505060);margin-top:2px;}
  .ck-na{font-size:12px;font-weight:600;color:#0a7d2e;margin-top:3px;}
  .ck-act{display:flex;gap:8px;align-items:center;}
  .ck-empty{color:var(--muted);font-size:13px;padding:10px 0;}
  .ck-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
</style>
<!-- OpenAI Ads pixel --><script>!function(w,d,s,u){if(w.oaiq)return;var q=function(){q.q.push(arguments)};q.q=[];w.oaiq=q;var j=d.createElement(s);j.async=1;j.src=u;var f=d.getElementsByTagName(s)[0];f.parentNode.insertBefore(j,f)}(window,document,"script","https://bzrcdn.openai.com/sdk/oaiq.min.js");oaiq("init",{pixelId:"1SVHHxEVsMKxiFJd8MnXZm",debug:false});</script>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Sales Cockpit</span></div>
    </div>
    <div class="content">
      <div class="ck-head">
        <div style="font-size:12.5px;color:var(--muted);" id="lastnote"></div>
        <button class="btn btn-sm btn-primary" id="rescore" onclick="rescore()">Re-score leads</button>
      </div>
      <div class="ck-stats" id="stats"></div>
      <div class="ck-sec"><h3>Work now <span class="ct" id="c-work"></span></h3><div id="work"><div class="ck-empty">Loading…</div></div></div>
      <div class="ck-sec"><h3>Open calls <span class="ct" id="c-calls"></span></h3><div id="calls"></div></div>
      <div class="ck-sec"><h3>Due follow-ups <span class="ct" id="c-follow"></span></h3><div id="follow"></div></div>
      <div class="ck-sec"><h3>Stalled <span class="ct" id="c-stalled"></span></h3><div id="stalled"></div></div>
      <div class="ck-sec"><h3>New intent signals <span class="ct" id="c-signals"></span></h3><div id="signals"></div></div>
    </div>
  </div>
</div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('cockpit');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tel(p){ return 'tel:'+String(p||'').replace(/[^0-9+]/g,''); }

function leadRow(l){
  const hot = (l.priority==='hot')||(l.score>=70);
  const sub = [l.owner, l.status, l.source].filter(Boolean).map(esc).join(' · ');
  const acts = [];
  if (l.phone) acts.push(`<a class="btn btn-sm" href="${tel(l.phone)}">Call</a>`);
  if (l.audit_url) acts.push(`<a class="btn btn-sm" href="${esc(l.audit_url)}" target="_blank" rel="noopener">Audit</a>`);
  acts.push(`<a class="btn btn-sm" href="/admin-leads">Open</a>`);
  return `<div class="ck-row">
    <div class="ck-score"><div class="v ${hot?'hot':''}">${l.score||0}</div><div class="b">score</div></div>
    <div><div class="ck-co">${esc(l.company||l.owner||l.email||'Lead')}</div>${sub?`<div class="ck-sub">${sub}</div>`:''}${l.next_action?`<div class="ck-na">${esc(l.next_action)}</div>`:''}</div>
    <div class="ck-act">${acts.join('')}</div>
  </div>`;
}
function callRow(t){
  return `<div class="ck-row"><div class="ck-score"><div class="v hot">!</div><div class="b">call</div></div>
    <div><div class="ck-co">${esc(t.company||'Unknown')}</div><div class="ck-sub">${esc(t.owner||'')}</div></div>
    <div class="ck-act">${t.phone?`<a class="btn btn-sm btn-primary" href="${tel(t.phone)}">${esc(t.phone)}</a>`:''}<a class="btn btn-sm" href="/admin-call-tasks">Queue</a></div></div>`;
}
function sigRow(s){
  return `<div class="ck-row"><div class="ck-score"><div class="v">${Number(s.score||0)}</div><div class="b">intent</div></div>
    <div><div class="ck-co">${esc(s.company||s.person_name||'Signal')}</div><div class="ck-sub">${esc(s.summary||s.rationale||'')}</div></div>
    <div class="ck-act"><a class="btn btn-sm" href="/admin-signals">Review</a></div></div>`;
}

async function load(){
  const d = await TMIAdmin.api('/api/sales-cockpit');
  if(!d){ document.getElementById('work').innerHTML='<div class="ck-empty">Could not load.</div>'; return; }
  const f=d.funnel||{};
  const stat=(n,l,hot)=>`<div class="ck-stat ${hot?'hot':''}"><div class="n">${n||0}</div><div class="l">${l}</div></div>`;
  document.getElementById('stats').innerHTML =
    stat(f.active,'Active') + stat(f.hot,'Hot',true) + stat(f.newLeads,'New') +
    stat(f.inSequence,'In sequence') + stat(f.replied,'Replied') + stat(f.stalled,'Stalled');
  if (f.unrouted) document.getElementById('lastnote').textContent = `${f.unrouted} leads not yet scored. Hit Re-score.`;
  const fill=(id,rows,fn,empty)=>{ document.getElementById(id).innerHTML = rows&&rows.length ? rows.map(fn).join('') : `<div class="ck-empty">${empty}</div>`; };
  fill('work', d.workNow, leadRow, 'Nothing hot right now.');
  fill('calls', d.callTasks, callRow, 'No open calls.');
  fill('follow', d.dueFollowups, leadRow, 'No follow-ups due.');
  fill('stalled', d.stalled, leadRow, 'Nothing stalled.');
  fill('signals', d.signals, sigRow, 'No new signals.');
  const setc=(id,n)=>document.getElementById(id).textContent=(n&&n.length)||0;
  setc('c-work',d.workNow); setc('c-calls',d.callTasks); setc('c-follow',d.dueFollowups); setc('c-stalled',d.stalled); setc('c-signals',d.signals);
}
async function rescore(){
  const b=document.getElementById('rescore'); b.disabled=true; b.textContent='Scoring…';
  await TMIAdmin.api('/api/sales-cockpit','POST',{action:'route'});
  setTimeout(()=>{ b.disabled=false; b.textContent='Re-score leads'; load(); }, 2500);
}
load();
</script>
</body>
</html>
