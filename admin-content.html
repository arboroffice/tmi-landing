<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Content — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Content</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="view-toggle" onclick="toggleView()">List view</button>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Article
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Content Calendar</h1>
        <span class="filter-count" id="content-count"></span>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search articles..." oninput="renderView()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderView()">
          <option value="">All statuses</option>
          <option value="idea">Idea</option>
          <option value="writing">Writing</option>
          <option value="ready">Ready</option>
          <option value="published">Published</option>
        </select>
        <select class="filter-select" id="filter-cat" onchange="renderView()">
          <option value="">All categories</option>
          <option>Operations</option>
          <option>The Trades</option>
          <option>AI &amp; Tech</option>
          <option>Finance</option>
          <option>Leadership</option>
        </select>
      </div>

      <!-- Calendar view (default) -->
      <div id="calendar-view">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:6px 0">${d}</div>`).join('')}
        </div>
        <div id="cal-grid"></div>
      </div>

      <!-- List view (hidden) -->
      <div id="list-view" style="display:none">
        <div class="card">
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th>Title</th><th>Category</th><th>Status</th><th>Publish Date</th><th>File</th><th></th>
              </tr></thead>
              <tbody id="content-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title" id="modal-title-text">Add Article</h2>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input class="form-input" id="f-title" placeholder="Article title" required/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-input" id="f-cat">
          <option value="">Uncategorized</option>
          <option>Operations</option>
          <option>The Trades</option>
          <option>AI &amp; Tech</option>
          <option>Finance</option>
          <option>Leadership</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="f-status">
          <option value="idea">Idea</option>
          <option value="writing">Writing</option>
          <option value="ready">Ready</option>
          <option value="published">Published</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Publish Date</label>
        <input class="form-input" id="f-date" type="date"/>
      </div>
      <div class="form-group">
        <label class="form-label">Filename</label>
        <input class="form-input" id="f-file" placeholder="article-slug.html"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea class="form-input" id="f-notes" rows="2" placeholder="Angle, notes..."></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('content');

let allItems = [];
let editId = null;
let calMode = true;
let calYear, calMonth;

async function loadContent() {
  allItems = await TMIAdmin.api('/api/content') || [];
  renderView();
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const cat = document.getElementById('filter-cat').value;
  return allItems.filter(i => {
    if (st && i.status !== st) return false;
    if (cat && i.category !== cat) return false;
    if (q && !i.title.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderView() {
  calMode ? renderCalendar() : renderList();
}

function renderCalendar() {
  const rows = filtered();
  document.getElementById('content-count').textContent = `${rows.length} article${rows.length !== 1 ? 's' : ''}`;

  const now = new Date();
  if (!calYear) calYear = now.getFullYear();
  if (!calMonth) calMonth = now.getMonth();

  const first = new Date(calYear, calMonth, 1);
  const last = new Date(calYear, calMonth + 1, 0);
  const startDay = first.getDay();

  // Items by date
  const byDate = {};
  rows.forEach(i => {
    if (i.publish_date) {
      const d = i.publish_date.slice(0, 10);
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(i);
    }
  });

  let html = '';
  let dayCount = 0;
  html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';

  // Empty cells for start offset
  for (let i = 0; i < startDay; i++) {
    html += `<div style="min-height:80px;background:var(--bg);border-radius:4px;padding:6px 8px"></div>`;
    dayCount++;
  }

  for (let d = 1; d <= last.getDate(); d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = dateStr === new Date().toISOString().slice(0, 10);
    const items = byDate[dateStr] || [];
    html += `
      <div style="min-height:80px;background:var(--surface);border-radius:4px;padding:6px 8px;border:1px solid ${isToday ? 'var(--ink)' : 'var(--line)'}">
        <div style="font-size:10px;color:${isToday ? 'var(--ink)' : 'var(--muted)'};font-weight:${isToday ? '700' : '400'};margin-bottom:4px">${d}</div>
        ${items.map(i => `<div class="cal-item ${i.status}" onclick="openEdit('${i.id}')" title="${i.title}">${i.title}</div>`).join('')}
        <div style="font-size:9px;color:var(--line);cursor:pointer;margin-top:2px" onclick="openAddOnDate('${dateStr}')">+</div>
      </div>
    `;
    dayCount++;
  }

  // Pad end
  while (dayCount % 7 !== 0) {
    html += `<div style="min-height:80px;background:var(--bg);border-radius:4px;padding:6px 8px"></div>`;
    dayCount++;
  }
  html += '</div>';

  const monthName = new Date(calYear, calMonth).toLocaleString('default', { month: 'long', year: 'numeric' });
  document.getElementById('cal-grid').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" onclick="calNav(-1)">&larr;</button>
      <span style="font-size:14px;font-weight:600">${monthName}</span>
      <button class="btn btn-ghost btn-sm" onclick="calNav(1)">&rarr;</button>
    </div>
    ${html}
  `;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function renderList() {
  const rows = filtered();
  document.getElementById('content-count').textContent = `${rows.length} article${rows.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('content-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">✍️</div><h3>No articles</h3><p>Add your first article idea above.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(i => `
    <tr onclick="openEdit('${i.id}')">
      <td class="td-name">${i.title}</td>
      <td class="td-muted">${i.category || '-'}</td>
      <td>${TMIAdmin.badge(i.status)}</td>
      <td class="td-muted">${i.publish_date ? TMIAdmin.fmt(i.publish_date) : '-'}</td>
      <td>${i.filename ? `<a href="${i.filename}" target="_blank" style="color:var(--blue);font-size:12px">${i.filename}</a>` : '<span class="td-muted">-</span>'}</td>
      <td class="td-action">
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEdit('${i.id}')">Edit</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red);margin-left:4px" onclick="event.stopPropagation();deleteItem('${i.id}')">Del</button>
      </td>
    </tr>
  `).join('');
}

function toggleView() {
  calMode = !calMode;
  document.getElementById('calendar-view').style.display = calMode ? '' : 'none';
  document.getElementById('list-view').style.display = calMode ? 'none' : '';
  document.getElementById('view-toggle').textContent = calMode ? 'List view' : 'Calendar view';
  renderView();
}

function openAddModal() {
  editId = null;
  document.getElementById('modal-title-text').textContent = 'Add Article';
  ['f-title','f-date','f-file','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-cat').value = '';
  document.getElementById('f-status').value = 'idea';
  document.getElementById('add-modal').classList.add('open');
}

function openAddOnDate(dateStr) {
  openAddModal();
  document.getElementById('f-date').value = dateStr;
  document.getElementById('f-status').value = 'writing';
}

function openEdit(id) {
  const item = allItems.find(i => i.id === id);
  if (!item) return;
  editId = id;
  document.getElementById('modal-title-text').textContent = 'Edit Article';
  document.getElementById('f-title').value = item.title;
  document.getElementById('f-cat').value = item.category || '';
  document.getElementById('f-status').value = item.status;
  document.getElementById('f-date').value = item.publish_date || '';
  document.getElementById('f-file').value = item.filename || '';
  document.getElementById('f-notes').value = item.notes || '';
  document.getElementById('add-modal').classList.add('open');
}

function closeModal() { document.getElementById('add-modal').classList.remove('open'); editId = null; }

async function saveItem() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { TMIAdmin.toast('Title required', 'error'); return; }
  const payload = {
    title,
    category: document.getElementById('f-cat').value || null,
    status: document.getElementById('f-status').value,
    publish_date: document.getElementById('f-date').value || null,
    filename: document.getElementById('f-file').value || null,
    notes: document.getElementById('f-notes').value || null,
  };
  if (editId) payload.id = editId;
  const method = editId ? 'PUT' : 'POST';
  const res = await TMIAdmin.api('/api/content', method, payload);
  if (res) {
    TMIAdmin.toast(editId ? 'Article updated' : 'Article added');
    closeModal();
    await loadContent();
  }
}

async function deleteItem(id) {
  const ok = await TMIAdmin.confirm('Delete this article?', false);
  if (!ok) return;
  const res = await TMIAdmin.api('/api/content', 'DELETE', { id });
  if (res) { TMIAdmin.toast('Deleted'); await loadContent(); }
}

loadContent();
</script>
</body>
</html>
