<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Leads — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .view-toggle{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:2px;}
  .view-toggle button{background:none;border:none;padding:5px 10px;border-radius:4px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:background 0.12s,color 0.12s;line-height:1;}
  .view-toggle button svg{width:13px;height:13px;}
  .view-toggle button.active{background:var(--chart);color:var(--ink);}
  .view-toggle button:not(.active):hover{background:var(--surface);color:var(--ink);}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Leads</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Lead
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Leads</h1>
        <div class="sec-head-right">
          <span class="filter-count" id="lead-count"></span>
          <div class="view-toggle">
            <button id="btn-table-view" class="active" onclick="setView('table')" title="Table view">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="11" width="18" height="3" rx="1"/><rect x="3" y="17" width="18" height="3" rx="1"/></svg>
              Table
            </button>
            <button id="btn-board-view" onclick="setView('board')" title="Board view">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="18" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
              Board
            </button>
          </div>
        </div>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, email, company..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderTable()">
          <option value="">All statuses</option>
          <option>new</option><option>contacted</option><option>qualified</option>
          <option>proposal</option><option>won</option><option>lost</option>
        </select>
        <select class="filter-select" id="filter-source" onchange="renderTable()">
          <option value="">All sources</option>
        </select>
        <select class="filter-select" id="filter-audience" onchange="renderTable()">
          <option value="">All audiences</option>
          <option value="physical">Physical</option>
          <option value="online">Online</option>
          <option value="fotf">FOTF</option>
        </select>
      </div>

      <!-- Table view -->
      <div class="card" id="table-view">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Name</th><th>Company</th><th>Email</th><th>Audience</th><th>Niche</th>
              <th>Source</th><th>Status</th><th>Value</th><th>Added</th>
            </tr></thead>
            <tbody id="leads-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Board view -->
      <div id="board-view" style="display:none;">
        <div class="kanban" id="kanban-board"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="lead-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title" id="modal-title">Add Lead</h2>
      <button class="modal-x" onclick="TMIAdmin.closeModal('lead-modal')">&times;</button>
    </div>
    <input type="hidden" id="edit-id"/>
    <div class="form-row">
      <div class="form-group"><label class="form-label">First Name *</label><input class="form-input" id="f-first" placeholder="First"/></div>
      <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" id="f-last" placeholder="Last"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" type="email" placeholder="email@company.com"/></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="f-phone" placeholder="+1 555 000 0000"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Company</label><input class="form-input" id="f-company" placeholder="Company name"/></div>
      <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="f-title" placeholder="Job title"/></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select class="form-input" id="f-audience" onchange="onAudienceChange()">
          <option value="">Select audience</option>
          <option value="physical">Physical</option>
          <option value="online">Online</option>
          <option value="fotf">FOTF</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Niche</label>
        <select class="form-input" id="f-niche"><option value="">Select niche</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="f-status">
          <option value="new">New</option><option value="contacted">Contacted</option>
          <option value="qualified">Qualified</option><option value="proposal">Proposal</option>
          <option value="won">Won</option><option value="lost">Lost</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Source</label>
        <select class="form-input" id="f-source"><option value="">Select source</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Deal Value ($)</label><input class="form-input" id="f-value" type="number" placeholder="0"/></div>
      <div class="form-group"><label class="form-label">Owner</label><input class="form-input" id="f-owner" placeholder="e.g. Mia"/></div>
    </div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="f-notes" rows="3"></textarea></div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="TMIAdmin.closeModal('lead-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveLead()">Save Lead</button>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="lead-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('lead-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-name">—</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" id="panel-edit-btn" onclick="editFromPanel()">Edit</button>
        <button class="btn btn-danger btn-sm" id="panel-del-btn" onclick="deleteFromPanel()">Delete</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Status</div><div class="detail-val" id="pd-status">—</div></div>
        <div class="detail-item"><div class="detail-label">Source</div><div class="detail-val" id="pd-source">—</div></div>
        <div class="detail-item"><div class="detail-label">Email</div><div class="detail-val" id="pd-email">—</div></div>
        <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-val" id="pd-phone">—</div></div>
        <div class="detail-item"><div class="detail-label">Company</div><div class="detail-val" id="pd-company">—</div></div>
        <div class="detail-item"><div class="detail-label">Title</div><div class="detail-val" id="pd-title">—</div></div>
        <div class="detail-item"><div class="detail-label">Audience</div><div class="detail-val" id="pd-audience">—</div></div>
        <div class="detail-item"><div class="detail-label">Niche</div><div class="detail-val" id="pd-niche">—</div></div>
        <div class="detail-item"><div class="detail-label">Deal Value</div><div class="detail-val" id="pd-value">—</div></div>
        <div class="detail-item"><div class="detail-label">Owner</div><div class="detail-val" id="pd-owner">—</div></div>
        <div class="detail-item"><div class="detail-label">Added</div><div class="detail-val" id="pd-created">—</div></div>
        <div class="detail-item"><div class="detail-label">Last Contact</div><div class="detail-val" id="pd-last">—</div></div>
      </div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Notes</div>
      <div id="pd-notes" style="font-size:14px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;">—</div>
      <div class="panel-sep"></div>
      <button class="btn btn-primary btn-sm" onclick="convertToClient()" id="convert-btn">Convert to Client &rarr;</button>
      <div class="panel-sep"></div>
      <div class="panel-sec-label" style="margin-bottom:12px">Account 360</div>
      <div id="account-360" style="font-size:13px;color:var(--ink-2);">Loading…</div>
      <div class="panel-sep"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="panel-sec-label" style="margin:0">Activity</div>
        <button class="btn btn-ghost btn-sm" onclick="logLeadActivity()">+ Log</button>
      </div>
      <div id="lead-activity-feed"></div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('leads');

let allLeads = [];
let currentLead = null;
let viewMode = 'table';

const KANBAN_STAGES = [
  { key: 'new',       label: 'New' },
  { key: 'contacted', label: 'Contacted' },
  { key: 'qualified', label: 'Qualified' },
  { key: 'proposal',  label: 'Proposal' },
  { key: 'won',       label: 'Won' },
  { key: 'lost',      label: 'Lost' },
];

// Populate source filter and modal select
const SOURCES = TMIAdmin.sources;
SOURCES.forEach(s => {
  document.getElementById('filter-source').innerHTML += `<option>${s}</option>`;
  document.getElementById('f-source').innerHTML += `<option>${s}</option>`;
});

function setView(mode) {
  viewMode = mode;
  document.getElementById('table-view').style.display = mode === 'table' ? '' : 'none';
  document.getElementById('board-view').style.display = mode === 'board' ? '' : 'none';
  document.getElementById('btn-table-view').classList.toggle('active', mode === 'table');
  document.getElementById('btn-board-view').classList.toggle('active', mode === 'board');
  renderTable();
}

function onAudienceChange() {
  const aud = document.getElementById('f-audience').value;
  const niches = aud ? TMIAdmin.niches[aud] : [...TMIAdmin.niches.physical, ...TMIAdmin.niches.online, ...TMIAdmin.niches.fotf];
  const sel = document.getElementById('f-niche');
  sel.innerHTML = `<option value="">Select niche</option>` + (niches || []).map(n => `<option>${n}</option>`).join('');
}

async function loadLeads() {
  const data = await TMIAdmin.api('/api/leads');
  if (data) { allLeads = data; renderTable(); }
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const src = document.getElementById('filter-source').value;
  const aud = document.getElementById('filter-audience').value;

  return allLeads.filter(l => {
    const c = l.contacts || {};
    const name = [c.first_name, c.last_name, c.email, c.company].filter(Boolean).join(' ').toLowerCase();
    if (q && !name.includes(q)) return false;
    if (st && l.status !== st) return false;
    if (src && l.source !== src) return false;
    if (aud && c.audience !== aud) return false;
    return true;
  });
}

function renderTable() {
  const filtered = getFiltered();

  document.getElementById('lead-count').textContent = `${filtered.length} lead${filtered.length !== 1 ? 's' : ''}`;

  if (viewMode === 'table') {
    renderTableView(filtered);
  } else {
    renderBoardView(filtered);
  }
}

function renderTableView(filtered) {
  const tbody = document.getElementById('leads-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty-state"><div class="empty-icon">📋</div><h3>No leads found</h3><p>Try adjusting your filters or add a new lead.</p></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(l => {
    const c = l.contacts || {};
    const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || '—';
    return `<tr onclick="openPanel(${JSON.stringify(l).replace(/"/g,'&quot;')})">
      <td class="td-name">${name}</td>
      <td>${c.company || '—'}</td>
      <td style="color:var(--ink-2)">${c.email || '—'}</td>
      <td>${c.audience ? TMIAdmin.badge(c.audience) : '—'}</td>
      <td class="td-muted">${c.niche || '—'}</td>
      <td class="td-muted">${l.source || '—'}</td>
      <td>${TMIAdmin.badge(l.status)}</td>
      <td class="td-muted">${l.value ? TMIAdmin.currency(l.value) : '—'}</td>
      <td class="td-muted">${TMIAdmin.fmt(l.created_at)}</td>
    </tr>`;
  }).join('');
}

function renderBoardView(filtered) {
  const board = document.getElementById('kanban-board');

  // Group leads by stage
  const byStage = {};
  KANBAN_STAGES.forEach(s => { byStage[s.key] = []; });
  filtered.forEach(l => {
    const key = l.status && byStage[l.status] !== undefined ? l.status : 'new';
    byStage[key].push(l);
  });

  board.innerHTML = KANBAN_STAGES.map(stage => {
    const leads = byStage[stage.key];
    const cards = leads.length
      ? leads.map(l => {
          const c = l.contacts || {};
          const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || '—';
          const company = c.company ? `<div class="kanban-card-meta">${c.company}</div>` : '';
          const val = l.value ? `<div class="kanban-card-val">${TMIAdmin.currency(l.value)}</div>` : '';
          const data = JSON.stringify(l).replace(/"/g, '&quot;');
          return `<div class="kanban-card" onclick="openPanel(${data})">
            <div class="kanban-card-name">${name}</div>
            ${company}
            ${val}
          </div>`;
        }).join('')
      : `<div style="padding:8px 2px;font-size:12px;color:var(--muted);text-align:center;">No leads</div>`;

    return `<div class="kanban-col">
      <div class="kanban-col-head">
        <span class="kanban-col-title">${stage.label}</span>
        <span class="kanban-count">${leads.length}</span>
      </div>
      <div class="kanban-cards">${cards}</div>
    </div>`;
  }).join('');
}

function openPanel(lead) {
  currentLead = lead;
  const c = lead.contacts || {};
  const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || '—';
  document.getElementById('panel-name').textContent = name;
  document.getElementById('pd-status').innerHTML = TMIAdmin.badge(lead.status);
  document.getElementById('pd-source').textContent = lead.source || '—';
  document.getElementById('pd-email').innerHTML = c.email ? `<a href="mailto:${c.email}" style="color:var(--blue)">${c.email}</a>` : '—';
  document.getElementById('pd-phone').textContent = c.phone || '—';
  document.getElementById('pd-company').textContent = c.company || '—';
  document.getElementById('pd-title').textContent = c.title || '—';
  document.getElementById('pd-audience').innerHTML = c.audience ? TMIAdmin.badge(c.audience) : '—';
  document.getElementById('pd-niche').textContent = c.niche || '—';
  document.getElementById('pd-value').textContent = lead.value ? TMIAdmin.currency(lead.value) : '—';
  document.getElementById('pd-owner').textContent = lead.owner || '—';
  document.getElementById('pd-created').textContent = TMIAdmin.fmt(lead.created_at);
  document.getElementById('pd-last').textContent = TMIAdmin.fmt(lead.last_contact);
  document.getElementById('pd-notes').textContent = [lead.notes, c.notes].filter(Boolean).join('\n\n') || '—';
  document.getElementById('lead-activity-feed').innerHTML = '';
  TMIAdmin.openPanel('lead-panel');
  if (lead.contact_id) TMIAdmin.renderActivityPanel(lead.contact_id, 'lead-activity-feed');
  loadAccount360(lead);
}

// Account 360 — pull the full picture for this person (audit answers + results,
// booking, follow-ups, and every email/SMS) from /api/account and render it.
async function loadAccount360(lead) {
  const box = document.getElementById('account-360');
  if (!box) return;
  box.innerHTML = 'Loading…';
  const data = await TMIAdmin.api(`/api/account?leadId=${lead.id}`);
  if (!data) { box.innerHTML = '<span style="color:var(--muted)">Could not load account.</span>'; return; }

  const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, m => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m]));
  const fmt = t => t ? TMIAdmin.fmt(t) : '—';
  const c = data.counts || {};

  // Summary chips
  const chips = [
    `${c.audits || 0} audit${c.audits === 1 ? '' : 's'}`,
    data.booking && data.booking.booked ? 'Booked ✓' : 'Not booked',
    `${c.followups || 0} follow-ups`,
    `${c.emails || 0} emails`,
    `${c.sms || 0} SMS`,
  ].map(t => `<span style="display:inline-block;padding:3px 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:11px;margin:0 6px 6px 0;color:var(--ink-2)">${t}</span>`).join('');

  // Latest audit: results headline + raw answers
  let auditHtml = '<div style="color:var(--muted);font-size:12px">No audit submitted.</div>';
  const audit = (data.audits || [])[0];
  if (audit) {
    const ANS = audit.answers && typeof audit.answers === 'object' ? audit.answers : {};
    const rows = Object.keys(ANS).map(k =>
      `<tr><td style="padding:3px 8px;color:var(--muted);vertical-align:top;white-space:nowrap">${esc(k)}</td><td style="padding:3px 8px;color:var(--ink)">${esc(ANS[k])}</td></tr>`).join('');
    auditHtml = `
      <div style="margin-bottom:8px">
        <strong>${esc(audit.tier || '—')}</strong> ·
        ${typeof audit.dep_pct === 'number' ? audit.dep_pct + '% dependency' : '—'} ·
        ${esc(audit.industry || '—')} ·
        <span style="color:var(--muted)">${fmt(audit.created_at)}</span>
      </div>
      <details><summary style="cursor:pointer;color:var(--blue);font-size:12px">Raw answers (${Object.keys(ANS).length})</summary>
        <table style="margin-top:6px;border-collapse:collapse;font-size:12px;width:100%"><tbody>${rows || '<tr><td style="color:var(--muted)">No answers recorded.</td></tr>'}</tbody></table>
      </details>`;
  }

  // Booking
  const b = data.booking || {};
  const bookingHtml = b.booked
    ? `Booked ${b.booked_at ? 'on ' + fmt(b.booked_at) : ''} · status <strong>${esc(b.status || '')}</strong>`
    : `<span style="color:var(--muted)">No call booked. Current status: ${esc(b.status || '—')}</span>`;

  // Communications + follow-up timeline
  const tl = (data.timeline || []).slice(0, 40);
  const icon = { email: '✉️', sms: '💬', activity: '•', followup: '⏰' };
  const tlHtml = tl.length ? tl.map(e => `
    <div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)">
      <span style="flex:none">${icon[e.kind] || '•'}</span>
      <div style="flex:1;min-width:0">
        <div style="color:var(--ink)">${esc(e.title)}</div>
        <div style="color:var(--muted);font-size:11px">${esc(e.kind)}${e.detail ? ' · ' + esc(e.detail) : ''} · ${fmt(e.at)}</div>
      </div>
    </div>`).join('') : '<div style="color:var(--muted);font-size:12px">No communications logged yet.</div>';

  const sec = (label, inner) => `<div style="margin-bottom:14px"><div class="panel-sec-label" style="margin-bottom:6px">${label}</div>${inner}</div>`;

  box.innerHTML =
    `<div style="margin-bottom:12px">${chips}</div>` +
    sec('Audit', auditHtml) +
    sec('Booking', bookingHtml) +
    sec('Communications &amp; follow-ups', tlHtml);
}

async function logLeadActivity() {
  if (!currentLead?.contact_id) return;
  const type = prompt('Type (call / email / note / meeting):', 'note');
  if (!type) return;
  const title = prompt('Summary:');
  if (!title) return;
  const body = prompt('Details (optional):') || '';
  await TMIAdmin.logActivity(currentLead.contact_id, type, title, body);
  TMIAdmin.toast('Activity logged');
  TMIAdmin.renderActivityPanel(currentLead.contact_id, 'lead-activity-feed');
}

function openAddModal() {
  document.getElementById('edit-id').value = '';
  document.getElementById('modal-title').textContent = 'Add Lead';
  document.getElementById('save-btn').textContent = 'Save Lead';
  ['first','last','email','phone','company','title','notes','value','owner'].forEach(f => {
    document.getElementById('f-' + f).value = '';
  });
  document.getElementById('f-status').value = 'new';
  document.getElementById('f-audience').value = '';
  document.getElementById('f-source').value = '';
  onAudienceChange();
  TMIAdmin.openModal('lead-modal');
}

function editFromPanel() {
  if (!currentLead) return;
  const l = currentLead;
  const c = l.contacts || {};
  TMIAdmin.closePanel('lead-panel');
  document.getElementById('edit-id').value = l.id;
  document.getElementById('modal-title').textContent = 'Edit Lead';
  document.getElementById('save-btn').textContent = 'Update Lead';
  document.getElementById('f-first').value = c.first_name || '';
  document.getElementById('f-last').value = c.last_name || '';
  document.getElementById('f-email').value = c.email || '';
  document.getElementById('f-phone').value = c.phone || '';
  document.getElementById('f-company').value = c.company || '';
  document.getElementById('f-title').value = c.title || '';
  document.getElementById('f-audience').value = c.audience || '';
  onAudienceChange();
  setTimeout(() => { document.getElementById('f-niche').value = c.niche || ''; }, 50);
  document.getElementById('f-status').value = l.status || 'new';
  document.getElementById('f-source').value = l.source || '';
  document.getElementById('f-value').value = l.value || '';
  document.getElementById('f-owner').value = l.owner || '';
  document.getElementById('f-notes').value = l.notes || '';
  TMIAdmin.openModal('lead-modal');
}

async function saveLead() {
  const id = document.getElementById('edit-id').value;
  const firstName = document.getElementById('f-first').value.trim();
  if (!firstName) { TMIAdmin.toast('First name is required', 'error'); return; }

  const payload = {
    contact: {
      first_name: firstName,
      last_name: document.getElementById('f-last').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      company: document.getElementById('f-company').value.trim(),
      title: document.getElementById('f-title').value.trim(),
      audience: document.getElementById('f-audience').value,
      niche: document.getElementById('f-niche').value
    },
    lead: {
      status: document.getElementById('f-status').value,
      source: document.getElementById('f-source').value,
      value: parseFloat(document.getElementById('f-value').value) || null,
      owner: document.getElementById('f-owner').value.trim(),
      notes: document.getElementById('f-notes').value.trim()
    }
  };

  if (id) payload.lead.id = id;

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving...';

  const res = await TMIAdmin.api('/api/leads', id ? 'PUT' : 'POST', payload);
  btn.disabled = false; btn.textContent = id ? 'Update Lead' : 'Save Lead';

  if (res) {
    TMIAdmin.toast(id ? 'Lead updated' : 'Lead added');
    TMIAdmin.closeModal('lead-modal');
    await loadLeads();
  }
}

async function deleteFromPanel() {
  if (!currentLead) return;
  const ok = await TMIAdmin.confirm('Delete this lead? This cannot be undone.');
  if (!ok) return;
  const res = await TMIAdmin.api(`/api/leads?id=${currentLead.id}`, 'DELETE');
  if (res) {
    TMIAdmin.toast('Lead deleted');
    TMIAdmin.closePanel('lead-panel');
    await loadLeads();
  }
}

async function convertToClient() {
  if (!currentLead) return;
  const ok = await TMIAdmin.confirm('Convert this lead to a client?', false);
  if (!ok) return;
  const res = await TMIAdmin.api('/api/clients', 'POST', {
    contact_id: currentLead.contact_id,
    status: 'active',
    notes: currentLead.notes
  });
  if (res) {
    TMIAdmin.toast('Converted to client!');
    TMIAdmin.closePanel('lead-panel');
    // Update lead status to won
    await TMIAdmin.api('/api/leads', 'PUT', {
      lead: { id: currentLead.id, status: 'won' },
      contact: { first_name: (currentLead.contacts || {}).first_name || 'Lead' }
    });
    await loadLeads();
  }
}

function exportCSV() {
  const filtered = getFiltered();
  const headers = ['Name','Email','Company','Status','Source','Added'];
  const rows = filtered.map(l => {
    const c = l.contacts || {};
    const name = [c.first_name, c.last_name].filter(Boolean).join(' ');
    return [
      name,
      c.email || '',
      c.company || '',
      l.status || '',
      l.source || '',
      l.created_at ? new Date(l.created_at).toLocaleDateString() : ''
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
  });
  const csv = [headers.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  a.href = url; a.download = `leads-${date}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

loadLeads();
