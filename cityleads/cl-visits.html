<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Visits Log | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.visits-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.visit-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;}
.visit-stat-val{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);line-height:1;}
.visit-stat-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;}

.date-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:16px;}
.date-chips::-webkit-scrollbar{display:none;}
.date-chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:500;cursor:pointer;background:none;color:var(--ink-2);transition:all 0.12s;min-height:40px;white-space:nowrap;}
.date-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.tl-list .tl-item .tl-dot.walkin{background:var(--chart);border-color:var(--chart);}
.tl-list .tl-item .tl-dot.coffee{background:var(--amber);border-color:var(--amber);}
.tl-list .tl-item .tl-dot.call{background:var(--blue);border-color:var(--blue);}
.tl-list .tl-item .tl-dot.text{background:var(--purple);border-color:var(--purple);}
.tl-list .tl-item .tl-dot.email{background:var(--muted);border-color:var(--muted);}

.visit-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow 0.15s;}
.visit-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.08);}
.visit-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.visit-type-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.visit-type-dot.walkin{background:var(--chart);}
.visit-type-dot.coffee{background:var(--amber);}
.visit-type-dot.call{background:var(--blue);}
.visit-type-dot.text{background:var(--purple);}
.visit-type-dot.email{background:var(--muted);}
.visit-biz-name{font-size:14px;font-weight:600;color:var(--ink);flex:1;}
.visit-time{font-size:11px;color:var(--muted);flex-shrink:0;white-space:nowrap;}
.visit-note-excerpt{font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.visit-footer{display:flex;align-items:center;gap:10px;}
.visit-type-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
.visit-photos{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.visit-photos svg{width:11px;height:11px;}

.day-header{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:16px 0 8px;display:flex;align-items:center;gap:8px;}
.day-header::after{content:'';flex:1;height:1px;background:var(--line);}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Visits Log</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="location.href='cl-quick-capture.html'">+ Log Visit</button>
      </div>
    </div>

    <div class="content">

      <!-- Stats strip -->
      <div class="visits-stats">
        <div class="visit-stat">
          <div class="visit-stat-val" id="stat-week">11</div>
          <div class="visit-stat-label">This Week</div>
        </div>
        <div class="visit-stat">
          <div class="visit-stat-val" id="stat-month">43</div>
          <div class="visit-stat-label">This Month</div>
        </div>
        <div class="visit-stat">
          <div class="visit-stat-val" id="stat-total">218</div>
          <div class="visit-stat-label">All Time</div>
        </div>
      </div>

      <!-- Date filter chips -->
      <div class="date-chips">
        <button class="date-chip active" data-range="week" onclick="filterRange(this)">This Week</button>
        <button class="date-chip" data-range="month" onclick="filterRange(this)">This Month</button>
        <button class="date-chip" data-range="all" onclick="filterRange(this)">All Time</button>
      </div>

      <!-- Business search -->
      <div class="filter-bar" style="margin-bottom:20px;">
        <div class="filter-row">
          <div class="search-wrap" style="flex:1;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Filter by business..." oninput="filterVisits(this.value)" style="width:100%;"/>
          </div>
          <select class="filter-select" id="type-filter" onchange="filterVisits('')">
            <option value="">All types</option>
            <option value="Walk-in">Walk-in</option>
            <option value="Coffee">Coffee</option>
            <option value="Call">Call</option>
            <option value="Text">Text</option>
            <option value="Email">Email</option>
          </select>
        </div>
      </div>

      <!-- Visit list -->
      <div id="visit-list"></div>

    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-visits');

const VISITS = [
  { id:1, biz:'Apex HVAC',           type:'Walk-in',  date:'2026-05-17', time:'10:24 AM', notes:'Spoke with the owner, Mike. He\'s been frustrated with their current scheduling software. Said they lose about 3 hrs/week on admin. Warm lead.', photos:2, tags:['Hot lead'] },
  { id:2, biz:'Travis Electric',     type:'Coffee',   date:'2026-05-17', time:'8:45 AM',  notes:'Had coffee with Sarah, office manager. She was open about the pain points — field crews never update job status. Ready to schedule an audit.', photos:0, tags:['Ready to close'] },
  { id:3, biz:'Silverline Roofing',  type:'Walk-in',  date:'2026-05-16', time:'2:10 PM',  notes:'Owner was out. Left card with the front desk, asked them to pass it along. Will follow up by end of week.', photos:1, tags:['Follow up needed'] },
  { id:4, biz:'Cedar Park Plumbing', type:'Call',     date:'2026-05-16', time:'11:30 AM', notes:'Quick call — owner confirmed he received my card. Said he\'s open to a conversation next Tuesday. Scheduled.', photos:0, tags:[] },
  { id:5, biz:'Lone Star Concrete',  type:'Walk-in',  date:'2026-05-15', time:'3:45 PM',  notes:'Met with Diego, the operations lead. He mentioned they\'re scaling from 4 crews to 8 this year. Big opportunity.', photos:3, tags:['Hot lead', 'Ask for referral'] },
  { id:6, biz:'Hill Country HVAC',   type:'Text',     date:'2026-05-15', time:'1:00 PM',  notes:'Texted owner re: audit follow-up. He confirmed they\'re ready to book. Sent calendar link.', photos:0, tags:['Ready to close'] },
  { id:7, biz:'Austin Painting Co',  type:'Email',    date:'2026-05-14', time:'9:15 AM',  notes:'Sent intro email with TMI overview deck. Asked for a 15-min call.', photos:0, tags:[] },
  { id:8, biz:'Capital Landscaping', type:'Walk-in',  date:'2026-05-13', time:'4:30 PM',  notes:'Dropped in, receptionist said owner is usually in Thursdays. Will try again.', photos:0, tags:[] },
  { id:9, biz:'Apex HVAC',           type:'Call',     date:'2026-05-13', time:'2:00 PM',  notes:'Follow-up call after first visit. Mike has 2 other decision makers he wants to loop in. Will arrange group meeting.', photos:0, tags:['Follow up needed'] },
  { id:10,biz:'Travis Electric',     type:'Walk-in',  date:'2026-05-12', time:'11:00 AM', notes:'Second visit. Met the owner (James) this time. He runs a 12-person shop. Really interested in field tracking.', photos:2, tags:['Hot lead'] },
];

let currentRange = 'week';
let searchQuery = '';

function typeClass(type) {
  return type.toLowerCase().replace(/[^a-z]/g,'');
}

function filterRange(btn) {
  document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  currentRange = btn.dataset.range;
  renderVisits();
}

function filterVisits(val) {
  searchQuery = val.toLowerCase();
  renderVisits();
}

function groupByDate(visits) {
  const groups = {};
  visits.forEach(v => {
    if (!groups[v.date]) groups[v.date] = [];
    groups[v.date].push(v);
  });
  return groups;
}

function friendlyDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const now = new Date();
  const today = now.toDateString();
  const yesterday = new Date(now - 86400000).toDateString();
  if (d.toDateString() === today) return 'Today';
  if (d.toDateString() === yesterday) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}

function renderVisits() {
  const typeFilter = document.getElementById('type-filter').value;
  let filtered = VISITS.filter(v => {
    if (searchQuery && !v.biz.toLowerCase().includes(searchQuery)) return false;
    if (typeFilter && v.type !== typeFilter) return false;
    return true;
  });
  const groups = groupByDate(filtered);
  const dates = Object.keys(groups).sort().reverse();
  const list = document.getElementById('visit-list');
  if (!dates.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">👟</div><h3>No visits yet</h3><p>Log your first visit to get started.</p><a href="cl-quick-capture.html" class="btn btn-primary">Log a Visit</a></div>`;
    return;
  }
  list.innerHTML = dates.map(date => `
    <div class="day-header">${friendlyDate(date)}</div>
    ${groups[date].map(v => {
      const tc = typeClass(v.type);
      const tagsHtml = v.tags.length ? v.tags.map(t => `<span style="display:inline-flex;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600;background:${t==='Hot lead'?'#fee2e2':t==='Ready to close'?'#dcfce7':'#fef9c3'};color:${t==='Hot lead'?'#b91c1c':t==='Ready to close'?'#15803d':'#854d0e'}">${t}</span>`).join(' ') : '';
      const photosHtml = v.photos ? `<span class="visit-photos"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke-linecap="round"/><circle cx="12" cy="13" r="4"/></svg>${v.photos} photo${v.photos>1?'s':''}</span>` : '';
      return `
        <div class="visit-card" onclick="CL.toast('Opening ${v.biz}...')">
          <div class="visit-card-top">
            <div class="visit-type-dot ${tc}"></div>
            <div class="visit-biz-name">${v.biz}</div>
            <div class="visit-time">${v.time}</div>
          </div>
          <div class="visit-note-excerpt">${v.notes}</div>
          <div class="visit-footer">
            <span class="visit-type-label">${v.type}</span>
            ${photosHtml}
            ${tagsHtml}
          </div>
        </div>`;
    }).join('')}`).join('');
}

renderVisits();
</script>
</body>
</html>
