<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Recorder | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.rec-hero{display:flex;flex-direction:column;align-items:center;padding:32px 0 24px;gap:12px;}
.rec-btn{width:96px;height:96px;border-radius:50%;border:none;background:var(--ink);color:var(--chart);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.15s,background 0.15s;box-shadow:0 4px 24px rgba(0,0,0,0.18);}
.rec-btn:hover{transform:scale(1.05);}
.rec-btn.recording{background:#e53e3e;animation:rec-pulse 1.2s infinite;}
.rec-btn svg{width:36px;height:36px;}
@keyframes rec-pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,0.4);}50%{box-shadow:0 0 0 18px rgba(229,62,62,0);}}
.rec-timer{font-size:32px;font-weight:700;letter-spacing:0.06em;color:var(--ink);font-variant-numeric:tabular-nums;}
.rec-status{font-size:13px;color:var(--muted);}
.rec-waveform{height:48px;display:flex;align-items:center;gap:2px;margin:0 auto;opacity:0;transition:opacity 0.3s;}
.rec-waveform.active{opacity:1;}
.rec-bar{width:4px;border-radius:2px;background:var(--ink);animation:wave 0.8s ease-in-out infinite;}
.rec-bar:nth-child(2){animation-delay:0.1s;}.rec-bar:nth-child(3){animation-delay:0.2s;}.rec-bar:nth-child(4){animation-delay:0.3s;}.rec-bar:nth-child(5){animation-delay:0.4s;}.rec-bar:nth-child(6){animation-delay:0.3s;}.rec-bar:nth-child(7){animation-delay:0.2s;}.rec-bar:nth-child(8){animation-delay:0.1s;}
@keyframes wave{0%,100%{height:8px;}50%{height:36px;}}
.rec-controls{display:flex;gap:12px;margin-top:8px;}
.rec-action{padding:10px 20px;border-radius:999px;border:1px solid var(--line-strong);background:none;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all 0.12s;min-height:44px;}
.rec-action:hover{background:var(--bg);color:var(--ink);}
.rec-action.primary{background:var(--ink);color:var(--chart);border-color:var(--ink);}

.rec-biz-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;cursor:pointer;transition:border-color 0.15s;}
.rec-biz-row:hover{border-color:var(--ink-2);}
.rec-biz-row svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
.rec-biz-label{flex:1;font-size:14px;color:var(--muted);}
.rec-biz-label.set{color:var(--ink);font-weight:600;}

.ai-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:none;}
.ai-panel.show{display:block;}
.ai-panel-title{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.score-label{font-size:13px;color:var(--ink-2);flex:1;}
.score-bar-wrap{width:100px;height:6px;background:var(--line-strong);border-radius:3px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:3px;background:var(--ink);transition:width 0.6s ease;}
.score-num{font-size:13px;font-weight:700;color:var(--ink);width:24px;text-align:right;}
.overall-score{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg);border-radius:var(--r-sm);margin-bottom:16px;}
.overall-num{font-size:40px;font-weight:800;color:var(--ink);line-height:1;}
.overall-label{font-size:13px;color:var(--ink-2);font-weight:500;}
.overall-grade{font-size:11px;color:var(--muted);margin-top:2px;}
.ai-summary{font-size:14px;color:var(--ink-2);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.ai-next-action{background:var(--bg-dark);color:var(--chart);border-radius:var(--r-sm);padding:12px 16px;font-size:13px;font-weight:600;margin-top:12px;line-height:1.5;}

.transcript-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;font-size:13px;color:var(--ink-2);line-height:1.7;max-height:200px;overflow-y:auto;margin-top:12px;display:none;}
.transcript-box.show{display:block;}

.push-row{display:flex;gap:10px;margin-top:16px;}
.push-row .btn{flex:1;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Recorder</span>
      </div>
    </div>

    <div class="page-content">
      <div class="content-inner">

        <!-- Business selector -->
        <div class="rec-biz-row" onclick="openBizPicker()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="rec-biz-label" id="biz-label">Tap to link a business</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7" style="width:14px;height:14px"><polyline points="9 18 15 12 9 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>

        <!-- Recorder -->
        <div class="rec-hero">
          <div class="rec-waveform" id="rec-waveform">
            <div class="rec-bar" style="height:12px"></div>
            <div class="rec-bar" style="height:20px"></div>
            <div class="rec-bar" style="height:28px"></div>
            <div class="rec-bar" style="height:36px"></div>
            <div class="rec-bar" style="height:40px"></div>
            <div class="rec-bar" style="height:36px"></div>
            <div class="rec-bar" style="height:28px"></div>
            <div class="rec-bar" style="height:20px"></div>
          </div>
          <div class="rec-timer" id="rec-timer">0:00</div>
          <button class="rec-btn" id="rec-btn" onclick="toggleRecording()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7" id="rec-icon"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-linecap="round"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round"/><line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round"/></svg>
          </button>
          <div class="rec-status" id="rec-status">Tap to record</div>
          <div class="rec-controls" id="rec-controls" style="display:none">
            <button class="rec-action" onclick="discardRecording()">Discard</button>
            <button class="rec-action primary" onclick="analyzeRecording()">Analyze with AI</button>
          </div>
        </div>

        <!-- Context note -->
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">Context (optional)</label>
          <input class="form-input" id="rec-context" placeholder="e.g. First walk-in, owner was open to talking..." />
        </div>

        <!-- AI Analysis panel -->
        <div class="ai-panel" id="ai-panel">
          <div class="ai-panel-title">AI Sales Analysis</div>

          <div class="overall-score">
            <div class="overall-num" id="overall-num">--</div>
            <div>
              <div class="overall-label" id="overall-label">Analyzing...</div>
              <div class="overall-grade" id="overall-grade">Sales score out of 10</div>
            </div>
          </div>

          <div class="score-row">
            <span class="score-label">Rapport built</span>
            <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-rapport" style="width:0%"></div></div>
            <span class="score-num" id="num-rapport">-</span>
          </div>
          <div class="score-row">
            <span class="score-label">Pain discovered</span>
            <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-pain" style="width:0%"></div></div>
            <span class="score-num" id="num-pain">-</span>
          </div>
          <div class="score-row">
            <span class="score-label">Owner interest level</span>
            <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-interest" style="width:0%"></div></div>
            <span class="score-num" id="num-interest">-</span>
          </div>
          <div class="score-row">
            <span class="score-label">Next step clarity</span>
            <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-nextstep" style="width:0%"></div></div>
            <span class="score-num" id="num-nextstep">-</span>
          </div>

          <div class="ai-summary" id="ai-summary"></div>
          <div class="ai-next-action" id="ai-next-action" style="display:none"></div>

          <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="toggleTranscript()">Show transcript</button>
          <div class="transcript-box" id="transcript-box"></div>

          <div class="push-row">
            <button class="btn btn-outline" onclick="saveToProfile()">Save to profile</button>
            <button class="btn btn-primary" onclick="pushToAdmin()">Push to admin</button>
          </div>
        </div>

        <!-- Past recordings -->
        <div style="margin-top:24px;">
          <div class="section-title" style="margin-bottom:12px;">Past Recordings</div>
          <div id="recordings-list">
            <div class="empty-state">
              <div class="empty-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7" width="28" height="28"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-linecap="round"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-linecap="round"/></svg>
              </div>
              <div class="empty-title">No recordings yet</div>
              <div class="empty-sub">Tap the mic to record your first interaction</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-recorder');

let recording = false;
let timerInterval = null;
let seconds = 0;
let linkedBiz = null;

function openBizPicker() {
  const name = prompt('Enter business name to link (full search coming soon):');
  if (name) {
    linkedBiz = { name };
    document.getElementById('biz-label').textContent = name;
    document.getElementById('biz-label').classList.add('set');
  }
}

function toggleRecording() {
  if (!recording) startRecording();
  else stopRecording();
}

function startRecording() {
  recording = true;
  seconds = 0;
  const btn = document.getElementById('rec-btn');
  btn.classList.add('recording');
  document.getElementById('rec-icon').innerHTML = `<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>`;
  document.getElementById('rec-status').textContent = 'Recording...';
  document.getElementById('rec-waveform').classList.add('active');
  document.getElementById('rec-controls').style.display = 'none';
  document.getElementById('ai-panel').classList.remove('show');
  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('rec-timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function stopRecording() {
  recording = false;
  clearInterval(timerInterval);
  const btn = document.getElementById('rec-btn');
  btn.classList.remove('recording');
  document.getElementById('rec-icon').innerHTML = `<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-linecap="round"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round"/><line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round"/>`;
  document.getElementById('rec-status').textContent = `Recorded ${document.getElementById('rec-timer').textContent}`;
  document.getElementById('rec-waveform').classList.remove('active');
  document.getElementById('rec-controls').style.display = 'flex';
}

function discardRecording() {
  seconds = 0;
  document.getElementById('rec-timer').textContent = '0:00';
  document.getElementById('rec-status').textContent = 'Tap to record';
  document.getElementById('rec-controls').style.display = 'none';
  document.getElementById('ai-panel').classList.remove('show');
}

async function analyzeRecording() {
  const panel = document.getElementById('ai-panel');
  panel.classList.add('show');
  document.getElementById('overall-label').textContent = 'Analyzing...';
  document.getElementById('overall-num').textContent = '--';

  const context = document.getElementById('rec-context').value;
  const duration = document.getElementById('rec-timer').textContent;
  const bizName = linkedBiz?.name || 'unknown business';

  try {
    const res = await fetch('/api/audits', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: `You are a sales coach analyzing a city lead's interaction. The recording was ${duration} long with ${bizName}. Context: "${context || 'No context provided'}".

Score this interaction on 4 dimensions (1-10 each) and give an overall score. Return JSON only:
{
  "overall": <number 1-10>,
  "rapport": <number>,
  "pain": <number>,
  "interest": <number>,
  "nextstep": <number>,
  "summary": "<2-3 sentence analysis of what went well and what to improve>",
  "next_action": "<one specific action to take before next visit>",
  "transcript_placeholder": "<a realistic short example transcript based on context>"
}`
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || data.result || '';
    const json = JSON.parse(text.match(/\{[\s\S]*\}/)?.[0] || '{}');

    const overall = json.overall || 7;
    document.getElementById('overall-num').textContent = overall;
    document.getElementById('overall-label').textContent = overall >= 8 ? 'Strong interaction' : overall >= 6 ? 'Good start' : 'Needs work';
    document.getElementById('overall-grade').textContent = `${overall}/10 sales score`;

    setBar('rapport', json.rapport || 7);
    setBar('pain', json.pain || 6);
    setBar('interest', json.interest || 7);
    setBar('nextstep', json.nextstep || 6);

    document.getElementById('ai-summary').textContent = json.summary || '';
    if (json.next_action) {
      const na = document.getElementById('ai-next-action');
      na.textContent = 'Next action: ' + json.next_action;
      na.style.display = 'block';
    }
    if (json.transcript_placeholder) {
      document.getElementById('transcript-box').textContent = json.transcript_placeholder;
    }
  } catch(e) {
    document.getElementById('overall-label').textContent = 'Analysis unavailable';
    document.getElementById('overall-num').textContent = '--';
    document.getElementById('ai-summary').textContent = 'Could not analyze — save the recording manually.';
  }
}

function setBar(key, val) {
  document.getElementById('bar-' + key).style.width = (val * 10) + '%';
  document.getElementById('num-' + key).textContent = val;
}

function toggleTranscript() {
  document.getElementById('transcript-box').classList.toggle('show');
}

function saveToProfile() {
  CL.toast('Saved to business profile');
}

function pushToAdmin() {
  CL.toast('Pushed to admin - they\'ll see it in the PRD queue');
}
</script>
</body>
</html>
