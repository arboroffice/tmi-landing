<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>All Cities | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>Admin</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">All Cities</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="export-btn">Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="openAddCity()">+ Add City</button>
      </div>
    </div>

    <div class="content">

      <div class="filter-bar">
        <div class="filter-row">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
            <input type="text" id="search-input" placeholder="Search city..." oninput="filterTable()"/>
          </div>
          <select class="filter-select" id="state-filter" onchange="filterTable()">
            <option value="">All States</option>
            <option>TX</option><option>CO</option><option>TN</option><option>AZ</option>
            <option>NC</option><option>FL</option><option>GA</option><option>OH</option>
          </select>
          <select class="filter-select" id="lead-filter" onchange="filterTable()">
            <option value="">All Leads</option>
            <option>Unassigned</option>
          </select>
        </div>
        <span class="filter-count" id="row-count">0 cities</span>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table id="cities-table">
            <thead>
              <tr>
                <th style="cursor:pointer" onclick="sortTable(0)">City <span class="sort-arrow">&#8597;</span></th>
                <th style="cursor:pointer" onclick="sortTable(1)">State <span class="sort-arrow">&#8597;</span></th>
                <th>City Lead</th>
                <th style="cursor:pointer" onclick="sortTable(3)">Businesses <span class="sort-arrow">&#8597;</span></th>
                <th style="cursor:pointer" onclick="sortTable(4)">Warm Leads <span class="sort-arrow">&#8597;</span></th>
                <th style="cursor:pointer" onclick="sortTable(5)">Deals Closed <span class="sort-arrow">&#8597;</span></th>
                <th style="cursor:pointer" onclick="sortTable(6)">Revenue <span class="sort-arrow">&#8597;</span></th>
                <th>Last Activity</th>
              </tr>
            </thead>
            <tbody id="cities-tbody">
              <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:32px">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /layout -->

<!-- Add City Modal -->
<div class="modal-overlay" id="add-city-modal">
  <div class="modal">
    <div class="modal-grip"></div>
    <div class="modal-hd">
      <h2 class="modal-title">Add City</h2>
      <button class="modal-x" onclick="CL.closeModal('add-city-modal')">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">City Name</label>
      <input class="form-input" id="modal-city" type="text" placeholder="e.g. Austin"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">State</label>
        <select class="form-input" id="modal-state">
          <option value="">Select state</option>
          <option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
          <option>CA</option><option>CO</option><option>CT</option><option>DE</option>
          <option>FL</option><option>GA</option><option>HI</option><option>ID</option>
          <option>IL</option><option>IN</option><option>IA</option><option>KS</option>
          <option>KY</option><option>LA</option><option>ME</option><option>MD</option>
          <option>MA</option><option>MI</option><option>MN</option><option>MS</option>
          <option>MO</option><option>MT</option><option>NE</option><option>NV</option>
          <option>NH</option><option>NJ</option><option>NM</option><option>NY</option>
          <option>NC</option><option>ND</option><option>OH</option><option>OK</option>
          <option>OR</option><option>PA</option><option>RI</option><option>SC</option>
          <option>SD</option><option>TN</option><option selected>TX</option><option>UT</option>
          <option>VT</option><option>VA</option><option>WA</option><option>WV</option>
          <option>WI</option><option>WY</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Assign to Existing Lead</label>
        <select class="form-input" id="modal-lead">
          <option value="">New territory (no lead yet)</option>
        </select>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost btn-full" onclick="CL.closeModal('add-city-modal')">Cancel</button>
      <button class="btn btn-primary btn-full" id="modal-save-btn" onclick="saveAddCity()">Add City</button>
    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-cities', { adminOnly: true });

const ALL_CITIES = [];
const LEADS_LIST = [];
let filtered = [];

async function loadCities() {
  const [leadsRes, bizRes] = await Promise.all([
    CL.api('city_leads', { select: 'id,name,first_name,last_name,city,state,territory,status,updated_at' }),
    CL.api('city_businesses', { select: 'id,city_lead_id,stage,deal_value,updated_at,last_visit_at' })
  ]);
  const leads = leadsRes.data || [];
  const bizAll = bizRes.data || [];

  const leadSel = document.getElementById('lead-filter');
  const modalLeadSel = document.getElementById('modal-lead');
  LEADS_LIST.length = 0;
  leads.forEach(l => {
    const name = l.name || [l.first_name, l.last_name].filter(Boolean).join(' ') || '—';
    LEADS_LIST.push({ id: l.id, name });
    const o = document.createElement('option'); o.value = name; o.textContent = name;
    leadSel.appendChild(o);
    const o2 = document.createElement('option'); o2.value = l.id; o2.textContent = name;
    modalLeadSel.appendChild(o2);
  });

  ALL_CITIES.length = 0;
  leads.forEach(l => {
    const lBiz = bizAll.filter(b => b.city_lead_id === l.id);
    const warm = lBiz.filter(b => ['warm','audit_booked','proposal_sent'].includes(b.stage)).length;
    const closed = lBiz.filter(b => ['closed','build_live','support_active','expansion'].includes(b.stage)).length;
    const rev = lBiz.filter(b => b.stage === 'closed').reduce((s,b) => s + (b.deal_value||0), 0);
    const name = l.name || [l.first_name, l.last_name].filter(Boolean).join(' ') || '—';
    const lastActive = lBiz.reduce((latest, b) => {
      const d = new Date(b.updated_at || b.last_visit_at || 0);
      return d > latest ? d : latest;
    }, new Date(l.updated_at || 0));
    ALL_CITIES.push({
      city: l.territory || l.city || '—',
      state: l.state || '—',
      lead: name,
      leadId: l.id,
      biz: lBiz.length,
      warm, closed, rev,
      last: lastActive.getTime() > 0 ? CL.fmt(lastActive.toISOString()) : '—'
    });
  });
  filtered = [...ALL_CITIES];
  renderTable(filtered);
}

function renderTable(data) {
  const tbody = document.getElementById('cities-tbody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:32px">No cities match your filters.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(c => `
    <tr onclick="CL.toast('Opening ${c.city}...')">
      <td class="td-name">${c.city}</td>
      <td>${c.state}</td>
      <td>${c.lead === 'Unassigned' ? '<span style="color:var(--muted)">Unassigned</span>' : c.lead}</td>
      <td>${c.biz || '—'}</td>
      <td>${c.warm || '—'}</td>
      <td>${c.closed || '—'}</td>
      <td>${c.rev ? CL.currency(c.rev) : '—'}</td>
      <td class="td-muted">${c.last}</td>
    </tr>`).join('');
  document.getElementById('row-count').textContent = data.length + ' cities';
}

function filterTable() {
  const q    = document.getElementById('search-input').value.toLowerCase();
  const st   = document.getElementById('state-filter').value;
  const lead = document.getElementById('lead-filter').value;
  filtered = ALL_CITIES.filter(c =>
    (!q    || c.city.toLowerCase().includes(q)) &&
    (!st   || c.state === st) &&
    (!lead || c.lead === lead)
  );
  renderTable(filtered);
}

let sortCol = -1, sortAsc = true;
function sortTable(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  const keys = ['city','state',null,'biz','warm','closed','rev'];
  const key = keys[col];
  if (!key) return;
  filtered.sort((a,b) => {
    const va = a[key], vb = b[key];
    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });
  renderTable(filtered);
}

function openAddCity() {
  document.getElementById('modal-city').value = '';
  document.getElementById('modal-state').value = 'TX';
  document.getElementById('modal-lead').value = '';
  CL.openModal('add-city-modal');
}

async function saveAddCity() {
  const city  = document.getElementById('modal-city').value.trim();
  const state = document.getElementById('modal-state').value;
  const leadId = document.getElementById('modal-lead').value;
  if (!city) { CL.toast('City name is required', 'error'); return; }
  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  const sb = CL.initSupabase();
  let error;
  if (leadId) {
    ({ error } = await sb.from('city_leads').update({ city, state: state || null }).eq('id', leadId));
    if (!error) CL.toast('Lead territory updated to ' + city);
  } else {
    ({ error } = await sb.from('city_leads').insert({
      city, state: state || null,
      name: city + (state ? ', ' + state : '') + ' (Open Territory)',
      status: 'prospect'
    }));
    if (!error) CL.toast(city + ' added as open territory');
  }
  btn.disabled = false; btn.textContent = 'Add City';
  if (error) { CL.toast(error.message || 'Save failed', 'error'); return; }
  CL.closeModal('add-city-modal');
  ALL_CITIES.length = 0;
  loadCities();
}

document.getElementById('export-btn').onclick = () => {
  if (!filtered.length) { CL.toast('No data to export', 'info'); return; }
  const csv = [
    'City,State,Lead,Businesses,Warm Leads,Deals Closed,Revenue,Last Activity',
    ...filtered.map(c => [c.city, c.state, c.lead, c.biz, c.warm, c.closed, c.rev, c.last]
      .map(v => JSON.stringify(v ?? '')).join(','))
  ].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'cities.csv';
  a.click();
};

loadCities();
</script>
</body>
</html>
