<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Leaderboard | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.metric-tabs{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;margin-bottom:16px;}
.metric-tab{flex:1;padding:10px 6px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;background:none;border:none;border-right:1px solid var(--line-strong);font-family:inherit;color:var(--ink-2);transition:all 0.12s;min-height:44px;}
.metric-tab:last-child{border-right:none;}
.metric-tab.active{background:var(--ink);color:#fff;}
.time-filter{display:flex;gap:6px;margin-bottom:20px;}
.time-btn{padding:7px 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px;cursor:pointer;background:none;font-family:inherit;color:var(--ink-2);transition:all 0.12s;min-height:36px;}
.time-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.lb-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;}
.lb-item{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px 16px;}
.lb-item:last-child{border-bottom:none;}
.lb-item.me{background:#fffef0;}
.lb-rank{width:28px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);flex-shrink:0;line-height:1;}
.lb-rank.first{color:var(--amber);}
.lb-rank.second{color:var(--ink-2);}
.lb-rank.third{color:#cd7c2e;}
.lb-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-2);flex-shrink:0;}
.lb-body{flex:1;min-width:0;}
.lb-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2;}
.lb-city{font-size:12px;color:var(--muted);margin-top:1px;}
.lb-val{font-size:18px;font-weight:700;color:var(--ink);flex-shrink:0;text-align:right;}
.lb-val-label{font-size:10px;color:var(--muted);text-align:right;margin-top:1px;font-weight:400;}
.medal-first{font-size:18px;}
.medal-second{font-size:16px;}
.medal-third{font-size:16px;}
.your-rank-card{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:24px;}
.yr-rank{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--chart);flex-shrink:0;line-height:1;width:40px;text-align:center;}
.yr-body{flex:1;}
.yr-name{font-size:15px;font-weight:600;margin-bottom:2px;}
.yr-city{font-size:12px;opacity:0.6;}
.yr-val{font-size:22px;font-weight:700;color:var(--chart);flex-shrink:0;text-align:right;}
.yr-val-label{font-size:10px;opacity:0.6;text-align:right;margin-top:1px;}
.lb-tagline{font-size:14px;color:var(--muted);text-align:center;padding:16px 20px;line-height:1.5;font-style:italic;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Leaderboard</span>
      </div>
    </div>

    <div class="content">

      <div class="sec-head" style="margin-bottom:16px;">
        <h1>Leaderboard</h1>
      </div>

      <!-- Metric tabs -->
      <div class="metric-tabs">
        <button class="metric-tab active" onclick="setMetric('visits',this)">Visits</button>
        <button class="metric-tab" onclick="setMetric('handoffs',this)">Handoffs</button>
        <button class="metric-tab" onclick="setMetric('deals',this)">Deals</button>
        <button class="metric-tab" onclick="setMetric('earnings',this)">Earnings</button>
      </div>

      <!-- Time filter -->
      <div class="time-filter">
        <button class="time-btn active" onclick="setTime('week',this)">This Week</button>
        <button class="time-btn" onclick="setTime('month',this)">This Month</button>
        <button class="time-btn" onclick="setTime('all',this)">All Time</button>
      </div>

      <!-- Your rank (sticky-style, top) -->
      <div class="your-rank-card" id="your-rank-card" style="display:none;">
        <div class="yr-rank" id="yr-rank">--</div>
        <div class="yr-body">
          <div class="yr-name" id="yr-name">You</div>
          <div class="yr-city" id="yr-city"></div>
        </div>
        <div>
          <div class="yr-val" id="yr-val">0</div>
          <div class="yr-val-label" id="yr-val-label">visits</div>
        </div>
      </div>

      <!-- Leaderboard list -->
      <div class="lb-list" id="lb-list"></div>

      <p class="lb-tagline">Competition is how we get better. See you at the top.</p>

    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-leaderboard');

const DATA = {
  visits:   { week: [], month: [], all: [], label: 'visits' },
  handoffs: { week: [], month: [], all: [], label: 'handoffs' },
  deals:    { week: [], month: [], all: [], label: 'deals' },
  earnings: { week: [], month: [], all: [], label: 'earned' },
};

let metric = 'visits';
let time = 'week';
const MEDALS = ['🥇','🥈','🥉'];
const RANK_CLASSES = ['first','second','third'];
const AVATAR_COLORS = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#14b8a6'];

function dateFilter(period) {
  const now = new Date();
  if (period === 'week') { const d = new Date(now); d.setDate(d.getDate() - 7); return d; }
  if (period === 'month') { return new Date(now.getFullYear(), now.getMonth(), 1); }
  return new Date(0);
}

function buildEntries(rawMap, myClId, leadMap, formatVal) {
  return Object.entries(rawMap)
    .map(([id, val]) => {
      const lead = leadMap[id] || { name: '—', city: '—' };
      const idx = Object.keys(leadMap).indexOf(id) % AVATAR_COLORS.length;
      return {
        id, name: lead.name, city: lead.city,
        avatar: CL.initials(lead.name),
        color: AVATAR_COLORS[idx], tc: '#fff',
        val: formatVal(val), rawVal: val,
        me: id === myClId
      };
    })
    .sort((a, b) => b.rawVal - a.rawVal);
}

async function loadLeaderboard() {
  const myClId = CL.getCityLeadId();

  const [leadsRes, visitsRes, handoffsRes, bizRes, earningsRes] = await Promise.all([
    CL.api('city_leads', { select: 'id,name,city,state' }),
    CL.api('city_visits', { select: 'city_lead_id,visited_at' }),
    CL.api('city_handoffs', { select: 'city_lead_id,created_at' }),
    CL.api('city_businesses', { select: 'city_lead_id,stage,deal_value,updated_at' }),
    CL.api('city_earnings', { select: 'city_lead_id,amount,created_at' })
  ]);

  const leads = leadsRes.data || [];
  const leadMap = {};
  leads.forEach(l => {
    leadMap[l.id] = { name: l.name || '—', city: [l.city, l.state].filter(Boolean).join(', ') || '—' };
  });

  // Update my name in "your rank" card
  if (myClId && leadMap[myClId]) {
    document.getElementById('yr-name').textContent = leadMap[myClId].name;
    document.getElementById('yr-city').textContent = leadMap[myClId].city;
  }

  const periods = ['week', 'month', 'all'];

  periods.forEach(period => {
    const cutoff = dateFilter(period);

    // Visits
    const visitMap = {};
    (visitsRes.data || []).forEach(v => {
      if (new Date(v.visited_at) >= cutoff) visitMap[v.city_lead_id] = (visitMap[v.city_lead_id]||0) + 1;
    });
    DATA.visits[period] = buildEntries(visitMap, myClId, leadMap, v => v);

    // Handoffs
    const hoMap = {};
    (handoffsRes.data || []).forEach(h => {
      if (new Date(h.created_at) >= cutoff) hoMap[h.city_lead_id] = (hoMap[h.city_lead_id]||0) + 1;
    });
    DATA.handoffs[period] = buildEntries(hoMap, myClId, leadMap, v => v);

    // Deals (closed stage businesses updated in period)
    const dealMap = {};
    (bizRes.data || []).filter(b => ['closed','build_live','support_active','expansion'].includes(b.stage))
      .forEach(b => {
        if (new Date(b.updated_at) >= cutoff) dealMap[b.city_lead_id] = (dealMap[b.city_lead_id]||0) + 1;
      });
    DATA.deals[period] = buildEntries(dealMap, myClId, leadMap, v => v);

    // Earnings
    const earnMap = {};
    (earningsRes.data || []).forEach(e => {
      if (new Date(e.created_at) >= cutoff) earnMap[e.city_lead_id] = (earnMap[e.city_lead_id]||0) + (e.amount||0);
    });
    DATA.earnings[period] = buildEntries(earnMap, myClId, leadMap, v => CL.currency(v));
  });

  render();
}
loadLeaderboard();

function render() {
  const d = DATA[metric];
  const entries = d[time] || [];
  const label = d.label;

  document.getElementById('yr-val-label').textContent = label;

  const list = document.getElementById('lb-list');
  if (!entries.length) {
    list.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 20px;">No activity yet for this period.</div>`;
    document.getElementById('your-rank-card').style.display = 'none';
    return;
  }

  const meIdx = entries.findIndex(e => e.me);
  const meEntry = meIdx >= 0 ? entries[meIdx] : null;
  document.getElementById('yr-rank').textContent = meEntry ? '#' + (meIdx + 1) : '--';
  document.getElementById('yr-val').textContent = meEntry ? meEntry.val : '0';
  document.getElementById('your-rank-card').style.display = meEntry ? '' : 'none';

  list.innerHTML = entries.map((e, i) => {
    const rankDisplay = i < 3
      ? `<span class="${['medal-first','medal-second','medal-third'][i]}">${MEDALS[i]}</span>`
      : `<span>${i+1}</span>`;
    return `
    <div class="lb-item${e.me ? ' me' : ''}">
      <div class="lb-rank ${RANK_CLASSES[i] || ''}">${rankDisplay}</div>
      <div class="lb-avatar" style="background:${e.color};color:${e.tc};">${e.avatar}</div>
      <div class="lb-body">
        <div class="lb-name">${e.name}${e.me ? ' (you)' : ''}</div>
        <div class="lb-city">${e.city}</div>
      </div>
      <div>
        <div class="lb-val">${e.val}</div>
        <div class="lb-val-label">${label}</div>
      </div>
    </div>`;
  }).join('');
}

function setMetric(m, btn) {
  metric = m;
  document.querySelectorAll('.metric-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setTime(t, btn) {
  time = t;
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
</script>
</body>
</html>
