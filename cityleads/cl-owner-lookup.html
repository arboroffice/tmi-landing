<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Owner Lookup | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.search-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:20px;}
.search-hero-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px;}
.search-hero-row{display:flex;gap:10px;}
.search-hero-input{flex:1;padding:12px 16px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:15px;color:var(--ink);background:var(--bg);outline:none;min-height:48px;font-family:inherit;}
.search-hero-input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,0.05);}
.lookup-result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;}
.lookup-result-header{background:var(--ink);padding:18px 16px;color:#fff;}
.lookup-result-name{font-size:20px;font-weight:700;margin-bottom:2px;}
.lookup-result-biz{font-size:13px;opacity:0.65;}
.lookup-result-body{padding:0;}
.lookup-field{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
.lookup-field:last-child{border-bottom:none;}
.lookup-field svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
.lookup-field-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);width:88px;flex-shrink:0;}
.lookup-field-val{font-size:14px;color:var(--ink);flex:1;min-width:0;}
.lookup-field-val.link{color:var(--blue);text-decoration:underline;cursor:pointer;}
.copy-btn{width:32px;height:32px;border-radius:var(--r-sm);background:none;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.12s;color:var(--muted);}
.copy-btn:hover{background:var(--bg);color:var(--ink);border-color:var(--ink-2);}
.copy-btn svg{width:13px;height:13px;}
.result-actions{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;}
.ai-note{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r-sm);padding:12px 14px;font-size:12px;color:#92400e;line-height:1.5;margin-bottom:20px;display:flex;gap:8px;}
.ai-note svg{flex-shrink:0;color:#d97706;margin-top:1px;}
.multi-results{margin-bottom:20px;}
.multi-result-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all 0.12s;display:flex;align-items:center;gap:12px;}
.multi-result-item:hover{border-color:var(--ink-2);background:var(--bg);}
.multi-result-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink-2);flex-shrink:0;}
.multi-result-body{flex:1;min-width:0;}
.multi-result-name{font-size:14px;font-weight:600;color:var(--ink);}
.multi-result-biz{font-size:12px;color:var(--muted);}
.confidence-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;flex-shrink:0;}
.confidence-high{background:#dcfce7;color:#15803d;}
.confidence-med{background:#fef9c3;color:#854d0e;}
.search-empty{text-align:center;padding:40px 20px;color:var(--muted);}
.search-empty svg{color:var(--line-strong);margin-bottom:12px;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Owner Lookup</span>
      </div>
    </div>

    <div class="content">

      <div class="sec-head" style="margin-bottom:8px;">
        <h1>Owner Lookup</h1>
      </div>
      <p style="font-size:14px;color:var(--muted);margin-bottom:20px;">Find the owner behind any business before you walk in.</p>

      <!-- Search -->
      <div class="search-hero">
        <div class="search-hero-label">Search</div>
        <div class="search-hero-row">
          <input class="search-hero-input" id="lookup-input" type="text" placeholder="Business name or address..." onkeydown="if(event.key==='Enter') doLookup()"/>
          <button class="btn btn-primary" onclick="doLookup()">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
            Search
          </button>
        </div>
      </div>

      <!-- Results area -->
      <div id="results-area">
        <div class="search-empty">
          <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" stroke-linecap="round"/><path d="M11 8a3 3 0 0 1 3 3" stroke-linecap="round"/></svg>
          <p style="font-size:14px;margin:0;">Enter a business name or address to look up the owner.</p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-owner-lookup');

const DEMO_RESULTS = {
  'apex': [
    {
      owner: 'Michael J. Torres',
      biz: 'Apex HVAC Services',
      phone: '(512) 834-2210',
      email: 'mike@apexhvacaustin.com',
      linkedin: 'linkedin.com/in/miketorres-hvac',
      title: 'Owner & Founder',
      years: '14 years',
      employees: '12–18',
      confidence: 'high',
    }
  ],
  'silverline': [
    {
      owner: 'Robert Kavanaugh',
      biz: 'Silverline Roofing LLC',
      phone: '(512) 991-4471',
      email: 'rob@silverlineroofing.com',
      linkedin: 'linkedin.com/in/robkav',
      title: 'Owner',
      years: '9 years',
      employees: '6–12',
      confidence: 'high',
    }
  ],
  'plumbing': [
    {
      owner: 'David Reyes',
      biz: 'Cedar Park Plumbing',
      phone: '(512) 219-8832',
      email: 'david@cedarplumbing.com',
      linkedin: null,
      title: 'Owner / Master Plumber',
      years: '11 years',
      employees: '4–8',
      confidence: 'high',
    },
    {
      owner: 'James Whitfield',
      biz: 'Whitfield Plumbing & Drain',
      phone: '(512) 478-1190',
      email: null,
      linkedin: 'linkedin.com/in/jwhitfield-plumbing',
      title: 'Owner',
      years: '6 years',
      employees: '2–5',
      confidence: 'med',
    },
    {
      owner: 'Ana Gutierrez',
      biz: 'South Austin Plumbing Co.',
      phone: '(512) 441-7723',
      email: 'ana@southaustinplumbing.com',
      linkedin: null,
      title: 'Co-Owner',
      years: '4 years',
      employees: '3–6',
      confidence: 'med',
    },
  ],
};

function getKey(q) {
  if (q.includes('apex')) return 'apex';
  if (q.includes('silver')) return 'silverline';
  if (q.includes('plumb')) return 'plumbing';
  return null;
}

let currentResults = [];

function doLookup() {
  const q = document.getElementById('lookup-input').value.trim().toLowerCase();
  if (!q) { CL.toast('Enter a business name or address', 'error'); return; }

  document.getElementById('results-area').innerHTML = `
    <div style="text-align:center;padding:40px 20px;color:var(--muted);">
      <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" style="animation:spin 1s linear infinite;display:inline-block;"><polyline points="1 4 1 10 7 10" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.51 15a9 9 0 1 0 .49-4" stroke-linecap="round"/></svg>
      <p style="font-size:13px;margin-top:10px;">Searching public records...</p>
    </div>
    <style>@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style>`;

  setTimeout(() => {
    const key = getKey(q);
    if (!key) {
      document.getElementById('results-area').innerHTML = `
        <div class="search-empty">
          <p style="font-size:14px;margin:0;color:var(--ink);">No results found for "${document.getElementById('lookup-input').value}".</p>
          <p style="font-size:13px;margin-top:6px;">Try a different name or check the spelling.</p>
        </div>`;
      return;
    }
    currentResults = DEMO_RESULTS[key];
    if (currentResults.length === 1) {
      showResult(currentResults[0]);
    } else {
      showMultiple(currentResults);
    }
  }, 1200);
}

function showMultiple(results) {
  const area = document.getElementById('results-area');
  area.innerHTML = `
    <div class="ai-note">
      <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13" stroke-linecap="round"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-linecap="round" stroke-width="2"/></svg>
      Multiple businesses match. Select the one you're looking for.
    </div>
    <div class="multi-results">
      ${results.map((r, i) => `
        <div class="multi-result-item" onclick="showResult(currentResults[${i}])">
          <div class="multi-result-avatar">${CL.initials(r.owner)}</div>
          <div class="multi-result-body">
            <div class="multi-result-name">${r.owner}</div>
            <div class="multi-result-biz">${r.biz} · ${r.title}</div>
          </div>
          <span class="confidence-pill confidence-${r.confidence}">${r.confidence === 'high' ? 'High match' : 'Possible'}</span>
        </div>`).join('')}
    </div>`;
}

function showResult(r) {
  const area = document.getElementById('results-area');
  area.innerHTML = `
    <div class="ai-note">
      <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13" stroke-linecap="round"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-linecap="round" stroke-width="2"/></svg>
      Results are AI-generated from public sources. Always verify before reaching out.
    </div>
    <div class="lookup-result">
      <div class="lookup-result-header">
        <div class="lookup-result-name">${r.owner}</div>
        <div class="lookup-result-biz">${r.biz}</div>
      </div>
      <div class="lookup-result-body">
        ${field('Phone', r.phone || '—', iconPhone(), r.phone)}
        ${field('Email', r.email || '—', iconEmail(), r.email)}
        ${field('LinkedIn', r.linkedin ? r.linkedin.replace('linkedin.com/in/','') : '—', iconLinkedIn(), r.linkedin, true)}
        ${field('Title', r.title || '—', iconBadge(), null)}
        ${field('In Business', r.years, iconClock(), null)}
        ${field('Est. Employees', r.employees, iconTeam(), null)}
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="CL.toast('Saved to My List')">Save to My List</button>
        <button class="btn btn-ghost" onclick="CL.toast('Business linked')">Add to Existing Business</button>
        ${currentResults.length > 1 ? `<button class="btn btn-ghost btn-sm" onclick="showMultiple(currentResults)">← Back to results</button>` : ''}
      </div>
    </div>`;
}

function field(label, val, icon, copyVal, isLink) {
  const valHtml = (isLink && copyVal) ? `<span class="lookup-field-val link" onclick="window.open('https://${copyVal}','_blank')">${val}</span>` : `<span class="lookup-field-val">${val}</span>`;
  const copyBtn = copyVal ? `<button class="copy-btn" onclick="copyField('${copyVal.replace(/'/g,'&#39;')}')">${iconCopy()}</button>` : `<div style="width:32px;height:32px;flex-shrink:0;"></div>`;
  return `<div class="lookup-field">${icon}<span class="lookup-field-label">${label}</span>${valHtml}${copyBtn}</div>`;
}

function copyField(val) {
  navigator.clipboard?.writeText(val).catch(()=>{});
  CL.toast('Copied');
}

function iconPhone(){return`<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.77a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21.73 16l.19.92z" stroke-linecap="round"/></svg>`;}
function iconEmail(){return`<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;}
function iconLinkedIn(){return`<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" stroke-linecap="round"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`;}
function iconBadge(){return`<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1" stroke-linecap="round"/></svg>`;}
function iconClock(){return`<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14" stroke-linecap="round"/></svg>`;}
function iconTeam(){return`<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="9" cy="7" r="4"/><path d="M3 20v-1a6 6 0 0 1 12 0v1" stroke-linecap="round"/><path d="M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round"/><path d="M21 20v-1a4 4 0 0 0-3-3.87" stroke-linecap="round"/></svg>`;}
function iconCopy(){return`<svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-linecap="round"/></svg>`;}
</script>
</body>
</html>
