<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Birthdays &amp; Personal Details | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.coming-up-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.coming-up-head h2{font-family:var(--serif);font-size:18px;font-weight:400;margin:0;letter-spacing:-0.01em;}
.coming-up-badge{padding:2px 8px;border-radius:999px;background:var(--chart);color:var(--ink);font-size:11px;font-weight:700;}

.upcoming-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
.upcoming-item.soon{border-color:var(--chart);background:#fefff5;}
.upcoming-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
.upcoming-icon.birthday{background:#fce7f3;}
.upcoming-icon.anniversary{background:#dbeafe;}
.upcoming-body{flex:1;min-width:0;}
.upcoming-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2;}
.upcoming-biz{font-size:12px;color:var(--muted);margin-top:1px;}
.upcoming-what{font-size:12px;color:var(--ink-2);margin-top:4px;}
.upcoming-days{font-size:12px;font-weight:700;color:var(--ink);flex-shrink:0;}
.upcoming-days.very-soon{color:var(--red);}
.upcoming-log-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;margin-top:8px;min-height:28px;font-family:inherit;transition:all 0.12s;}
.upcoming-log-btn:hover{border-color:var(--ink-2);color:var(--ink);}

.contacts-sec-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px;}
.contacts-sec-head h2{font-family:var(--serif);font-size:18px;font-weight:400;margin:0;letter-spacing:-0.01em;}

.contact-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.contact-card-head{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 0.1s;}
.contact-card-head:hover{background:var(--bg);}
.contact-avatar{width:36px;height:36px;border-radius:50%;background:var(--chart);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink);flex-shrink:0;}
.contact-info{flex:1;min-width:0;}
.contact-name{font-size:14px;font-weight:600;color:var(--ink);}
.contact-biz{font-size:12px;color:var(--muted);}
.contact-chevron{color:var(--muted);transition:transform 0.2s;}
.contact-chevron.open{transform:rotate(180deg);}
.contact-details{display:none;border-top:1px solid var(--line);padding:12px 14px;}
.contact-details.open{display:block;}
.detail-chips{display:flex;flex-wrap:wrap;gap:6px;}
.detail-chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink-2);background:var(--bg);}
.detail-chip .chip-cat{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.no-details{font-size:12px;color:var(--muted);font-style:italic;}

.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cat-dot.birthday{background:#ec4899;}
.cat-dot.anniversary{background:#3b82f6;}
.cat-dot.family{background:#8b5cf6;}
.cat-dot.pet{background:#f59e0b;}
.cat-dot.interest{background:#22c55e;}
.cat-dot.other{background:#6b7280;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Birthdays &amp; Personal</span>
      </div>
    </div>

    <div class="content">

      <!-- Coming Up -->
      <div class="coming-up-head">
        <h2>Coming Up</h2>
        <span class="coming-up-badge" id="coming-count">3</span>
      </div>
      <div id="coming-up-list"></div>

      <!-- All Contacts -->
      <div class="contacts-sec-head">
        <h2>All Contacts</h2>
        <button class="btn btn-ghost btn-sm" onclick="CL.openModal('add-note-modal')">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/></svg>
          Add Note
        </button>
      </div>
      <div id="contacts-list"></div>

    </div>
  </div>
</div>

<!-- Add Note Modal -->
<div class="modal-overlay" id="add-note-modal">
  <div class="modal">
    <div class="modal-grip"></div>
    <div class="modal-hd">
      <h2 class="modal-title">Add Personal Note</h2>
      <button class="modal-x" onclick="CL.closeModal('add-note-modal')">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Business / Contact</label>
      <select class="form-input" id="note-biz">
        <option value="">Select a contact...</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-input" id="note-cat">
        <option value="birthday">Birthday</option>
        <option value="anniversary">Business Anniversary</option>
        <option value="family">Family</option>
        <option value="pet">Pet</option>
        <option value="interest">Interest / Hobby</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Note</label>
      <textarea class="form-input" id="note-text" placeholder="e.g. Birthday is June 12 / Wife's name is Maria / Has a rescue dog named Duke"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Date (if applicable)</label>
      <input class="form-input" id="note-date" type="date"/>
    </div>
    <div class="modal-ft">
      <button class="btn btn-primary btn-full" onclick="saveNote()">Save Note</button>
      <button class="btn btn-ghost btn-full" onclick="CL.closeModal('add-note-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Log Note Modal -->
<div class="modal-overlay" id="log-note-modal">
  <div class="modal">
    <div class="modal-grip"></div>
    <div class="modal-hd">
      <h2 class="modal-title">Log a Note</h2>
      <button class="modal-x" onclick="CL.closeModal('log-note-modal')">&times;</button>
    </div>
    <p style="font-size:14px;color:var(--ink-2);margin-bottom:16px;line-height:1.5" id="log-note-context"></p>
    <div class="form-group">
      <label class="form-label">Note</label>
      <textarea class="form-input" id="log-note-text" placeholder="e.g. Sent a birthday text, mentioned their 3-year anniversary"></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-primary btn-full" onclick="saveLogNote()">Save Note</button>
      <button class="btn btn-ghost btn-full" onclick="CL.closeModal('log-note-modal')">Cancel</button>
    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-birthdays');

const CONTACTS = [
  {
    id:1, name:'Mike Tran', biz:'Apex HVAC', initials:'MT',
    details:[
      { cat:'birthday', text:'May 22', date:'2026-05-22' },
      { cat:'family', text:'Wife: Linh, two kids (ages 7 and 4)' },
      { cat:'interest', text:'Golfs on weekends, UT Longhorns fan' },
    ]
  },
  {
    id:2, name:'Diego Ruiz', biz:'Lone Star Concrete', initials:'DR',
    details:[
      { cat:'birthday', text:'July 4', date:'2026-07-04' },
      { cat:'anniversary', text:'10-year business anniversary: September 2026' },
      { cat:'family', text:'Daughter just started college - UT Austin' },
    ]
  },
  {
    id:3, name:'Sarah Webb', biz:'Travis Electric', initials:'SW',
    details:[
      { cat:'interest', text:'Runs marathons, training for Austin Marathon' },
      { cat:'pet', text:'Dog named Hank - black lab' },
    ]
  },
  {
    id:4, name:'James Park', biz:'Silverline Roofing', initials:'JP',
    details:[
      { cat:'birthday', text:'June 3', date:'2026-06-03' },
      { cat:'family', text:'Spouse: Rachel, no kids' },
      { cat:'interest', text:'Big into BBQ competitions on weekends' },
    ]
  },
  {
    id:5, name:'Tom Garza', biz:'Hill Country HVAC', initials:'TG',
    details:[
      { cat:'family', text:'Three sons, two work in the business' },
      { cat:'interest', text:'Grew up in Kerrville, goes hunting every November' },
    ]
  },
  {
    id:6, name:'Carl Moss', biz:'Cedar Park Plumbing', initials:'CM',
    details: []
  },
  {
    id:7, name:'Keisha Brown', biz:'Austin Painting Co', initials:'KB',
    details:[
      { cat:'anniversary', text:'7-year business anniversary: August 2026' },
      { cat:'pet', text:'Two cats, Pixel and Remy' },
    ]
  },
];

const COMING_UP = [
  { name:'Mike Tran',  biz:'Apex HVAC',      what:'Birthday',              date:'May 22, 2026',  days:5,  type:'birthday' },
  { name:'James Park', biz:'Silverline Roofing', what:'Birthday',           date:'Jun 3, 2026',   days:17, type:'birthday' },
  { name:'Keisha Brown', biz:'Austin Painting Co', what:'7-Year Business Anniversary', date:'Aug 2026', days:77, type:'anniversary' },
];

const CAT_ICONS = {
  birthday: '🎂', anniversary: '🏢', family: '👨‍👩‍👧', pet: '🐾', interest: '⭐', other: '📝'
};

const CAT_LABELS = {
  birthday:'Birthday', anniversary:'Anniversary', family:'Family', pet:'Pet', interest:'Interest', other:'Other'
};

function renderComingUp() {
  document.getElementById('coming-count').textContent = COMING_UP.length;
  document.getElementById('coming-up-list').innerHTML = COMING_UP.map(c => `
    <div class="upcoming-item${c.days <= 7 ? ' soon' : ''}">
      <div class="upcoming-icon ${c.type}">${c.type === 'birthday' ? '🎂' : '🏢'}</div>
      <div class="upcoming-body">
        <div class="upcoming-name">${c.name}</div>
        <div class="upcoming-biz">${c.biz}</div>
        <div class="upcoming-what">${c.what} &middot; ${c.date}</div>
        <button class="upcoming-log-btn" onclick="openLogNote('${c.name}', '${c.what}')">
          <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Log a note about this
        </button>
      </div>
      <div class="upcoming-days${c.days <= 7 ? ' very-soon' : ''}">${c.days}d</div>
    </div>`).join('');
}

function renderContacts() {
  // Populate modal select
  const sel = document.getElementById('note-biz');
  sel.innerHTML = '<option value="">Select a contact...</option>' +
    CONTACTS.map(c => `<option value="${c.id}">${c.name} - ${c.biz}</option>`).join('');

  document.getElementById('contacts-list').innerHTML = CONTACTS.map(c => `
    <div class="contact-card" id="cc-${c.id}">
      <div class="contact-card-head" onclick="toggleContact(${c.id})">
        <div class="contact-avatar">${c.initials}</div>
        <div class="contact-info">
          <div class="contact-name">${c.name}</div>
          <div class="contact-biz">${c.biz}</div>
        </div>
        <svg class="contact-chevron" id="chev-${c.id}" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><polyline points="6 9 12 15 18 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="contact-details" id="cd-${c.id}">
        ${c.details.length ? `<div class="detail-chips">${c.details.map(d => `
          <div class="detail-chip">
            <div class="cat-dot ${d.cat}"></div>
            <span>${CAT_ICONS[d.cat]} ${d.text}</span>
          </div>`).join('')}</div>` :
          `<div class="no-details">No personal details yet. Tap "Add Note" to add some.</div>`}
        <div style="margin-top:10px">
          <button class="btn btn-ghost btn-sm" onclick="prefillNote(${c.id})">+ Add Detail</button>
        </div>
      </div>
    </div>`).join('');
}

function toggleContact(id) {
  const det = document.getElementById('cd-' + id);
  const chev = document.getElementById('chev-' + id);
  det.classList.toggle('open');
  chev.classList.toggle('open');
}

function prefillNote(id) {
  document.getElementById('note-biz').value = id;
  CL.openModal('add-note-modal');
}

function openLogNote(name, what) {
  document.getElementById('log-note-context').textContent = `Log a note about ${name}'s ${what}.`;
  document.getElementById('log-note-text').value = '';
  CL.openModal('log-note-modal');
}

function saveLogNote() {
  const text = document.getElementById('log-note-text').value.trim();
  if (!text) { CL.toast('Enter a note', 'error'); return; }
  CL.closeModal('log-note-modal');
  CL.toast('Note saved');
}

function saveNote() {
  const bizId = document.getElementById('note-biz').value;
  const cat = document.getElementById('note-cat').value;
  const text = document.getElementById('note-text').value.trim();
  if (!bizId) { CL.toast('Select a contact', 'error'); return; }
  if (!text) { CL.toast('Enter a note', 'error'); return; }
  const c = CONTACTS.find(x => x.id == bizId);
  c.details.push({ cat, text });
  CL.closeModal('add-note-modal');
  CL.toast('Note saved for ' + c.name);
  renderContacts();
}

renderComingUp();
renderContacts();
</script>
</body>
</html>
