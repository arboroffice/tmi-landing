<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Findings | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.finding-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.finding-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.finding-biz{font-size:15px;font-weight:700;color:var(--ink);flex:1;}
.finding-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.finding-badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;flex-shrink:0;}
.badge-draft{background:var(--bg);border:1px solid var(--line-strong);color:var(--muted);}
.badge-submitted{background:#e6f4ea;color:#2e7d32;border:1px solid #a5d6a7;}
.badge-reviewing{background:#fff8e1;color:#f57f17;border:1px solid #ffe082;}
.badge-prd{background:var(--bg-dark);color:var(--chart);border:1px solid transparent;}
.finding-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.finding-field{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;}
.finding-field-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.finding-field-val{font-size:13px;color:var(--ink-2);line-height:1.4;}
.finding-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.finding-actions .btn{flex:1;}

/* Form */
.findings-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;}
.form-section-title{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;}
.form-section-title:first-child{margin-top:0;}
.deal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.product-chips{display:flex;gap:8px;flex-wrap:wrap;}
.product-chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line-strong);background:none;font-size:13px;cursor:pointer;color:var(--ink-2);transition:all 0.12s;min-height:40px;}
.product-chip.active{background:var(--ink);color:var(--chart);border-color:var(--ink);}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page" id="page-title">Findings</span>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="showTab('list')">My Findings</button>
      <button class="tab-btn" onclick="showTab('new')">+ New Finding</button>
    </div>

    <div class="page-content">
      <div class="content-inner">

        <!-- Findings list -->
        <div id="tab-list">
          <div id="findings-list">
            <div class="empty-state">
              <div class="empty-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7" width="28" height="28"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke-linecap="round"/></svg>
              </div>
              <div class="empty-title">No findings yet</div>
              <div class="empty-sub">Document a discovery and push it to admin for a PRD</div>
              <button class="btn btn-primary" style="margin-top:16px" onclick="showTab('new')">Write a Finding</button>
            </div>
          </div>
        </div>

        <!-- New finding form -->
        <div id="tab-new" style="display:none">
          <div class="findings-form">
            <div class="form-section-title">Business</div>
            <div class="form-group">
              <input class="form-input" id="f-biz" placeholder="Business name" />
            </div>
            <div class="form-group">
              <input class="form-input" id="f-owner" placeholder="Owner name" />
            </div>

            <div class="form-section-title">What's the problem?</div>
            <div class="form-group">
              <textarea class="form-textarea" id="f-pain" rows="3" placeholder="What specific pain did the owner describe? Be specific — quotes are gold."></textarea>
            </div>

            <div class="form-section-title">Current situation</div>
            <div class="form-group">
              <textarea class="form-textarea" id="f-situation" rows="3" placeholder="How are they handling it now? What tools, processes, or people are involved?"></textarea>
            </div>

            <div class="form-section-title">AI / TMI opportunity</div>
            <div class="form-group">
              <textarea class="form-textarea" id="f-opportunity" rows="3" placeholder="Where does TMI fit? What could we build or automate for them?"></textarea>
            </div>

            <div class="form-section-title">Recommended product</div>
            <div class="product-chips" id="product-chips">
              <button class="product-chip" onclick="toggleProduct(this)">Foundation Pilot</button>
              <button class="product-chip" onclick="toggleProduct(this)">Full Build</button>
              <button class="product-chip" onclick="toggleProduct(this)">AI Agents</button>
              <button class="product-chip" onclick="toggleProduct(this)">Automation Stack</button>
              <button class="product-chip" onclick="toggleProduct(this)">Not sure yet</button>
            </div>

            <div class="form-section-title">Deal potential</div>
            <div class="deal-row">
              <div class="form-group">
                <label class="form-label">Estimated deal size</label>
                <input class="form-input" id="f-deal" type="number" placeholder="5000" />
              </div>
              <div class="form-group">
                <label class="form-label">Timeline to close</label>
                <select class="form-select" id="f-timeline">
                  <option value="">Select...</option>
                  <option>This week</option>
                  <option>This month</option>
                  <option>1-3 months</option>
                  <option>3+ months</option>
                  <option>Unknown</option>
                </select>
              </div>
            </div>

            <div class="form-section-title">Owner's readiness</div>
            <div class="form-group">
              <select class="form-select" id="f-readiness">
                <option value="">Select...</option>
                <option>Cold - just exploring</option>
                <option>Curious - asked good questions</option>
                <option>Warm - wants a follow-up</option>
                <option>Hot - ready to move</option>
                <option>Ready to book an audit</option>
              </select>
            </div>

            <div class="form-section-title">Anything else admin should know</div>
            <div class="form-group">
              <textarea class="form-textarea" id="f-notes" rows="3" placeholder="Personality, objections raised, who else is involved in the decision, red flags..."></textarea>
            </div>

            <div style="display:flex;gap:10px;margin-top:8px;">
              <button class="btn btn-outline" onclick="saveDraft()">Save Draft</button>
              <button class="btn btn-primary" style="flex:1" onclick="submitFinding()">Submit to Admin</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
const role = CL.getRole();
if (role === 'admin') {
  document.getElementById('page-title').textContent = 'PRD Queue';
  document.querySelector('.tab-btn:first-child').textContent = 'All Submissions';
  document.querySelector('.tab-btn:last-child').style.display = 'none';
  document.getElementById('topbar-actions').innerHTML = '';
}

CL.initPage('cl-findings');

function showTab(id) {
  ['list','new'].forEach(t => {
    document.getElementById('tab-' + t).style.display = 'none';
    document.querySelectorAll('.tab-btn')[t === 'list' ? 0 : 1]?.classList.remove('active');
  });
  document.getElementById('tab-' + id).style.display = 'block';
  document.querySelectorAll('.tab-btn')[id === 'list' ? 0 : 1]?.classList.add('active');
}

function toggleProduct(el) {
  el.classList.toggle('active');
}

function saveDraft() {
  CL.toast('Draft saved');
}

function submitFinding() {
  const biz = document.getElementById('f-biz').value.trim();
  if (!biz) { CL.toast('Add a business name first'); return; }

  const finding = {
    id: Date.now(),
    biz,
    owner: document.getElementById('f-owner').value,
    pain: document.getElementById('f-pain').value,
    situation: document.getElementById('f-situation').value,
    opportunity: document.getElementById('f-opportunity').value,
    deal: document.getElementById('f-deal').value,
    timeline: document.getElementById('f-timeline').value,
    readiness: document.getElementById('f-readiness').value,
    notes: document.getElementById('f-notes').value,
    products: [...document.querySelectorAll('.product-chip.active')].map(c => c.textContent),
    status: 'submitted',
    submitted_at: new Date().toISOString(),
    lead: CL.getUser()?.email || 'Unknown',
  };

  const existing = JSON.parse(localStorage.getItem('cl_findings') || '[]');
  existing.unshift(finding);
  localStorage.setItem('cl_findings', JSON.stringify(existing));

  CL.toast('Finding submitted to admin');
  showTab('list');
  loadFindings();
}

function loadFindings() {
  const isAdmin = CL.getRole() === 'admin';
  const all = JSON.parse(localStorage.getItem('cl_findings') || '[]');
  const list = document.getElementById('findings-list');

  if (!all.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7" width="28" height="28"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke-linecap="round"/></svg></div>
      <div class="empty-title">${isAdmin ? 'No findings yet' : 'No findings yet'}</div>
      <div class="empty-sub">${isAdmin ? 'City leads will submit discoveries here' : 'Document a discovery and push it to admin for a PRD'}</div>
      ${!isAdmin ? '<button class="btn btn-primary" style="margin-top:16px" onclick="showTab(\'new\')">Write a Finding</button>' : ''}
    </div>`;
    return;
  }

  list.innerHTML = all.map(f => `
    <div class="finding-card">
      <div class="finding-header">
        <div>
          <div class="finding-biz">${f.biz}</div>
          <div class="finding-meta">${f.owner ? f.owner + ' · ' : ''}${new Date(f.submitted_at).toLocaleDateString()}</div>
        </div>
        <span class="finding-badge badge-${f.status === 'submitted' ? 'submitted' : f.status === 'prd' ? 'prd' : 'draft'}">${f.status === 'submitted' ? 'Submitted' : f.status === 'prd' ? 'PRD Created' : 'Draft'}</span>
      </div>
      <div class="finding-row">
        <div class="finding-field"><div class="finding-field-label">Pain</div><div class="finding-field-val">${f.pain || '-'}</div></div>
        <div class="finding-field"><div class="finding-field-label">Readiness</div><div class="finding-field-val">${f.readiness || '-'}</div></div>
      </div>
      <div class="finding-row">
        <div class="finding-field"><div class="finding-field-label">Deal size</div><div class="finding-field-val">${f.deal ? '$' + Number(f.deal).toLocaleString() : '-'}</div></div>
        <div class="finding-field"><div class="finding-field-label">Timeline</div><div class="finding-field-val">${f.timeline || '-'}</div></div>
      </div>
      ${f.opportunity ? `<div class="finding-field" style="margin-bottom:8px;"><div class="finding-field-label">TMI Opportunity</div><div class="finding-field-val">${f.opportunity}</div></div>` : ''}
      <div class="finding-actions">
        ${isAdmin
          ? `<button class="btn btn-outline btn-sm" onclick="markPRD(${f.id})">Mark PRD Created</button><button class="btn btn-primary btn-sm" onclick="exportFinding(${f.id})">Export</button>`
          : `<button class="btn btn-outline btn-sm" onclick="">Edit</button><button class="btn btn-ghost btn-sm" style="color:var(--muted)" onclick="deleteFinding(${f.id})">Delete</button>`
        }
      </div>
    </div>`).join('');
}

function markPRD(id) {
  const all = JSON.parse(localStorage.getItem('cl_findings') || '[]');
  const i = all.findIndex(f => f.id === id);
  if (i > -1) { all[i].status = 'prd'; localStorage.setItem('cl_findings', JSON.stringify(all)); loadFindings(); CL.toast('Marked as PRD created'); }
}

function deleteFinding(id) {
  const all = JSON.parse(localStorage.getItem('cl_findings') || '[]').filter(f => f.id !== id);
  localStorage.setItem('cl_findings', JSON.stringify(all));
  loadFindings();
}

function exportFinding(id) {
  const f = JSON.parse(localStorage.getItem('cl_findings') || '[]').find(x => x.id === id);
  if (!f) return;
  const text = `FINDING: ${f.biz}\nOwner: ${f.owner}\n\nPAIN:\n${f.pain}\n\nCURRENT SITUATION:\n${f.situation}\n\nTMI OPPORTUNITY:\n${f.opportunity}\n\nRECOMMENDED PRODUCT: ${f.products?.join(', ')}\nDEAL SIZE: $${f.deal}\nTIMELINE: ${f.timeline}\nREADINESS: ${f.readiness}\n\nNOTES:\n${f.notes}`;
  navigator.clipboard.writeText(text).then(() => CL.toast('Copied to clipboard'));
}

loadFindings();
</script>
</body>
</html>
