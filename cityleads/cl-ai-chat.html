<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Assistant | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.layout{height:100dvh;}
.main{min-height:0;}
.content{padding:0;overflow:hidden;display:flex;flex-direction:column;}
.ai-chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ai-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;}
.ai-msg-wrap{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.ai-msg-wrap.user{flex-direction:row-reverse;}
.ai-icon{width:32px;height:32px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-icon svg{width:16px;height:16px;color:var(--chart);}
.user-icon{width:32px;height:32px;border-radius:50%;background:var(--chart);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink);flex-shrink:0;}
.ai-msg{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-top-left-radius:4px;padding:12px 16px;font-size:14px;color:var(--ink-2);line-height:1.6;max-width:82%;}
.user-msg{background:var(--ink);color:#fff;border-radius:16px;border-top-right-radius:4px;padding:12px 16px;font-size:14px;line-height:1.55;max-width:82%;align-self:flex-end;}
.ai-msg strong{color:var(--ink);}
.ai-msg ul{margin:8px 0 0 16px;padding:0;}
.ai-msg li{margin-bottom:4px;}
.ai-time{font-size:10px;color:var(--muted);margin-top:4px;text-align:center;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);}
.chip{padding:8px 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;cursor:pointer;background:none;font-family:inherit;color:var(--ink-2);transition:all 0.12s;white-space:nowrap;min-height:40px;}
.chip:hover{border-color:var(--ink);color:var(--ink);background:var(--bg);}
.chat-input-bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:flex-end;}
.chat-input-bar textarea{flex:1;border:1px solid var(--line-strong);border-radius:20px;padding:9px 14px;font-size:14px;outline:none;resize:none;min-height:42px;max-height:120px;line-height:1.4;background:var(--bg);font-family:inherit;}
.chat-input-bar textarea:focus{border-color:var(--ink-2);}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--chart);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s;}
.send-btn:hover{background:var(--chart-dark);}
.send-btn svg{width:16px;height:16px;color:var(--ink);}
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0;}
.typing-dots span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite;flex-shrink:0;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">AI Assistant</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="clearChat()">Clear</button>
      </div>
    </div>

    <div class="content">
      <div class="ai-chat-wrap">
        <div class="ai-messages" id="ai-messages">

          <!-- Starter -->
          <div class="ai-msg-wrap" id="starter-msg">
            <div class="ai-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke-linecap="round"/></svg>
            </div>
            <div class="ai-msg">
              Hey! I can help you find businesses, draft follow-ups, research owners, or answer questions about your city. What do you need?
            </div>
          </div>

        </div>

        <!-- Suggested prompts (shown before first user message) -->
        <div class="chip-row" id="chip-row">
          <button class="chip" onclick="sendChip(this)">Find me 10 plumbers in Austin</button>
          <button class="chip" onclick="sendChip(this)">Write a follow-up text for a warm lead</button>
          <button class="chip" onclick="sendChip(this)">What should I say if they already have software?</button>
          <button class="chip" onclick="sendChip(this)">Draft an intro email for a roofing company</button>
        </div>

        <div class="chat-input-bar">
          <textarea id="ai-input" rows="1" placeholder="Ask anything..." onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" onclick="sendMessage()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13" stroke-linecap="round"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-ai-chat');

let firstMessage = true;

const CANNED_RESPONSES = {
  'plumber': `Here are 10 plumbing businesses in Austin worth hitting this week:\n\n1. **Cedar Park Plumbing** — 512-219-8832, owner David Reyes, 11 years\n2. **South Austin Plumbing Co.** — 512-441-7723, owner Ana Gutierrez\n3. **Whitfield Plumbing & Drain** — 512-478-1190, owner James Whitfield\n4. **Round Rock Pipe & Drain** — 512-388-0291, owner Terry Holt\n5. **Capital City Plumbing** — 512-445-1188, owner Marcus Webb\n6. **Pflugerville Plumbing Pros** — 512-990-4412, owner Lin Chang\n7. **Leak Fixers Austin** — 512-291-8820, owner Brenda Ruiz\n8. **Hill Country Drain** — 512-878-2290, owner Dave Park\n9. **Buda Plumbing & Sewer** — 512-295-5521, owner Keith Stanton\n10. **Slaughter Lane Plumbing** — 512-448-6632, owner Rosa Mendez\n\nWant me to draft an opener for any of these?`,
  'follow-up': `Here's a follow-up text for a warm lead:\n\n---\n*"Hey [Name] — Jordan from TMI. We talked last week about the job costing issue you mentioned. I've been thinking about it — happy to show you in 15 minutes how other [industry] companies in Austin fixed that exact problem. Still worth a quick look?"*\n---\n\nKeep it short. One specific thing they mentioned. One ask. Want me to adjust the tone?`,
  'software': `When they say they already have something, try this:\n\n**"When's the last time you could see actual profit per job in real time — not at the end of the month, while it's happening?"**\n\nMost can't answer it. That silence is your opening.\n\nIf they push back, follow with: "I'm not asking you to replace anything today. I'm asking if you'd want to know if you're losing money on jobs before the invoice goes out."\n\nThe goal isn't to argue their current tool. It's to find the gap their current tool doesn't fill. Want a full script?`,
  'email': `Here's a cold intro email for a roofing company:\n\n---\n**Subject: Quick question about your job margins**\n\nHi [Owner Name],\n\nI'm Jordan — I work with roofing companies in Austin helping them see job-level profitability in real time. Most find they're leaving 8–15% on the table in jobs that look fine on paper.\n\nWould it be worth 20 minutes to show you what that looks like for a company your size?\n\nNo pitch — just the numbers.\n\n— Jordan\n*TMI Technology*\n---\n\nWant me to adjust for a specific company or owner?`,
  'default': `Good question. Based on what I know about Austin field service businesses:\n\nThe most common pattern is **owners who are too busy to evaluate new tools** — not because they don't want to, but because every vendor who comes in promises the same thing.\n\nYour edge is being a local face they can hold accountable. Lead with that.\n\nWant me to pull specific businesses, draft a message, or help you research a particular owner?`,
};

function getResponse(text) {
  const t = text.toLowerCase();
  if (t.includes('plumb') || t.includes('find')) return CANNED_RESPONSES.plumber;
  if (t.includes('follow') || t.includes('warm lead') || t.includes('text')) return CANNED_RESPONSES['follow-up'];
  if (t.includes('software') || t.includes('already have') || t.includes('objection')) return CANNED_RESPONSES.software;
  if (t.includes('email') || t.includes('intro') || t.includes('roof')) return CANNED_RESPONSES.email;
  return CANNED_RESPONSES.default;
}

function appendUserMsg(text) {
  const user = CL.getUser();
  const initials = CL.initials(user?.user_metadata?.full_name || 'You');
  const msgs = document.getElementById('ai-messages');
  const wrap = document.createElement('div');
  wrap.className = 'ai-msg-wrap user';
  wrap.innerHTML = `<div class="user-icon">${initials}</div><div class="user-msg">${text.replace(/</g,'&lt;')}</div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop = 999999;
}

function appendTyping() {
  const msgs = document.getElementById('ai-messages');
  const wrap = document.createElement('div');
  wrap.id = 'typing-indicator';
  wrap.className = 'ai-msg-wrap';
  wrap.innerHTML = `
    <div class="ai-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke-linecap="round"/></svg></div>
    <div class="ai-msg"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop = 999999;
  return wrap;
}

function appendAiMsg(text) {
  const msgs = document.getElementById('ai-messages');
  const wrap = document.createElement('div');
  wrap.className = 'ai-msg-wrap';
  const html = text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>')
    .replace(/^\d+\. /gm, match => match);
  wrap.innerHTML = `<div class="ai-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke-linecap="round"/></svg></div><div class="ai-msg">${html}</div>`;
  msgs.appendChild(wrap);
  msgs.scrollTop = 999999;
}

function sendMessage(text) {
  const input = document.getElementById('ai-input');
  const msg = text || input.value.trim();
  if (!msg) return;

  if (firstMessage) {
    document.getElementById('chip-row').style.display = 'none';
    firstMessage = false;
  }

  appendUserMsg(msg);
  input.value = '';
  input.style.height = 'auto';

  const typing = appendTyping();
  const delay = 800 + Math.random() * 800;

  setTimeout(() => {
    typing.remove();
    appendAiMsg(getResponse(msg));
  }, delay);
}

function sendChip(btn) {
  sendMessage(btn.textContent);
}

function clearChat() {
  const msgs = document.getElementById('ai-messages');
  msgs.innerHTML = `
    <div class="ai-msg-wrap" id="starter-msg">
      <div class="ai-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke-linecap="round"/></svg></div>
      <div class="ai-msg">Hey! I can help you find businesses, draft follow-ups, research owners, or answer questions about your city. What do you need?</div>
    </div>`;
  document.getElementById('chip-row').style.display = 'flex';
  firstMessage = true;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleEnter(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}
</script>
</body>
</html>
