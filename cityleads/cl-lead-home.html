<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Dashboard | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">My Dashboard</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="location.href='cl-quick-capture.html'">+ Log Visit</button>
      </div>
    </div>

    <div class="content">

      <!-- Greeting card -->
      <div style="background:var(--ink);border-radius:var(--r-lg);padding:24px 20px;margin-bottom:20px;position:relative;overflow:hidden;">
        <div style="position:absolute;top:-20px;right:-20px;width:120px;height:120px;border-radius:50%;background:rgba(228,255,151,0.08);pointer-events:none;"></div>
        <div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:8px;">Good morning</div>
        <div style="font-family:var(--serif);font-size:26px;font-weight:400;color:#fff;margin-bottom:4px;" id="greeting-name">Loading...</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.55);" id="greeting-city">Your city &mdash;</div>
        <div style="margin-top:16px;display:flex;align-items:center;gap:8px;">
          <span style="background:var(--chart);color:var(--ink);padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.08em;" id="greeting-streak">Loading...</span>
          <span style="font-size:12px;color:rgba(255,255,255,0.45);">week streak</span>
        </div>
      </div>

      <!-- Stats 2x2 -->
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">My Businesses</div>
          <div class="stat-val" id="stat-biz">Loading...</div>
          <div class="stat-delta pos"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Visits This Week</div>
          <div class="stat-val" id="stat-visits">0</div>
          <div class="stat-delta">Goal: 15</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Follow-Ups Due</div>
          <div class="stat-val" id="stat-followups" style="color:var(--amber)">0</div>
          <div class="stat-delta"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Deals in Pipeline</div>
          <div class="stat-val" id="stat-pipeline">0</div>
          <div class="stat-delta pos"></div>
        </div>
      </div>

      <!-- Quick actions -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;">
        <a href="cl-quick-capture.html" class="btn btn-primary" style="flex-direction:column;gap:6px;padding:16px 8px;min-height:72px;text-align:center;border-radius:var(--r);">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" stroke-linecap="round"/><circle cx="12" cy="10" r="3"/></svg>
          Log a Visit
        </a>
        <a href="cl-search.html" class="btn btn-ghost" style="flex-direction:column;gap:6px;padding:16px 8px;min-height:72px;text-align:center;border-radius:var(--r);">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
          Find Business
        </a>
        <a href="cl-map.html" class="btn btn-ghost" style="flex-direction:column;gap:6px;padding:16px 8px;min-height:72px;text-align:center;border-radius:var(--r);">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" stroke-linecap="round"/></svg>
          Open Map
        </a>
      </div>

      <!-- Next 5 Follow-Ups -->
      <div class="sec-head">
        <h1 style="font-family:var(--serif);font-size:18px;font-weight:400;margin:0;">Next 5 Follow-Ups</h1>
        <div class="sec-head-right">
          <a href="cl-follow-ups.html" class="btn btn-ghost btn-sm">See All</a>
        </div>
      </div>

      <div id="followup-list">
        <div style="text-align:center;color:var(--muted);padding:24px">Loading...</div>
      </div>

      <!-- Pipeline Snapshot -->
      <div class="sec-head" style="margin-top:24px;">
        <h1 style="font-family:var(--serif);font-size:18px;font-weight:400;margin:0;">My Pipeline Snapshot</h1>
        <a href="cl-pipeline.html" class="btn btn-ghost btn-sm">Full Board</a>
      </div>

      <div class="card" style="padding:16px;">
        <div id="pipeline-strip" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">
          <div style="color:var(--muted);font-size:13px;">Loading...</div>
        </div>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /layout -->

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-lead-home');

const user = CL.getUser();
const fullName = user?.user_metadata?.full_name || 'City Lead';
document.getElementById('greeting-name').textContent = fullName;
document.getElementById('greeting-city').textContent = user?.user_metadata?.city ? 'Territory: ' + user.user_metadata.city : 'Your Territory';
document.getElementById('greeting-streak').textContent = '—';

async function loadDashboard() {
  const clId = CL.getCityLeadId();
  if (!clId) return;

  const startOfWeek = new Date();
  startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
  startOfWeek.setHours(0,0,0,0);

  const [bizRes, visitRes, fuRes] = await Promise.all([
    CL.api('city_businesses', { eq: { city_lead_id: clId }, select: 'id,stage,deal_value' }),
    CL.api('city_visits', { eq: { city_lead_id: clId }, select: 'id,visited_at' }),
    CL.api('city_follow_ups', { eq: { city_lead_id: clId, completed: false }, select: 'id,title,due_at,business_id,city_businesses(business_name)', order: 'due_at', asc: true })
  ]);

  const bizData  = bizRes.data  || [];
  const visitData = visitRes.data || [];
  const fuData   = fuRes.data   || [];

  const now = new Date();
  const visitsThisWeek = visitData.filter(v => new Date(v.visited_at) >= startOfWeek).length;
  const overdueCount   = fuData.filter(f => f.due_at && new Date(f.due_at) < now).length;
  const ACTIVE_STAGES  = ['met_owner','second_visit','problem_identified','warm','audit_booked','proposal_sent'];
  const pipelineCount  = bizData.filter(b => ACTIVE_STAGES.includes(b.stage)).length;

  document.getElementById('stat-biz').textContent       = bizData.length;
  document.getElementById('stat-visits').textContent    = visitsThisWeek;
  document.getElementById('stat-followups').textContent = overdueCount;
  document.getElementById('stat-pipeline').textContent  = pipelineCount;

  // Follow-ups list (next 5)
  const upcoming = fuData.slice(0, 5);
  document.getElementById('followup-list').innerHTML = upcoming.length ? upcoming.map(f => {
    const biz = f.city_businesses?.business_name || '—';
    const due = f.due_at ? CL.fmt(f.due_at) : 'No date';
    const isOverdue = f.due_at && new Date(f.due_at) < now;
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);">
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${f.title || biz}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;">${biz} &bull; <span style="color:${isOverdue?'#ef4444':'var(--muted)'}">${due}</span></div>
      </div>
    </div>`;
  }).join('') : '<div style="text-align:center;color:var(--muted);padding:32px 20px;font-size:14px;">No follow-ups due</div>';

  // Pipeline strip
  const STRIP_STAGES = [
    {id:'warm',label:'Warm'},{id:'audit_booked',label:'Audit Booked'},
    {id:'proposal_sent',label:'Proposal'},{id:'closed',label:'Closed'}
  ];
  const counts = {};
  bizData.forEach(b => { counts[b.stage] = (counts[b.stage]||0) + 1; });
  const stripItems = STRIP_STAGES.map(s => {
    const n = counts[s.id] || 0;
    return `<div style="flex:0 0 auto;background:${n>0?'var(--ink)':'var(--bg)'};color:${n>0?'#fff':'var(--ink-2)'};border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 14px;text-align:center;min-width:80px;">
      <div style="font-size:22px;font-weight:700;">${n}</div>
      <div style="font-size:11px;opacity:0.7;margin-top:2px;">${s.label}</div>
    </div>`;
  });
  document.getElementById('pipeline-strip').innerHTML = stripItems.join('') || '<div style="color:var(--muted);font-size:13px;padding:8px 0;">No businesses yet</div>';
}

loadDashboard();
</script>
</body>
</html>
