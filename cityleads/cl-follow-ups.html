<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Follow-Ups | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.fu-section-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.fu-section-label .count-pill{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:700;background:var(--red);color:#fff;line-height:1;}
.fu-section-label.due-today{color:var(--red);}
.fu-section-label.upcoming{color:var(--ink-2);}

.fu-card{border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--line);}
.fu-card.overdue{background:#fff8f8;border-color:#fecaca;}
.fu-card.upcoming-card{background:var(--surface);}
.fu-card.done{opacity:0.45;pointer-events:none;}
.fu-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
.fu-biz-wrap{flex:1;min-width:0;}
.fu-biz{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2;}
.fu-biz-type{font-size:11px;color:var(--muted);margin-top:3px;}
.fu-due{font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;padding:3px 10px;border-radius:999px;}
.fu-due.overdue{background:#fee2e2;color:#b91c1c;}
.fu-due.today{background:var(--chart);color:var(--ink);}
.fu-due.future{background:var(--bg);color:var(--ink-2);border:1px solid var(--line);}

.ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.ai-badge svg{width:12px;height:12px;}

.fu-message{font-size:14px;color:var(--ink-2);line-height:1.55;background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:12px;font-style:italic;}
.fu-message.editable{background:var(--surface);border:1px solid var(--line-strong);outline:none;font-style:normal;font-family:inherit;}

.fu-actions{display:flex;gap:6px;flex-wrap:wrap;}
.fu-actions .btn{font-size:12px;padding:8px 14px;min-height:40px;}

.snooze-opts{display:none;flex-wrap:wrap;gap:6px;margin-top:8px;}
.snooze-opts.show{display:flex;}
.snooze-opt{padding:6px 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:12px;cursor:pointer;background:none;color:var(--ink-2);transition:all 0.12s;min-height:36px;}
.snooze-opt:hover{background:var(--bg);color:var(--ink);}

.empty-section{padding:24px 0;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.empty-section svg{opacity:0.25;}

.section-spacer{height:28px;}

/* Handoffs */
.ho-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.ho-header{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:10px;}
.ho-biz{font-size:15px;font-weight:700;color:var(--ink);}
.ho-biz-type{font-size:12px;color:var(--muted);margin-top:2px;}
.ho-assignee{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-bottom:8px;}
.ho-assignee-avatar{width:22px;height:22px;border-radius:50%;background:var(--chart);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink);}
.ho-notes{font-size:13px;color:var(--ink-2);line-height:1.55;background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;}
.ho-urgency{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
.ho-urgency.this_week{background:#fee2e2;color:#b91c1c;}
.ho-urgency.this_month{background:var(--chart);color:var(--ink);}
.ho-urgency.when_possible{background:var(--bg);color:var(--muted);border:1px solid var(--line);}

/* Referrals */
.ref-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.ref-flow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.ref-biz{font-size:13px;font-weight:700;color:var(--ink);padding:5px 12px;background:var(--bg);border-radius:999px;border:1px solid var(--line);}
.ref-arrow{color:var(--muted);font-size:16px;}
.ref-status-badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
.ref-status-badge.introduced{background:var(--bg);color:var(--muted);border:1px solid var(--line);}
.ref-status-badge.warm{background:var(--chart);color:var(--ink);}
.ref-status-badge.closed{background:#dcfce7;color:#166534;}

/* Relationships */
.rel-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;}
.rel-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.rel-dot.birthday{background:#f59e0b;}
.rel-dot.personal{background:#3b82f6;}
.rel-dot.anniversary{background:#8b5cf6;}
.rel-biz{font-size:14px;font-weight:700;color:var(--ink);}
.rel-note{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.5;}
.rel-date{font-size:11px;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Follow-Ups</span>
      </div>
      <div class="topbar-actions">
        <span style="font-size:12px;color:var(--muted);" id="pending-count"></span>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="showFUTab('followups')">Follow-Ups</button>
      <button class="tab-btn" onclick="showFUTab('handoffs')">Handoffs</button>
      <button class="tab-btn" onclick="showFUTab('referrals')">Referrals</button>
      <button class="tab-btn" onclick="showFUTab('relationships')">Relationships</button>
    </div>

    <div class="content">

      <!-- ── Follow-Ups tab ── -->
      <div id="tab-followups">
      <!-- Due Today -->
      <div class="fu-section-label due-today">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14" stroke-linecap="round"/></svg>
        Due Today
        <span class="count-pill" id="today-count">0</span>
      </div>
      <div id="today-list"></div>

      <div class="section-spacer"></div>

      <!-- Upcoming -->
      <div class="fu-section-label upcoming">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6" stroke-linecap="round"/><line x1="8" y1="2" x2="8" y2="6" stroke-linecap="round"/><line x1="3" y1="10" x2="21" y2="10" stroke-linecap="round"/></svg>
        Upcoming
        <span id="upcoming-count" style="font-size:11px;font-weight:400;color:var(--muted);"></span>
      </div>
      <div id="upcoming-list"></div>
      </div><!-- end tab-followups -->

      <!-- ── Handoffs tab ── -->
      <div id="tab-handoffs" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
          <div style="font-size:13px;color:var(--muted);">Businesses ready to close — pushed to Mia or Tyler.</div>
          <a href="cl-business.html" class="btn btn-primary btn-sm">+ New Handoff</a>
        </div>
        <div id="handoff-list"></div>
      </div>

      <!-- ── Referrals tab ── -->
      <div id="tab-referrals" style="display:none;">
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Owner-to-owner referrals you've set up.</div>
        <div id="referral-list"></div>
      </div>

      <!-- ── Relationships tab ── -->
      <div id="tab-relationships" style="display:none;">
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Birthdays, family details, and personal notes. Remember the person, not just the prospect.</div>
        <div id="rel-list"></div>
      </div>

    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-follow-ups');

const FOLLOWUPS = [];
let cards = [];

async function loadFollowUps() {
  const clId = CL.getCityLeadId();
  if (!clId) return;
  const today0 = new Date(); today0.setHours(0,0,0,0);
  const today1 = new Date(); today1.setHours(23,59,59,999);

  const { data } = await CL.api('city_follow_ups', {
    eq: { city_lead_id: clId, completed: false },
    select: 'id,title,due_at,business_id,city_businesses(business_name,industry)',
    order: 'due_at', asc: true
  });
  if (!data) return;
  FOLLOWUPS.length = 0;
  data.forEach(f => {
    const due = f.due_at ? new Date(f.due_at) : null;
    let dueClass, dueLabel;
    if (!due) { dueClass = 'future'; dueLabel = 'No date'; }
    else if (due < today0) { dueClass = 'overdue'; dueLabel = 'Overdue'; }
    else if (due <= today1) { dueClass = 'today'; dueLabel = 'Today'; }
    else { dueClass = 'future'; dueLabel = CL.fmt(f.due_at); }
    FOLLOWUPS.push({
      id: f.id,
      biz: f.city_businesses?.business_name || '—',
      type: f.city_businesses?.industry || '—',
      dueClass, dueLabel,
      message: f.title || ('Follow up with ' + (f.city_businesses?.business_name || 'this business'))
    });
  });
  cards = FOLLOWUPS.map(f => ({ ...f, status: 'pending' }));
  renderAll();
}
loadFollowUps();

function renderAll() {
  const today = cards.filter(c => c.status !== 'done' && (c.dueClass === 'overdue' || c.dueClass === 'today'));
  const upcoming = cards.filter(c => c.status !== 'done' && c.dueClass === 'future');
  const done = cards.filter(c => c.status === 'done');

  document.getElementById('today-count').textContent = today.length;
  document.getElementById('upcoming-count').textContent = upcoming.length + ' scheduled';
  document.getElementById('pending-count').textContent = (today.length + upcoming.length) + ' pending';

  document.getElementById('today-list').innerHTML = today.length
    ? today.map(renderCard).join('')
    : `<div class="empty-section"><svg width="36" height="36" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2"><polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>You\'re all caught up for today.</div>`;

  document.getElementById('upcoming-list').innerHTML = upcoming.length
    ? upcoming.map(renderCard).join('')
    : `<div class="empty-section">No upcoming follow-ups scheduled.</div>`;
}

function renderCard(f) {
  return `
  <div class="fu-card ${f.dueClass === 'future' ? 'upcoming-card' : 'overdue'}" id="fu-${f.id}">
    <div class="fu-header">
      <div class="fu-biz-wrap">
        <div class="fu-biz">${f.biz}</div>
        <div class="fu-biz-type">${f.type}</div>
      </div>
      <span class="fu-due ${f.dueClass}">${f.dueLabel}</span>
    </div>
    <div class="ai-badge">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke-linecap="round"/></svg>
      AI-drafted message
    </div>
    <div class="fu-message" id="fu-msg-${f.id}" contenteditable="false">${f.message}</div>
    <div class="fu-actions">
      <button class="btn btn-primary" onclick="approve(${f.id})">Approve &amp; Send</button>
      <button class="btn btn-ghost" onclick="editMsg(${f.id})">Edit Message</button>
      <button class="btn btn-ghost" onclick="toggleSnooze(${f.id})">Snooze</button>
      <button class="btn btn-ghost" onclick="markDone(${f.id})">Done</button>
    </div>
    <div class="snooze-opts" id="snooze-${f.id}">
      <button class="snooze-opt" onclick="snooze(${f.id}, '1d')">Tomorrow</button>
      <button class="snooze-opt" onclick="snooze(${f.id}, '3d')">3 Days</button>
      <button class="snooze-opt" onclick="snooze(${f.id}, '1w')">Next Week</button>
      <button class="snooze-opt" onclick="snooze(${f.id}, '2w')">2 Weeks</button>
    </div>
  </div>`;
}

function approve(id) {
  const f = cards.find(c => c.id === id);
  CL.toast('Message approved for ' + f.biz);
  markDone(id);
}

function editMsg(id) {
  const el = document.getElementById('fu-msg-' + id);
  const isEditing = el.contentEditable === 'true';
  if (isEditing) {
    el.contentEditable = 'false';
    el.classList.remove('editable');
    CL.toast('Message updated');
  } else {
    el.contentEditable = 'true';
    el.classList.add('editable');
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    window.getSelection()?.removeAllRanges();
    window.getSelection()?.addRange(range);
  }
}

function toggleSnooze(id) {
  const el = document.getElementById('snooze-' + id);
  el.classList.toggle('show');
}

function snooze(id, duration) {
  const f = cards.find(c => c.id === id);
  const labels = { '1d':'tomorrow', '3d':'in 3 days', '1w':'next week', '2w':'in 2 weeks' };
  f.dueClass = 'future';
  f.dueLabel = 'Snoozed ' + labels[duration];
  CL.toast(f.biz + ' snoozed ' + labels[duration]);
  document.getElementById('snooze-' + id).classList.remove('show');
  renderAll();
}

async function markDone(id) {
  const f = cards.find(c => c.id === id);
  const sb = CL.initSupabase();
  await sb.from('city_follow_ups').update({ completed: true }).eq('id', id);
  f.status = 'done';
  CL.toast(f.biz + ' follow-up marked done');
  renderAll();
}

// Tab switching
const FU_TABS = ['followups','handoffs','referrals','relationships'];
function showFUTab(id) {
  FU_TABS.forEach(t => { document.getElementById('tab-'+t).style.display = t === id ? '' : 'none'; });
  document.querySelectorAll('.tab-btn').forEach((b,i) => { b.classList.toggle('active', FU_TABS[i] === id); });
}

// Handoffs
async function loadHandoffs() {
  const clId = CL.getCityLeadId();
  if (!clId) return;
  const { data } = await CL.api('city_handoffs', {
    eq: { city_lead_id: clId },
    select: 'id,notes,status,assigned_to,deal_value,created_at,business_id,city_businesses(business_name,industry)',
    order: 'created_at', asc: false
  });
  const items = data || [];
  document.getElementById('handoff-list').innerHTML = items.length
    ? items.map(h => `
      <div class="ho-card">
        <div class="ho-header">
          <div><div class="ho-biz">${h.city_businesses?.business_name||'—'}</div><div class="ho-biz-type">${h.city_businesses?.industry||'—'}</div></div>
          <span class="badge badge-${h.status||'in_progress'}">${(h.status||'in progress').replace('_',' ')}</span>
        </div>
        <div class="ho-assignee">
          <div class="ho-assignee-avatar">${(h.assigned_to||'?')[0]}</div>
          Assigned to ${h.assigned_to||'—'} &middot; ${CL.fmt(h.created_at)}
        </div>
        ${h.notes ? `<div class="ho-notes">${h.notes}</div>` : ''}
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="location.href='cl-business.html?id=${h.business_id}'">View Profile</button>
          <button class="btn btn-ghost btn-sm" onclick="CL.toast('Status updated')">Mark Won</button>
        </div>
      </div>`).join('')
    : `<div style="text-align:center;color:var(--muted);padding:32px;">No handoffs yet. When a business is ready to close, add a handoff from their profile.</div>`;
}
loadHandoffs();

// Referrals
async function loadReferrals() {
  const clId = CL.getCityLeadId();
  if (!clId) return;
  const { data } = await CL.api('city_referrals', {
    eq: { city_lead_id: clId },
    select: 'id,referred_name,referred_city,status,notes,created_at,source_business_id,city_businesses(business_name)',
    order: 'created_at', asc: false
  });
  const items = data || [];
  document.getElementById('referral-list').innerHTML = items.length
    ? items.map(r => `
    <div class="ref-card">
      <div class="ref-flow">
        <span class="ref-biz">${r.city_businesses?.business_name||'—'}</span>
        <span class="ref-arrow">→</span>
        <span class="ref-biz">${r.referred_name||'—'}${r.referred_city ? ', '+r.referred_city : ''}</span>
        <span class="ref-status-badge ${r.status||'introduced'}">${r.status||'introduced'}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">${CL.fmt(r.created_at)}</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.5;">${r.notes||''}</div>
    </div>`).join('')
    : `<div style="text-align:center;color:var(--muted);padding:32px;">No referrals yet. When a business owner sends you to another owner, log it here.</div>`;
}
loadReferrals();

// Relationships
const RELS = [];

document.getElementById('rel-list').innerHTML = RELS.length
  ? RELS.map(r => `
  <div class="rel-item">
    <div class="rel-dot ${r.dot}"></div>
    <div>
      <div class="rel-biz">${r.biz} — ${r.owner}</div>
      <div class="rel-note">${r.note}</div>
      <div class="rel-date">${r.date}</div>
    </div>
  </div>`).join('')
  : `<div style="text-align:center;color:var(--muted);padding:32px;">No relationship notes yet. Add birthdays, family details, and personal notes from a business profile.</div>`;
</script>
</body>
</html>
