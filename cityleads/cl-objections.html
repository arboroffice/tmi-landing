<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Objection Library | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.obj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}
.obj-quote{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink-2);padding:18px 18px 12px;line-height:1.4;}
.obj-meaning{font-size:13px;color:var(--muted);padding:0 18px 14px;line-height:1.5;}
.obj-meaning strong{color:var(--ink-2);}
.obj-divider{height:1px;background:var(--line);}
.obj-section{padding:14px 18px;}
.obj-section-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;margin-bottom:10px;}
.obj-section-label.say{color:#16a34a;}
.obj-section-label.nosay{color:var(--red);}
.obj-response{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;color:var(--ink);line-height:1.65;margin-bottom:8px;}
.obj-response:last-child{margin-bottom:0;}
.obj-response-num{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.nosay-box{background:#fff5f5;border:1px solid #fecaca;border-radius:var(--r-sm);padding:12px 14px;font-size:14px;color:#7f1d1d;line-height:1.65;}
.success-rate{display:flex;gap:4px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);}
.success-label{font-size:11px;color:var(--muted);margin-right:4px;}
.dot-rate{width:10px;height:10px;border-radius:50%;background:var(--line-strong);}
.dot-rate.fill{background:var(--green);}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:12px;cursor:pointer;background:none;color:var(--ink-2);font-family:inherit;transition:all 0.12s;min-height:36px;white-space:nowrap;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Objection Library</span>
      </div>
    </div>

    <div class="content">

      <div class="sec-head" style="margin-bottom:6px;">
        <h1>What to say when they push back</h1>
      </div>
      <p style="font-size:14px;color:var(--muted);margin-bottom:20px;">Every objection is information. Use it.</p>

      <div class="filter-chips" id="filter-chips">
        <button class="chip active" onclick="setFilter(this,'all')">All</button>
        <button class="chip" onclick="setFilter(this,'too-busy')">Too Busy</button>
        <button class="chip" onclick="setFilter(this,'no-ai')">Don't Need AI</button>
        <button class="chip" onclick="setFilter(this,'tried-that')">Tried That</button>
        <button class="chip" onclick="setFilter(this,'too-expensive')">Too Expensive</button>
        <button class="chip" onclick="setFilter(this,'call-later')">Call Me Later</button>
        <button class="chip" onclick="setFilter(this,'not-decision-maker')">Not My Call</button>
      </div>

      <div id="objections-list"></div>

    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-objections');

const OBJECTIONS = [
  {
    id: 'too-busy',
    quote: '"I don\'t have time for this right now."',
    meaning: 'Usually means: I don\'t trust that this is worth my time. Busy is real, but it\'s also the default deflection. The question is whether you\'ve made it feel worth the interruption.',
    responses: [
      'That\'s fair — I\'m not here to take an hour. Honestly, 10 minutes is enough for me to show you if this is relevant to you. If it\'s not, I won\'t be back. If it is, we can figure out the right next step. When do you have 10 minutes this week?',
      'I hear you. What I\'ll do is come back [specific day] when you\'re not in the middle of something. Just need 10 minutes — you decide if it\'s worth more.',
    ],
    nosay: '"I\'ll be quick" — because everyone who says that isn\'t. "Just one question" — also not quick. Don\'t minimize your ask; give them a real time estimate they can plan around.',
    rate: 2,
  },
  {
    id: 'no-ai',
    quote: '"We don\'t really need AI. We\'ve got our process."',
    meaning: 'They heard "AI" and thought: expensive experiment, crew won\'t use it, another app to babysit. This is often a problem with how the conversation started. Don\'t defend AI. Talk about what the problem costs.',
    responses: [
      'That makes sense — most of the owners I work with said the same thing. What I\'d ask is: how\'s the job costing working right now? When a job goes over, how do you know and when do you find out? [Let them answer.] That\'s the specific problem we\'re built to close.',
      'You\'re right — I shouldn\'t have said AI. That\'s not really what this is. What we do is build operational systems for trade companies. The question isn\'t whether you need AI — it\'s whether there\'s a gap between what your business does and what you can actually see from the inside.',
    ],
    nosay: '"Actually AI is really important right now" or any sentence that starts with defending the technology. You\'ll lose them. Get back to the specific problem.',
    rate: 3,
  },
  {
    id: 'tried-that',
    quote: '"We tried something like this before. Didn\'t stick."',
    meaning: 'This is actually a warm signal — they cared enough to try. The real question is why it failed. Most of the time: crew didn\'t adopt it, too much admin to set up, or it didn\'t match how they actually work. Ask before defending.',
    responses: [
      '"What happened?" [Then stop talking. This question alone is worth five minutes of their time. What they tell you is your pitch for why TMI is different.] "That\'s exactly the problem we built around. The reason most apps don\'t stick is [specific thing they said]. Here\'s how we handle that."',
      '"Most of the companies we work with said the same thing. We\'re specifically built to work the way your crew already operates — not to force a new workflow. Can I show you the difference in 15 minutes?"',
    ],
    nosay: '"We\'re different" before you\'ve listened to why the last thing failed. You don\'t know you\'re different until you know what broke.',
    rate: 3,
  },
  {
    id: 'too-expensive',
    quote: '"That sounds expensive."',
    meaning: 'Usually means: I don\'t see the ROI yet. They don\'t know the price — they\'re just pattern-matching from past tech purchases that didn\'t pay off. The job is to connect cost to what the problem is actually costing them today.',
    responses: [
      '"I haven\'t told you the price yet — so let me ask: what does [the problem they mentioned] cost you right now? In time, in missed revenue, in crew hours? That\'s the math we start with, and then the price conversation makes a lot more sense."',
      '"Fair concern. Most owners I work with thought the same thing before they saw the numbers. What I\'d ask is — if this fixed [specific problem they mentioned], what would that be worth to you in a month? Just a rough guess. [Let them answer.] That\'s the conversation worth having before we ever talk price."',
    ],
    nosay: 'The actual price before they\'ve articulated the cost of the problem. Price without context is always expensive. Make them feel the problem first.',
    rate: 2,
  },
  {
    id: 'call-later',
    quote: '"Call me in a few months — we\'re in our busy season."',
    meaning: 'Sometimes legitimate timing. More often: a polite exit with no hard feelings. The key is to leave something specific behind so that when you do call back, it\'s a continuation of a real conversation, not a cold call.',
    responses: [
      '"Absolutely — I won\'t bother you during the rush. When does your busy season wrap up? [Get a month.] I\'ll put it in my calendar and reach out [month]. In the meantime, is it okay if I shoot you a text every few weeks so you don\'t forget who I am?"',
      '"That makes total sense. One quick thing before I let you go — what\'s the thing you\'re most looking forward to fixing when things slow down? [Let them answer.] Perfect. That\'s exactly what I want to show you when you\'re ready."',
    ],
    nosay: '"I\'ll follow up" without locking in a specific date and a reason to call. Vague follow-up is forgotten follow-up.',
    rate: 2,
  },
  {
    id: 'not-decision-maker',
    quote: '"You\'d have to talk to my business partner / owner / boss."',
    meaning: 'They\'re telling you they can\'t say yes. But they might be able to get you in the room with someone who can. Work with what you have — don\'t dismiss the person in front of you.',
    responses: [
      '"Totally understand — I\'d love to get in front of them. Would it be weird to ask them directly, or would it help if you introduced me? I can make it easy for you — I won\'t put you in an awkward spot."',
      '"Makes sense. Is there a time when you\'d both be around? Even 15 minutes with both of you in the room would be enough. You could be the one who brought this to them."',
    ],
    nosay: '"Can I just get their contact info?" — that puts the gatekeeper in a difficult spot. Make them feel like the hero of the introduction, not a step in your process.',
    rate: 2,
  },
];

let activeFilter = 'all';

function setFilter(btn, filter) {
  document.querySelectorAll('#filter-chips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = filter;
  renderObjections();
}

function getFiltered() {
  if (activeFilter === 'all') return OBJECTIONS;
  return OBJECTIONS.filter(o => o.id === activeFilter);
}

function renderDots(n) {
  return [1,2,3].map(i => `<div class="dot-rate ${i <= n ? 'fill' : ''}"></div>`).join('');
}

function renderObjections() {
  const objs = getFiltered();
  const list = document.getElementById('objections-list');
  if (!objs.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🤔</div><h3>Nothing here yet</h3><p>More objection responses coming soon.</p></div>`;
    return;
  }
  list.innerHTML = objs.map(o => `
    <div class="obj-card">
      <div class="obj-quote">${o.quote}</div>
      <div class="obj-meaning"><strong>What it usually means:</strong> ${o.meaning}</div>
      <div class="obj-divider"></div>
      <div class="obj-section">
        <div class="obj-section-label say">What to say</div>
        ${o.responses.map((r, i) => `
          <div class="obj-response">
            <div class="obj-response-num">Option ${i + 1}</div>
            ${r}
          </div>`).join('')}
      </div>
      <div class="obj-divider"></div>
      <div class="obj-section">
        <div class="obj-section-label nosay">What NOT to say</div>
        <div class="nosay-box">${o.nosay}</div>
      </div>
      <div class="success-rate">
        <span class="success-label">Success rate:</span>
        ${renderDots(o.rate)}
        <span style="font-size:11px;color:var(--muted);margin-left:6px;">${o.rate === 3 ? 'High' : o.rate === 2 ? 'Medium' : 'Situational'}</span>
      </div>
    </div>`).join('');
}

renderObjections();
</script>
</body>
</html>
