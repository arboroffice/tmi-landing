<style>
  :root{
    --bg:#f4f5ef;--card:#ffffff;--ink:#0a0b14;--ink-2:#454654;--muted:#7c7d89;
    --line:rgba(10,11,20,0.10);--line-2:rgba(10,11,20,0.16);
    --chart:#E4FF97;--chart-d:#c8ec6f;--dark:#0a0b14;
    --blue:#2f6bd6;--amber:#c98a12;--purple:#7a5bd0;--red:#d1483a;--green:#3f8f2a;
    --sans:"Barlow",system-ui,-apple-system,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:12px;background:#fff;color:var(--ink);}
  input:focus,select,textarea:focus,button:focus-visible{outline:2px solid var(--chart-d);outline-offset:1px;}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
  .field{margin-bottom:14px;}
  a{color:inherit;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--chart);color:#0a0b14;font-weight:800;font-size:15px;padding:14px 18px;border-radius:12px;width:100%;transition:filter .1s,transform .05s;}
  .btn:active{transform:scale(0.99);} .btn:disabled{opacity:0.5;}
  .btn.dark{background:var(--dark);color:#fff;}
  .btn.ghost{background:#fff;border:1px solid var(--line-2);color:var(--ink);font-weight:700;}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:10px;}
  .btn.rec{background:var(--red);color:#fff;}

  /* login */
  #login{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px 24px calc(28px + var(--safe-b));background:var(--dark);color:#fff;}
  #login .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-0.02em;margin-bottom:6px;}
  #login .brand .m{width:34px;height:34px;border-radius:8px;background:var(--chart);color:#0a0b14;display:grid;place-items:center;font-size:15px;font-weight:900;}
  #login h1{font-size:30px;font-weight:800;letter-spacing:-0.03em;margin:24px 0 6px;}
  #login p{color:rgba(255,255,255,0.62);margin:0 0 26px;font-size:15px;}
  #login label{color:rgba(255,255,255,0.6);}
  #login input{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.16);color:#fff;}
  #login .err{color:#ffb4ab;font-size:13px;min-height:18px;margin:4px 0 12px;}

  /* app shell */
  #app{display:none;flex-direction:column;height:100%;}
  .topbar{position:sticky;top:0;z-index:20;padding:calc(14px + var(--safe-t)) 18px 12px;background:rgba(244,245,239,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .topbar .m{width:28px;height:28px;border-radius:7px;background:var(--dark);color:var(--chart);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none;}
  .topbar h2{font-size:19px;font-weight:800;letter-spacing:-0.02em;margin:0;flex:1;}
  .topbar .who{font-size:12px;color:var(--muted);font-weight:600;}

  #view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(96px + var(--safe-b));}
  .screen{display:none;} .screen.on{display:block;}

  /* bottom tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,0.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);}
  .tab{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:0.02em;}
  .tab .ic{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tab.on{color:var(--ink);} .tab.on .ic{stroke:var(--ink);}
  .tab.add{color:#0a0b14;} .tab.add .badge{width:44px;height:44px;border-radius:50%;background:var(--chart);display:grid;place-items:center;margin-top:-14px;box-shadow:0 8px 20px rgba(0,0,0,0.18);}
  .tab.add .badge .ic{width:26px;height:26px;stroke:#0a0b14;stroke-width:2.4;}

  /* cards + bits */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;}
  .stat .n{font-size:28px;font-weight:900;letter-spacing:-0.03em;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.2;}
  .h-eyebrow{font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:20px 2px 10px;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}

  .lead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
  .lead:active{background:#fafbf6;}
  .lead .body{flex:1;min-width:0;}
  .lead .name{font-weight:700;font-size:15.5px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lead .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap;color:#fff;}
  .chip.new{background:var(--muted);} .chip.attempted{background:var(--amber);} .chip.contacted{background:var(--blue);}
  .chip.booked{background:var(--green);} .chip.callback{background:var(--purple);} .chip.not_interested{background:#9aa;color:#fff;}
  .chip.won{background:#186b1e;} .chip.lost{background:var(--red);}

  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;}
  .filters button{flex:none;font-size:12.5px;font-weight:700;color:var(--ink-2);background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;}
  .filters button.on{background:var(--dark);color:#fff;border-color:var(--dark);}
  .search{margin-bottom:8px;}

  /* map */
  #map{width:100%;height:calc(100vh - 220px);min-height:340px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:#dfe1d8;}
  .map-actions{display:flex;gap:8px;margin-bottom:10px;}

  /* sheet (lead detail) */
  .sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;}
  .sheet.on{display:flex;}
  .sheet-top{position:sticky;top:0;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);}
  .sheet-top h3{flex:1;font-size:18px;font-weight:800;letter-spacing:-0.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sheet-body{flex:1;overflow-y:auto;padding:16px 16px calc(28px + var(--safe-b));}
  .x{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center;font-size:20px;color:var(--ink);flex:none;}
  .quickact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px;}
  .quickact a{display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:12px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);}
  .statuses{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px;}
  .statuses button{font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);}
  .statuses button.on{color:#fff;border-color:transparent;}
  .note-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:14px;}
  .note-item .t{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .recbar{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:0.3;}}
  @media(prefers-reduced-motion:reduce){.recbar .dot{animation:none;}}

  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--dark);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center;}
  .toast.on{opacity:1;}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

<!-- LOGIN -->

<script>
const API = '';
let TOKEN = '';
let ME = null, LEADS = [], FILTER = 'all', SEARCH = '', SORT = 'recent';
function haversine(la1,lo1,la2,lo2){ const R=3958.8,toR=x=>x*Math.PI/180; const dLa=toR(la2-la1),dLo=toR(lo2-lo1); const a=Math.sin(dLa/2)**2+Math.cos(toR(la1))*Math.cos(toR(la2))*Math.sin(dLo/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
let map = null, markers = [], meMarker = null, lastPos = null, dirRenderer = null, geocoder = null, gInfo = null;

const $ = (s, r=document) => r.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const STATUS = ['new','attempted','contacted','booked','callback','not_interested','won','lost'];
const STATUS_LABEL = {new:'New',attempted:'Attempted',contacted:'Contacted',booked:'Booked',callback:'Callback',not_interested:'Not interested',won:'Won',lost:'Lost'};
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2400); }

async function api(path, opts={}){
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  // Always send a fresh Firebase ID token (auto-refreshes before expiry).
  try { if(window.fbAuth && window.fbAuth.currentUser) TOKEN = await window.fbAuth.currentUser.getIdToken(); } catch(e){}
  if(TOKEN) h.Authorization = 'Bearer '+TOKEN;
  const res = await fetch(API+path, Object.assign({}, opts, {headers:h}));
  if(res.status===401){ logout(); throw new Error('Session expired, sign in again'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('Error '+res.status));
  return data;
}

/* ---- auth ---- */
function authError(ex){
  const c = (ex && ex.code) || '';
  if(c==='auth/invalid-email') return 'That email looks invalid.';
  if(c==='auth/user-disabled') return 'This account is disabled. Contact the office.';
  if(c==='auth/user-not-found'||c==='auth/wrong-password'||c==='auth/invalid-credential') return 'Wrong email or password.';
  if(c==='auth/too-many-requests') return 'Too many tries. Wait a minute and try again.';
  if(c==='auth/network-request-failed') return 'Network problem. Check your connection.';
  return (ex && ex.message) || 'Sign in failed';
}
$('#loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=$('#lBtn'), err=$('#lErr'); err.textContent='';
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const email=$('#lEmail').value.trim(), pass=$('#lPass').value;
  try{
    await window.fbAuth.signInWithEmailAndPassword(email, pass);
    // Success -> onAuthStateChanged fires next and boots the app.
  }catch(ex){
    // Transition fallback: rep not in Firebase Auth yet -> try the legacy login,
    // whose token the backend still accepts. Removed once all reps are on Firebase.
    try{
      const r = await fetch('/api/rep-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Sign in failed');
      TOKEN=d.token; ME=d.rep; await boot();
    }catch(ex2){
      err.textContent=authError(ex);
    }
    btn.disabled=false; btn.textContent='Sign in';
  }
});
async function logout(){ TOKEN=''; ME=null; try{ await window.fbAuth.signOut(); }catch(e){} $('#app').style.display='none'; $('#login').style.display='flex'; }

async function boot(){
  try{
    if(!ME) ME = await api('/api/rep-me');
    $('#login').style.display='none'; $('#app').style.display='flex';
    $('#whoami').textContent = (ME.name||'').split(' ')[0] + (ME.city?(' · '+ME.city):'');
    await loadLeads();
    switchTab('today');
  }catch(ex){ logout(); }
}

async function loadLeads(){
  try{ LEADS = await api('/api/rep-leads'); }catch(ex){ LEADS=[]; toast(ex.message); }
}

/* ---- tabs ---- */
const TITLES = {today:'Today',leads:'My Leads',map:'Map',log:'Log a Lead',me:'Me',plan:'Day Plan'};
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('#s-'+tab).classList.add('on');
  $('#screenTitle').textContent = TITLES[tab];
  $('#view').scrollTop=0;
  if(tab==='today') renderToday();
  if(tab==='leads') renderLeads();
  if(tab==='log') renderLog();
  if(tab==='me') renderMe();
  if(tab==='plan') renderPlan();
  if(tab==='map') setTimeout(initMap,50);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

/* ---- Today ---- */
function isToday(iso){ if(!iso) return false; const d=new Date(iso), n=new Date(); return d.toDateString()===n.toDateString(); }
function dueToday(l){ if(!l.next_action_at) return false; return new Date(l.next_action_at) <= new Date() && !['won','lost','not_interested'].includes(l.status); }
function renderToday(){
  const loggedToday = LEADS.filter(l=>isToday(l.created_at)).length;
  const booked = LEADS.filter(l=>l.status==='booked'||l.status==='won').length;
  const due = LEADS.filter(dueToday);
  const rot = LEADS.filter(l=>isWarm(l)&&l.status==='new'&&l.created_at&&(Date.now()-new Date(l.created_at).getTime())>5*864e5);
  const s=$('#s-today');
  s.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="n">${loggedToday}</div><div class="l">Logged today</div></div>
      <div class="stat"><div class="n">${booked}</div><div class="l">Audits booked</div></div>
      <div class="stat"><div class="n">${due.length}</div><div class="l">Follow-ups due</div></div>
    </div>
    <button class="btn" id="tLog">Log a walk-in</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="tMap">Open the map</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="tPlan">📋 Today's game plan</button>
    ${rot.length?`<div class="card" id="tRot" style="background:#fbeceb;color:#7a241c;font-weight:700;cursor:pointer;margin-top:14px;">⚠ ${rot.length} warm lead${rot.length===1?'':'s'} going cold — untouched 5+ days. Tap to work them.</div>`:''}
    <div class="h-eyebrow">Follow-ups due</div>
    <div id="tDue"></div>`;
  $('#tLog').onclick=()=>switchTab('log');
  $('#tMap').onclick=()=>switchTab('map');
  $('#tPlan').onclick=()=>switchTab('plan');
  const rb=$('#tRot'); if(rb) rb.onclick=()=>{ FILTER='warm'; switchTab('leads'); renderLeads(); };
  const box=$('#tDue');
  if(!due.length){ box.innerHTML='<div class="empty">Nothing due. Go knock some doors.</div>'; }
  else due.sort((a,b)=>new Date(a.next_action_at)-new Date(b.next_action_at)).forEach(l=>box.appendChild(leadRow(l)));
}

/* ---- Day Plan (oil & gas + industrial, Acadiana) ---- */
function renderPlan(){
  const todays = LEADS.filter(l=>isToday(l.created_at));
  const doors = todays.length;
  const convos = todays.filter(l=>['contacted','booked','callback','won'].includes(l.status)).length;

function isWarm(l){ return l.priority==='hot' || l.priority==='warm' || l.source==='assigned'; }
function leadRow(l){
  const dist=(l._dist!=null&&isFinite(l._dist))?l._dist.toFixed(1)+' mi':'';
  const owner=(l.contact_name&&l.business_name)?l.contact_name:'';
  const sub=[dist,l.context||l.industry,owner,l.phone].filter(Boolean).join(' · ')||'Tap to open';
  const warm = isWarm(l) ? `<span class="chip" style="background:#E4FF97;color:#0a0b14;font-weight:700;">${l.priority==='hot'?'HOT':'Warm'}</span>` : '';
  const node = el(`<div class="lead"><div class="body"><div class="name">${esc(l.business_name||l.contact_name||'Untitled')}</div><div class="sub">${esc(sub)}</div></div>${warm}<span class="chip ${l.status}">${STATUS_LABEL[l.status]||l.status}</span></div>`);
  node.addEventListener('click',()=>openLead(l.id));
  return node;
}
function renderLeads(){
  const s=$('#s-leads');
  s.innerHTML = `
    <input class="search" id="leadSearch" type="search" placeholder="Search leads" value="${esc(SEARCH)}"/>
    <div class="filters" style="padding-bottom:4px"><button id="srtR" class="${SORT==='recent'?'on':''}">Recent</button><button id="srtN" class="${SORT==='near'?'on':''}">Nearest</button></div>
    <div class="filters" id="leadFilters"></div>
    <div id="leadList"></div>`;
  const fils=['all','warm','new','attempted','contacted','callback','booked','won','not_interested','lost'];
  const fbox=$('#leadFilters');
  fils.forEach(f=>{ const label=f==='all'?'All':(f==='warm'?'★ Warm':(STATUS_LABEL[f]||f)); const b=el(`<button class="${f===FILTER?'on':''}">${label}</button>`); b.onclick=()=>{FILTER=f; renderLeads();}; fbox.appendChild(b); });
  $('#srtR').onclick=()=>{ SORT='recent'; renderLeads(); };
  $('#srtN').onclick=async()=>{ if(!lastPos){ try{ lastPos=await getPos(); }catch(e){ toast('Turn on location to sort by nearest'); return; } } SORT='near'; renderLeads(); };
  $('#leadSearch').addEventListener('input',(e)=>{ SEARCH=e.target.value; drawLeadList(); });
  drawLeadList();
}
function drawLeadList(){
  const box=$('#leadList'); if(!box) return; box.innerHTML='';
  let rows = LEADS.slice();
  if(FILTER==='warm') rows=rows.filter(l=>isWarm(l) && !['won','lost','not_interested'].includes(l.status));
  else if(FILTER!=='all') rows=rows.filter(l=>l.status===FILTER);
  const q=SEARCH.trim().toLowerCase();
  if(q) rows=rows.filter(l=>[l.business_name,l.contact_name,l.phone,l.address,l.industry,l.notes,l.context].filter(Boolean).join(' ').toLowerCase().includes(q));
  if(SORT==='near' && lastPos){
    rows.forEach(l=>{ l._dist=(l.lat!=null&&l.lng!=null)?haversine(lastPos.coords.latitude,lastPos.coords.longitude,l.lat,l.lng):Infinity; });
    rows.sort((a,b)=>(a._dist)-(b._dist));
  } else {
    rows.forEach(l=>{ delete l._dist; });
    // Warm, not-yet-worked leads bubble to the top (stable sort keeps recency otherwise).
    const score=l=>(isWarm(l)&&l.status==='new')?(l.priority==='hot'?2:1):0;
    rows.sort((a,b)=>score(b)-score(a));
  }
  if(!rows.length){ box.innerHTML='<div class="empty">No leads here yet.</div>'; return; }
  rows.forEach(l=>box.appendChild(leadRow(l)));
}

// Speak a lead: record -> transcribe -> AI extracts fields -> prefill the form.
function wireLeadDictation(btn, state){
  let rec=null, chunks=[], stream=null;
  btn.onclick=async()=>{
    if(rec && rec.state==='recording'){ rec.stop(); return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Recording not supported'); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(ex){ toast('Microphone blocked'); return; }
    chunks=[]; rec=new MediaRecorder(stream);
    rec.ondataavailable=(e)=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop()); btn.classList.remove('rec'); btn.textContent='🎤 Speak a new lead';
      state.innerHTML='<span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:#0a0b14"></span> Reading it back…';
      try{
        const dataUrl=await blobToDataUrl(new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||'audio/webm'}));
        const r=await api('/api/rep-transcribe',{method:'POST',body:JSON.stringify({audio:dataUrl,intent:'new_lead'})});
        state.textContent='';
        const L=r.lead||{};
        const set=(id,v)=>{ const e=$(id); if(e && v) e.value=v; };
        set('#f_business',L.business_name); set('#f_contact',L.contact_name); set('#f_phone',L.phone); set('#f_industry',L.industry);
        if(L.status){ const sel=$('#f_status'); if(sel) sel.value=L.status; }
        if(L.notes){ const n=$('#f_notes'); n.value=(n.value?n.value+'\n':'')+L.notes; }
        toast(L.business_name?('Got it: '+L.business_name):'Filled what I caught');
      }catch(ex){ state.textContent=''; toast(ex.message); }
    };
    rec.start(); btn.classList.add('rec'); btn.innerHTML='Stop';
    state.innerHTML='<span class="recbar" style="margin:0"><span class="dot"></span> Listening</span>';
  };
}

/* ---- Recorder: transcribe (Deepgram) + AI recap ---- */
function wireRecorder(btn, state, leadId, onResult){
  let rec=null, chunks=[], stream=null, t0=0, tick=null;
  const label = btn.textContent || 'Record interaction';
  btn.onclick=async()=>{
    if(rec && rec.state==='recording'){ rec.stop(); return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Recording not supported on this browser'); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(ex){ toast('Microphone blocked'); return; }
    chunks=[]; rec=new MediaRecorder(stream); t0=Date.now();
    rec.ondataavailable=(e)=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(tick);
      btn.classList.remove('rec'); btn.textContent=label;
      const blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||'audio/webm'});
      const dur=Math.round((Date.now()-t0)/1000);
      state.innerHTML='<span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:#0a0b14"></span> Transcribing &amp; summarizing...';
      try{
        const dataUrl=await blobToDataUrl(blob);
        const r=await api('/api/rep-transcribe',{method:'POST',body:JSON.stringify({audio:dataUrl,lead_id:leadId,duration:dur})});
        state.textContent='';
        if((r.transcript && r.transcript.trim()) || r.summary){ onResult(r); }
        else toast('Nothing caught, try again');
      }catch(ex){ state.textContent=''; toast(ex.message); }
    };
    rec.start();
    btn.classList.add('rec'); btn.innerHTML='Stop &amp; save';
    const render=()=>{ const s=Math.round((Date.now()-t0)/1000); const mm=String(Math.floor(s/60)).padStart(1,'0'), ss=String(s%60).padStart(2,'0'); state.innerHTML='<span class="recbar" style="margin:0"><span class="dot"></span> Recording '+mm+':'+ss+'</span>'; };
    render(); tick=setInterval(render,1000);
  };
}
function outcomeLabel(o){ return ({booked:'Booked',interested:'Interested',follow_up:'Follow up',not_interested:'Not interested',no_decision:'No decision'})[o]||o||''; }
function blobToDataUrl(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
/* ---- Photos (downscale client-side, upload via server to Firebase Storage) ---- */
function downscaleImage(file,maxDim,quality){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.width,h=img.height; const scale=Math.min(1,(maxDim||1280)/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',quality||0.8)); };
    img.onerror=rej; img.src=url;
  });
}
async function addPhoto(leadId,input){
  const f=input.files&&input.files[0]; if(!f) return;
  toast('Uploading photo…');
  try{ const dataUrl=await downscaleImage(f,1280,0.8); await api('/api/rep-photo',{method:'POST',body:JSON.stringify({image:dataUrl,lead_id:leadId})}); toast('Photo added'); loadPhotos(leadId); }
  catch(ex){ toast(ex.message||'Upload failed'); }
  input.value='';
}
async function loadPhotos(leadId){
  const box=$('#dPhotos'); if(!box) return;
  let rows=[]; try{ rows=await api('/api/rep-photo?lead_id='+encodeURIComponent(leadId)); }catch(e){ return; }
  if(!rows||!rows.length){ box.innerHTML=''; return; }
  box.innerHTML=rows.slice(0,12).map(p=>'<a href="'+p.url+'" target="_blank" rel="noopener" style="display:block;width:72px;height:72px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--line)"><img src="'+p.url+'" style="width:100%;height:100%;object-fit:cover" loading="lazy"/></a>').join('');
}
async function loadInteractions(leadId){
  const box=document.getElementById('dTimeline'); if(!box) return;
  let rows=[];
  try{ rows=await api('/api/rep-interactions?lead_id='+encodeURIComponent(leadId)); }catch(e){ return; }
  if(!rows || !rows.length){ box.innerHTML=''; return; }
  box.innerHTML='<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;">Interaction history</div>'+
    rows.slice(0,20).map(x=>{
      const when=x.created_at?new Date(x.created_at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
      const oc=x.outcome?('<span style="font-weight:700">'+esc(outcomeLabel(x.outcome))+'</span> · '):'';
      const body=x.summary||x.transcript||'';
      return '<div style="border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:var(--card)"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+oc+esc(when)+'</div><div style="font-size:13.5px;color:var(--ink);line-height:1.5">'+esc(body)+'</div>'+(x.next_step?('<div style="font-size:12.5px;color:var(--ink-2);margin-top:5px">Next: '+esc(x.next_step)+'</div>'):'')+'</div>';
    }).join('');
}

/* ---- Arrival check-in + add-to-calendar ---- */
async function checkIn(l){
  toast('Checking in…');
  try{
    const p=await getPos();
    const patch={id:l.id,lat:p.coords.latitude,lng:p.coords.longitude};
    if(l.status==='new') patch.status='attempted';
    const up=await api('/api/rep-leads',{method:'PATCH',body:JSON.stringify(patch)});
    mergeLead(up); openLead(l.id); toast('Checked in here');
  }catch(ex){ toast('Turn on location to check in'); }
}
function addToCalendar(l){
  if(!l.next_action_at){ toast('Set a follow-up date first'); return; }
  const d=String(l.next_action_at).slice(0,10).replace(/-/g,'');
  const nx=new Date(l.next_action_at); nx.setDate(nx.getDate()+1); const d2=nx.toISOString().slice(0,10).replace(/-/g,'');
  const title='Follow up: '+(l.business_name||l.contact_name||'lead');
  const details=[l.contact_name&&('Contact: '+l.contact_name),l.phone&&('Phone: '+l.phone),l.notes].filter(Boolean).join('\n');
  const u='https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent(title)+'&dates='+d+'/'+d2+
    '&details='+encodeURIComponent(details||'')+'&location='+encodeURIComponent(l.address||'');
  window.open(u,'_blank','noopener');
}

/* ---- On-the-spot enrichment (Google Places) ---- */
function enrichLead(l){
  if(typeof google==='undefined'||!google.maps||!google.maps.places){ toast('Enrichment still loading, try again'); return; }
  toast('Looking up '+(l.business_name||'business')+'…');
  const svc=new google.maps.places.PlacesService(document.createElement('div'));
  const query=[l.business_name,l.address||l.industry,'Louisiana'].filter(Boolean).join(' ');
  svc.textSearch({query},(results,status)=>{
    if(status!=='OK'||!results||!results[0]){ toast('No public match found'); return; }
    svc.getDetails({placeId:results[0].place_id,fields:['name','formatted_phone_number','international_phone_number','website','formatted_address','geometry']},(d,st)=>{
      if(st!=='OK'||!d){ toast('No details found'); return; }
      const patch={}; const ph=d.formatted_phone_number||d.international_phone_number;
      if(ph && !l.phone) patch.phone=ph;
      if(d.formatted_address && !l.address) patch.address=d.formatted_address;
      if(d.geometry&&d.geometry.location){ patch.lat=d.geometry.location.lat(); patch.lng=d.geometry.location.lng(); }
      if(d.website){ patch.notes=(l.notes?l.notes+'\n':'')+'Website: '+d.website; }
      if(!Object.keys(patch).length){ toast('Nothing new to add'); return; }
      patch.id=l.id;
      api('/api/rep-leads',{method:'PATCH',body:JSON.stringify(patch)}).then(up=>{ mergeLead(up); openLead(l.id); toast('Enriched from Google'); }).catch(ex=>toast(ex.message));
    });
  });
}

/* ---- Map (Google Maps) ---- */
function getPos(){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej(new Error('No GPS')); navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:8000,maximumAge:30000}); }); }
function statusColor(s){ return ({new:'#7c7d89',attempted:'#c98a12',contacted:'#2f6bd6',booked:'#3f8f2a',callback:'#7a5bd0',not_interested:'#9aa',won:'#186b1e',lost:'#d1483a'})[s]||'#7c7d89'; }
function dot(color,size){ return {path:google.maps.SymbolPath.CIRCLE,scale:size||7,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}; }
function initMap(){
  if(!window.__gmapsReady || typeof google==='undefined' || !google.maps){ setTimeout(initMap,300); return; }
  if(!map){
    map=new google.maps.Map(document.getElementById('map'),{center:{lat:30.22,lng:-92.02},zoom:11,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',clickableIcons:false});
    dirRenderer=new google.maps.DirectionsRenderer({map,suppressMarkers:true,polylineOptions:{strokeColor:'#0a0b14',strokeWeight:5,strokeOpacity:.85}});
    geocoder=new google.maps.Geocoder();
    gInfo=new google.maps.InfoWindow();
    getPos().then(p=>{ lastPos=p; map.setCenter({lat:p.coords.latitude,lng:p.coords.longitude}); map.setZoom(13); drawMe(p); }).catch(()=>{});
    geocodeMissing();
  }
  drawPins();
}
function drawPins(){
  if(!map) return;
  markers.forEach(m=>m.setMap(null)); markers=[];
  const bounds=new google.maps.LatLngBounds(); let n=0;
  LEADS.filter(l=>l.lat!=null&&l.lng!=null).forEach(l=>{
    const pos={lat:Number(l.lat),lng:Number(l.lng)};
    const mk=new google.maps.Marker({position:pos,map,icon:dot(statusColor(l.status), isWarm(l)&&l.status==='new'?9:7),title:l.business_name||l.contact_name||'Lead'});
    mk.addListener('click',()=>{ gInfo.setContent('<div style="font-weight:700;font-size:13px">'+esc(l.business_name||l.contact_name||'Lead')+'</div><div style="font-size:12px;color:#555">'+esc([l.industry,l.address].filter(Boolean).join(' · '))+'</div><a href="#" id="iwOpen" style="font-size:12px;color:#1d4ed8;font-weight:600">Open →</a>'); gInfo.open(map,mk); setTimeout(()=>{ const a=document.getElementById('iwOpen'); if(a) a.onclick=(e)=>{e.preventDefault();openLead(l.id);}; },50); });
    markers.push(mk); bounds.extend(pos); n++;
  });
  if(n && !lastPos){ try{ map.fitBounds(bounds); }catch(e){} }
}
function drawMe(p){ const pos={lat:p.coords.latitude,lng:p.coords.longitude}; if(meMarker) meMarker.setMap(null); meMarker=new google.maps.Marker({position:pos,map,icon:dot('#2f6bd6',6),zIndex:999}); }

// Geocode assigned leads that have an address but no coordinates, and persist.
async function geocodeMissing(){
  if(!geocoder) return;
  const todo=LEADS.filter(l=>(l.lat==null||l.lng==null)&&l.address).slice(0,12);
  for(const l of todo){
    await new Promise(r=>{
      geocoder.geocode({address:l.address+', Louisiana'},(res,status)=>{
        if(status==='OK'&&res[0]){ const loc=res[0].geometry.location; l.lat=loc.lat(); l.lng=loc.lng();
          api('/api/rep-leads',{method:'PATCH',body:JSON.stringify({id:l.id,lat:l.lat,lng:l.lng})}).catch(()=>{}); }
        setTimeout(r,220);
      });
    });
  }
  if(todo.length) drawPins();
}

// Optimize today's driving route across actionable stops (round trip from you).
async function optimizeRoute(){
  const panel=$('#routePanel'); const btn=$('#routeBtn');
  if(!map){ toast('Open the map first'); return; }
  let origin=lastPos?{lat:lastPos.coords.latitude,lng:lastPos.coords.longitude}:null;
  if(!origin){ try{ const p=await getPos(); lastPos=p; origin={lat:p.coords.latitude,lng:p.coords.longitude}; drawMe(p); }catch(e){ toast('Turn on location to build a route'); return; } }
  const stops=LEADS.filter(l=>l.lat!=null&&l.lng!=null && ['new','attempted','callback','contacted'].includes(l.status));
  if(!stops.length){ toast('No open stops with a location yet'); return; }
  if(stops.length>23) stops.length=23;
  btn.disabled=true; btn.textContent='Optimizing…';
  const ds=new google.maps.DirectionsService();
  ds.route({origin,destination:origin,travelMode:'DRIVING',optimizeWaypoints:true,
    waypoints:stops.map(l=>({location:{lat:Number(l.lat),lng:Number(l.lng)},stopover:true}))},(result,status)=>{
    btn.disabled=false; btn.textContent='Optimize route';
    if(status!=='OK'||!result){ toast('Route failed: '+status+(status==='REQUEST_DENIED'?' (enable Directions API)':'')); return; }
    dirRenderer.setDirections(result);
    const order=result.routes[0].waypoint_order;
    const legs=result.routes[0].legs;
    let meters=0,secs=0; legs.forEach(lg=>{ meters+=lg.distance.value; secs+=lg.duration.value; });
    const miles=(meters/1609.34).toFixed(1); const mins=Math.round(secs/60);
    const ordered=order.map((idx,i)=>{ const l=stops[idx]; return '<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><div style="flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">'+(i+1)+'</div><div style="min-width:0"><div style="font-weight:700;font-size:14px" onclick="openLead(\''+l.id+'\')">'+esc(l.business_name||l.contact_name||'Lead')+'</div><div style="font-size:12px;color:var(--muted)">'+esc(l.address||l.industry||'')+'</div></div></div>'; }).join('');
    const navUrl='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+origin.lat+','+origin.lng+'&destination='+origin.lat+','+origin.lng+'&waypoints='+order.map(idx=>stops[idx].lat+','+stops[idx].lng).join('%7C');
    panel.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-weight:800">'+order.length+' stops · '+miles+' mi · '+mins+' min</div><a class="btn sm" href="'+navUrl+'" target="_blank" rel="noopener" style="text-decoration:none">Navigate →</a></div>'+ordered+'</div>';
  });
}

$('#locateBtn').onclick=async()=>{ try{ const p=await getPos(); lastPos=p; map.setCenter({lat:p.coords.latitude,lng:p.coords.longitude}); map.setZoom(14); drawMe(p); }catch(ex){ toast('Location blocked'); } };
$('#routeBtn').onclick=optimizeRoute;
$('#addHereBtn').onclick=()=>switchTab('log');

/* ---- Me ---- */
function dayKey(d){ d=new Date(d); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function calcStreak(){
  const days=new Set(LEADS.filter(l=>l.created_at).map(l=>dayKey(l.created_at)));
  const d=new Date(); d.setHours(0,0,0,0);
  if(!days.has(dayKey(d))){ d.setDate(d.getDate()-1); if(!days.has(dayKey(d))) return 0; }
  let streak=0; while(days.has(dayKey(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function renderMe(){
  const s=$('#s-me');
  const total=LEADS.length;
  const booked=LEADS.filter(l=>l.status==='booked'||l.status==='won').length;
  const wonLeads=LEADS.filter(l=>l.status==='won');
  const today=LEADS.filter(l=>isToday(l.created_at)).length;
  const weekAgo=Date.now()-7*864e5;
  const week=LEADS.filter(l=>l.created_at&&new Date(l.created_at).getTime()>=weekAgo).length;
  const warmLeft=LEADS.filter(l=>isWarm(l)&&l.status==='new').length;
  const conv=total?Math.round((booked/total)*100):0;
  const dealTotal=wonLeads.reduce((a,l)=>a+(Number(l.deal_value)||0),0);
  const commission=Math.round(dealTotal*0.20);
  const money=n=>'$'+Math.round(n||0).toLocaleString();
  const GOAL=20; const goalPct=Math.min(100,Math.round((today/GOAL)*100));
  const streak=calcStreak();
  s.innerHTML=`
    <div class="card">
      <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em">${esc(ME.name||'')}</div>
      <div style="color:var(--muted);font-size:14px;margin-top:2px">${esc(ME.email||'')}${ME.city?(' · '+esc(ME.city)):''}</div>
    </div>
    <div class="card" style="background:var(--ink);color:#fff">
      <div style="font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.07em">Commission earned</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px">${money(commission)}</div>
      <div style="font-size:12px;opacity:.65;margin-top:2px">20% of ${money(dealTotal)} won · ${wonLeads.length} deal${wonLeads.length===1?'':'s'}</div>
    </div>
    ${warmLeft?`<div class="card" id="meWarm" style="background:#E4FF97;color:#0a0b14;font-weight:800;cursor:pointer;text-align:center;">★ ${warmLeft} warm lead${warmLeft===1?'':'s'} waiting — tap to work them</div>`:''}
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>Today's goal</span><span>${today}/${GOAL} doors</span></div>
      <div style="height:9px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden"><div style="height:100%;width:${goalPct}%;background:#3f8f2a"></div></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:9px">🔥 ${streak}-day streak</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="n">${today}</div><div class="l">Logged today</div></div>
      <div class="stat"><div class="n">${week}</div><div class="l">This week</div></div>
      <div class="stat"><div class="n">${total}</div><div class="l">Total leads</div></div>
      <div class="stat"><div class="n">${booked}</div><div class="l">Booked / won</div></div>
      <div class="stat"><div class="n">${wonLeads.length}</div><div class="l">Won</div></div>
      <div class="stat"><div class="n">${conv}%</div><div class="l">Book rate</div></div>
    </div>
    <div class="card" id="meBoard"><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">This week's leaderboard</div><div style="font-size:13px;color:var(--muted);margin-top:8px">Loading…</div></div>
    <button class="btn ghost" id="meRefresh">Refresh</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="meOut" style="color:var(--red)">Sign out</button>`;
  const w=$('#meWarm'); if(w) w.onclick=()=>{ FILTER='warm'; switchTab('leads'); renderLeads(); };
  $('#meRefresh').onclick=async()=>{ await loadLeads(); toast('Up to date'); renderMe(); };
  $('#meOut').onclick=logout;
  loadLeaderboard();
}
async function loadLeaderboard(){
  const box=$('#meBoard'); if(!box) return;
  let rows=[]; try{ rows=await api('/api/rep-leaderboard'); }catch(e){ box.innerHTML=''; return; }
  if(!rows || !rows.length){ box.innerHTML=''; return; }
  box.innerHTML='<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">This week\'s leaderboard</div>'+
    rows.slice(0,8).map(r=>'<div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;'+(r.isMe?'background:#E4FF97;':'')+'"><div style="width:20px;font-weight:800;color:var(--ink-2)">'+r.rank+'</div><div style="flex:1;font-size:14px;font-weight:'+(r.isMe?'800':'600')+'">'+esc((r.name||'').split(' ')[0])+(r.isMe?' (you)':'')+'</div><div style="font-size:12px;color:var(--ink-2)">'+r.won+'W · '+r.booked+'B · '+r.visits+'V</div></div>').join('');
}

/* ---- start ---- */
window.fbAuth.onAuthStateChanged(async (user)=>{
  const btn=$('#lBtn');
  if(user){
    try{ TOKEN = await user.getIdToken(); ME=null; await boot(); }
    catch(ex){ $('#lErr').textContent = authError(ex); }
    if(btn){ btn.disabled=false; btn.textContent='Sign in'; }
  } else {
    TOKEN=''; ME=null; $('#app').style.display='none'; $('#login').style.display='flex';
    if(btn){ btn.disabled=false; btn.textContent='Sign in'; }
  }
});

if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/cityleads/sw.js').catch(()=>{}); }); }
