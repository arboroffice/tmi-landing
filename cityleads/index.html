<style>
  :root{
    --bg:#f4f5ef;--card:#ffffff;--ink:#0a0b14;--ink-2:#454654;--muted:#7c7d89;
    --line:rgba(10,11,20,0.10);--line-2:rgba(10,11,20,0.16);
    --chart:#E4FF97;--chart-d:#c8ec6f;--dark:#0a0b14;
    --blue:#2f6bd6;--amber:#c98a12;--purple:#7a5bd0;--red:#d1483a;--green:#3f8f2a;
    --sans:"Barlow",system-ui,-apple-system,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:12px;background:#fff;color:var(--ink);}
  input:focus,select,textarea:focus,button:focus-visible{outline:2px solid var(--chart-d);outline-offset:1px;}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
  .field{margin-bottom:14px;}
  a{color:inherit;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--chart);color:#0a0b14;font-weight:800;font-size:15px;padding:14px 18px;border-radius:12px;width:100%;transition:filter .1s,transform .05s;}
  .btn:active{transform:scale(0.99);} .btn:disabled{opacity:0.5;}
  .btn.dark{background:var(--dark);color:#fff;}
  .btn.ghost{background:#fff;border:1px solid var(--line-2);color:var(--ink);font-weight:700;}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:10px;}
  .btn.rec{background:var(--red);color:#fff;}

  /* login */
  #login{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px 24px calc(28px + var(--safe-b));background:var(--dark);color:#fff;}
  #login .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-0.02em;margin-bottom:6px;}
  #login .brand .m{width:34px;height:34px;border-radius:8px;background:var(--chart);color:#0a0b14;display:grid;place-items:center;font-size:15px;font-weight:900;}
  #login h1{font-size:30px;font-weight:800;letter-spacing:-0.03em;margin:24px 0 6px;}
  #login p{color:rgba(255,255,255,0.62);margin:0 0 26px;font-size:15px;}
  #login label{color:rgba(255,255,255,0.6);}
  #login input{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.16);color:#fff;}
  #login .err{color:#ffb4ab;font-size:13px;min-height:18px;margin:4px 0 12px;}

  /* app shell */
  #app{display:none;flex-direction:column;height:100%;}
  .topbar{position:sticky;top:0;z-index:20;padding:calc(14px + var(--safe-t)) 18px 12px;background:rgba(244,245,239,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .topbar .m{width:28px;height:28px;border-radius:7px;background:var(--dark);color:var(--chart);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none;}
  .topbar h2{font-size:19px;font-weight:800;letter-spacing:-0.02em;margin:0;flex:1;}
  .topbar .who{font-size:12px;color:var(--muted);font-weight:600;}

  #view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(96px + var(--safe-b));}
  .screen{display:none;} .screen.on{display:block;}

  /* bottom tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,0.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);}
  .tab{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:0.02em;}
  .tab .ic{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tab.on{color:var(--ink);} .tab.on .ic{stroke:var(--ink);}
  .tab.add{color:#0a0b14;} .tab.add .badge{width:44px;height:44px;border-radius:50%;background:var(--chart);display:grid;place-items:center;margin-top:-14px;box-shadow:0 8px 20px rgba(0,0,0,0.18);}
  .tab.add .badge .ic{width:26px;height:26px;stroke:#0a0b14;stroke-width:2.4;}

  /* cards + bits */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;}
  .stat .n{font-size:28px;font-weight:900;letter-spacing:-0.03em;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.2;}
  .h-eyebrow{font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:20px 2px 10px;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}

  .lead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
  .lead:active{background:#fafbf6;}
  .lead .body{flex:1;min-width:0;}
  .lead .name{font-weight:700;font-size:15.5px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lead .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap;color:#fff;}
  .chip.new{background:var(--muted);} .chip.attempted{background:var(--amber);} .chip.contacted{background:var(--blue);}
  .chip.booked{background:var(--green);} .chip.callback{background:var(--purple);} .chip.not_interested{background:#9aa;color:#fff;}
  .chip.won{background:#186b1e;} .chip.lost{background:var(--red);}

  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;}
  .filters button{flex:none;font-size:12.5px;font-weight:700;color:var(--ink-2);background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;}
  .filters button.on{background:var(--dark);color:#fff;border-color:var(--dark);}
  .search{margin-bottom:8px;}

  /* map */
  #map{width:100%;height:calc(100vh - 220px);min-height:340px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:#dfe1d8;}
  .map-actions{display:flex;gap:8px;margin-bottom:10px;}

  /* sheet (lead detail) */
  .sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;}
  .sheet.on{display:flex;}
  .sheet-top{position:sticky;top:0;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);}
  .sheet-top h3{flex:1;font-size:18px;font-weight:800;letter-spacing:-0.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sheet-body{flex:1;overflow-y:auto;padding:16px 16px calc(28px + var(--safe-b));}
  .x{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center;font-size:20px;color:var(--ink);flex:none;}
  .quickact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px;}
  .quickact a{display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:12px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);}
  .statuses{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px;}
  .statuses button{font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);}
  .statuses button.on{color:#fff;border-color:transparent;}
  .note-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:14px;}
  .note-item .t{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .recbar{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:0.3;}}
  @media(prefers-reduced-motion:reduce){.recbar .dot{animation:none;}}
  /* Global floating recorder bar: always visible while recording, so the rep
     can keep using the app and stop from anywhere. */
  #recBar{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));z-index:120;display:none;align-items:center;gap:12px;background:var(--dark);color:#fff;border-radius:14px;padding:12px 15px;box-shadow:0 14px 44px rgba(0,0,0,.4);}
  #recBar.on{display:flex;}
  #recBar .dot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;flex:none;}
  @media(prefers-reduced-motion:reduce){#recBar .dot{animation:none;}}
  #recBar .lbl{font-size:14px;font-weight:600;flex:1;display:flex;align-items:center;gap:9px;}
  #recBar .lbl b{font-variant-numeric:tabular-nums;}
  #recBar button{background:var(--red);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;flex:none;}
  #recBar.busy button{opacity:.55;pointer-events:none;}

  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--dark);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center;}
  .toast.on{opacity:1;}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>

<script>
const API = '';
let TOKEN = '';
let ME = null, LEADS = [], FILTER = 'all', SEARCH = '', SORT = 'recent';
let LEADVIEW = 'list';        // 'list' | 'board' (Kanban)
let LB_RANGE = 'week';        // leaderboard window: week | month | all
let heatLayer = null, heatOn = false;
function haversine(la1,lo1,la2,lo2){ const R=3958.8,toR=x=>x*Math.PI/180; const dLa=toR(la2-la1),dLo=toR(lo2-lo1); const a=Math.sin(dLa/2)**2+Math.cos(toR(la1))*Math.cos(toR(la2))*Math.sin(dLo/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
let map = null, markers = [], meMarker = null, lastPos = null, dirRenderer = null, geocoder = null, gInfo = null;

const $ = (s, r=document) => r.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const STATUS = ['new','attempted','contacted','booked','callback','not_interested','won','lost'];
const STATUS_LABEL = {new:'New',attempted:'Attempted',contacted:'Contacted',booked:'Booked',callback:'Callback',not_interested:'Not interested',won:'Won',lost:'Lost'};
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2400); }

async function api(path, opts={}){
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  // Always send a fresh Firebase ID token (auto-refreshes before expiry).
  try { if(window.fbAuth && window.fbAuth.currentUser) TOKEN = await window.fbAuth.currentUser.getIdToken(); } catch(e){}
  if(TOKEN) h.Authorization = 'Bearer '+TOKEN;
  const res = await fetch(API+path, Object.assign({}, opts, {headers:h}));
  if(res.status===401){ logout(); throw new Error('Session expired, sign in again'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('Error '+res.status));
  return data;
}

/* ---- Offline write queue ----
   Reps work basements, rural yards, dead zones. Writes that fail on the network
   are stashed in localStorage and replayed automatically when the connection
   returns. Reads still need signal; writes never get lost. */
const OQ_KEY = 'cl_offline_queue';
function oqLoad(){ try{ return JSON.parse(localStorage.getItem(OQ_KEY)||'[]'); }catch(e){ return []; } }
function oqSave(q){ try{ localStorage.setItem(OQ_KEY, JSON.stringify(q)); }catch(e){} paintPending(); }
function oqAdd(path, method, body){ const q=oqLoad(); q.push({path,method,body,ts:Date.now()}); oqSave(q); }
function oqCount(){ return oqLoad().length; }
function isOffline(ex){ return !navigator.onLine || (ex && /Failed to fetch|NetworkError|network request failed/i.test(ex.message||'')); }
function paintPending(){
  const n=oqCount(); document.querySelectorAll('[data-pending]').forEach(el=>{ el.textContent = n?('• '+n+' unsynced'):''; });
}
async function flushQueue(){
  if(!navigator.onLine) return;
  let q=oqLoad(); if(!q.length) return;
  const keep=[]; let done=0;
  for(const item of q){
    try{ await api(item.path,{method:item.method,body:JSON.stringify(item.body)}); done++; }
    catch(ex){ if(isOffline(ex)) keep.push(item); /* server rejects (4xx/5xx) are dropped, not retried forever */ }
  }
  oqSave(keep);
  if(done){ await loadLeads(); toast(done+' offline change'+(done===1?'':'s')+' synced'); refreshCurrent(); }
}
window.addEventListener('online', flushQueue);

// Write helper for rep-leads: online -> real result; offline -> queue + optimistic.
// Returns { lead, queued }.
async function writeLead(method, body, optimistic){
  if(navigator.onLine){
    try{ const lead=await api('/api/rep-leads',{method,body:JSON.stringify(body)}); return {lead, queued:false}; }
    catch(ex){ if(!isOffline(ex)) throw ex; }
  }
  oqAdd('/api/rep-leads', method, body);
  return { lead: optimistic || null, queued:true };
}

/* ---- Follow-up cadence: auto-schedule the next touch when a status changes,
   so warm leads never rot. Only fills an empty slot; never overrides a date the
   rep set by hand. ---- */
const CADENCE = { attempted:2, contacted:3, callback:1, booked:7 };
function cadenceDate(status){
  const days = CADENCE[status]; if(days==null) return undefined;
  const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10);
}

/* ---- Log a manual call/text/note interaction against a lead ---- */
async function logInteraction(leadId, channel, opts){
  opts=opts||{};
  const body=Object.assign({lead_id:leadId, channel}, opts);
  if(navigator.onLine){
    try{
      const r=await api('/api/rep-interactions',{method:'POST',body:JSON.stringify(body)});
      if(r && r.lead) mergeLead(r.lead);
      return r;
    }catch(ex){ if(!isOffline(ex)) throw ex; }
  }
  oqAdd('/api/rep-interactions','POST',body);
  return {queued:true};
}

/* ---- Web push opt-in ---- */
function urlB64ToUint8(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b64=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b64); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
async function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification==='undefined') return 'unsupported';
  if(Notification.permission==='denied') return 'blocked';
  try{ const reg=await navigator.serviceWorker.ready; const s=await reg.pushManager.getSubscription(); return s?'on':'off'; }
  catch(e){ return 'off'; }
}
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){ toast('Notifications not supported here'); return; }
  let cfg; try{ cfg=await api('/api/rep-push'); }catch(e){ toast('Could not reach the server'); return; }
  if(!cfg.enabled||!cfg.publicKey){ toast('Notifications are not set up yet'); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast('Notifications blocked'); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(cfg.publicKey)});
    await api('/api/rep-push',{method:'POST',body:JSON.stringify({subscription:sub.toJSON()})});
    toast('Notifications on'); renderMe();
  }catch(ex){ toast(ex.message||'Could not enable notifications'); }

/* ---- auth ---- */
function authError(ex){
  const c = (ex && ex.code) || '';
  if(c==='auth/invalid-email') return 'That email looks invalid.';
  if(c==='auth/user-disabled') return 'This account is disabled. Contact the office.';
  if(c==='auth/user-not-found'||c==='auth/wrong-password'||c==='auth/invalid-credential') return 'Wrong email or password.';
  if(c==='auth/too-many-requests') return 'Too many tries. Wait a minute and try again.';
  if(c==='auth/network-request-failed') return 'Network problem. Check your connection.';
  return (ex && ex.message) || 'Sign in failed';
}
$('#loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=$('#lBtn'), err=$('#lErr'); err.textContent='';
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const email=$('#lEmail').value.trim(), pass=$('#lPass').value;
  try{
    await window.fbAuth.signInWithEmailAndPassword(email, pass);
    // Success -> onAuthStateChanged fires next and boots the app.
  }catch(ex){
    // Transition fallback: rep not in Firebase Auth yet -> try the legacy login,
    // whose token the backend still accepts. Removed once all reps are on Firebase.
    try{
      const r = await fetch('/api/rep-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Sign in failed');
      TOKEN=d.token; ME=d.rep; await boot();
    }catch(ex2){
      err.textContent=authError(ex);
    }
    btn.disabled=false; btn.textContent='Sign in';
  }
});

/* ---- Today ---- */
function isToday(iso){ if(!iso) return false; const d=new Date(iso), n=new Date(); return d.toDateString()===n.toDateString(); }
function dueToday(l){ if(!l.next_action_at) return false; return new Date(l.next_action_at) <= new Date() && !['won','lost','not_interested'].includes(l.status); }
// One signal, one action. The single highest-priority move right now, from this
// rep's own leads. Mirrors the OS Pulse pattern in the field tool.
function todayMove(){
  const nm=l=>l.contact_name||l.business_name||'this lead';
  const cold=LEADS.filter(l=>isWarm(l)&&l.status==='new'&&l.created_at&&(Date.now()-new Date(l.created_at).getTime())>5*864e5);
  if(cold.length) return {t:'Save a warm lead going cold',d:nm(cold[0])+' has been untouched 5+ days. Reach out before it dies.',lead:cold[0].id};
  const due=LEADS.filter(dueToday).sort((a,b)=>new Date(a.next_action_at)-new Date(b.next_action_at));
  if(due.length){ const l=due[0]; return {t:'Follow-up due now',d:nm(l)+(l.business_name&&l.contact_name?(' at '+l.business_name):'')+' is due. Call or text.',lead:l.id}; }
  const cb=LEADS.filter(l=>l.status==='callback');
  if(cb.length) return {t:'Chase a callback',d:nm(cb[0])+' asked for a callback. Close the loop.',lead:cb[0].id};
  const warm=LEADS.filter(l=>isWarm(l)&&l.status==='new');
  if(warm.length) return {t:'Work a warm lead',d:nm(warm[0])+' is warm and waiting. Go get the audit booked.',lead:warm[0].id};
  if(!LEADS.filter(l=>isToday(l.created_at)).length) return {t:'Log your first door',d:'No doors logged yet today. Walk your cluster and log the first one.',go:'log'};
  return {t:'You are on track',d:'Nothing overdue. Keep walking your cluster and book an audit.',go:'plan'};
}

async function moveLeadStatus(l, st){

  try{

    mergeLead(lead||opt); drawBoard();

function drawLeadList(){
  const box=$('#leadList'); if(!box) return; box.innerHTML='';
  let rows = LEADS.slice();
  if(FILTER==='warm') rows=rows.filter(l=>isWarm(l) && !['won','lost','not_interested'].includes(l.status));
  else if(FILTER!=='all') rows=rows.filter(l=>l.status===FILTER);
  const q=SEARCH.trim().toLowerCase();
  if(q) rows=rows.filter(l=>[l.business_name,l.contact_name,l.phone,l.address,l.industry,l.notes,l.context].filter(Boolean).join(' ').toLowerCase().includes(q));
  if(SORT==='near' && lastPos){
    rows.forEach(l=>{ l._dist=(l.lat!=null&&l.lng!=null)?haversine(lastPos.coords.latitude,lastPos.coords.longitude,l.lat,l.lng):Infinity; });
    rows.sort((a,b)=>(a._dist)-(b._dist));
  } else {
    rows.forEach(l=>{ delete l._dist; });
    // Warm, not-yet-worked leads bubble to the top (stable sort keeps recency otherwise).
    const score=l=>(isWarm(l)&&l.status==='new')?(l.priority==='hot'?2:1):0;
    rows.sort((a,b)=>score(b)-score(a));
  }
  if(!rows.length){ box.innerHTML='<div class="empty">No leads here yet.</div>'; return; }
  rows.forEach(l=>box.appendChild(leadRow(l)));
}

// Speak a lead: record -> transcribe -> AI extracts fields -> prefill the form.
function wireLeadDictation(btn, state){
  let rec=null, chunks=[], stream=null;
  btn.onclick=async()=>{
    if(rec && rec.state==='recording'){ rec.stop(); return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Recording not supported'); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(ex){ toast('Microphone blocked'); return; }
    chunks=[]; rec=new MediaRecorder(stream);
    rec.ondataavailable=(e)=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop()); btn.classList.remove('rec'); btn.textContent='🎤 Speak a new lead';
      state.innerHTML='<span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:#0a0b14"></span> Reading it back…';
      try{
        const dataUrl=await blobToDataUrl(new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||'audio/webm'}));
        const r=await api('/api/rep-transcribe',{method:'POST',body:JSON.stringify({audio:dataUrl,intent:'new_lead'})});
        state.textContent='';
        const L=r.lead||{};
        const set=(id,v)=>{ const e=$(id); if(e && v) e.value=v; };
        set('#f_business',L.business_name); set('#f_contact',L.contact_name); set('#f_phone',L.phone); set('#f_industry',L.industry);
        if(L.status){ const sel=$('#f_status'); if(sel) sel.value=L.status; }
        if(L.notes){ const n=$('#f_notes'); n.value=(n.value?n.value+'\n':'')+L.notes; }
        toast(L.business_name?('Got it: '+L.business_name):'Filled what I caught');
      }catch(ex){ state.textContent=''; toast(ex.message); }
    };
    rec.start(1000); btn.classList.add('rec'); btn.innerHTML='Stop';
    state.innerHTML='<span class="recbar" style="margin:0"><span class="dot"></span> Listening</span>';
  };
}

/* ---- Recorder: one global recording at a time ----
   Records with a 1s timeslice (so nothing is lost if interrupted), holds a
   screen Wake Lock so the phone will not sleep and kill the mic, and shows a
   floating Stop bar that survives tab switches so the rep can keep using the
   app and stop from anywhere. Deepgram transcribes + Claude recaps on stop. */
const Rec = {
  active:false, busy:false, rec:null, stream:null, chunks:[], t0:0, tick:null, wake:null, onResult:null, leadId:null, mime:'audio/webm',
  supported(){ return !!(navigator.mediaDevices && window.MediaRecorder); },
  async start(leadId, onResult){
    if(this.active || this.busy){ toast('Already recording'); return; }
    if(!this.supported()){ toast('Recording not supported on this browser'); return; }
    let stream;
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(ex){ toast('Microphone blocked'); return; }
    this.stream=stream; this.chunks=[]; this.leadId=leadId||null; this.onResult=onResult||null; this.t0=Date.now();
    let mime=''; try{ mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t))||''; }catch(_){}
    try{ this.rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(_){ this.rec = new MediaRecorder(stream); }
    this.mime = (this.rec && this.rec.mimeType) || mime || 'audio/webm';
    this.rec.ondataavailable=(e)=>{ if(e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.onstop=()=>this._finish();
    try{ this.rec.start(1000); }catch(_){ try{ this.rec.start(); }catch(e2){ toast('Could not start recording'); this._cleanup(); return; } }
    this.active=true; this._wake(); this._bar('rec');
    this.tick=setInterval(()=>this._tick(),500); this._tick(); this._reflect();
  },
  stop(){
    if(!this.active) return;
    this.active=false; this.busy=true;
    clearInterval(this.tick); this._release(); this._bar('busy'); this._reflect();
    try{ if(this.rec && this.rec.state!=='inactive') this.rec.stop(); else this._finish(); }
    catch(_){ this._finish(); }
  },
  async _finish(){
    try{ if(this.stream) this.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
    const chunks=this.chunks, mime=this.mime, t0=this.t0, onResult=this.onResult, leadId=this.leadId;
    try{
      const blob=new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||mime});
      const dur=Math.round((Date.now()-t0)/1000);
      const dataUrl=await blobToDataUrl(blob);
      const r=await api('/api/rep-transcribe',{method:'POST',body:JSON.stringify({audio:dataUrl,lead_id:leadId,duration:dur})});
      if((r.transcript && r.transcript.trim()) || r.summary){ try{ if(onResult) onResult(r); }catch(_){ toast('Interaction saved'); } }
      else toast('Nothing caught, try again');
    }catch(ex){ toast((ex && ex.message) || 'Upload failed'); }
    this._cleanup();
  },
  _cleanup(){ this.busy=false; this.active=false; this.rec=null; this.stream=null; this.chunks=[]; this.onResult=null; this.leadId=null; this._bar('off'); this._reflect(); },
  _tick(){ const s=Math.max(0,Math.round((Date.now()-this.t0)/1000)); const mm=Math.floor(s/60), ss=String(s%60).padStart(2,'0'); const el=$('#recBarTime'); if(el) el.textContent=mm+':'+ss; },
  _bar(mode){ const b=$('#recBar'); if(!b) return; const lbl=b.querySelector('.lbl'); if(mode==='off'){ b.classList.remove('on','busy'); return; } b.classList.add('on'); if(mode==='rec'){ b.classList.remove('busy'); if(lbl) lbl.innerHTML='Recording <b id="recBarTime">0:00</b>'; } else if(mode==='busy'){ b.classList.add('busy'); if(lbl) lbl.innerHTML='<span class="spin"></span> Transcribing…'; } },
  _reflect(){ document.querySelectorAll('[data-rec-btn]').forEach(btn=>{ btn.classList.toggle('rec', this.active); btn.textContent = this.active ? 'Stop recording' : (btn.getAttribute('data-rec-label')||'Record interaction'); }); },
  async _wake(){ try{ if('wakeLock' in navigator){ this.wake=await navigator.wakeLock.request('screen'); } }catch(_){} },
  _release(){ try{ if(this.wake){ this.wake.release(); } }catch(_){} this.wake=null; },
};

/* ---- Photos (downscale client-side, upload via server to Firebase Storage) ---- */
function downscaleImage(file,maxDim,quality){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.width,h=img.height; const scale=Math.min(1,(maxDim||1280)/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',quality||0.8)); };
    img.onerror=rej; img.src=url;
  });
}

/* ---- On-the-spot enrichment (Google Places) ---- */
function enrichLead(l){
  if(typeof google==='undefined'||!google.maps||!google.maps.places){ toast('Enrichment still loading, try again'); return; }
  toast('Looking up '+(l.business_name||'business')+'…');

  const query=[l.business_name,l.address||l.industry,'Louisiana'].filter(Boolean).join(' ');
  svc.textSearch({query},(results,status)=>{
    if(status!=='OK'||!results||!results[0]){ toast('No public match found'); return; }
    svc.getDetails({placeId:results[0].place_id,fields:['name','formatted_phone_number','international_phone_number','website','formatted_address','geometry']},(d,st)=>{
      if(st!=='OK'||!d){ toast('No details found'); return; }

      if(d.website){ patch.notes=(l.notes?l.notes+'\n':'')+'Website: '+d.website; }
      if(!Object.keys(patch).length){ toast('Nothing new to add'); return; }
      patch.id=l.id;

}

// Geocode assigned leads that have an address but no coordinates, and persist.
async function geocodeMissing(){

  }

async function optimizeRoute(){
  const panel=$('#routePanel'); const btn=$('#routeBtn');

  const days=new Set(LEADS.filter(l=>l.created_at).map(l=>dayKey(l.created_at)));
  const d=new Date(); d.setHours(0,0,0,0);
  if(!days.has(dayKey(d))){ d.setDate(d.getDate()-1); if(!days.has(dayKey(d))) return 0; }
  let streak=0; while(days.has(dayKey(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700"><span>This month's goal</span><button id="meEarnEdit" style="font-size:12px;color:var(--blue);font-weight:700">${money(monthCommission)} / ${money(earnGoal)}</button></div>
      <div style="height:9px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden"><div style="height:100%;width:${earnPct}%;background:var(--dark)"></div></div>
      <div style="font-size:12px;color:var(--muted);margin-top:9px">On pace for about ${money(projected)} this month. Tap the number to set your target.</div>
    </div>
    ${warmLeft?`<div class="card" id="meWarm" style="background:#E4FF97;color:#0a0b14;font-weight:800;cursor:pointer;text-align:center;">★ ${warmLeft} warm lead${warmLeft===1?'':'s'} waiting — tap to work them</div>`:''}
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>Today's goal</span><span>${today}/${GOAL} doors</span></div>
      <div style="height:9px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden"><div style="height:100%;width:${goalPct}%;background:#3f8f2a"></div></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:9px">🔥 ${streak}-day streak</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="n">${today}</div><div class="l">Logged today</div></div>
      <div class="stat"><div class="n">${week}</div><div class="l">This week</div></div>
      <div class="stat"><div class="n">${total}</div><div class="l">Total leads</div></div>
      <div class="stat"><div class="n">${booked}</div><div class="l">Booked / won</div></div>
      <div class="stat"><div class="n">${wonLeads.length}</div><div class="l">Won</div></div>
      <div class="stat"><div class="n">${conv}%</div><div class="l">Book rate</div></div>
    </div>
    ${stageCard}
    <div class="card">
      <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Badges</div>
      <div style="display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px">${badgeHtml}</div>
    </div>
    <div class="card" id="mePush">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><div style="font-weight:700;font-size:14px">Notifications</div><div style="font-size:12px;color:var(--muted)" id="mePushState">Follow-up nudges and warm-lead alerts.</div></div>
        <button class="btn ghost sm" id="mePushBtn" style="flex:none">Enable</button>
      </div>
    </div>
    <div class="card" id="meHD"><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Your Human Design</div><div style="font-size:13px;color:var(--muted);margin-top:8px">Loading…</div></div>
    <div class="card" id="meBoard"><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Leaderboard</div><div style="font-size:13px;color:var(--muted);margin-top:8px">Loading…</div></div>
    <button class="btn ghost" id="meRefresh">Refresh</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="meOut" style="color:var(--red)">Sign out</button>`;
  const w=$('#meWarm'); if(w) w.onclick=()=>{ FILTER='warm'; switchTab('leads'); renderLeads(); };
  const ee=$('#meEarnEdit'); if(ee) ee.onclick=()=>{ const v=prompt('Set your monthly commission goal ($):', String(earnGoal)); if(v==null) return; const n=parseInt(String(v).replace(/[^0-9]/g,''),10); if(Number.isFinite(n)&&n>0){ localStorage.setItem('cl_earn_goal',String(n)); renderMe(); } };
  const pb=$('#mePushBtn'); if(pb){ pushState().then(st=>{
    if(st==='unsupported'){ pb.style.display='none'; $('#mePushState').textContent='Not supported on this device.'; }
    else if(st==='blocked'){ pb.textContent='Blocked'; pb.disabled=true; $('#mePushState').textContent='Turn notifications on in your phone settings.'; }
    else if(st==='on'){ pb.textContent='Turn off'; pb.onclick=disablePush; $('#mePushState').textContent='On — you\'ll get daily nudges.'; }
    else { pb.textContent='Enable'; pb.onclick=enablePush; }
  }); }
  $('#meRefresh').onclick=async()=>{ await loadLeads(); toast('Up to date'); renderMe(); };
  $('#meOut').onclick=logout;
  loadLeaderboard();
  loadRepHD();
}
async function loadLeaderboard(){
  const box=$('#meBoard'); if(!box) return;
  let data; try{ data=await api('/api/rep-leaderboard?range='+LB_RANGE); }catch(e){ box.innerHTML=''; return; }
  const rows=(data&&data.rows)||[];
  const label = LB_RANGE==='week'?'This week':(LB_RANGE==='month'?'This month':'All time');
  const tabs=['week','month','all'].map(r=>'<button data-r="'+r+'" style="font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:'+(r===LB_RANGE?'var(--dark)':'#fff')+';color:'+(r===LB_RANGE?'#fff':'var(--ink-2)')+'">'+(r==='week'?'Week':r==='month'?'Month':'All')+'</button>').join('');
  const medal=n=>n===1?'🥇':n===2?'🥈':n===3?'🥉':'';
  box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">'+label+' leaderboard</div><div style="display:flex;gap:6px">'+tabs+'</div></div>'+
    (rows.length? rows.slice(0,8).map(r=>'<div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;'+(r.isMe?'background:#E4FF97;':'')+'"><div style="width:22px;font-weight:800;color:var(--ink-2)">'+(medal(r.rank)||r.rank)+'</div><div style="flex:1;font-size:14px;font-weight:'+(r.isMe?'800':'600')+'">'+esc((r.name||'').split(' ')[0])+(r.isMe?' (you)':'')+'</div><div style="font-size:12px;color:var(--ink-2)">'+r.won+'W · '+r.booked+'B · '+r.visits+'V</div></div>').join('') : '<div style="font-size:13px;color:var(--muted)">No standings yet.</div>');
  box.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{ LB_RANGE=b.dataset.r; loadLeaderboard(); });
}

/* ---- Human Design (rep + prospect) ---- */
const HD_TZ=[['Eastern (EST, UTC-5)',-5],['Eastern (EDT, UTC-4)',-4],['Central (CST, UTC-6)',-6],['Central (CDT, UTC-5)',-5],['Mountain (MST, UTC-7)',-7],['Mountain (MDT, UTC-6)',-6],['Pacific (PST, UTC-8)',-8],['Pacific (PDT, UTC-7)',-7],['UTC',0]];
function hdTzOptions(sel){ return HD_TZ.map(o=>'<option value="'+o[1]+'"'+(o[1]===sel?' selected':'')+'>'+o[0]+'</option>').join(''); }
function hdProse(text){
  return String(text||'').split(/\n\n+/).map(function(bl){
    var m=bl.match(/^([^\n:]{2,44}):\s*\n?([\s\S]*)$/);
    if(m) return '<div style="margin-bottom:10px"><div style="font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px">'+esc(m[1])+'</div><div style="font-size:13.5px;line-height:1.5;color:var(--ink)">'+esc(m[2].trim())+'</div></div>';
    return '<div style="font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:8px">'+esc(bl)+'</div>';
  }).join('');
}
function hdChartTiles(chart){
  var t=[['Type',chart.type],['Authority',chart.authority],['Strategy',chart.strategy],['Profile',chart.profile]];
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">'+t.map(function(kv){return '<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px"><div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700">'+kv[0]+'</div><div style="font-size:14px;font-weight:700;color:var(--ink);margin-top:2px">'+esc(kv[1]||'')+'</div></div>';}).join('')+'</div>';
}
var HD_SPIN='<span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:#0a0b14"></span>';
async function loadRepHD(){
  var box=$('#meHD'); if(!box) return;
  var d; try{ d=await api('/api/rep-hd',{method:'POST',body:JSON.stringify({action:'me'})}); }catch(e){ box.style.display='none'; return; }
  var head='<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Your Human Design</div>';
  if(!d.chart){
    box.innerHTML=head+'<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">See how you sell best. Add your birth details. It stays private and is computed in-house, nothing leaves the platform.</div>'+
      '<div class="row" style="gap:10px"><div class="field" style="flex:1"><label>Birth date</label><input id="rhDate" type="date"/></div><div class="field" style="flex:1"><label>Birth time</label><input id="rhTime" type="time"/></div></div>'+
      '<div class="field"><label>Time zone at birth</label><select id="rhTz">'+hdTzOptions(-6)+'</select></div>'+
      '<button class="btn" id="rhGo">Compute my design</button>';
    $('#rhGo').onclick=async function(){ var btn=$('#rhGo'); if(!$('#rhDate').value){ toast('Add your birth date'); return; } btn.disabled=true; btn.innerHTML=HD_SPIN; try{ await api('/api/rep-hd',{method:'POST',body:JSON.stringify({action:'submit_self',date:$('#rhDate').value,time:$('#rhTime').value,tz_offset:Number($('#rhTz').value)})}); toast('Design saved'); loadRepHD(); }catch(ex){ toast(ex.message); btn.disabled=false; btn.textContent='Compute my design'; } };
    return;
  }
  box.innerHTML=head+hdChartTiles(d.chart)+'<button class="btn ghost sm" id="rhGuide" style="margin-top:10px;width:100%">✨ How you sell best</button><div id="rhGuideOut">'+(d.guide?('<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'+hdProse(d.guide)+'</div>'):'')+'</div>';
  $('#rhGuide').onclick=async function(){ var o=$('#rhGuideOut'); $('#rhGuide').disabled=true; o.innerHTML='<div style="margin-top:8px;color:var(--muted);font-size:13px">'+HD_SPIN+' Reading your design…</div>'; try{ var g=await api('/api/rep-hd',{method:'POST',body:JSON.stringify({action:'guide_self'})}); o.innerHTML='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'+hdProse(g.guide)+'</div>'; }catch(ex){ o.innerHTML=''; toast(ex.message); } $('#rhGuide').disabled=false; };
}
async function loadLeadHD(l){
  var box=$('#dHD'); if(!box) return;
  var d; try{ d=await api('/api/rep-hd',{method:'POST',body:JSON.stringify({action:'lead',lead_id:l.id})}); }catch(e){ box.innerHTML=''; return; }
  var head='<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px">Owner Human Design</div>';
  if(!d.chart){
    box.innerHTML=head+'<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Know how to approach this owner. Add their birth details if you have them, from the call or your research.</div>'+
      '<div class="row" style="gap:10px"><div class="field" style="flex:1"><label>Birth date</label><input id="lhDate" type="date"/></div><div class="field" style="flex:1"><label>Birth time</label><input id="lhTime" type="time"/></div></div>'+
      '<div class="field"><label>Time zone at birth</label><select id="lhTz">'+hdTzOptions(-6)+'</select></div>'+
      '<button class="btn ghost sm" id="lhGo" style="width:100%">Compute owner design</button>';
    $('#lhGo').onclick=async function(){ var btn=$('#lhGo'); if(!$('#lhDate').value){ toast('Add a birth date'); return; } btn.disabled=true; btn.innerHTML=HD_SPIN; try{ await api('/api/rep-hd',{method:'POST',body:JSON.stringify({action:'submit_lead',lead_id:l.id,date:$('#lhDate').value,time:$('#lhTime').value,tz_offset:Number($('#lhTz').value)})}); toast('Owner design saved'); loadLeadHD(l); }catch(ex){ toast(ex.message); btn.disabled=false; btn.textContent='Compute owner design'; } };
    return;
  }
  box.innerHTML=head+hdChartTiles(d.chart)+
    '<div style="display:flex;gap:7px;margin-top:10px"><button class="btn ghost sm" id="lhApproach" style="flex:1">✨ How to approach</button><button class="btn ghost sm" id="lhFit" style="flex:1">✨ Fit with you</button></div>'+
    '<div id="lhOut">'+(d.guide?('<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'+hdProse(d.guide)+'</div>'):'')+'</div>';
  var run=async function(action,label){ var o=$('#lhOut'); o.innerHTML='<div style="margin-top:8px;color:var(--muted);font-size:13px">'+HD_SPIN+' '+label+'</div>'; try{ var r=await api('/api/rep-hd',{method:'POST',body:JSON.stringify({action:action,lead_id:l.id})}); var text=action==='fit'?(r.fit&&r.fit.brief):r.guide; var extra=(action==='fit'&&r.fit)?('<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Click '+r.fit.counts.click+' · Grind '+r.fit.counts.grind+' · Same '+r.fit.counts.same+'</div>'):''; o.innerHTML='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'+extra+hdProse(text)+'</div>'; }catch(ex){ o.innerHTML=''; toast(ex.message); } };
  $('#lhApproach').onclick=function(){ run('approach','Reading this owner…'); };
  $('#lhFit').onclick=function(){ run('fit','Reading you two…'); };
}

/* ---- start ---- */
window.fbAuth.onAuthStateChanged(async (user)=>{
  const btn=$('#lBtn');
  if(user){
    try{ TOKEN = await user.getIdToken(); ME=null; await boot(); }
    catch(ex){ $('#lErr').textContent = authError(ex); }
    if(btn){ btn.disabled=false; btn.textContent='Sign in'; }
  } else {
    TOKEN=''; ME=null; $('#app').style.display='none'; $('#login').style.display='flex';
    if(btn){ btn.disabled=false; btn.textContent='Sign in'; }
  }
});

/* ---- installable PWA (offline app shell) ---- */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/cityleads/sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
