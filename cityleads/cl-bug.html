<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Report a Bug | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.bug-form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;}
.file-drop{border:2px dashed var(--line-strong);border-radius:var(--r-sm);padding:24px;text-align:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.file-drop:hover{border-color:var(--ink-2);background:var(--bg);}
.file-drop input{display:none;}
.file-drop svg{color:var(--muted);margin-bottom:8px;}
.file-drop-label{font-size:14px;color:var(--ink-2);}
.file-drop-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.attached-files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.attached-file{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.attached-file button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0;display:flex;align-items:center;}
.attached-file button:hover{color:var(--red);}
.success-state{display:none;text-align:center;padding:48px 20px;}
.success-icon{width:64px;height:64px;border-radius:50%;background:var(--chart);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.success-icon svg{width:28px;height:28px;color:var(--ink);}
.success-title{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--ink);margin:0 0 8px;}
.success-sub{font-size:14px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">Report a Bug</span>
      </div>
    </div>

    <div class="content">

      <div class="sec-head" style="margin-bottom:8px;">
        <h1>Report a Bug</h1>
      </div>
      <p style="font-size:14px;color:var(--muted);margin-bottom:20px;">Something broken? Tell us exactly what happened and we'll fix it fast.</p>

      <div class="bug-form-card" id="bug-form">
        <div class="form-group">
          <label class="form-label">Page where it happened</label>
          <select class="form-input" id="bug-page">
            <option value="">Select a page...</option>
            <option>Dashboard (Home)</option>
            <option>City Map</option>
            <option>Search</option>
            <option>My List</option>
            <option>Quick Capture</option>
            <option>Visits</option>
            <option>Follow-Ups</option>
            <option>Handoffs</option>
            <option>Pipeline Board</option>
            <option>My Earnings</option>
            <option>Owner Lookup</option>
            <option>AI Assistant</option>
            <option>Leaderboard</option>
            <option>Office Hours</option>
            <option>City Lead Chat</option>
            <option>Upload Content</option>
            <option>My Posts</option>
            <option>Settings</option>
            <option>Help</option>
            <option>Other / I don't know</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">What were you trying to do?</label>
          <textarea class="form-input" id="bug-action" rows="3" placeholder="E.g. 'I was trying to log a visit for Apex HVAC and tap the Save button...'"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">What actually happened?</label>
          <textarea class="form-input" id="bug-result" rows="3" placeholder="E.g. 'The page went blank and showed a white screen. Nothing saved.'"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Screenshots (optional)</label>
          <div class="file-drop" onclick="document.getElementById('bug-files').click()">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.3">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="file-drop-label">Tap to attach screenshots</div>
            <div class="file-drop-sub">PNG, JPG, GIF up to 10MB each</div>
            <input type="file" id="bug-files" multiple accept="image/*" onchange="handleAttachments(this.files)"/>
          </div>
          <div class="attached-files" id="attached-files"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Your email</label>
          <input class="form-input" id="bug-email" type="email" value="jordan@tmi-technology.com"/>
          <div class="form-hint">We'll follow up here if we need more details.</div>
        </div>

        <button class="btn btn-primary btn-full" onclick="submitBug()">Send Report</button>
      </div>

      <!-- Success state -->
      <div class="success-state" id="success-state">
        <div class="success-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 class="success-title">Got it.</h2>
        <p class="success-sub">Thanks. We'll look at it today.<br/>Check your email if we need more info.</p>
        <button class="btn btn-ghost" style="margin-top:24px;" onclick="resetForm()">Report another bug</button>
      </div>

    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-bug');

let attachedFiles = [];

function handleAttachments(files) {
  attachedFiles = [...attachedFiles, ...Array.from(files)];
  renderAttachments();
}

function renderAttachments() {
  document.getElementById('attached-files').innerHTML = attachedFiles.map((f, i) => `
    <div class="attached-file">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${f.name.length > 20 ? f.name.slice(0, 20) + '...' : f.name}
      <button onclick="removeAttachment(${i})">×</button>
    </div>`).join('');
}

function removeAttachment(i) {
  attachedFiles.splice(i, 1);
  renderAttachments();
}

function submitBug() {
  const page = document.getElementById('bug-page').value;
  const action = document.getElementById('bug-action').value.trim();
  const result = document.getElementById('bug-result').value.trim();
  const email = document.getElementById('bug-email').value.trim();

  if (!page) { CL.toast('Select the page where this happened', 'error'); return; }
  if (!action) { CL.toast('Tell us what you were trying to do', 'error'); return; }
  if (!result) { CL.toast('Tell us what actually happened', 'error'); return; }
  if (!email) { CL.toast('Add your email so we can follow up', 'error'); return; }

  document.getElementById('bug-form').style.display = 'none';
  document.getElementById('success-state').style.display = 'block';
}

function resetForm() {
  document.getElementById('bug-page').value = '';
  document.getElementById('bug-action').value = '';
  document.getElementById('bug-result').value = '';
  attachedFiles = [];
  renderAttachments();
  document.getElementById('bug-form').style.display = 'block';
  document.getElementById('success-state').style.display = 'none';
}
</script>
</body>
</html>
