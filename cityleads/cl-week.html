<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>This Week | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.week-strip{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.day-btn{flex:1;min-width:44px;padding:8px 4px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;justify-content:center;}
.day-btn:hover{background:var(--bg);}
.day-btn.active{background:var(--ink);border-color:var(--ink);}
.day-btn.today{border-color:var(--chart);}
.day-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.day-num{font-size:18px;font-weight:700;color:var(--ink);line-height:1;}
.day-btn.active .day-label,.day-btn.active .day-num{color:#fff;}
.day-btn.today .day-num{color:var(--chart);}
.day-btn.active.today .day-num{color:var(--chart);}
.day-dot{width:5px;height:5px;border-radius:50%;background:var(--chart);}
.day-btn.active .day-dot{background:#fff;}

.event-list{display:flex;flex-direction:column;gap:10px;}
.event-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;cursor:pointer;transition:background 0.1s;}
.event-card:hover{background:var(--bg);}
.event-time-col{width:52px;flex-shrink:0;text-align:right;}
.event-time{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;}
.event-ampm{font-size:10px;color:var(--muted);}
.event-vline{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:40px;}
.event-vline.visit{background:var(--chart);}
.event-vline.followup{background:var(--amber);}
.event-vline.office{background:var(--blue);}
.event-vline.checkin{background:var(--green);}
.event-body{flex:1;min-width:0;}
.event-type-tag{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px;}
.event-type-tag.visit{color:var(--ink);}
.event-type-tag.followup{color:var(--amber);}
.event-type-tag.office{color:var(--blue);}
.event-type-tag.checkin{color:var(--green);}
.event-biz{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:2px;}
.event-action{font-size:12px;color:var(--ink-2);}
.event-note{font-size:12px;color:var(--muted);margin-top:4px;}

.day-heading{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--ink);margin:0 0 16px;letter-spacing:-0.01em;}
.day-empty{padding:32px 0;text-align:center;color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">This Week</span>
      </div>
      <div class="topbar-actions">
        <span style="font-size:12px;color:var(--muted)" id="week-range-label"></span>
      </div>
    </div>

    <div class="content">

      <!-- Weekly stats -->
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">Total This Week</div>
          <div class="stat-val">14</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Visits Planned</div>
          <div class="stat-val">9</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Follow-Ups Due</div>
          <div class="stat-val" style="color:var(--amber)">4</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Done</div>
          <div class="stat-val" style="color:var(--green)">5</div>
        </div>
      </div>

      <!-- Day strip -->
      <div class="week-strip" id="day-strip"></div>

      <!-- Selected day heading -->
      <div class="day-heading" id="day-heading">Today</div>

      <!-- Events for selected day -->
      <div class="event-list" id="event-list"></div>

    </div>
  </div>
</div>

<!-- Add to Week Modal -->
<div class="modal-overlay" id="add-event-modal">
  <div class="modal">
    <div class="modal-grip"></div>
    <div class="modal-hd">
      <h2 class="modal-title">Add to Week</h2>
      <button class="modal-x" onclick="CL.closeModal('add-event-modal')">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <select class="form-input" id="ev-type">
        <option value="visit">Visit</option>
        <option value="followup">Follow-Up Due</option>
        <option value="office">Office Hours</option>
        <option value="checkin">Check-In</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Business Name</label>
      <input class="form-input" id="ev-biz" placeholder="e.g. Apex HVAC" type="text"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Day</label>
        <select class="form-input" id="ev-day">
          <option>Mon</option><option>Tue</option><option>Wed</option>
          <option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Time</label>
        <input class="form-input" id="ev-time" type="time" value="09:00"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Action Needed</label>
      <input class="form-input" id="ev-action" placeholder="e.g. Present audit results"/>
    </div>
    <div class="modal-ft">
      <button class="btn btn-primary btn-full" onclick="saveEvent()">Add Event</button>
      <button class="btn btn-ghost btn-full" onclick="CL.closeModal('add-event-modal')">Cancel</button>
    </div>
  </div>
</div>

<button class="btn-fab" onclick="CL.openModal('add-event-modal')" title="Add to Week">
  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/></svg>
</button>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-week');

const TODAY_IDX = 6; // May 17 2026 = Sunday (index 6)
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DATES = [11,12,13,14,15,16,17]; // May 11-17

const TYPE_LABELS = { visit:'Visit', followup:'Follow-Up', office:'Office Hours', checkin:'Check-In' };

let selectedDay = TODAY_IDX;

const EVENTS = {
  0: [ // Mon
    { id:1, time:'9:00', ampm:'AM', type:'visit', biz:'Apex HVAC', action:'First walk-in visit', note:'Ask for the owner directly.' },
    { id:2, time:'2:00', ampm:'PM', type:'visit', biz:'Riverfront Electrician', action:'Second visit - meet owner', note:'' },
  ],
  1: [ // Tue
    { id:3, time:'10:30', ampm:'AM', type:'followup', biz:'Lone Star Concrete', action:'Send follow-up text after visit', note:'Overdue by 1 day' },
    { id:4, time:'3:00', ampm:'PM', type:'visit', biz:'Cedar Park Plumbing', action:'Drop off overview card', note:'' },
  ],
  2: [ // Wed
    { id:5, time:'9:00', ampm:'AM', type:'office', biz:'TMI HQ', action:'Weekly sync call', note:'Video call with Austin team' },
    { id:6, time:'11:00', ampm:'AM', type:'visit', biz:'Travis Electric', action:'First visit', note:'' },
    { id:7, time:'1:30', ampm:'PM', type:'visit', biz:'Silverline Roofing', action:'Follow-up meeting', note:'Owner wants to see demo' },
  ],
  3: [ // Thu
    { id:8, time:'10:00', ampm:'AM', type:'followup', biz:'Hill Country HVAC', action:'Call to confirm audit slot', note:'' },
    { id:9, time:'4:00', ampm:'PM', type:'checkin', biz:'Austin Painting Co', action:'Casual drop-in check-in', note:'' },
  ],
  4: [ // Fri
    { id:10, time:'9:30', ampm:'AM', type:'visit', biz:'Brazos Welding', action:'First visit', note:'' },
    { id:11, time:'11:30', ampm:'AM', type:'followup', biz:'Apex HVAC', action:'Call - did they review the deck?', note:'Hot lead - close this week' },
    { id:12, time:'2:00', ampm:'PM', type:'visit', biz:'Capital Landscaping', action:'First visit', note:'' },
  ],
  5: [ // Sat
    { id:13, time:'10:00', ampm:'AM', type:'checkin', biz:'Mesa Roofing', action:'Text check-in', note:'Owner works Saturdays' },
  ],
  6: [ // Sun (today)
    { id:14, time:'7:00', ampm:'PM', type:'followup', biz:'Lone Star Concrete', action:'Review notes from this week', note:'Prep for Monday push' },
  ],
};

let events = JSON.parse(JSON.stringify(EVENTS));

function renderStrip() {
  document.getElementById('day-strip').innerHTML = DAYS.map((d, i) => {
    const hasEvents = (events[i] || []).length > 0;
    const isToday = i === TODAY_IDX;
    const isActive = i === selectedDay;
    return `<button class="day-btn${isActive ? ' active' : ''}${isToday ? ' today' : ''}" onclick="selectDay(${i})">
      <span class="day-label">${d}</span>
      <span class="day-num">${DATES[i]}</span>
      ${hasEvents ? `<span class="day-dot"></span>` : '<span style="width:5px;height:5px"></span>'}
    </button>`;
  }).join('');
  const d = DATES[selectedDay];
  const dayName = selectedDay === TODAY_IDX ? 'Today' : DAYS[selectedDay] + ', May ' + d;
  document.getElementById('day-heading').textContent = dayName;
  const wStart = 'May 11', wEnd = 'May 17, 2026';
  document.getElementById('week-range-label').textContent = wStart + ' - ' + wEnd;
}

function renderEvents() {
  const list = events[selectedDay] || [];
  const el = document.getElementById('event-list');
  if (!list.length) {
    el.innerHTML = `<div class="day-empty">No events scheduled for this day.<br/>Tap + to add.</div>`;
    return;
  }
  el.innerHTML = list.map(e => `
    <div class="event-card">
      <div class="event-time-col">
        <div class="event-time">${e.time}</div>
        <div class="event-ampm">${e.ampm}</div>
      </div>
      <div class="event-vline ${e.type}"></div>
      <div class="event-body">
        <div class="event-type-tag ${e.type}">${TYPE_LABELS[e.type]}</div>
        <div class="event-biz">${e.biz}</div>
        <div class="event-action">${e.action}</div>
        ${e.note ? `<div class="event-note">${e.note}</div>` : ''}
      </div>
    </div>`).join('');
}

function selectDay(idx) {
  selectedDay = idx;
  renderStrip();
  renderEvents();
}

function saveEvent() {
  const type = document.getElementById('ev-type').value;
  const biz = document.getElementById('ev-biz').value.trim();
  const dayIdx = DAYS.indexOf(document.getElementById('ev-day').value);
  const timeRaw = document.getElementById('ev-time').value;
  const action = document.getElementById('ev-action').value.trim();
  if (!biz) { CL.toast('Enter a business name', 'error'); return; }
  const [h, m] = timeRaw.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h % 12 || 12;
  const time = `${hr}:${String(m).padStart(2,'0')}`;
  if (!events[dayIdx]) events[dayIdx] = [];
  events[dayIdx].push({ id: Date.now(), time, ampm, type, biz, action: action || TYPE_LABELS[type], note:'' });
  CL.closeModal('add-event-modal');
  CL.toast('Event added to ' + DAYS[dayIdx]);
  renderStrip();
  renderEvents();
}

renderStrip();
renderEvents();
</script>
</body>
</html>
