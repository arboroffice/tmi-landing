<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Posts | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
.platform-tabs{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;margin-bottom:20px;}
.platform-tab{flex:1;padding:10px 8px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;background:none;border:none;border-right:1px solid var(--line-strong);font-family:inherit;color:var(--ink-2);transition:all 0.12s;min-height:44px;}
.platform-tab:last-child{border-right:none;}
.platform-tab.active{background:var(--ink);color:#fff;}
.post-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;}
.post-preview{height:200px;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;}
.post-preview-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;opacity:0.3;}
.post-preview-placeholder svg{width:32px;height:32px;}
.post-preview-placeholder span{font-size:12px;letter-spacing:0.15em;text-transform:uppercase;}
.platform-badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.05em;}
.platform-badge.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff;}
.platform-badge.linkedin{background:#0077b5;color:#fff;}
.platform-badge.tiktok{background:#010101;color:#fff;}
.post-body{padding:14px 16px;}
.post-caption{font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.post-meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:12px;color:var(--muted);}
.post-stats{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px;}
.post-stat{text-align:center;}
.post-stat-val{font-size:16px;font-weight:700;color:var(--ink);line-height:1;}
.post-stat-label{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.1em;}
.ig-icon{display:inline-block;width:14px;height:14px;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);border-radius:3px;vertical-align:middle;}
.li-icon{display:inline-block;width:14px;height:14px;background:#0077b5;border-radius:2px;vertical-align:middle;}
.tt-icon{display:inline-block;width:14px;height:14px;background:#010101;border-radius:2px;vertical-align:middle;}
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span>City Leads</span>
        <span style="color:var(--line-strong);margin:0 2px">/</span>
        <span class="page">My Posts</span>
      </div>
      <div class="topbar-actions">
        <span id="post-count" style="font-size:12px;color:var(--muted);"></span>
      </div>
    </div>

    <div class="content">

      <div class="sec-head" style="margin-bottom:16px;">
        <h1>My Posts</h1>
      </div>

      <div class="platform-tabs">
        <button class="platform-tab active" onclick="filterPosts('all',this)">All</button>
        <button class="platform-tab" onclick="filterPosts('instagram',this)">Instagram</button>
        <button class="platform-tab" onclick="filterPosts('linkedin',this)">LinkedIn</button>
        <button class="platform-tab" onclick="filterPosts('tiktok',this)">TikTok</button>
      </div>

      <div id="posts-list"></div>

    </div>
  </div>
</div>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-my-posts');

const POSTS = [
  {
    id: 1,
    platform: 'instagram',
    caption: 'Austin HVAC owners are the backbone of this city. Spent the morning with Mike at Apex — 22 years in the trade, 14 crew members, and he still answers every callback personally. That\'s the kind of operator TMI was built for. 🛠️ #Austin #HVAC #FieldOps',
    date: 'May 14, 2026',
    likes: 312,
    comments: 18,
    shares: 44,
    city: 'Austin, TX',
  },
  {
    id: 2,
    platform: 'linkedin',
    caption: 'The trades are the most underleveraged sector in the American economy. While every SaaS company chases enterprise contracts, 2 million field service businesses are still running on spreadsheets and gut feel. That\'s the gap TMI is closing — one city at a time.',
    date: 'May 12, 2026',
    likes: 201,
    comments: 31,
    shares: 88,
    city: 'Austin, TX',
  },
  {
    id: 3,
    platform: 'tiktok',
    caption: 'What does a day in the field look like for a TMI City Lead? We hit 8 businesses before noon. Here\'s what happened. 👇',
    date: 'May 10, 2026',
    likes: 1840,
    comments: 92,
    shares: 204,
    city: 'Austin, TX',
  },
  {
    id: 4,
    platform: 'instagram',
    caption: 'Before and after: Silverline Roofing went from three clipboards and a group text to a full dispatch and job costing system in 60 days. Owner said it\'s the first time in 11 years he could see actual margin per job. That\'s the point. #Roofing #FieldService #Austin',
    date: 'May 8, 2026',
    likes: 428,
    comments: 24,
    shares: 61,
    city: 'Austin, TX',
  },
];

let activeFilter = 'all';

const PLATFORM_ICONS = {
  instagram: '<svg viewBox="0 0 24 24" fill="white" width="24" height="24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="1.5"/><circle cx="17.5" cy="6.5" r="1" fill="white"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.37 6.37 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.82 1.56V6.79a4.85 4.85 0 0 1-1.05-.1z"/></svg>',
};

const BKGS = { instagram:'linear-gradient(135deg,#833ab4 0%,#fd1d1d 50%,#fcb045 100%)', linkedin:'#0a66c2', tiktok:'#010101' };

function renderPosts(filter) {
  const filtered = filter === 'all' ? POSTS : POSTS.filter(p => p.platform === filter);
  document.getElementById('post-count').textContent = filtered.length + ' post' + (filtered.length !== 1 ? 's' : '');

  if (!filtered.length) {
    document.getElementById('posts-list').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📱</div>
        <h3>No ${filter === 'all' ? '' : filter + ' '}posts yet</h3>
        <p>Posts featuring your city will appear here when Mia and Tyler publish them.</p>
      </div>`;
    return;
  }

  document.getElementById('posts-list').innerHTML = filtered.map(p => `
    <div class="post-card">
      <div class="post-preview" style="background:${BKGS[p.platform]}">
        <div class="post-preview-placeholder">
          ${PLATFORM_ICONS[p.platform]}
          <span>${p.platform}</span>
        </div>
        <span class="platform-badge ${p.platform}">${p.platform.charAt(0).toUpperCase() + p.platform.slice(1)}</span>
      </div>
      <div class="post-body">
        <p class="post-caption">${p.caption}</p>
        <div class="post-meta">
          <span>${p.city}</span>
          <span>·</span>
          <span>${p.date}</span>
        </div>
        <div class="post-stats">
          <div class="post-stat"><div class="post-stat-val">${p.likes.toLocaleString()}</div><div class="post-stat-label">Likes</div></div>
          <div class="post-stat"><div class="post-stat-val">${p.comments}</div><div class="post-stat-label">Comments</div></div>
          <div class="post-stat"><div class="post-stat-val">${p.shares}</div><div class="post-stat-label">Shares</div></div>
        </div>
        <button class="btn btn-ghost btn-full btn-sm" onclick="CL.toast('Link copied to clipboard')">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.98 2.98 0 0 0 18 8a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A3 3 0 0 0 6 9a3 3 0 0 0 0 6c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a3 3 0 1 0 3-3z"/></svg>
          Share to your page
        </button>
      </div>
    </div>
  `).join('');
}

function filterPosts(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.platform-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPosts(filter);
}

renderPosts('all');
</script>
</body>
</html>
