<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My List | TMI City Leads</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="cl.css"/>
<style>
  .days-chip { font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .days-chip.overdue { background:#fee2e2; color:#b91c1c; }
  .days-chip.ok { background:#f3f4f6; color:#6b7280; }
  .biz-avatar.hot-bg { background:#fecaca; color:#b91c1c; }
  .biz-avatar.warm-bg { background:#fde68a; color:#92400e; }
  .biz-avatar.cold-bg { background:#e5e7eb; color:#6b7280; }
  .biz-avatar.seed-bg { background:#f3f4f6; color:#9ca3af; }
  .biz-avatar.met-bg { background:#dbeafe; color:#1d4ed8; }
  .biz-avatar.visit-bg { background:#ede9fe; color:#6d28d9; }
  .biz-avatar.audit-bg { background:#fce7f3; color:#9d174d; }
  .biz-avatar.closed-bg { background:#dcfce7; color:#15803d; }
  .biz-avatar.exp-bg { background:#E4FF97; color:#0a0b14; }
</style>
</head>
<body>

<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span class="page">My List</span>
      </div>
      <div class="topbar-actions">
        <a href="cl-add-business.html" class="btn btn-primary btn-sm">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/></svg>
          Add
        </a>
      </div>
    </div>

    <div class="content">
      <!-- Stats strip -->
      <div class="stats-row" style="grid-template-columns:repeat(4,1fr);" id="stats-strip">
        <div class="stat-box">
          <div class="stat-label">Total</div>
          <div class="stat-val" id="stat-total">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Hot</div>
          <div class="stat-val" id="stat-hot" style="color:#ef4444;">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Warm</div>
          <div class="stat-val" id="stat-warm" style="color:#f59e0b;">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Due Today</div>
          <div class="stat-val" id="stat-due" style="color:#ef4444;">—</div>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <div class="filter-row">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
            <input type="search" placeholder="Search my list..." oninput="filterList()" id="list-search"/>
          </div>
          <select class="filter-select" id="stage-filter" onchange="filterList()">
            <option value="">All Stages</option>
            <option value="seed">Seed</option>
            <option value="met_owner">Met Owner</option>
            <option value="second_visit">2nd Visit</option>
            <option value="problem_identified">Problem ID'd</option>
            <option value="warm">Warm</option>
            <option value="audit_booked">Audit Booked</option>
            <option value="proposal_sent">Proposal Sent</option>
            <option value="closed">Closed</option>
            <option value="build_live">Build Live</option>
            <option value="support_active">Support Active</option>
            <option value="expansion">Expansion</option>
          </select>
        </div>
        <div class="filter-row">
          <select class="filter-select" id="score-filter" onchange="filterList()">
            <option value="">All Scores</option>
            <option value="hot">Hot</option>
            <option value="warm">Warm</option>
            <option value="cold">Cold</option>
          </select>
          <select class="filter-select" id="sort-filter" onchange="filterList()">
            <option value="recent">Most Recent</option>
            <option value="name">Name A-Z</option>
            <option value="stage">Stage</option>
          </select>
          <span class="filter-count" id="filter-count"></span>
        </div>
      </div>

      <!-- Business list -->
      <div id="list-wrap">
        <div class="biz-list-wrap" style="background:var(--surface);border-radius:var(--r);overflow:hidden;" id="biz-list-wrap">
          <ul class="biz-list" id="biz-list"></ul>
        </div>

        <div class="empty-state" id="empty-state" style="display:none;">
          <div class="empty-icon">📋</div>
          <h3>No businesses yet</h3>
          <p>Start adding businesses in your territory to track your pipeline.</p>
          <a href="cl-add-business.html" class="btn btn-primary">Add Your First Business</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FAB -->
<a href="cl-add-business.html" class="btn-fab" title="Add Business">
  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="24" height="24"><line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/></svg>
</a>

<script src="cl-shared.js"></script>
<script>
CL.initPage('cl-my-list');

const STAGE_ORDER = ['seed','met_owner','second_visit','problem_identified','warm','audit_booked','proposal_sent','closed','build_live','support_active','expansion'];

const DEMO_LIST = [
  { id:'b1', name:'Austin HVAC Pros', type:'HVAC', owner:'Mike Torres', stage:'warm', score:'hot', lastContact:'2026-05-10', added:'2026-04-01' },
  { id:'b2', name:'Capital Plumbing Co', type:'Plumbing', owner:'Sarah Chen', stage:'met_owner', score:'warm', lastContact:'2026-05-15', added:'2026-04-10' },
  { id:'b3', name:'Lone Star Roofing', type:'Roofing', owner:'James Polk', stage:'seed', score:'cold', lastContact:'2026-04-20', added:'2026-03-15' },
  { id:'b4', name:'Hill Country Electric', type:'Electrician', owner:'Dana Webb', stage:'audit_booked', score:'hot', lastContact:'2026-05-16', added:'2026-04-05' },
  { id:'b5', name:'Green Leaf Landscaping', type:'Landscaping', owner:'Carlos Reyes', stage:'proposal_sent', score:'warm', lastContact:'2026-05-12', added:'2026-04-20' },
  { id:'b6', name:'Precision Painting LLC', type:'Painting', owner:'Tom Garcia', stage:'seed', score:'cold', lastContact:'2026-04-28', added:'2026-04-25' },
  { id:'b7', name:'Cornerstone Concrete', type:'Concrete', owner:'Linda Park', stage:'second_visit', score:'warm', lastContact:'2026-05-08', added:'2026-04-18' },
  { id:'b8', name:'Apex Construction Group', type:'Construction', owner:'Brett Wilson', stage:'warm', score:'hot', lastContact:'2026-05-03', added:'2026-03-30' },
];

function daysSince(dateStr) {
  if (!dateStr) return 999;
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

function avatarClass(score) {
  if (score === 'hot') return 'hot-bg';
  if (score === 'warm') return 'warm-bg';
  return 'cold-bg';
}

function renderStats(businesses) {
  document.getElementById('stat-total').textContent = businesses.length;
  document.getElementById('stat-hot').textContent = businesses.filter(b => b.score === 'hot').length;
  document.getElementById('stat-warm').textContent = businesses.filter(b => b.score === 'warm').length;
  document.getElementById('stat-due').textContent = businesses.filter(b => daysSince(b.lastContact) >= 14).length;
}

function filterList() {
  const q = document.getElementById('list-search').value.toLowerCase();
  const stage = document.getElementById('stage-filter').value;
  const score = document.getElementById('score-filter').value;
  const sort = document.getElementById('sort-filter').value;

  let results = DEMO_LIST.filter(b => {
    if (stage && b.stage !== stage) return false;
    if (score && b.score !== score) return false;
    if (q && !b.name.toLowerCase().includes(q) && !b.owner.toLowerCase().includes(q)) return false;
    return true;
  });

  if (sort === 'name') results.sort((a,b) => a.name.localeCompare(b.name));
  else if (sort === 'stage') results.sort((a,b) => STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage));
  else results.sort((a,b) => new Date(b.lastContact) - new Date(a.lastContact));

  renderList(results);
  document.getElementById('filter-count').textContent = results.length + ' businesses';
}

function renderList(businesses) {
  const listEl = document.getElementById('biz-list');
  const emptyEl = document.getElementById('empty-state');
  const wrapEl = document.getElementById('biz-list-wrap');

  if (businesses.length === 0) {
    wrapEl.style.display = 'none';
    emptyEl.style.display = 'block';
    return;
  }

  emptyEl.style.display = 'none';
  wrapEl.style.display = 'block';

  listEl.innerHTML = businesses.map(b => {
    const days = daysSince(b.lastContact);
    const overdue = days >= 14;
    return `
    <a class="biz-item" href="cl-business.html?id=${b.id}">
      <div class="biz-avatar ${avatarClass(b.score)}">${CL.initials(b.name)}</div>
      <div class="biz-body">
        <div class="biz-name">${b.name}</div>
        <div class="biz-meta">${b.type} &middot; ${b.owner} &middot; Last: ${CL.fmt(b.lastContact)}</div>
      </div>
      <div class="biz-right">
        ${CL.stageBadge(b.stage)}
        <span class="days-chip ${overdue ? 'overdue' : 'ok'}">${days === 0 ? 'Today' : days + 'd ago'}</span>
      </div>
    </a>`;
  }).join('');
}

// Init
renderStats(DEMO_LIST);
filterList();
</script>
</body>
</html>
