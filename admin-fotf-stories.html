<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stories — FOTF Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
.story-list { display: flex; flex-direction: column; gap: 12px; }
.story-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 24px; }
.story-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.story-member { display: flex; align-items: center; gap: 10px; }
.story-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-deep); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.story-member-name { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.story-member-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
.story-date { font-size: 12px; color: var(--muted); flex-shrink: 0; }
.story-body { font-size: 14px; color: var(--ink-2); line-height: 1.75; white-space: pre-wrap; margin-bottom: 14px; }
.story-ft { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); }
.story-email { font-size: 12px; color: var(--muted); }
.founder-badge { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; background: var(--chart); color: #3a5400; padding: 2px 8px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="page">Stories</span>
      </div>
    </div>

    <div class="content">
      <div class="sec-head">
        <h1>Member Stories <span id="story-count" style="font-size:14px;font-weight:400;color:var(--muted)"></span></h1>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="story-search" placeholder="Search by story or member name..." oninput="renderList()"/>
        </div>
      </div>

      <div class="story-list" id="story-list">
        <div style="padding:32px;text-align:center;color:var(--muted);font-size:13px">Loading...</div>
      </div>

    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('fotf-stories');

let stories = [];

function initials(name) {
  if (!name) return '?';
  const parts = name.trim().split(' ');
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : parts[0].slice(0, 2).toUpperCase();
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderList() {
  const q = (document.getElementById('story-search').value || '').toLowerCase();
  let filtered = stories;
  if (q) {
    filtered = filtered.filter(s =>
      (s.story_text || '').toLowerCase().includes(q) ||
      (s.fotf_members?.name || '').toLowerCase().includes(q) ||
      (s.fotf_members?.email || '').toLowerCase().includes(q)
    );
  }

  document.getElementById('story-count').textContent = filtered.length ? `(${filtered.length})` : '';

  if (!filtered.length) {
    document.getElementById('story-list').innerHTML =
      `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>No stories submitted yet.</p>
      </div>`;
    return;
  }

  document.getElementById('story-list').innerHTML = filtered.map(s => {
    const member = s.fotf_members || {};
    const name = member.name || member.email || 'Unknown member';
    const founderNum = member.founder_number ? `#${member.founder_number}` : null;
    return `<div class="story-card">
      <div class="story-hd">
        <div class="story-member">
          <div class="story-avatar">${initials(name)}</div>
          <div>
            <div class="story-member-name">${escHtml(name)}</div>
            <div class="story-member-meta">${founderNum ? `Founder ${founderNum}` : ''}</div>
          </div>
          ${founderNum ? `<span class="founder-badge">${founderNum}</span>` : ''}
        </div>
        <span class="story-date">${TMIAdmin.fmt(s.submitted_at || s.created_at)}</span>
      </div>
      <div class="story-body">${escHtml(s.story_text || '')}</div>
      <div class="story-ft">
        <span class="story-email">${escHtml(member.email || '')}</span>
        <button class="btn btn-ghost btn-sm" style="color:var(--red);font-size:12px" onclick="deleteStory('${s.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

async function deleteStory(id) {
  const ok = await TMIAdmin.confirm('Delete this story? This cannot be undone.');
  if (!ok) return;
  await TMIAdmin.api(`/api/fotf-stories?id=${id}`, 'DELETE');
  TMIAdmin.toast('Story deleted');
  await reload();
}

async function reload() {
  stories = await TMIAdmin.api('/api/fotf-stories') || [];
  stories.sort((a, b) => new Date(b.submitted_at || b.created_at) - new Date(a.submitted_at || a.created_at));
  renderList();
}

reload();
</script>
</body>
</html>
