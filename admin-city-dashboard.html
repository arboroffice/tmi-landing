<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>City Leads Overview — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .us-map-wrap{background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:24px;min-height:340px;display:flex;flex-direction:column;gap:16px;}
  .us-map-header{display:flex;align-items:center;justify-content:space-between;}
  .us-map-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-2);}
  .us-map-svg-wrap{flex:1;display:flex;align-items:center;justify-content:center;}
  .city-pin-list{display:flex;flex-wrap:wrap;gap:10px;padding-top:8px;border-top:1px solid var(--line);}
  .city-pin-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;text-decoration:none;color:var(--ink);transition:border-color 0.15s,box-shadow 0.15s;}
  .city-pin-item:hover{border-color:var(--chart);box-shadow:0 2px 8px rgba(0,0,0,0.07);}
  .city-pin-dot{width:10px;height:10px;border-radius:50%;background:var(--chart);flex-shrink:0;}
  .city-pin-dot.inactive{background:var(--muted);}
  .city-pin-name{font-weight:600;}
  .city-pin-count{font-size:11px;color:var(--muted);}
  .recent-activity{display:flex;flex-direction:column;gap:0;}
  .activity-item{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:8px;height:8px;border-radius:50%;background:var(--chart);flex-shrink:0;margin-top:5px;}
  .activity-body{flex:1;}
  .activity-title{font-size:13px;font-weight:500;color:var(--ink);}
  .activity-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .stage-bar-wrap{display:flex;gap:4px;align-items:flex-end;height:80px;padding:12px 0 0;}
  .stage-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .stage-bar{width:100%;border-radius:3px 3px 0 0;background:var(--chart);min-height:4px;transition:height 0.4s;}
  .stage-bar-label{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);text-align:center;line-height:1.2;}
  .stage-bar-count{font-size:11px;font-weight:700;color:var(--ink);}
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">City Leads</span></div>
      <div class="topbar-actions">
        <a href="/admin-city-add" class="btn btn-primary btn-sm">+ Add City Lead</a>
      </div>
    </div>

    <div class="content">
      <div class="sec-head">
        <h1>City Leads Overview</h1>
      </div>

      <div class="stats-row" id="stats-row">
        <div class="stat-box">
          <div class="stat-label">Active Cities</div>
          <div class="stat-val" id="stat-cities">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total City Leads</div>
          <div class="stat-val" id="stat-leads">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Businesses Tracked</div>
          <div class="stat-val" id="stat-biz">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Clients Signed</div>
          <div class="stat-val" id="stat-signed">—</div>
        </div>
      </div>

      <!-- City pin map -->
      <div class="us-map-wrap">
        <div class="us-map-header">
          <span class="us-map-title">Active Markets</span>
          <a href="/admin-cities" class="btn btn-ghost btn-sm">View all cities</a>
        </div>
        <div class="city-pin-list" id="city-pin-list">
          <div style="font-size:13px;color:var(--muted);padding:8px 0;">Loading markets...</div>
        </div>
      </div>

      <div class="grid-2" style="gap:24px">

        <!-- Pipeline stage distribution -->
        <div class="card">
          <div class="card-head">
            <div class="card-title">Pipeline Distribution</div>
            <a href="/admin-city-businesses" class="btn btn-ghost btn-sm">View all</a>
          </div>
          <div id="stage-bars" class="stage-bar-wrap"></div>
          <div id="stage-bar-labels" style="display:flex;gap:4px;padding-bottom:4px;"></div>
        </div>

        <!-- Top city leads by activity -->
        <div class="card">
          <div class="card-head">
            <div class="card-title">City Leads</div>
            <a href="/admin-city-roster" class="btn btn-ghost btn-sm">View roster</a>
          </div>
          <div id="top-leads-list" style="padding-top:4px;"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('city-dashboard');

const STAGES = [
  { key:'seed',             label:'Seed' },
  { key:'met-owner',        label:'Met' },
  { key:'second-visit',     label:'2nd Visit' },
  { key:'problem-id',       label:'Problem ID' },
  { key:'warm',             label:'Warm' },
  { key:'audit-booked',     label:'Audit' },
  { key:'proposal-sent',    label:'Proposal' },
  { key:'closed',           label:'Closed' },
  { key:'build-live',       label:'Build Live' },
  { key:'support-active',   label:'Support' },
  { key:'expansion',        label:'Expansion' },
];

async function loadData() {
  const [leads, biz] = await Promise.all([
    TMIAdmin.api('/api/city-leads'),
    TMIAdmin.api('/api/city-businesses'),
  ]);

  if (!leads || !biz) return;

  const activeLeads = leads.filter(l => l.status === 'active');

  // Stats
  const cities = [...new Set(activeLeads.map(l => l.city).filter(Boolean))];
  document.getElementById('stat-cities').textContent = cities.length;
  document.getElementById('stat-leads').textContent = leads.length;
  document.getElementById('stat-biz').textContent = biz.length;
  document.getElementById('stat-signed').textContent = biz.filter(b => b.stage === 'closed' || b.stage === 'build-live' || b.stage === 'support-active' || b.stage === 'expansion').length;

  // City pins
  const cityPinList = document.getElementById('city-pin-list');
  if (leads.length === 0) {
    cityPinList.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:8px 0;">No city leads yet. <a href="/admin-city-add" style="color:var(--ink)">Add one →</a></div>`;
  } else {
    const byCityLead = {};
    biz.forEach(b => { if (b.city_lead_id) { byCityLead[b.city_lead_id] = (byCityLead[b.city_lead_id] || 0) + 1; } });

    cityPinList.innerHTML = leads.map(l => {
      const count = byCityLead[l.id] || 0;
      const inactive = l.status !== 'active';
      return `<a href="/admin-city-roster" class="city-pin-item">
        <span class="city-pin-dot${inactive ? ' inactive' : ''}"></span>
        <span class="city-pin-name">${l.city}${l.state ? ', ' + l.state : ''}</span>
        <span class="city-pin-count">${count} biz</span>
      </a>`;
    }).join('');
  }

  // Stage distribution
  const stageCounts = {};
  STAGES.forEach(s => stageCounts[s.key] = 0);
  biz.forEach(b => { if (b.stage && stageCounts[b.stage] !== undefined) stageCounts[b.stage]++; });
  const maxCount = Math.max(...Object.values(stageCounts), 1);

  const barsEl = document.getElementById('stage-bars');
  const labelsEl = document.getElementById('stage-bar-labels');
  barsEl.innerHTML = STAGES.map(s => {
    const count = stageCounts[s.key];
    const pct = Math.round((count / maxCount) * 100);
    return `<div class="stage-bar-col">
      <span class="stage-bar-count">${count}</span>
      <div class="stage-bar" style="height:${Math.max(pct * 0.56, 4)}px"></div>
    </div>`;
  }).join('');
  labelsEl.innerHTML = STAGES.map(s =>
    `<div style="flex:1;text-align:center;font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);line-height:1.2">${s.label}</div>`
  ).join('');

  // Top leads list
  const leadsEl = document.getElementById('top-leads-list');
  if (leads.length === 0) {
    leadsEl.innerHTML = `<div class="empty-state" style="padding:24px 0"><div class="empty-icon">📍</div><h3>No city leads</h3><p><a href="/admin-city-add">Add your first one →</a></p></div>`;
  } else {
    leadsEl.innerHTML = leads.slice(0, 8).map(l => {
      const bizCount = byCityLead[l.id] || 0;
      const signed = biz.filter(b => b.city_lead_id === l.id && ['closed','build-live','support-active','expansion'].includes(b.stage)).length;
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);">
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--ink)">${l.name}</div>
          <div style="font-size:11px;color:var(--muted)">${l.city}${l.state ? ', ' + l.state : ''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:600;color:var(--ink)">${bizCount}</div>
          <div style="font-size:11px;color:var(--muted)">${signed} signed</div>
        </div>
      </div>`;
    }).join('');
  }
}

loadData();
</script>
</body>
</html>
