<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Circle -->
  <circle cx="150" cy="150" r="135" stroke="currentColor" stroke-width="8" fill="none"/>

  <g fill="currentColor">
    <!-- M — sits in lower 2/3, behind T -->
    <!-- Left stem -->
    <rect x="40" y="108" width="19" height="118"/>
    <!-- Left base serif -->
    <rect x="28" y="218" width="43" height="13"/>
    <!-- Left top serif -->
    <rect x="28" y="108" width="43" height="13"/>
    <!-- Left diagonal (left stem top → center V) -->
    <polygon points="59,121 78,121 148,182 129,182"/>
    <!-- Right diagonal (center V → right stem top) -->
    <polygon points="152,182 171,182 241,121 222,121"/>
    <!-- Right stem -->
    <rect x="222" y="108" width="19" height="118"/>
    <!-- Right base serif -->
    <rect x="210" y="218" width="43" height="13"/>
    <!-- Right top serif -->
    <rect x="210" y="108" width="43" height="13"/>

    <!-- T — dominant, overlaps M at crossbar level -->
    <!-- Left end serif block -->
    <rect x="30" y="68" width="46" height="38"/>
    <!-- Crossbar -->
    <rect x="40" y="78" width="220" height="26"/>
    <!-- Right end serif block -->
    <rect x="224" y="68" width="46" height="38"/>
    <!-- Stem -->
    <rect x="132" y="78" width="36" height="160"/>
    <!-- Stem base serif -->
    <rect x="112" y="228" width="76" height="14"/>
  </g>
</svg>
