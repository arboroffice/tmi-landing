<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Email — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
  .tab-bar { display:flex; gap:2px; margin-bottom:24px; }
  .tab-btn { font-size:13px; font-weight:500; padding:7px 18px; border-radius:6px; border:none; background:transparent; color:var(--ink-2); cursor:pointer; transition:background .15s,color .15s; }
  .tab-btn.active { background:var(--bg-alt,#f5f5f5); color:var(--ink); font-weight:600; }
  .tab-btn:hover:not(.active) { background:var(--bg-alt,#f5f5f5); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .tmpl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .tmpl-card { background:var(--bg); border:1px solid var(--line,rgba(0,0,0,.08)); border-radius:var(--r,8px); padding:20px; display:flex; flex-direction:column; gap:10px; transition:border-color .15s,box-shadow .15s; }
  .tmpl-card:hover { border-color:var(--ink-3,#ccc); box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .tmpl-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .tmpl-card-name { font-size:14px; font-weight:600; color:var(--ink); line-height:1.3; }
  .tmpl-card-subject { font-size:13px; color:var(--ink-2); line-height:1.4; }
  .tmpl-card-foot { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .tmpl-card-actions { display:flex; gap:6px; }
</style>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Email</span></div>
      <div class="topbar-actions" id="topbar-actions">
        <a href="/admin-email-compose" class="btn btn-primary btn-sm" id="compose-btn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Compose
        </a>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Email</h1>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-campaigns-btn" onclick="switchTab('campaigns')">Campaigns</button>
        <button class="tab-btn" id="tab-templates-btn" onclick="switchTab('templates')">Templates</button>
      </div>

      <!-- CAMPAIGNS TAB -->
      <div class="tab-panel active" id="tab-campaigns">
        <!-- Stats row -->
        <div class="stats-row" id="email-stats" style="grid-template-columns:repeat(4,1fr)">
          <div class="stat-box"><div class="stat-label">Total Sent</div><div class="stat-val" id="es-sent">-</div></div>
          <div class="stat-box"><div class="stat-label">Emails Delivered</div><div class="stat-val" id="es-delivered">-</div></div>
          <div class="stat-box"><div class="stat-label">Total Opens</div><div class="stat-val" id="es-opens">-</div></div>
          <div class="stat-box"><div class="stat-label">Avg Open Rate</div><div class="stat-val" id="es-rate">-</div></div>
        </div>

        <div class="filter-bar" style="margin-top:16px">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="search" placeholder="Search subject..." oninput="renderTable()"/>
          </div>
          <select class="filter-select" id="filter-status" onchange="renderTable()">
            <option value="">All statuses</option>
            <option value="draft">Draft</option>
            <option value="sent">Sent</option>
            <option value="sending">Sending</option>
            <option value="failed">Failed</option>
          </select>
        </div>

        <div class="card">
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th>Subject</th><th>Audience</th><th>Status</th>
                <th>Sent To</th><th>Opens</th><th>Open Rate</th><th>Date</th><th></th>
              </tr></thead>
              <tbody id="email-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TEMPLATES TAB -->
      <div class="tab-panel" id="tab-templates">
        <div class="sec-head" style="margin-bottom:20px">
          <span></span>
          <button class="btn btn-primary btn-sm" onclick="openTemplateModal()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Template
          </button>
        </div>
        <div id="templates-container">
          <div class="tmpl-grid" id="tmpl-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Campaign detail panel -->
<div class="panel-overlay" id="campaign-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('campaign-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-subject" style="font-size:16px;max-width:340px;line-height:1.3">-</h2>
      <div class="panel-actions">
        <button class="btn btn-danger btn-sm" onclick="deleteFromPanel()">Delete</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Status</div><div class="detail-val" id="pd-status">-</div></div>
        <div class="detail-item"><div class="detail-label">Audience</div><div class="detail-val" id="pd-audience">-</div></div>
        <div class="detail-item"><div class="detail-label">Sent To</div><div class="detail-val" id="pd-sent">-</div></div>
        <div class="detail-item"><div class="detail-label">Opens</div><div class="detail-val" id="pd-opens">-</div></div>
        <div class="detail-item"><div class="detail-label">Open Rate</div><div class="detail-val" id="pd-rate">-</div></div>
        <div class="detail-item"><div class="detail-label">Clicks</div><div class="detail-val" id="pd-clicks">-</div></div>
        <div class="detail-item"><div class="detail-label">From</div><div class="detail-val" id="pd-from">-</div></div>
        <div class="detail-item"><div class="detail-label">Sent</div><div class="detail-val" id="pd-date">-</div></div>
      </div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Email Body</div>
      <div id="pd-body" style="font-size:13px;color:var(--ink-2);line-height:1.7;white-space:pre-wrap;background:var(--bg);padding:14px;border-radius:var(--r-sm);max-height:360px;overflow-y:auto;margin-top:8px"></div>
    </div>
  </div>
</div>

<!-- New Template Modal -->
<div class="modal-overlay" id="tmpl-modal">
  <div class="modal" style="max-width:580px;width:100%">
    <div class="modal-hd">
      <h2 class="modal-title" id="tmpl-modal-title">New Template</h2>
      <button class="modal-x" onclick="closeTemplateModal()">&times;</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Template Name <span style="color:var(--red)">*</span></label>
        <input class="form-input" id="tf-name" placeholder="e.g. Monthly Newsletter"/>
      </div>
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select class="form-input" id="tf-audience">
          <option value="all">Everyone</option>
          <option value="physical">Physical</option>
          <option value="online">Online</option>
          <option value="fotf">FOTF</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Subject <span style="color:var(--red)">*</span></label>
      <input class="form-input" id="tf-subject" placeholder="Email subject line"/>
    </div>
    <div class="form-group">
      <label class="form-label">Body</label>
      <textarea class="form-input" id="tf-body" rows="7" style="min-height:150px;resize:vertical" placeholder="Email body content..."></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeTemplateModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTemplate()">Save Template</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('email');

let allCampaigns = [];
let allTemplates = [];
let currentCampaign = null;

// --- Tab switching ---
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`tab-${tab}-btn`).classList.add('active');

  const composeBtn = document.getElementById('compose-btn');
  if (tab === 'campaigns') {
    composeBtn.style.display = '';
  } else {
    composeBtn.style.display = 'none';
  }

  if (tab === 'templates' && !allTemplates.length) {
    loadTemplates();
  }
}

// --- Campaigns ---
async function loadCampaigns() {
  const data = await TMIAdmin.api('/api/emails');
  if (!data) return;
  allCampaigns = data;

  const sent = data.filter(c => c.status === 'sent');
  const totalDelivered = sent.reduce((s, c) => s + (c.sent_count || 0), 0);
  const totalOpens = sent.reduce((s, c) => s + (c.open_count || 0), 0);
  const avgRate = sent.length && totalDelivered
    ? Math.round(sent.reduce((s, c) => s + (c.sent_count ? c.open_count / c.sent_count : 0), 0) / sent.length * 100)
    : 0;
  document.getElementById('es-sent').textContent = sent.length;
  document.getElementById('es-delivered').textContent = totalDelivered.toLocaleString();
  document.getElementById('es-opens').textContent = totalOpens.toLocaleString();
  document.getElementById('es-rate').textContent = sent.length ? `${avgRate}%` : '-';

  renderTable();
}

function audienceLabel(c) {
  if (c.audience_type === 'all') return 'Everyone';
  if (!c.audience_filter) return 'Segment';
  const f = c.audience_filter;
  const parts = [];
  if (f.audiences?.length) parts.push(f.audiences.join(', '));
  if (f.niches?.length) parts.push(f.niches.slice(0, 2).join(', ') + (f.niches.length > 2 ? '...' : ''));
  return parts.join(' · ') || 'Segment';
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;

  const filtered = allCampaigns.filter(c => {
    if (q && !c.subject.toLowerCase().includes(q)) return false;
    if (st && c.status !== st) return false;
    return true;
  });

  const tbody = document.getElementById('email-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">✉</div><h3>No campaigns yet</h3><p><a href="/admin-email-compose" style="color:var(--ink);text-decoration:underline">Compose your first email</a></p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(c => {
    const rate = c.sent_count ? Math.round(c.open_count / c.sent_count * 100) : 0;
    return `<tr onclick="openPanel(${JSON.stringify(c).replace(/"/g,'&quot;')})">
      <td class="td-name" style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.subject}</td>
      <td class="td-muted">${audienceLabel(c)}</td>
      <td>${TMIAdmin.badge(c.status)}</td>
      <td>${c.sent_count ? c.sent_count.toLocaleString() : '-'}</td>
      <td>${c.open_count ? c.open_count.toLocaleString() : '-'}</td>
      <td>${c.sent_count ? `<span style="font-weight:600;color:${rate>=30?'#15803d':rate>=15?'#854d0e':'var(--ink-2)'};">${rate}%</span>` : '-'}</td>
      <td class="td-muted">${TMIAdmin.fmt(c.sent_at || c.created_at)}</td>
      <td class="td-action">
        ${c.status === 'draft' ? `<a href="/admin-email-compose?id=${c.id}" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()">Edit</a>` : ''}
      </td>
    </tr>`;
  }).join('');
}

function openPanel(campaign) {
  currentCampaign = campaign;
  document.getElementById('panel-subject').textContent = campaign.subject;
  document.getElementById('pd-status').innerHTML = TMIAdmin.badge(campaign.status);
  document.getElementById('pd-audience').textContent = audienceLabel(campaign);
  document.getElementById('pd-sent').textContent = campaign.sent_count?.toLocaleString() || '0';
  document.getElementById('pd-opens').textContent = campaign.open_count?.toLocaleString() || '0';
  const rate = campaign.sent_count ? Math.round(campaign.open_count / campaign.sent_count * 100) : 0;
  document.getElementById('pd-rate').textContent = campaign.sent_count ? `${rate}%` : '-';
  document.getElementById('pd-clicks').textContent = campaign.click_count?.toLocaleString() || '0';
  document.getElementById('pd-from').textContent = `${campaign.from_name} <${campaign.from_email}>`;
  document.getElementById('pd-date').textContent = TMIAdmin.fmt(campaign.sent_at || campaign.created_at);
  document.getElementById('pd-body').textContent = campaign.body || '-';
  TMIAdmin.openPanel('campaign-panel');
}

async function deleteFromPanel() {
  if (!currentCampaign) return;
  const ok = await TMIAdmin.confirm('Delete this campaign? This cannot be undone.', true);
  if (!ok) return;
  const res = await TMIAdmin.api(`/api/emails?id=${currentCampaign.id}`, 'DELETE');
  if (res) {
    TMIAdmin.toast('Campaign deleted');
    TMIAdmin.closePanel('campaign-panel');
    await loadCampaigns();
  }
}

// --- Templates ---
async function loadTemplates() {
  try {
    const data = await TMIAdmin.api('/api/email-templates');
    allTemplates = data || [];
  } catch (e) {
    allTemplates = [];
  }
  renderTemplates();
}

function audienceLabelSimple(a) {
  const map = { all: 'Everyone', physical: 'Physical', online: 'Online', fotf: 'FOTF' };
  return map[a] || a || 'All';
}

function renderTemplates() {
  const grid = document.getElementById('tmpl-grid');
  if (!allTemplates.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📋</div><h3>No templates yet</h3><p>Create reusable email templates to speed up your campaigns.</p></div>`;
    return;
  }
  grid.innerHTML = allTemplates.map(t => `
    <div class="tmpl-card">
      <div class="tmpl-card-head">
        <div>
          <div class="tmpl-card-name">${escHtml(t.name)}</div>
          <div class="tmpl-card-subject" style="margin-top:4px">${escHtml(t.subject)}</div>
        </div>
        <span class="badge">${audienceLabelSimple(t.audience)}</span>
      </div>
      ${t.body ? `<div style="font-size:12px;color:var(--ink-3);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${escHtml(t.body)}</div>` : ''}
      <div class="tmpl-card-foot">
        <div class="tmpl-card-actions">
          <a href="/admin-email-compose?template_id=${encodeURIComponent(t.id)}" class="btn btn-primary btn-sm">Use</a>
          <button class="btn btn-ghost btn-sm" onclick="deleteTemplate('${t.id}')">Delete</button>
        </div>
        ${t.created_at ? `<span style="font-size:11px;color:var(--ink-3)">${TMIAdmin.fmt(t.created_at)}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function deleteTemplate(id) {
  const ok = await TMIAdmin.confirm('Delete this template?', true);
  if (!ok) return;
  const res = await TMIAdmin.api(`/api/email-templates?id=${encodeURIComponent(id)}`, 'DELETE');
  if (res !== null) {
    allTemplates = allTemplates.filter(t => t.id !== id);
    TMIAdmin.toast('Template deleted');
    renderTemplates();
  }
}

// --- Template Modal ---
function openTemplateModal() {
  ['tf-name','tf-subject','tf-body'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('tf-audience').value = 'all';
  document.getElementById('tmpl-modal').classList.add('open');
}

function closeTemplateModal() {
  document.getElementById('tmpl-modal').classList.remove('open');
}

async function saveTemplate() {
  const name = document.getElementById('tf-name').value.trim();
  const subject = document.getElementById('tf-subject').value.trim();
  if (!name) { TMIAdmin.toast('Template name is required', 'error'); return; }
  if (!subject) { TMIAdmin.toast('Subject is required', 'error'); return; }

  const payload = {
    name,
    subject,
    body: document.getElementById('tf-body').value.trim() || null,
    audience: document.getElementById('tf-audience').value,
  };

  const res = await TMIAdmin.api('/api/email-templates', 'POST', payload);
  if (res) {
    TMIAdmin.toast('Template saved');
    closeTemplateModal();
    await loadTemplates();
  }
}

loadCampaigns();
</script>
</body>
</html>
