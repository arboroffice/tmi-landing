<style>

}
@media (prefers-color-scheme: dark){
  :root{--bg:#121214;--card:#1c1c20;--ink:#f1f0ee;--muted:#a3a2a8;--line:#2e2e34;
  --accent:#7ea2ff;--accent-soft:#1f2a46;--good:#5fd39a;--good-soft:#173527;--warn:#f0b45a;--warn-soft:#3a2c14;
  --bad:#ff8a80;--bad-soft:#3d1c1a;--chip:#26262b;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.progress{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.stepname{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.field{margin-bottom:16px}
.field label.q{display:block;font-weight:600;margin-bottom:4px}
.help{font-size:13px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=email],input[type=time],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.Submitted,.pill.In-review{background:var(--warn-soft);color:var(--warn)}
.pill.Approved,.pill.Building{background:var(--accent-soft);color:var(--accent)}
.pill.Live{background:var(--good-soft);color:var(--good)}
.pill.On-hold{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--chip);margin:2px 4px 2px 0}
.tag.addon{background:var(--warn-soft);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tablewrap{overflow-x:auto}
.flag{display:flex;gap:8px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);margin-bottom:6px;font-size:14px}
.flag.hi{background:var(--bad-soft);color:var(--bad)}
.ok{padding:8px 10px;border-radius:10px;background:var(--good-soft);color:var(--good);font-size:14px}
/* team map */
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.node{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;min-width:150px}
.node.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.node.cos{background:var(--accent);color:#fff;border-color:var(--accent)}
.node b{display:block;font-size:14px}
.node span{font-size:12px;opacity:.8}
.vline{width:2px;height:18px;background:var(--line)}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%;border-top:2px solid var(--line);padding-top:16px;position:relative}
.bot{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.bot.off{opacity:.45}
.bot b{font-size:14px}
.bot .apps{margin-top:6px}
.botcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.botcard.off{opacity:.55}
pre.prompt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:340px;overflow:auto}
details summary{cursor:pointer;font-weight:600;font-size:14px;margin:6px 0}
.list .item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;color:var(--ink);font:inherit}
.list .item:hover{border-color:var(--accent)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.qa dt{font-weight:600;font-size:13px;color:var(--muted);margin-top:8px}
.qa dd{margin:2px 0 0;white-space:pre-wrap}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.jobrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.jobgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bigstat{font-size:28px;font-weight:700}

/* ---------- remote save ---------- */
let writing=Promise.resolve();
function targetPath(){
  if(S.isAdmin){if(!S.curId)S.curId='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);return 'installs/'+S.curId}
  return S.uid?'installs/'+S.uid:null;
}
async function saveRemote(submit){
  if(!S.db||S.canWrite===false)return false;
  const p=targetPath();if(!p)return false;
  const prev=S.isAdmin?S.installs[S.curId]:null;
  const body={answers:JSON.parse(JSON.stringify(S.answers)),submitted:submit||S.submitted||!!(prev&&prev.submitted),updatedAt:Date.now(),createdAt:(prev&&prev.createdAt)||S.createdAt||Date.now(),source:S.isAdmin?'You':'Client'};
  if(submit)body.submittedAt=Date.now();
  S.createdAt=body.createdAt;
  const job=writing.then(()=>S.db.doc(p).set(body)).then(()=>{S.canWrite=true;if(submit)S.submitted=true;return true}).catch(e=>{if(e&&e.code==='invalid_argument')S.canWrite=false;return false});
  writing=job;return job;
}

function buildSheet(a,plan){
