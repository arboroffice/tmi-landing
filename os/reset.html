<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reset your password | TMI OS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://api.fontshare.com"/>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#ffffff;--bg-alt:#f6f6f4;--ink:#0a0b14;--ink-2:#55576a;--ink-3:#8a8c9e;--line:rgba(10,11,20,0.10);--line-2:rgba(10,11,20,0.16);--chart:#E4FF97;--chart-dark:#cdee72;--sans:"General Sans",system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .card{width:100%;max-width:420px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-bottom:28px;}
  .brand span{background:var(--chart);border-radius:3px;width:11px;height:11px;display:inline-block;}
  h2{font-size:26px;font-weight:700;letter-spacing:-0.02em;}
  .sub{color:var(--ink-2);font-size:14.5px;margin-top:6px;line-height:1.5;}
  form{margin-top:24px;display:flex;flex-direction:column;gap:15px;}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px;}
  input{width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:13px 14px;}
  input:focus{outline:none;border-color:var(--ink);}
  .btn{font-family:var(--sans);font-size:15px;font-weight:600;background:var(--chart);color:var(--ink);border:1px solid var(--chart);border-radius:10px;padding:14px;cursor:pointer;transition:background .15s;margin-top:6px;}
  .btn:hover{background:var(--chart-dark);}
  .btn:disabled{opacity:.6;cursor:default;}
  .msg{font-size:13.5px;font-weight:500;min-height:1px;line-height:1.5;}
  .msg.err{color:#c0261f;}
  .msg.ok{color:#3a7d33;}
  .foot{margin-top:18px;text-align:center;font-size:13px;}
  .foot a{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">TMI <span></span> OS</div>

    <!-- REQUEST: no token -->
    <div id="paneRequest">
      <h2>Reset your password</h2>
      <p class="sub">Enter your work email and we will send you a link to set a new password.</p>
      <form onsubmit="return doRequest(event)">
        <div><label>Work email</label><input id="r-email" type="email" autocomplete="email" required/></div>
        <div class="msg" id="r-msg"></div>
        <button class="btn" id="r-btn" type="submit">Send reset link &rarr;</button>
      </form>
      <div class="foot"><a href="/os/">Back to sign in</a></div>
    </div>

    <!-- CONFIRM: token present -->
    <div id="paneConfirm" style="display:none">
      <h2>Set a new password</h2>
      <p class="sub">Choose a new password for your account.</p>
      <form onsubmit="return doConfirm(event)">
        <div><label>New password</label><input id="c-password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required/></div>
        <div class="msg" id="c-msg"></div>
        <button class="btn" id="c-btn" type="submit">Set new password &rarr;</button>
      </form>
      <div class="foot"><a href="/os/">Back to sign in</a></div>
    </div>
  </div>

<script>
function qs(k){return new URLSearchParams(location.search).get(k)||'';}
var TOKEN=qs('token');
if(TOKEN){document.getElementById('paneRequest').style.display='none';document.getElementById('paneConfirm').style.display='';}
function msg(id,text,cls){var e=document.getElementById(id);e.textContent=text;e.className='msg'+(cls?' '+cls:'');}
async function post(body){var r=await fetch('/api/os2-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var j={};try{j=await r.json();}catch(_){}if(!r.ok)throw new Error(j.error||'Something went wrong');return j;}
async function doRequest(ev){
  ev.preventDefault();
  var email=(document.getElementById('r-email').value||'').trim();
  var btn=document.getElementById('r-btn');btn.disabled=true;btn.textContent='Sending...';
  try{await post({action:'request',email:email});msg('r-msg','If that email has an account, a reset link is on its way. Check your inbox.','ok');}
  catch(e){msg('r-msg',e.message,'err');}
  btn.disabled=false;btn.textContent='Send reset link →';
  return false;
}
async function doConfirm(ev){
  ev.preventDefault();
  var pw=document.getElementById('c-password').value||'';
  if(pw.length<8){msg('c-msg','Use at least 8 characters.','err');return false;}
  var btn=document.getElementById('c-btn');btn.disabled=true;btn.textContent='Saving...';
  try{await post({action:'confirm',token:TOKEN,password:pw});msg('c-msg','Password updated. Redirecting you to sign in...','ok');setTimeout(function(){location.href='/os/';},1400);}
  catch(e){msg('c-msg',e.message,'err');btn.disabled=false;btn.textContent='Set new password →';}
  return false;
}
</script>
</body>
</html>
