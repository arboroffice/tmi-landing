<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Intelligence Assessments — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<!-- OpenAI Ads pixel --><script>!function(w,d,s,u){if(w.oaiq)return;var q=function(){q.q.push(arguments)};q.q=[];w.oaiq=q;var j=d.createElement(s);j.async=1;j.src=u;var f=d.getElementsByTagName(s)[0];f.parentNode.insertBefore(j,f)}(window,document,"script","https://bzrcdn.openai.com/sdk/oaiq.min.js");oaiq("init",{pixelId:"1SVHHxEVsMKxiFJd8MnXZm",debug:false});</script>
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Intelligence Assessments</span></div>
      <div class="topbar-actions"></div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Intelligence Assessment Applications</h1>
        <span class="filter-count" id="a-count"></span>
      </div>
      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, company, industry..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderTable()">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="reviewed">Reviewed</option>
          <option value="booked">Booked</option>
          <option value="won">Won</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Name</th><th>Company</th><th>Revenue</th><th>Industry</th><th>Status</th><th>Received</th><th></th>
            </tr></thead>
            <tbody id="a-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="panel-overlay" id="a-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('a-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-name">Application</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" id="btn-reject" onclick="setStatus('rejected')">Reject</button>
        <button class="btn btn-primary btn-sm" id="btn-book" onclick="setStatus('booked')">Mark booked</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid" id="panel-details"></div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Biggest challenge</div>
      <p id="panel-challenge" style="font-size:14px;color:var(--ink-2);line-height:1.65;margin-bottom:16px;"></p>
      <div class="panel-sec-label">Notes</div>
      <textarea class="form-input" id="panel-notes" rows="3" placeholder="Internal notes..." style="margin-top:8px;"></textarea>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="saveNotes()">Save Notes</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('assessment');

let allApps = [], currentApp = null;

async function loadApps(){
  allApps = await TMIAdmin.api('/api/assessment-applications').catch(()=>[]) || [];
  renderTable();
}

function renderTable(){
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const rows = allApps.filter(a=>{
    if(st && a.status!==st) return false;
    if(q && !`${a.first_name||''} ${a.last_name||''} ${a.company||''} ${a.industry||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('a-count').textContent = `${rows.length} application${rows.length!==1?'s':''}`;
  const tbody = document.getElementById('a-tbody');
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">🧭</div><h3>No assessment applications yet</h3><p>Applications from the Intelligence Assessment page will appear here.</p></div></td></tr>`; return; }
  tbody.innerHTML = rows.map(a=>{
    const name = [a.first_name,a.last_name].filter(Boolean).join(' ')||a.email||'Unknown';
    return `<tr onclick="openPanel('${a.id}')">
      <td class="td-name">${name}</td>
      <td>${a.company||'<span class="td-muted">-</span>'}</td>
      <td>${a.revenue?`<span style="font-size:12px;color:var(--muted)">${a.revenue}</span>`:'<span class="td-muted">-</span>'}</td>
      <td>${a.industry||'<span class="td-muted">-</span>'}</td>
      <td>${TMIAdmin.badge(a.status||'new')}</td>
      <td class="td-muted">${TMIAdmin.fmt(a.created_at)}</td>
      <td class="td-action"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openPanel('${a.id}')">View</button></td>
    </tr>`;
  }).join('');
}

function openPanel(id){
  currentApp = allApps.find(a=>a.id===id); if(!currentApp) return;
  const a = currentApp;
  document.getElementById('panel-name').textContent = [a.first_name,a.last_name].filter(Boolean).join(' ')||a.email||'Unknown';
  document.getElementById('panel-challenge').textContent = a.challenge || 'No details provided.';
  document.getElementById('panel-notes').value = a.notes || '';
  const details = [
    { label:'Company', value:a.company||'-' },
    { label:'Revenue', value:a.revenue||'-' },
    { label:'Employees', value:a.employees||'-' },
    { label:'Industry', value:a.industry||'-' },
    { label:'Current software', value:a.current_software||'-' },
    { label:'Email', value:a.email||'-' },
    { label:'Phone', value:a.phone||'-' },
    { label:'Status', value:TMIAdmin.badge(a.status||'new') },
    { label:'Received', value:TMIAdmin.fmt(a.created_at) },
  ];
  document.getElementById('panel-details').innerHTML = details.map(d=>`<div class="detail-row"><span class="detail-label">${d.label}</span><span class="detail-val">${d.value}</span></div>`).join('');
  TMIAdmin.openPanel('a-panel');
}

async function saveNotes(){
  if(!currentApp) return;
  const notes = document.getElementById('panel-notes').value;
  await TMIAdmin.api('/api/assessment-applications','PATCH',{ id:currentApp.id, notes }).catch(()=>{});
  currentApp.notes = notes; TMIAdmin.toast('Notes saved');
}
async function setStatus(status){
  if(!currentApp) return;
  await TMIAdmin.api('/api/assessment-applications','PATCH',{ id:currentApp.id, status }).catch(()=>{});
  currentApp.status = status; TMIAdmin.toast('Updated'); renderTable();
}

loadApps();
</script>
</body>
</html>
