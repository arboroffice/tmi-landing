<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Newsletter — FOTF Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
<style>
body.nl-page .content { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.nl-wrap { display: flex; flex: 1; overflow: hidden; }

/* Queue */
.nl-queue { width: 260px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
.nl-queue-hd { padding: 14px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.nl-queue-search { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; font-size: 13px; color: var(--ink); background: var(--bg); outline: none; font-family: inherit; }
.nl-queue-search:focus { border-color: var(--ink); }
.nl-filter-row { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; flex-wrap: wrap; }
.nl-filter { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; background: none; color: var(--ink-2); font-family: inherit; transition: background 0.1s, color 0.1s; }
.nl-filter.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.nl-list { flex: 1; overflow-y: auto; }
.nl-card { padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.1s; }
.nl-card:hover { background: var(--bg); }
.nl-card.active { background: var(--chart); }
.nl-card-series { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.nl-card-title { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nl-card-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
.nl-new-btn { display: block; padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-top: none; border-left: none; border-right: none; width: 100%; text-align: left; font-family: inherit; transition: background 0.1s; }
.nl-new-btn:hover { background: var(--bg); }

/* Editor */
.nl-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.nl-editor-bar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0; flex-wrap: wrap; }
.two-sides { display: flex; gap: 6px; align-items: center; }
.two-sides-chip { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 500; }
.two-sides-chip.ok { background: #dcfce7; color: #166534; }
.two-sides-chip.warn { background: #fef3c7; color: #92400e; }
.nl-editor-actions { margin-left: auto; display: flex; gap: 8px; }
.nl-form { flex: 1; overflow-y: auto; padding: 28px 32px; }
.nl-meta-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
.nl-field { margin-bottom: 20px; }
.nl-field label { display: block; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.nl-field .nl-hint { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 5px; font-weight: 400; text-transform: none; letter-spacing: 0; display: block; }
.nl-field input, .nl-field textarea, .nl-field select { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 12px; font-size: 14px; color: var(--ink); background: var(--surface); outline: none; font-family: inherit; resize: vertical; transition: border-color 0.15s; }
.nl-field input:focus, .nl-field textarea:focus, .nl-field select:focus { border-color: var(--ink); }
.nl-field textarea.tall { min-height: 120px; }
.nl-field textarea.short { min-height: 72px; }
.nl-field input.headline { font-size: 20px; font-family: var(--serif); font-weight: 600; }
.nl-section-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); min-height: 42px; cursor: text; }
.tag-pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--chart); color: var(--ink); display: flex; align-items: center; gap: 4px; }
.tag-pill button { background: none; border: none; cursor: pointer; color: var(--ink-2); font-size: 14px; line-height: 1; padding: 0; }
.tag-input { border: none; outline: none; font-size: 13px; font-family: inherit; color: var(--ink); background: transparent; min-width: 80px; }
.nl-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--muted); gap: 12px; padding: 60px 32px; text-align: center; }
.nl-empty h3 { font-size: 18px; font-weight: 400; color: var(--ink-2); }
.series-rotation { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 28px; }
.sr-cell { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font-size: 12px; }
.sr-cell .sr-name { color: var(--ink); font-weight: 500; margin-bottom: 4px; }
.sr-cell .sr-count { color: var(--muted); font-size: 11px; }
.sr-cell.has-issue { border-color: var(--chart); background: #fafff0; }

/* Series intro banner */
.series-banner { background: var(--bg-alt); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px 16px; margin-bottom: 24px; }
.series-banner-name { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.series-banner-desc { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

/* Previous in series */
.prev-series-strip { margin-bottom: 24px; }
.prev-series-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.prev-series-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.prev-issue-row { display: flex; gap: 10px; }
.prev-issue-card { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.12s; }
.prev-issue-card:hover { border-color: var(--ink-2); background: var(--bg-alt); }
.prev-issue-num { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.prev-issue-headline { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.3; }
.prev-issue-expand { display: none; margin-top: 10px; font-size: 12px; color: var(--ink-2); line-height: 1.55; border-top: 1px solid var(--line); padding-top: 10px; white-space: pre-wrap; }
.prev-issue-card.open .prev-issue-expand { display: block; }
</style>
</head>
<body class="nl-page">
<div class="layout">
  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb">
        <span style="color:var(--muted)">FOTF</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="page">Newsletter</span>
      </div>
    </div>

    <div class="content">
      <div class="nl-wrap">

        <!-- Queue -->
        <div class="nl-queue">
          <button class="nl-new-btn" onclick="newIssue()">+ New Issue</button>
          <div class="nl-queue-hd">
            <input class="nl-queue-search" placeholder="Search issues..." oninput="filterIssues(this.value)" id="q-search"/>
          </div>
          <div class="nl-filter-row" id="filter-row">
            <button class="nl-filter active" data-f="all" onclick="setFilter('all',this)">All</button>
            <button class="nl-filter" data-f="draft" onclick="setFilter('draft',this)">Draft</button>
            <button class="nl-filter" data-f="scheduled" onclick="setFilter('scheduled',this)">Scheduled</button>
            <button class="nl-filter" data-f="sent" onclick="setFilter('sent',this)">Sent</button>
          </div>
          <div class="nl-list" id="nl-list">
            <div style="padding:20px 16px;font-size:13px;color:var(--muted)">Loading...</div>
          </div>
        </div>

        <!-- Editor -->
        <div class="nl-editor" id="nl-editor">
          <div class="nl-empty" id="nl-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13" stroke-linecap="round"/><line x1="16" y1="17" x2="8" y2="17" stroke-linecap="round"/></svg>
            <h3>Select an issue or create a new one</h3>
            <button class="btn btn-primary btn-sm" onclick="newIssue()">+ New Issue</button>
          </div>
          <div id="nl-form-wrap" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
            <div class="nl-editor-bar">
              <div class="two-sides" id="two-sides" style="display:none">
                <span class="two-sides-chip warn" id="chip-online">Online ?</span>
                <span class="two-sides-chip warn" id="chip-physical">Physical ?</span>
              </div>
              <div class="nl-editor-actions">
                <button class="btn btn-ghost btn-sm" onclick="deleteIssue()" id="btn-delete" style="color:var(--red)">Delete</button>
                <button class="btn btn-ghost btn-sm" onclick="saveIssue()">Save Draft</button>
                <button class="btn btn-ghost btn-sm" onclick="openSchedule()">Schedule</button>
                <button class="btn btn-primary btn-sm" onclick="pushToBeehiiv()">Push to Beehiiv</button>
              </div>
            </div>
            <div class="nl-form" id="nl-form">
              <div class="nl-meta-row">
                <div style="flex:0 0 auto">
                  <label style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Series</label>
                  <select class="form-input" id="f-series" style="font-size:13px;padding:7px 10px;" onchange="onSeriesChange()">
                    <option value="">Pick series...</option>
                    <option value="field-guide">Sunday Field Guide</option>
                    <option value="tool-drop">Wednesday Tool Drop</option>
                    <option value="field-notes">Field Notes</option>
                    <option value="receipts">Receipts</option>
                    <option value="build">Build</option>
                    <option value="wrong-way">Wrong Way</option>
                    <option value="day-one">Day One</option>
                    <option value="open-tabs">Open Tabs</option>
                  </select>
                </div>
                <div style="flex:0 0 80px">
                  <label style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Issue #</label>
                  <input type="number" id="f-issue-num" class="form-input" style="font-size:13px;padding:7px 10px;" placeholder="Auto"/>
                </div>
                <div id="f-status-badge" style="align-self:flex-end;padding-bottom:2px"></div>
              </div>

              <!-- Rotation tracker -->
              <div id="rotation-wrap" style="margin-bottom:20px"></div>

              <!-- Series banner + previous issues -->
              <div id="series-context" style="display:none">
                <div class="series-banner" id="series-banner"></div>
                <div class="prev-series-strip" id="prev-series-strip" style="display:none">
                  <div class="prev-series-hd">
                    <span class="prev-series-label">Previous in this series</span>
                    <span id="prev-series-count" style="font-size:11px;color:var(--muted)"></span>
                  </div>
                  <div class="prev-issue-row" id="prev-issue-row"></div>
                </div>
              </div>

              <div class="nl-section-label">Headline & Dek</div>
              <div class="nl-field">
                <label>Headline</label>
                <input type="text" id="f-headline" class="headline" placeholder="The job that cost more than the invoice said" oninput="markDirty()"/>
              </div>
              <div class="nl-field">
                <label>Dek <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px">italic subhead</span></label>
                <input type="text" id="f-dek" placeholder="One sentence. Sets up the idea." oninput="markDirty()"/>
              </div>

              <!-- Series-specific body fields injected here -->
              <div id="series-fields-wrap"></div>

              <div class="nl-section-label">Tags</div>
              <div class="nl-field">
                <label>Topics</label>
                <div class="tags-wrap" id="tags-wrap" onclick="document.getElementById('tag-input').focus()">
                  <input class="tag-input" id="tag-input" placeholder="Add tag..." onkeydown="handleTagKey(event)"/>
                </div>
              </div>

              <div style="height:40px"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Schedule modal -->
<div class="modal-overlay" id="schedule-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-hd">
      <h3 class="modal-title">Schedule Issue</h3>
      <button class="modal-close" onclick="TMIAdmin.closeModal('schedule-modal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">
      <div class="form-group">
        <label class="form-label">Send Date & Time</label>
        <input type="datetime-local" class="form-input" id="sched-dt"/>
      </div>
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select class="form-input" id="sched-audience">
          <option value="all">All subscribers</option>
          <option value="free">Free only</option>
          <option value="premium">Premium (paid) only</option>
        </select>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost btn-sm" onclick="TMIAdmin.closeModal('schedule-modal')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="confirmSchedule()">Schedule</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>
<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('fotf-newsletter');

// ── Series definitions ──────────────────────────────────────────────────────
const SERIES_CONFIG = {
  'field-guide': {
    label: 'Sunday Field Guide',
    desc: 'A curated Sunday read. One story, three picks, a question that sits with you all week.',
    twoSides: false,
    fields: [
      { id: 'opening_note', label: 'Opening Note', hint: 'How you\'re coming into this week. Personal, grounded, no performance.', tall: true },
      { id: 'main_story', label: 'Main Story', hint: 'The one thing worth thinking about this week. Real situation, specific operator.', tall: true },
      { id: 'three_picks', label: 'Three Picks', hint: 'A tool, a read, an idea. One sentence each. No fluff.', tall: false },
      { id: 'question', label: 'Question to Sit With', hint: 'One question. Leave it open. Don\'t answer it.', input: true },
      { id: 'thread', label: 'Series Thread', hint: 'How this connects forward or back in the series. One sentence.', input: true },
    ]
  },
  'tool-drop': {
    label: 'Wednesday Tool Drop',
    desc: 'One tool. Why it matters right now. How both sides of the house use it.',
    twoSides: true,
    fields: [
      { id: 'the_tool', label: 'The Tool', hint: 'Name it. What category is it. Link if relevant.', input: true },
      { id: 'why_now', label: 'Why Now', hint: 'Why this tool this week. What changed or what made you notice it.', tall: false },
      { id: 'online_use', label: 'Online Business Use', hint: 'Specific scenario. Creator, SaaS, e-com, agency. What problem, what outcome.', tall: false },
      { id: 'physical_use', label: 'Physical Business Use', hint: 'Specific scenario. Trades, fleet, manufacturing. What problem, what outcome.', tall: false },
      { id: 'steal_this', label: 'Steal This', hint: 'One specific move they can take today. Concrete. No "consider using it."', tall: false },
    ]
  },
  'field-notes': {
    label: 'Field Notes',
    desc: 'What\'s happening in the field right now. In-the-trenches observations, no polish.',
    twoSides: false,
    fields: [
      { id: 'whats_happening', label: 'What\'s Happening', hint: 'The context. Set the scene without editorializing.', tall: false },
      { id: 'what_i_noticed', label: 'What I\'m Noticing', hint: 'The pattern. What keeps showing up across different operators.', tall: true },
      { id: 'surprise', label: 'What Surprised Me', hint: 'The thing you didn\'t expect. The data point or conversation that landed differently.', tall: false },
      { id: 'one_number', label: 'One Number', hint: 'The data point. Then one sentence on what it actually means.', input: true },
      { id: 'next_issue', label: 'Next Issue Teaser', hint: 'One sentence. What\'s coming. Build the anticipation.', input: true },
    ]
  },
  'receipts': {
    label: 'Receipts',
    desc: 'Real data. Real outcomes. Show the work, show the numbers.',
    twoSides: false,
    fields: [
      { id: 'the_claim', label: 'The Claim', hint: 'The thing people say. The conventional wisdom you\'re about to test.', input: true },
      { id: 'the_receipt', label: 'The Receipt', hint: 'Actual numbers, screenshots, specifics. This is the whole point — be granular.', tall: true },
      { id: 'what_it_means', label: 'What It Actually Means', hint: 'The interpretation. What the data shows vs. what people assume.', tall: false },
      { id: 'who_should_care', label: 'Who Should Care', hint: 'Online or physical — what does this number mean for each? Different implications.', tall: false },
      { id: 'the_caveat', label: 'The Caveat', hint: 'What this data doesn\'t prove. The honest limit of the conclusion.', input: true },
    ]
  },
  'build': {
    label: 'Build',
    desc: 'Building something in public. Each issue is a chapter — they connect.',
    twoSides: false,
    fields: [
      { id: 'build_what', label: 'What We\'re Building', hint: 'The thing. Keep this consistent across all issues in this arc.', input: true },
      { id: 'build_chapter', label: 'Chapter / Milestone', hint: 'Where in the build. Chapter X. What stage.', input: true },
      { id: 'what_broke', label: 'What Broke', hint: 'The real stuff. What went wrong, got harder, didn\'t work.', tall: true },
      { id: 'what_worked', label: 'What Worked', hint: 'The wins. Specific. Not "we made progress" — what actually moved.', tall: true },
      { id: 'whats_next', label: 'What\'s Next', hint: 'The next chapter. Sets up the sequel. What will they want to know.', tall: false },
    ]
  },
  'wrong-way': {
    label: 'Wrong Way',
    desc: 'The common belief. Why it\'s wrong. What it actually costs you.',
    twoSides: false,
    fields: [
      { id: 'common_belief', label: 'The Common Belief', hint: 'The thing everyone says. One sentence. The conventional wisdom.', input: true },
      { id: 'why_wrong', label: 'Why It\'s Wrong', hint: 'The actual evidence. Not opinion — data, cases, specific examples.', tall: true },
      { id: 'the_cost', label: 'What It Costs You', hint: 'What happens when you follow the wrong advice. Real consequences, real numbers.', tall: false },
      { id: 'what_instead', label: 'What to Do Instead', hint: 'The actual better approach. Specific enough to act on today.', tall: true },
      { id: 'how_to_know', label: 'How to Know If You\'re Doing It Right', hint: 'The test. The signal you\'re on the right path.', input: true },
    ]
  },
  'day-one': {
    label: 'Day One',
    desc: 'New operator. New business. The story nobody tells you before you start.',
    twoSides: false,
    fields: [
      { id: 'the_situation', label: 'The Situation', hint: 'Who is this person. What they walked into. Specific enough to feel real.', tall: false },
      { id: 'the_decision', label: 'The Decision', hint: 'The choice they faced. What the stakes were. What the options looked like.', tall: false },
      { id: 'what_nobody_said', label: 'What Nobody Told Them', hint: 'The thing you learn the hard way. What mentors skip because they forgot it was hard.', tall: true },
      { id: 'what_they_did', label: 'What They Did', hint: 'The actual move they made. Not what they should have done — what they did.', tall: true },
      { id: 'what_happened', label: 'What Happened Next', hint: 'The outcome. Honest. Not always a win. What it taught them.', tall: false },
    ]
  },
  'open-tabs': {
    label: 'Open Tabs',
    desc: 'Three things worth your time. What connects them is the whole point.',
    twoSides: false,
    fields: [
      { id: 'theme', label: 'The Thread This Week', hint: 'The thing connecting all three picks. Say it up front.', input: true },
      { id: 'tab_1', label: 'Tab 1', hint: 'Link or reference + 2-3 sentences on why. What to take from it. What it changed.', tall: false },
      { id: 'tab_2', label: 'Tab 2', hint: 'Link or reference + 2-3 sentences on why. What to take from it.', tall: false },
      { id: 'tab_3', label: 'Tab 3', hint: 'Link or reference + 2-3 sentences on why. What surprised you about it.', tall: false },
      { id: 'the_connection', label: 'Why These Three', hint: 'The non-obvious link. What they have to do with each other. The payoff.', tall: false },
    ]
  },
};

const SERIES_LABEL = Object.fromEntries(Object.entries(SERIES_CONFIG).map(([k,v]) => [k, v.label]));
const ALL_SERIES = Object.keys(SERIES_CONFIG);

let issues = [];
let currentIssue = null;
let dirty = false;
let filterStatus = 'all';
let tags = [];

function markDirty() { dirty = true; }

// ── Tags ────────────────────────────────────────────────────────────────────
function handleTagKey(e) {
  if ((e.key === 'Enter' || e.key === ',') && e.target.value.trim()) {
    e.preventDefault(); addTag(e.target.value.trim()); e.target.value = '';
  }
}
function addTag(t) {
  if (tags.includes(t)) return; tags.push(t); renderTags(); markDirty();
}
function removeTag(t) {
  tags = tags.filter(x => x !== t); renderTags(); markDirty();
}
function renderTags() {
  const wrap = document.getElementById('tags-wrap');
  const input = document.getElementById('tag-input');
  wrap.querySelectorAll('.tag-pill').forEach(p => p.remove());
  tags.forEach(t => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${t}<button onclick="removeTag('${t}')" type="button">×</button>`;
    wrap.insertBefore(pill, input);
  });
}

// ── Two Sides Checker ───────────────────────────────────────────────────────
function checkTwoSides() {
  const series = document.getElementById('f-series').value;
  const cfg = SERIES_CONFIG[series];
  const twoSidesEl = document.getElementById('two-sides');
  if (!cfg || !cfg.twoSides) { twoSidesEl.style.display = 'none'; return; }
  twoSidesEl.style.display = 'flex';
  const online   = (document.getElementById('sf-online_use')?.value || '').trim();
  const physical = (document.getElementById('sf-physical_use')?.value || '').trim();
  const co = document.getElementById('chip-online');
  const cp = document.getElementById('chip-physical');
  co.className = `two-sides-chip ${online ? 'ok' : 'warn'}`;
  co.textContent = online ? 'Online ✓' : 'Online —';
  cp.className = `two-sides-chip ${physical ? 'ok' : 'warn'}`;
  cp.textContent = physical ? 'Physical ✓' : 'Physical —';
}

// ── Series form rendering ───────────────────────────────────────────────────
function renderSeriesForm(series, bodyData) {
  const cfg = SERIES_CONFIG[series];
  const wrap = document.getElementById('series-fields-wrap');
  const ctx  = document.getElementById('series-context');
  const banner = document.getElementById('series-banner');

  if (!cfg) {
    wrap.innerHTML = '';
    ctx.style.display = 'none';
    document.getElementById('two-sides').style.display = 'none';
    return;
  }

  // Banner
  banner.innerHTML = `<div class="series-banner-name">${cfg.label}</div><div class="series-banner-desc">${cfg.desc}</div>`;
  ctx.style.display = '';

  // Previous issues in series
  renderPreviousInSeries(series);

  // Fields
  wrap.innerHTML = `<div class="nl-section-label">Body</div>` +
    cfg.fields.map(f => {
      const val = (bodyData && bodyData[f.id]) ? bodyData[f.id].replace(/"/g, '&quot;') : '';
      const onchange = f.id === 'online_use' || f.id === 'physical_use' ? 'oninput="checkTwoSides();markDirty()"' : 'oninput="markDirty()"';
      if (f.input) {
        return `<div class="nl-field">
          <label>${f.label}<span class="nl-hint">${f.hint}</span></label>
          <input type="text" id="sf-${f.id}" value="${val}" placeholder="${f.hint}" ${onchange}/>
        </div>`;
      }
      return `<div class="nl-field">
        <label>${f.label}<span class="nl-hint">${f.hint}</span></label>
        <textarea id="sf-${f.id}" class="${f.tall ? 'tall' : 'short'}" placeholder="${f.hint}" ${onchange}>${bodyData?.[f.id] || ''}</textarea>
      </div>`;
    }).join('');

  checkTwoSides();
}

function renderPreviousInSeries(series) {
  const strip = document.getElementById('prev-series-strip');
  const row   = document.getElementById('prev-issue-row');
  const count = document.getElementById('prev-series-count');

  const prev = issues
    .filter(i => i.series === series && i.id !== currentIssue?.id)
    .slice(0, 3);

  if (!prev.length) { strip.style.display = 'none'; return; }

  strip.style.display = '';
  count.textContent = `${prev.length} previous`;

  row.innerHTML = prev.map(i => {
    // Extract a preview snippet from body data
    let preview = '';
    try {
      const b = JSON.parse(i.notes || '{}');
      const bodyData = b.body || {};
      const firstField = Object.values(bodyData).find(v => v && v.trim());
      if (firstField) preview = firstField.slice(0, 200);
    } catch(e) {}
    const num = i.issue_number ? `#${i.issue_number}` : TMIAdmin.fmt(i.created_at);
    return `<div class="prev-issue-card" onclick="togglePrevIssue(this)">
      <div class="prev-issue-num">${num} · ${TMIAdmin.badge(i.status)}</div>
      <div class="prev-issue-headline">${i.headline || '(no headline)'}</div>
      ${preview ? `<div class="prev-issue-expand">${preview}${preview.length >= 200 ? '...' : ''}</div>` : ''}
    </div>`;
  }).join('');
}

function togglePrevIssue(card) {
  card.classList.toggle('open');
}

// ── Series rotation tracker ─────────────────────────────────────────────────
function renderRotation(allIssues) {
  const thisMonth = new Date(); thisMonth.setDate(1); thisMonth.setHours(0,0,0,0);
  const counts = {};
  ALL_SERIES.forEach(s => counts[s] = 0);
  allIssues.forEach(i => {
    if (i.series && new Date(i.created_at) >= thisMonth) counts[i.series] = (counts[i.series] || 0) + 1;
  });
  document.getElementById('rotation-wrap').innerHTML =
    `<div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">This Month</div>
    <div class="series-rotation">${ALL_SERIES.map(s =>
      `<div class="sr-cell ${counts[s] ? 'has-issue' : ''}">
        <div class="sr-name">${SERIES_CONFIG[s]?.label || s}</div>
        <div class="sr-count">${counts[s]} issue${counts[s] !== 1 ? 's' : ''}</div>
      </div>`).join('')}</div>`;
}

// ── Issue list ──────────────────────────────────────────────────────────────
function onSeriesChange() {
  const series = document.getElementById('f-series').value;
  renderSeriesForm(series, null);
  // Auto-suggest next issue number
  if (series) {
    const maxNum = Math.max(0, ...issues.filter(i => i.series === series && i.issue_number).map(i => i.issue_number));
    const numEl = document.getElementById('f-issue-num');
    if (!numEl.value) numEl.value = maxNum + 1;
  }
  markDirty();
}

function renderList(list) {
  const el = document.getElementById('nl-list');
  if (!list.length) {
    el.innerHTML = `<div style="padding:20px 16px;font-size:13px;color:var(--muted)">No issues found.</div>`;
    return;
  }
  el.innerHTML = list.map(i => {
    const series = SERIES_CONFIG[i.series]?.label || i.series || 'Unknown';
    const num = i.issue_number ? ` #${i.issue_number}` : '';
    const isActive = currentIssue?.id === i.id;
    return `<div class="nl-card${isActive?' active':''}" onclick="loadIssue('${i.id}')">
      <div class="nl-card-series">${series}${num}</div>
      <div class="nl-card-title">${i.headline || '(no headline)'}</div>
      <div class="nl-card-meta">${TMIAdmin.badge(i.status)}<span>${TMIAdmin.fmt(i.created_at)}</span></div>
    </div>`;
  }).join('');
}

function filterIssues(q) {
  const search = q.toLowerCase();
  let filtered = issues.filter(i => filterStatus === 'all' || i.status === filterStatus);
  if (search) filtered = filtered.filter(i =>
    (i.headline || '').toLowerCase().includes(search) ||
    (i.series || '').includes(search)
  );
  renderList(filtered);
}

function setFilter(status, btn) {
  filterStatus = status;
  document.querySelectorAll('.nl-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterIssues(document.getElementById('q-search').value);
}

// ── Load / save issue ───────────────────────────────────────────────────────
function loadIssue(id) {
  if (dirty && currentIssue) {
    if (!confirm('You have unsaved changes. Discard them?')) return;
  }
  const issue = issues.find(i => i.id === id);
  if (!issue) return;
  currentIssue = issue;
  dirty = false;
  tags = issue.tags || [];

  document.getElementById('nl-empty').style.display = 'none';
  document.getElementById('nl-form-wrap').style.display = 'flex';

  document.getElementById('f-series').value    = issue.series || '';
  document.getElementById('f-issue-num').value = issue.issue_number || '';
  document.getElementById('f-headline').value  = issue.headline || '';
  document.getElementById('f-dek').value       = issue.dek || '';

  // Load body data from notes JSON, or fall back to legacy flat fields
  let bodyData = {};
  try {
    const n = JSON.parse(issue.notes || '{}');
    bodyData = n.body || {};
  } catch(e) {}

  // Legacy fallback: if notes has no body, map old flat fields
  if (!Object.keys(bodyData).length) {
    bodyData = {
      cold_open: issue.cold_open, setup: issue.setup,
      the_turn: issue.the_turn, the_proof: issue.the_proof,
      online_use: issue.online_example, physical_use: issue.physical_example,
      next_step: issue.next_step, pull_quote: issue.pull_quote,
    };
  }

  renderSeriesForm(issue.series, bodyData);
  renderTags();

  document.getElementById('f-status-badge').innerHTML = TMIAdmin.badge(issue.status);
  document.getElementById('btn-delete').style.display = issue.status === 'sent' ? 'none' : '';

  renderList(issues.filter(i => filterStatus === 'all' || i.status === filterStatus));
}

function collectSeriesBody() {
  const series = document.getElementById('f-series').value;
  const cfg = SERIES_CONFIG[series];
  if (!cfg) return {};
  const body = {};
  cfg.fields.forEach(f => {
    const el = document.getElementById('sf-' + f.id);
    if (el) body[f.id] = el.value.trim();
  });
  return body;
}

function collectFields() {
  const body = collectSeriesBody();
  return {
    id:           currentIssue?.id,
    series:       document.getElementById('f-series').value,
    issue_number: parseInt(document.getElementById('f-issue-num').value) || null,
    headline:     document.getElementById('f-headline').value.trim(),
    dek:          document.getElementById('f-dek').value.trim(),
    notes:        JSON.stringify({ body }),
    tags,
  };
}

async function saveIssue() {
  const fields = collectFields();
  let updated;
  if (currentIssue?.id) {
    updated = await TMIAdmin.api('/api/fotf-issues', 'PUT', fields);
  } else {
    updated = await TMIAdmin.api('/api/fotf-issues', 'POST', fields);
  }
  if (!updated) return;
  dirty = false;
  currentIssue = updated;
  TMIAdmin.toast('Saved');
  await reload();
}

async function newIssue() {
  if (dirty && currentIssue) {
    if (!confirm('You have unsaved changes. Discard them?')) return;
  }
  currentIssue = null;
  dirty = false;
  tags = [];
  document.getElementById('nl-empty').style.display = 'none';
  document.getElementById('nl-form-wrap').style.display = 'flex';
  document.getElementById('f-series').value    = '';
  document.getElementById('f-issue-num').value = '';
  document.getElementById('f-headline').value  = '';
  document.getElementById('f-dek').value       = '';
  document.getElementById('series-fields-wrap').innerHTML = '';
  document.getElementById('series-context').style.display = 'none';
  document.getElementById('two-sides').style.display = 'none';
  renderTags();
  document.getElementById('f-status-badge').innerHTML = TMIAdmin.badge('draft');
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('f-headline').focus();
  renderList(issues.filter(i => filterStatus === 'all' || i.status === filterStatus));
}

async function deleteIssue() {
  if (!currentIssue?.id) return;
  const ok = await TMIAdmin.confirm(`Delete "${currentIssue.headline || 'this issue'}"? This cannot be undone.`);
  if (!ok) return;
  await TMIAdmin.api(`/api/fotf-issues?id=${currentIssue.id}`, 'DELETE');
  currentIssue = null; dirty = false;
  document.getElementById('nl-empty').style.display = 'flex';
  document.getElementById('nl-form-wrap').style.display = 'none';
  await reload();
}

function openSchedule() {
  if (!currentIssue?.id) { TMIAdmin.toast('Save the issue first','error'); return; }
  const dt = document.getElementById('sched-dt');
  dt.value = currentIssue.scheduled_at ? currentIssue.scheduled_at.slice(0,16) : '';
  TMIAdmin.openModal('schedule-modal');
}

async function confirmSchedule() {
  const dt = document.getElementById('sched-dt').value;
  if (!dt) { TMIAdmin.toast('Pick a date and time','error'); return; }
  await saveIssue();
  const updated = await TMIAdmin.api('/api/fotf-issues', 'PUT', {
    id: currentIssue.id, status: 'scheduled', scheduled_at: new Date(dt).toISOString()
  });
  if (!updated) return;
  currentIssue = updated;
  TMIAdmin.closeModal('schedule-modal');
  TMIAdmin.toast('Scheduled');
  await reload();
}

async function pushToBeehiiv() {
  if (!currentIssue?.id) { await saveIssue(); }
  if (!currentIssue?.id) return;
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Pushing...';
  const result = await TMIAdmin.api('/api/fotf-issues', 'POST', { action: 'push-beehiiv', id: currentIssue.id });
  btn.disabled = false; btn.textContent = 'Push to Beehiiv';
  if (result?.ok) TMIAdmin.toast('Pushed to Beehiiv as draft');
}

async function reload() {
  issues = await TMIAdmin.api('/api/fotf-issues') || [];
  issues.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  renderList(issues.filter(i => filterStatus === 'all' || i.status === filterStatus));
  renderRotation(issues);
}

reload();
</script>
</body>
</html>
