<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clients — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Clients</span></div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Client
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Clients</h1>
        <span class="filter-count" id="client-count"></span>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search name, company, email..." oninput="renderTable()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderTable()">
          <option value="">All statuses</option>
          <option value="active">Active</option><option value="paused">Paused</option><option value="churned">Churned</option>
        </select>
        <select class="filter-select" id="filter-audience" onchange="renderTable()">
          <option value="">All audiences</option>
          <option value="physical">Physical</option><option value="online">Online</option><option value="fotf">FOTF</option>
        </select>
      </div>

      <!-- MRR Summary -->
      <div id="mrr-bar" style="display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 22px;margin-bottom:16px;display:flex;gap:32px;flex-wrap:wrap;">
        <div><div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Total MRR</div><div style="font-size:24px;font-family:var(--serif);font-weight:700" id="mrr-total">—</div></div>
        <div><div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Active</div><div style="font-size:24px;font-family:var(--serif);font-weight:700" id="mrr-active-count">—</div></div>
        <div><div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Paused</div><div style="font-size:24px;font-family:var(--serif);font-weight:700" id="mrr-paused">—</div></div>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Company</th><th>Contact</th><th>Email</th><th>Audience</th><th>Niche</th>
              <th>Status</th><th>Plan</th><th>MRR</th><th>Started</th>
            </tr></thead>
            <tbody id="clients-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="client-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title" id="modal-title">Add Client</h2>
      <button class="modal-x" onclick="TMIAdmin.closeModal('client-modal')">&times;</button>
    </div>
    <input type="hidden" id="edit-id"/>
    <div class="form-row">
      <div class="form-group"><label class="form-label">First Name *</label><input class="form-input" id="f-first" placeholder="First"/></div>
      <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" id="f-last" placeholder="Last"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" type="email" placeholder="email@company.com"/></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="f-phone" placeholder="+1 555 000 0000"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Company</label><input class="form-input" id="f-company" placeholder="Company name"/></div>
      <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="f-title" placeholder="Job title"/></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Audience</label>
        <select class="form-input" id="f-audience" onchange="onAudienceChange()">
          <option value="">Select audience</option>
          <option value="physical">Physical</option><option value="online">Online</option><option value="fotf">FOTF</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Niche</label>
        <select class="form-input" id="f-niche"><option value="">Select niche</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="f-status">
          <option value="active">Active</option><option value="paused">Paused</option><option value="churned">Churned</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Plan</label><input class="form-input" id="f-plan" placeholder="e.g. Growth, Enterprise"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">MRR ($)</label><input class="form-input" id="f-mrr" type="number" placeholder="0"/></div>
      <div class="form-group"><label class="form-label">Start Date</label><input class="form-input" id="f-start" type="date"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Owner</label><input class="form-input" id="f-owner" placeholder="e.g. Mia"/></div>
    </div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="f-notes" rows="3"></textarea></div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="TMIAdmin.closeModal('client-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveClient()">Save Client</button>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="client-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('client-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-name">—</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" onclick="editFromPanel()">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteFromPanel()">Delete</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Status</div><div class="detail-val" id="pd-status">—</div></div>
        <div class="detail-item"><div class="detail-label">Plan</div><div class="detail-val" id="pd-plan">—</div></div>
        <div class="detail-item"><div class="detail-label">Email</div><div class="detail-val" id="pd-email">—</div></div>
        <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-val" id="pd-phone">—</div></div>
        <div class="detail-item"><div class="detail-label">Company</div><div class="detail-val" id="pd-company">—</div></div>
        <div class="detail-item"><div class="detail-label">Title</div><div class="detail-val" id="pd-title">—</div></div>
        <div class="detail-item"><div class="detail-label">Audience</div><div class="detail-val" id="pd-audience">—</div></div>
        <div class="detail-item"><div class="detail-label">Niche</div><div class="detail-val" id="pd-niche">—</div></div>
        <div class="detail-item"><div class="detail-label">MRR</div><div class="detail-val" id="pd-mrr">—</div></div>
        <div class="detail-item"><div class="detail-label">Owner</div><div class="detail-val" id="pd-owner">—</div></div>
        <div class="detail-item"><div class="detail-label">Started</div><div class="detail-val" id="pd-start">—</div></div>
        <div class="detail-item"><div class="detail-label">Added</div><div class="detail-val" id="pd-created">—</div></div>
      </div>
      <div class="panel-sep"></div>
      <div id="pd-health"></div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Notes</div>
      <div id="pd-notes" style="font-size:14px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;">—</div>
      <div class="panel-sep"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="panel-sec-label" style="margin:0">Activity</div>
        <button class="btn btn-ghost btn-sm" onclick="logClientActivity()">+ Log</button>
      </div>
      <div id="client-activity-feed"></div>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('clients');

let allClients = [];
let currentClient = null;

function onAudienceChange() {
  const aud = document.getElementById('f-audience').value;
  const niches = aud ? TMIAdmin.niches[aud] : [...TMIAdmin.niches.physical, ...TMIAdmin.niches.online, ...TMIAdmin.niches.fotf];
  const sel = document.getElementById('f-niche');
  sel.innerHTML = `<option value="">Select niche</option>` + (niches || []).map(n => `<option>${n}</option>`).join('');
}

async function loadClients() {
  const data = await TMIAdmin.api('/api/clients');
  if (!data) return;
  allClients = data;

  // MRR summary
  const active = data.filter(c => c.status === 'active');
  const mrr = active.reduce((s, c) => s + (parseFloat(c.mrr) || 0), 0);
  document.getElementById('mrr-total').textContent = TMIAdmin.currency(mrr);
  document.getElementById('mrr-active-count').textContent = active.length;
  document.getElementById('mrr-paused').textContent = data.filter(c => c.status === 'paused').length;
  document.getElementById('mrr-bar').style.display = 'flex';

  renderTable();
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const aud = document.getElementById('filter-audience').value;

  const filtered = allClients.filter(cl => {
    const c = cl.contacts || {};
    const text = [c.first_name, c.last_name, c.email, c.company].filter(Boolean).join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (st && cl.status !== st) return false;
    if (aud && c.audience !== aud) return false;
    return true;
  });

  document.getElementById('client-count').textContent = `${filtered.length} client${filtered.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('clients-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty-state"><div class="empty-icon">💼</div><h3>No clients found</h3><p>Add your first client or convert a lead.</p></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(cl => {
    const c = cl.contacts || {};
    const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || '—';
    return `<tr onclick="openPanel(${JSON.stringify(cl).replace(/"/g,'&quot;')})">
      <td class="td-name">${c.company || '—'}</td>
      <td>${name}</td>
      <td style="color:var(--ink-2)">${c.email || '—'}</td>
      <td>${c.audience ? TMIAdmin.badge(c.audience) : '—'}</td>
      <td class="td-muted">${c.niche || '—'}</td>
      <td>${TMIAdmin.badge(cl.status)}</td>
      <td class="td-muted">${cl.plan || '—'}</td>
      <td style="font-weight:500;color:var(--ink)">${cl.mrr ? TMIAdmin.currency(cl.mrr) : '—'}</td>
      <td class="td-muted">${cl.start_date ? TMIAdmin.fmt(cl.start_date) : '—'}</td>
    </tr>`;
  }).join('');
}

async function openPanel(cl) {
  currentClient = cl;
  const c = cl.contacts || {};
  const name = [c.first_name, c.last_name].filter(Boolean).join(' ') || '—';
  document.getElementById('panel-name').textContent = name;
  document.getElementById('pd-status').innerHTML = TMIAdmin.badge(cl.status);
  document.getElementById('pd-plan').textContent = cl.plan || '—';
  document.getElementById('pd-email').innerHTML = c.email ? `<a href="mailto:${c.email}" style="color:var(--blue)">${c.email}</a>` : '—';
  document.getElementById('pd-phone').textContent = c.phone || '—';
  document.getElementById('pd-company').textContent = c.company || '—';
  document.getElementById('pd-title').textContent = c.title || '—';
  document.getElementById('pd-audience').innerHTML = c.audience ? TMIAdmin.badge(c.audience) : '—';
  document.getElementById('pd-niche').textContent = c.niche || '—';
  document.getElementById('pd-mrr').textContent = cl.mrr ? TMIAdmin.currency(cl.mrr) : '—';
  document.getElementById('pd-owner').textContent = cl.owner || '—';
  document.getElementById('pd-start').textContent = cl.start_date ? TMIAdmin.fmt(cl.start_date) : '—';
  document.getElementById('pd-created').textContent = TMIAdmin.fmt(cl.created_at);
  document.getElementById('pd-notes').textContent = cl.notes || '—';
  document.getElementById('client-activity-feed').innerHTML = '';
  document.getElementById('pd-health').innerHTML = '<div style="font-size:13px;color:var(--muted);padding:4px 0">Computing health...</div>';
  TMIAdmin.openPanel('client-panel');

  // Fetch activities and compute health score
  let lastActivityDate = null;
  if (cl.contact_id) {
    const activities = await TMIAdmin.api(`/api/activities?contact_id=${cl.contact_id}`);
    if (activities && activities.length > 0) {
      // activities assumed sorted newest first
      lastActivityDate = new Date(activities[0].created_at);
    }
    TMIAdmin.renderActivityPanel(cl.contact_id, 'client-activity-feed');
  }

  renderHealthPanel(cl, lastActivityDate);
}

function renderHealthPanel(cl, lastActivityDate) {
  const el = document.getElementById('pd-health');
  if (!el) return;

  // Score algorithm (max 100)
  let score = 0;
  const signals = [];
  const now = new Date();

  // +30 if status is active
  if (cl.status === 'active') {
    score += 30;
    signals.push({ text: 'Status: Active', positive: true });
  } else if (cl.status === 'paused') {
    signals.push({ text: 'Status: Paused', positive: false });
  } else if (cl.status === 'churned') {
    signals.push({ text: 'Status: Churned', positive: false });
  }

  // Last contact scoring (+20 within 14 days, +10 within 30 days)
  if (lastActivityDate) {
    const daysSince = Math.floor((now - lastActivityDate) / (1000 * 60 * 60 * 24));
    if (daysSince <= 14) {
      score += 20;
      signals.push({ text: `Last contact: ${daysSince <= 1 ? 'today' : daysSince + ' days ago'}`, positive: true });
    } else if (daysSince <= 30) {
      score += 10;
      signals.push({ text: `Last contact: ${daysSince} days ago`, positive: null });
    } else {
      signals.push({ text: `Last contact: ${daysSince} days ago`, positive: false });
    }
  } else {
    signals.push({ text: 'No activity recorded', positive: false });
  }

  // Client tenure scoring (+15 if >90 days, +8 if >30 days)
  if (cl.start_date) {
    const daysClient = Math.floor((now - new Date(cl.start_date)) / (1000 * 60 * 60 * 24));
    if (daysClient >= 90) {
      score += 15;
      const months = Math.floor(daysClient / 30);
      signals.push({ text: `Client for ${months} month${months !== 1 ? 's' : ''}`, positive: true });
    } else if (daysClient >= 30) {
      score += 8;
      const months = Math.floor(daysClient / 30);
      signals.push({ text: `Client for ${months} month${months !== 1 ? 's' : ''}`, positive: null });
    } else {
      signals.push({ text: `New client (${daysClient} day${daysClient !== 1 ? 's' : ''})`, positive: null });
    }
  }

  score = Math.min(100, score);

  // Badge class
  let badgeClass, badgeLabel;
  if (score >= 70) {
    badgeClass = 'score-hot';
    badgeLabel = 'Healthy';
  } else if (score >= 40) {
    badgeClass = 'score-warm';
    badgeLabel = 'Fair';
  } else {
    badgeClass = 'score-cold';
    badgeLabel = 'At Risk';
  }

  // Signal color helper
  function signalColor(positive) {
    if (positive === true)  return 'var(--green, #22c55e)';
    if (positive === false) return 'var(--red, #ef4444)';
    return 'var(--muted)';
  }

  el.innerHTML = `
    <div class="panel-sec-label">Health</div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
      <span class="score-badge ${badgeClass}" style="font-size:13px;padding:4px 12px;border-radius:999px;font-weight:600">${score} — ${badgeLabel}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px">
      ${signals.slice(0, 3).map(s => `
        <div style="font-size:12px;color:${signalColor(s.positive)};display:flex;align-items:center;gap:6px">
          <span style="font-size:9px">${s.positive === true ? '▲' : s.positive === false ? '▼' : '●'}</span>
          ${s.text}
        </div>`).join('')}
    </div>`;
}

async function logClientActivity() {
  if (!currentClient?.contact_id) return;
  const type = prompt('Type (call / email / note / meeting):', 'note');
  if (!type) return;
  const title = prompt('Summary:');
  if (!title) return;
  const body = prompt('Details (optional):') || '';
  await TMIAdmin.logActivity(currentClient.contact_id, type, title, body);
  TMIAdmin.toast('Activity logged');
  TMIAdmin.renderActivityPanel(currentClient.contact_id, 'client-activity-feed');
}

function openAddModal() {
  document.getElementById('edit-id').value = '';
  document.getElementById('modal-title').textContent = 'Add Client';
  document.getElementById('save-btn').textContent = 'Save Client';
  ['first','last','email','phone','company','title','notes','mrr','owner','plan'].forEach(f => {
    document.getElementById('f-' + f).value = '';
  });
  document.getElementById('f-status').value = 'active';
  document.getElementById('f-audience').value = '';
  document.getElementById('f-start').value = new Date().toISOString().split('T')[0];
  onAudienceChange();
  TMIAdmin.openModal('client-modal');
}

function editFromPanel() {
  if (!currentClient) return;
  const cl = currentClient;
  const c = cl.contacts || {};
  TMIAdmin.closePanel('client-panel');
  document.getElementById('edit-id').value = cl.id;
  document.getElementById('modal-title').textContent = 'Edit Client';
  document.getElementById('save-btn').textContent = 'Update Client';
  document.getElementById('f-first').value = c.first_name || '';
  document.getElementById('f-last').value = c.last_name || '';
  document.getElementById('f-email').value = c.email || '';
  document.getElementById('f-phone').value = c.phone || '';
  document.getElementById('f-company').value = c.company || '';
  document.getElementById('f-title').value = c.title || '';
  document.getElementById('f-audience').value = c.audience || '';
  onAudienceChange();
  setTimeout(() => { document.getElementById('f-niche').value = c.niche || ''; }, 50);
  document.getElementById('f-status').value = cl.status || 'active';
  document.getElementById('f-plan').value = cl.plan || '';
  document.getElementById('f-mrr').value = cl.mrr || '';
  document.getElementById('f-start').value = cl.start_date || '';
  document.getElementById('f-owner').value = cl.owner || '';
  document.getElementById('f-notes').value = cl.notes || '';
  TMIAdmin.openModal('client-modal');
}

async function saveClient() {
  const id = document.getElementById('edit-id').value;
  const firstName = document.getElementById('f-first').value.trim();
  if (!firstName) { TMIAdmin.toast('First name is required', 'error'); return; }

  const payload = {
    contact: {
      first_name: firstName,
      last_name: document.getElementById('f-last').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      company: document.getElementById('f-company').value.trim(),
      title: document.getElementById('f-title').value.trim(),
      audience: document.getElementById('f-audience').value,
      niche: document.getElementById('f-niche').value
    },
    client: {
      status: document.getElementById('f-status').value,
      plan: document.getElementById('f-plan').value.trim(),
      mrr: parseFloat(document.getElementById('f-mrr').value) || null,
      start_date: document.getElementById('f-start').value || null,
      owner: document.getElementById('f-owner').value.trim(),
      notes: document.getElementById('f-notes').value.trim()
    }
  };
  if (id) payload.client.id = id;

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  const res = await TMIAdmin.api('/api/clients', id ? 'PUT' : 'POST', payload);
  btn.disabled = false; btn.textContent = id ? 'Update Client' : 'Save Client';

  if (res) {
    TMIAdmin.toast(id ? 'Client updated' : 'Client added');
    TMIAdmin.closeModal('client-modal');
    await loadClients();
  }
}

async function deleteFromPanel() {
  if (!currentClient) return;
  const ok = await TMIAdmin.confirm('Delete this client? This cannot be undone.');
  if (!ok) return;
  const res = await TMIAdmin.api(`/api/clients?id=${currentClient.id}`, 'DELETE');
  if (res) {
    TMIAdmin.toast('Client deleted');
    TMIAdmin.closePanel('client-panel');
    await loadClients();
  }
}

loadClients();
</script>
</body>
</html>
