<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Accept &amp; Sign Proposal - TMI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f5f5f7;
      --bg-deep: #0a0b14;
      --ink: #1a1a1a;
      --ink-2: #505060;
      --muted: #86868b;
      --line: rgba(0,0,0,0.08);
      --line-strong: rgba(0,0,0,0.13);
      --chart: #E4FF97;
      --chart-dark: #D0FF6A;
      --green: #22c55e;
      --green-bg: #f0fdf4;
      --sans: "Barlow", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg-alt);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    .doc-header {
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .doc-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .doc-brand img { height: 24px; width: auto; }
    .doc-type {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .page-wrap {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 24px;
    }

    .doc-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .doc-top {
      padding: 48px 48px 36px;
      border-bottom: 1px solid var(--line);
    }
    .doc-title {
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 0 0 20px;
      line-height: 1.1;
    }
    .doc-meta-row { display: flex; flex-wrap: wrap; gap: 24px; }
    .doc-meta-item { display: flex; flex-direction: column; gap: 3px; }
    .doc-meta-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    .doc-meta-val { font-size: 14px; font-weight: 500; color: var(--ink-2); }

    .doc-section { padding: 36px 48px; }
    .section-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .li-table { width: 100%; border-collapse: collapse; }
    .li-table thead tr { border-bottom: 1px solid var(--line-strong); }
    .li-table thead th {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      padding: 0 0 10px;
      text-align: left;
    }
    .li-table thead th.right { text-align: right; }
    .li-table tbody tr { border-bottom: 1px solid var(--line); }
    .li-table tbody tr:last-child { border-bottom: none; }
    .li-table tbody td {
      padding: 12px 0;
      font-size: 14px;
      color: var(--ink-2);
      vertical-align: top;
    }
    .li-table tbody td.desc { color: var(--ink); font-weight: 500; }
    .li-table tbody td.right { text-align: right; font-weight: 600; color: var(--ink); }
    .li-table tbody td.num { color: var(--ink-2); }
    .col-desc { width: 45%; }
    .col-qty { width: 12%; }
    .col-price { width: 20%; }
    .col-total { width: 23%; }

    .doc-total-section { padding: 0 48px 36px; }
    .total-divider { height: 1px; background: var(--line-strong); margin-bottom: 20px; }
    .total-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 24px; }
    .total-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .total-amount {
      font-size: clamp(28px, 3vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    /* Sign block */
    .sign-block {
      padding: 36px 48px 44px;
      border-top: 1px solid var(--line);
      background: var(--bg-alt);
    }
    .sign-head {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 6px;
    }
    .sign-sub {
      font-size: 14px;
      color: var(--ink-2);
      margin: 0 0 24px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--ink); }
    #name-input { font-size: 20px; font-weight: 600; }
    .accept-btn {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--bg-deep);
      background: var(--chart);
      border: none;
      border-radius: 999px;
      padding: 15px 24px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .accept-btn:hover { background: var(--chart-dark); }
    .accept-btn:disabled { opacity: 0.55; cursor: default; }
    .legal-note {
      font-size: 12px;
      color: var(--muted);
      margin: 16px 0 0;
      line-height: 1.5;
    }
    .form-error {
      font-size: 13px;
      color: #b91c1c;
      margin: 12px 0 0;
      display: none;
    }

    /* Confirmation */
    .confirm-wrap {
      padding: 64px 48px 72px;
      text-align: center;
      border-top: 1px solid var(--line);
      background: var(--green-bg);
    }
    .confirm-check {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .confirm-title {
      font-size: 24px;
      font-weight: 600;
      color: #15803d;
      margin: 0 0 8px;
    }
    .confirm-sub { font-size: 15px; color: var(--ink-2); margin: 0; }

    .doc-footer {
      padding: 24px 48px;
      background: var(--bg);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .doc-footer-text { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }
    .doc-footer-link { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }
    .doc-footer-link:hover { color: var(--ink); }

    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 16px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--line-strong);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--muted); }

    .error-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 12px;
      text-align: center;
    }
    .error-icon { font-size: 36px; margin-bottom: 8px; }
    .error-title { font-size: 22px; font-weight: 600; color: var(--ink); margin: 0; }
    .error-sub { font-size: 14px; color: var(--muted); margin: 0; }

    @media (max-width: 600px) {
      .doc-header { padding: 14px 20px; }
      .doc-top { padding: 32px 24px 24px; }
      .doc-section { padding: 24px 24px; }
      .doc-total-section { padding: 0 24px 28px; }
      .sign-block { padding: 28px 24px 36px; }
      .confirm-wrap { padding: 48px 24px 56px; }
      .doc-footer { padding: 20px 24px; }
      .doc-meta-row { gap: 16px; }
    }
  </style>

</head>
<body>

<header class="doc-header">
  <a href="https://www.tmitechai.com" class="doc-brand">
    <img src="logo.svg" alt="TMI"/>
    TMI
  </a>
  <span class="doc-type">Proposal</span>
</header>

<div class="page-wrap">
  <div class="doc-card" id="doc-card">
    <div class="loading-wrap" id="loading">
      <div class="spinner"></div>
      <span class="loading-text">Loading proposal...</span>
    </div>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const card = document.getElementById('doc-card');

  function currency(n) {
    return '$' + parseFloat(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderError(title, msg) {
    card.innerHTML = `
      <div class="error-wrap">
        <div class="error-icon">&#128274;</div>
        <h2 class="error-title">${escHtml(title || 'Proposal not found')}</h2>
        <p class="error-sub">${escHtml(msg || 'This proposal link may be invalid or expired.')}</p>
      </div>`;
  }

  function lineItemsHtml(p) {
    const items = (p.line_items && p.line_items.length ? p.line_items : p.sections) || [];
    if (!items.length) return '';
    const rows = items.map(li => {
      const qty = parseFloat(li.qty || li.quantity || 1);
      const price = parseFloat(li.price || li.unit_price || li.amount || 0);
      const lineTotal = qty * price;
      return `<tr>
        <td class="desc">${escHtml(li.desc || li.description || li.name || '')}</td>
        <td class="num">${qty}</td>
        <td class="num">${currency(price)}</td>
        <td class="right">${currency(lineTotal)}</td>
      </tr>`;
    }).join('');
    return `
      <div class="doc-section">
        <div class="section-label">Line Items</div>
        <table class="li-table">
          <thead>
            <tr>
              <th class="col-desc">Description</th>
              <th class="col-qty">Qty</th>
              <th class="col-price">Unit Price</th>
              <th class="col-total right">Total</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function totalHtml(p) {
    if (p.total == null) return '';
    return `
      <div class="doc-total-section">
        <div class="total-divider"></div>
        <div class="total-row">
          <span class="total-label">Total</span>
          <span class="total-amount">${currency(p.total)}</span>
        </div>
      </div>`;
  }

  function topHtml(p) {
    return `
      <div class="doc-top">
        <h1 class="doc-title">${escHtml(p.title || 'Proposal')}</h1>
        <div class="doc-meta-row">
          <div class="doc-meta-item"><div class="doc-meta-label">Document</div><div class="doc-meta-val">Proposal</div></div>
          ${p.total != null ? `<div class="doc-meta-item"><div class="doc-meta-label">Amount</div><div class="doc-meta-val">${currency(p.total)}</div></div>` : ''}
        </div>
      </div>`;
  }

  function footerHtml() {
    return `
      <div class="doc-footer">
        <span class="doc-footer-text">Prepared by TMI Technology</span>
        <a class="doc-footer-link" href="https://www.tmitechai.com">tmitechai.com</a>
      </div>`;
  }

  function confirmHtml() {
    return `
      <div class="confirm-wrap">
        <div class="confirm-check">&#10003;</div>
        <h2 class="confirm-title">Signed - thank you.</h2>
        <p class="confirm-sub">We'll be in touch.</p>
      </div>`;
  }

  function renderAlreadyAccepted(p) {
    card.innerHTML = topHtml(p) + lineItemsHtml(p) + totalHtml(p) + confirmHtml() + footerHtml();
  }

  function renderSignable(p) {
    card.innerHTML = topHtml(p) + lineItemsHtml(p) + totalHtml(p) + `
      <div class="sign-block">
        <h3 class="sign-head">Accept &amp; sign</h3>
        <p class="sign-sub">Type your full name below to accept this proposal.</p>
        <div class="field">
          <label for="name-input">Your full name</label>
          <input id="name-input" type="text" autocomplete="name" placeholder="Jane Smith"/>
        </div>
        <div class="field">
          <label for="email-input">Email</label>
          <input id="email-input" type="email" autocomplete="email" placeholder="you@company.com"/>
        </div>
        <button id="accept-btn" class="accept-btn">Accept &amp; Sign</button>
        <p id="form-error" class="form-error"></p>
        <p class="legal-note">By typing your name and clicking Accept &amp; Sign, you agree to the terms of this proposal. This typed-name signature is recorded with a timestamp as your electronic acceptance.</p>
      </div>` + footerHtml();

    const btn = document.getElementById('accept-btn');
    const nameInput = document.getElementById('name-input');
    const emailInput = document.getElementById('email-input');
    const errEl = document.getElementById('form-error');

    btn.addEventListener('click', function () {
      const typed_name = nameInput.value.trim();
      const email = emailInput.value.trim();
      errEl.style.display = 'none';
      if (!typed_name) {
        errEl.textContent = 'Please type your full name to accept.';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Signing...';
      fetch('/api/proposal-accept?id=' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ typed_name: typed_name, email: email }),
      })
        .then(res => res.json().then(d => ({ ok: res.ok, d })))
        .then(({ ok, d }) => {
          if (!ok || !d.accepted) {
            throw new Error((d && d.error) || 'Something went wrong.');
          }
          card.innerHTML = topHtml(p) + lineItemsHtml(p) + totalHtml(p) + confirmHtml() + footerHtml();
        })
        .catch(err => {
          btn.disabled = false;
          btn.textContent = 'Accept & Sign';
          errEl.textContent = err.message || 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
        });
    });
  }

  if (!id) {
    renderError('No proposal ID provided.', 'This link is missing a proposal reference.');
    return;
  }

  fetch('/api/proposal-accept?id=' + encodeURIComponent(id))
    .then(res => {
      if (!res.ok) throw new Error('Not found');
      return res.json();
    })
    .then(p => {
      if (p.status === 'accepted' || p.status === 'won') {
        renderAlreadyAccepted(p);
      } else {
        renderSignable(p);
      }
    })
    .catch(() => renderError('Proposal not found', 'This proposal could not be found.'));
})();
</script>
</body>
</html>
