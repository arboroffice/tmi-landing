<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Projects — TMI Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="layout">

  <div id="sidebar-root"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-crumb"><a href="/admin-dashboard">TMI Admin</a><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round"/></svg><span class="page">Projects</span></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="view-toggle" onclick="toggleView()">Board view</button>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Project
        </button>
      </div>
    </div>
    <div class="content">
      <div class="sec-head">
        <h1>Projects</h1>
        <span class="filter-count" id="proj-count"></span>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Search projects..." oninput="renderView()"/>
        </div>
        <select class="filter-select" id="filter-status" onchange="renderView()">
          <option value="">All statuses</option>
          <option value="scoping">Scoping</option>
          <option value="active">Active</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <!-- Table view -->
      <div id="table-view">
        <div class="card">
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th>Project</th><th>Client</th><th>Status</th><th>Value</th><th>Start</th><th>End</th><th></th>
              </tr></thead>
              <tbody id="proj-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Board view -->
      <div id="board-view" style="display:none">
        <div class="kanban" id="kanban-board"></div>
      </div>
    </div>
  </div>
</div>

<!-- Slide panel -->
<div class="panel-overlay" id="proj-panel">
  <div class="panel-bg" onclick="TMIAdmin.closePanel('proj-panel')"></div>
  <div class="panel">
    <div class="panel-hd">
      <h2 class="panel-title" id="panel-proj-name">Project</h2>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" onclick="editCurrentProject()">Edit</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="deleteProject()">Delete</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="detail-grid" id="panel-proj-details"></div>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Description</div>
      <p id="panel-proj-desc" style="font-size:14px;color:var(--ink-2);line-height:1.65;margin-top:8px;"></p>
      <div class="panel-sep"></div>
      <div class="panel-sec-label">Update Status</div>
      <select class="form-input" id="panel-proj-status" style="margin-top:8px;max-width:200px" onchange="updateProjectStatus()">
        <option value="scoping">Scoping</option>
        <option value="active">Active</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2 class="modal-title" id="modal-title-text">New Project</h2>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Project Name</label>
      <input class="form-input" id="f-name" placeholder="Project name" required/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="f-status">
          <option value="scoping">Scoping</option>
          <option value="active">Active</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Value ($)</label>
        <input class="form-input" id="f-value" type="number" step="0.01" placeholder="0.00"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Start Date</label>
        <input class="form-input" id="f-start" type="date"/>
      </div>
      <div class="form-group">
        <label class="form-label">End Date</label>
        <input class="form-input" id="f-end" type="date"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-input" id="f-desc" rows="3" placeholder="What are we building?"></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject()">Save Project</button>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="admin-shared.js"></script>
<script>
TMIAdmin.requireAuth();
TMIAdmin.initSidebar('projects');

let allProjects = [];
let currentProject = null;
let editId = null;
let boardMode = false;

async function loadProjects() {
  allProjects = await TMIAdmin.api('/api/projects') || [];
  renderView();
}

function clientName(p) {
  const c = p.clients?.contacts || p.contacts;
  if (!c) return '-';
  return `${c.first_name || ''} ${c.last_name || ''}`.trim() || c.company || '-';
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  return allProjects.filter(p => {
    if (st && p.status !== st) return false;
    if (q && !`${p.name} ${clientName(p)}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderView() {
  boardMode ? renderBoard() : renderTable();
}

function renderTable() {
  const rows = filtered();
  document.getElementById('proj-count').textContent = `${rows.length} project${rows.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('proj-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">🗂️</div><h3>No projects</h3><p>Create your first project above.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(p => `
    <tr onclick="openPanel('${p.id}')">
      <td class="td-name">${p.name}</td>
      <td>${clientName(p)}</td>
      <td>${TMIAdmin.badge(p.status)}</td>
      <td>${p.value ? '$' + parseFloat(p.value).toLocaleString() : '<span class="td-muted">-</span>'}</td>
      <td class="td-muted">${p.start_date ? TMIAdmin.fmt(p.start_date) : '-'}</td>
      <td class="td-muted">${p.end_date ? TMIAdmin.fmt(p.end_date) : '-'}</td>
      <td class="td-action"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openPanel('${p.id}')">View</button></td>
    </tr>
  `).join('');
}

function renderBoard() {
  const stages = ['scoping', 'active', 'delivered', 'cancelled'];
  const rows = filtered();
  document.getElementById('proj-count').textContent = `${rows.length} project${rows.length !== 1 ? 's' : ''}`;
  document.getElementById('kanban-board').innerHTML = stages.map(stage => {
    const cols = rows.filter(p => p.status === stage);
    return `
      <div class="kanban-col">
        <div class="kanban-col-head">
          <span class="kanban-col-title">${stage}</span>
          <span class="kanban-count">${cols.length}</span>
        </div>
        <div class="kanban-cards">
          ${cols.map(p => `
            <div class="kanban-card" onclick="openPanel('${p.id}')">
              <div class="kanban-card-name">${p.name}</div>
              <div class="kanban-card-meta">${clientName(p)}</div>
              ${p.value ? `<div class="kanban-card-val">$${parseFloat(p.value).toLocaleString()}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleView() {
  boardMode = !boardMode;
  document.getElementById('table-view').style.display = boardMode ? 'none' : '';
  document.getElementById('board-view').style.display = boardMode ? '' : 'none';
  document.getElementById('view-toggle').textContent = boardMode ? 'Table view' : 'Board view';
  renderView();
}

function openPanel(id) {
  currentProject = allProjects.find(p => p.id === id);
  if (!currentProject) return;
  const p = currentProject;
  document.getElementById('panel-proj-name').textContent = p.name;
  document.getElementById('panel-proj-desc').textContent = p.description || p.notes || '-';
  document.getElementById('panel-proj-status').value = p.status;
  document.getElementById('panel-proj-details').innerHTML = `
    <div class="detail-item"><div class="detail-label">Status</div><div class="detail-val">${TMIAdmin.badge(p.status)}</div></div>
    <div class="detail-item"><div class="detail-label">Client</div><div class="detail-val">${clientName(p)}</div></div>
    <div class="detail-item"><div class="detail-label">Value</div><div class="detail-val">${p.value ? '$' + parseFloat(p.value).toLocaleString() : '-'}</div></div>
    <div class="detail-item"><div class="detail-label">Created</div><div class="detail-val">${TMIAdmin.fmt(p.created_at)}</div></div>
    <div class="detail-item"><div class="detail-label">Start</div><div class="detail-val">${p.start_date ? TMIAdmin.fmt(p.start_date) : '-'}</div></div>
    <div class="detail-item"><div class="detail-label">End</div><div class="detail-val">${p.end_date ? TMIAdmin.fmt(p.end_date) : '-'}</div></div>
  `;
  TMIAdmin.openPanel('proj-panel');
}

function editCurrentProject() {
  if (!currentProject) return;
  TMIAdmin.closePanel('proj-panel');
  editId = currentProject.id;
  document.getElementById('modal-title-text').textContent = 'Edit Project';
  document.getElementById('f-name').value = currentProject.name;
  document.getElementById('f-status').value = currentProject.status;
  document.getElementById('f-value').value = currentProject.value || '';
  document.getElementById('f-start').value = currentProject.start_date || '';
  document.getElementById('f-end').value = currentProject.end_date || '';
  document.getElementById('f-desc').value = currentProject.description || '';
  document.getElementById('add-modal').classList.add('open');
}

async function updateProjectStatus() {
  if (!currentProject) return;
  const status = document.getElementById('panel-proj-status').value;
  const res = await TMIAdmin.api('/api/projects', 'PUT', { id: currentProject.id, status });
  if (res) { currentProject.status = status; TMIAdmin.toast('Status updated'); await loadProjects(); }
}

async function deleteProject() {
  if (!currentProject) return;
  const ok = await TMIAdmin.confirm('Delete this project?', false);
  if (!ok) return;
  const res = await TMIAdmin.api('/api/projects', 'DELETE', { id: currentProject.id });
  if (res) { TMIAdmin.toast('Deleted'); TMIAdmin.closePanel('proj-panel'); await loadProjects(); }
}

function openAddModal() {
  editId = null;
  document.getElementById('modal-title-text').textContent = 'New Project';
  ['f-name','f-value','f-start','f-end','f-desc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value = 'scoping';
  document.getElementById('add-modal').classList.add('open');
}
function closeModal() { document.getElementById('add-modal').classList.remove('open'); editId = null; }

async function saveProject() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { TMIAdmin.toast('Name required', 'error'); return; }
  const payload = {
    name,
    status: document.getElementById('f-status').value,
    value: parseFloat(document.getElementById('f-value').value) || null,
    start_date: document.getElementById('f-start').value || null,
    end_date: document.getElementById('f-end').value || null,
    description: document.getElementById('f-desc').value || null,
  };
  if (editId) payload.id = editId;
  const method = editId ? 'PUT' : 'POST';
  const res = await TMIAdmin.api('/api/projects', method, payload);
  if (res) {
    TMIAdmin.toast(editId ? 'Project updated' : 'Project created');
    closeModal();
    await loadProjects();
  }
}

loadProjects();
</script>
</body>
</html>
